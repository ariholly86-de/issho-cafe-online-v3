<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — OWNER</title><style>html,body{margin:0;width:100%;height:100%;background:#0b0b0b}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="owner" src="owner-v3.html?v=20260823-owner-report-fix2" title="ISSHO CAFE OWNER"></iframe><script>
const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',frame=document.getElementById('owner');
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));

function api(path,opt={}){const h={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};return fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h})).then(async r=>{const t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null})}
function weekRange(){const d=new Date(),day=d.getDay()||7;d.setDate(d.getDate()-day+1);const e=new Date(d);e.setDate(e.getDate()+6);return[d.toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'}),e.toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'})]}
function monthRange(){const d=new Date();return[new Date(d.getFullYear(),d.getMonth(),1).toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'}),new Date(d.getFullYear(),d.getMonth()+1,0).toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'})]}
function install(){try{const w=frame.contentWindow,d=w.document,sec=d.getElementById('reports');if(!d||!sec)return false;if(d.getElementById('owner-report-v4-fix2'))return true;const st=d.createElement('style');st.id='owner-report-v4-fix2';st.textContent='.owner-report-v4{margin-top:14px}.owner-report-v4 .range{display:grid;grid-template-columns:1fr 1fr;gap:10px}.owner-report-v4 .buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.owner-report-v4 button{background:#1687f7!important;color:#fff!important;border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.owner-report-v4 .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.owner-report-v4 .stat{background:#202020;border:1px solid #383838;border-radius:9px;padding:12px}.owner-report-v4 .detail{background:#151515;border:1px solid #303030;border-radius:12px;padding:12px;margin-top:12px}.owner-report-v4 .line{padding:9px 0;border-bottom:1px solid #333}.owner-report-v4 .muted2{color:#aaa;font-size:12px}@media(max-width:650px){.owner-report-v4 .range{grid-template-columns:1fr}.owner-report-v4 .summary{grid-template-columns:repeat(2,1fr)}}@media print{.owner-report-v4 button,.owner-report-v4 input{display:none!important}.owner-report-v4 .detail,.owner-report-v4 .stat{color:#000!important;background:#fff!important;border-color:#ccc!important}}';d.head.appendChild(st);sec.innerHTML='<h2>📊 Rekapan Owner</h2><div class="muted">Rekapan Owner mengikuti data order dan pengeluaran dari sistem Kasir.</div><div id="owner-report-v4-fix2" class="owner-report-v4"><div class="range"><div><label>Dari tanggal</label><input id="orFrom" type="date"></div><div><label>Sampai tanggal</label><input id="orTo" type="date"></div></div><div class="buttons"><button id="orDay">📅 Harian</button><button id="orWeek">📆 Mingguan</button><button id="orMonth">🗓️ Bulanan</button><button id="orShow">🔎 Tampilkan</button><button id="orPrint">🖨️ Print Rekapan</button></div><div id="orBox"></div></div>';const $=id=>d.getElementById(id),pin=()=>($('pin')?.value||'').trim();function setRange(kind){let r=kind==='week'?weekRange():kind==='month'?monthRange():[today(),today()];$('orFrom').value=r[0];$('orTo').value=r[1];load()}async function load(){const from=$('orFrom').value,to=$('orTo').value,p=pin();if(!p){$('orBox').innerHTML='<div class="err">Silakan login Owner terlebih dahulu.</div>';return}if(!from||!to)return;if(from>to){$('orBox').innerHTML='<div class="err">Tanggal awal tidak boleh melewati tanggal akhir.</div>';return}try{const orders=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:p})});const expRaw=await api('/rest/v1/rpc/owner_get_expenses',{method:'POST',body:JSON.stringify({p_owner_pin:p,p_from:from,p_to:to})});const end=new Date(to+'T00:00:00+07:00');end.setDate(end.getDate()+1);const lo=new Date(from+'T00:00:00+07:00').getTime(),hi=end.getTime();const paid=(orders||[]).filter(o=>String(o.payment_status||'').toUpperCase()==='PAID'&&o.created_at&&new Date(o.created_at).getTime()>=lo&&new Date(o.created_at).getTime()<hi);const exp=Array.isArray(expRaw)?expRaw:[];const revenue=paid.reduce((s,o)=>s+Number(o.total||0),0),expense=exp.reduce((s,e)=>s+Number(e.amount||0),0),net=revenue-expense,cash=paid.filter(o=>String(o.payment_method||'').toUpperCase()==='CASH').reduce((s,o)=>s+Number(o.total||0),0),qris=paid.filter(o=>String(o.payment_method||'').toUpperCase()==='QRIS').reduce((s,o)=>s+Number(o.total||0),0),items=paid.reduce((s,o)=>s+(o.items||[]).reduce((a,i)=>a+Number(i.qty||0),0),0);$('orBox').innerHTML='<div class="summary"><div class="stat"><b>Total Order</b><br>'+paid.length+'</div><div class="stat"><b>Pendapatan</b><br>'+money(revenue)+'</div><div class="stat"><b>Pengeluaran</b><br>'+money(expense)+'</div><div class="stat"><b>Laba Bersih</b><br>'+money(net)+'</div><div class="stat"><b>Tunai</b><br>'+money(cash)+'</div><div class="stat"><b>QRIS</b><br>'+money(qris)+'</div><div class="stat"><b>Item Terjual</b><br>'+items+'</div></div><div class="detail"><h3>📋 Detail Order Masuk</h3>'+(paid.length?paid.map(o=>'<div class="line"><b>'+esc(o.order_number)+'</b> • 🪑 Meja <b>'+esc(o.table_name||'Take Away')+'</b><br>'+esc(o.payment_method||'-')+' • '+esc(o.payment_status||'-')+' • '+money(o.total)+'<br><span class="muted2">'+(o.created_at?new Date(o.created_at).toLocaleString('id-ID',{timeZone:'Asia/Jakarta'}):'-')+'</span><br>'+((o.items||[]).map(i=>esc(i.name)+' × '+Number(i.qty||0)+' — '+money(Number(i.price||0)*Number(i.qty||0))).join(' • ')||'-')+'</div>').join(''):'<span class="muted">Tidak ada order PAID pada periode ini.</span>')+'</div><div class="detail"><h3>💸 Detail Pengeluaran</h3>'+(exp.length?exp.map(e=>'<div class="line"><b>'+esc(e.category||'Operasional')+'</b> — '+money(e.amount)+'<br>Keterangan: <b>'+esc(e.description||'-')+'</b><br><span class="muted2">Tanggal: '+esc(e.expense_date||'-')+'</span></div>').join(''):'<span class="muted">Belum ada pengeluaran pada periode ini.</span>')+'</div>'}catch(e){$('orBox').innerHTML='<div class="err">Gagal memuat rekapan: '+esc(e.message)+'</div>'}}$('orDay').onclick=()=>setRange('day');$('orWeek').onclick=()=>setRange('week');$('orMonth').onclick=()=>setRange('month');$('orShow').onclick=load;$('orPrint').onclick=()=>w.print();$('orFrom').value=today();$('orTo').value=today();return true}catch(e){return false}}
let tries=0;frame.addEventListener('load',()=>{const t=setInterval(()=>{tries++;if(install()||tries>120)clearInterval(t)},250)});
</script></body></html>
