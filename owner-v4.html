<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — OWNER</title><style>html,body{margin:0;width:100%;height:100%;background:#0b0b0b}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="owner" src="owner-v3.html?v=20260823" title="ISSHO CAFE OWNER"></iframe><script>
const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';
const f=document.getElementById('owner');
function api(w,path,opt={}){const h=Object.assign({apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},opt.headers||{});return fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h})).then(async r=>{const t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null})}
function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}
function today(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'})}
function range(kind){const d=new Date();let a,b;if(kind==='day'){a=today();b=a}else if(kind==='week'){const x=new Date(d);const day=x.getDay()||7;x.setDate(x.getDate()-day+1);a=x.toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'});const y=new Date(x);y.setDate(y.getDate()+6);b=y.toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'})}else{a=new Date(d.getFullYear(),d.getMonth(),1).toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'});b=new Date(d.getFullYear(),d.getMonth()+1,0).toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'})}return[a,b]}
function install(){try{const w=f.contentWindow,d=w.document;if(!d||!w.$)return false;let st=d.getElementById('owner-v4-style');if(!st){st=d.createElement('style');st.id='owner-v4-style';st.textContent='.proof{width:120px!important;height:120px!important;max-width:120px!important;object-fit:contain!important;background:#fff;border:1px solid #333;border-radius:10px}.proof-note{font-size:12px;color:#aaa}.expense-box{margin-top:12px}.summary-v4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.summary-v4 .stat{background:#202020;border:1px solid #333;border-radius:10px;padding:10px}@media(max-width:700px){.summary-v4{grid-template-columns:repeat(2,1fr)}}@media print{.proof{width:90px!important;height:90px!important}}';d.head.appendChild(st)}
const sec=d.getElementById('reports');if(!sec)return true;sec.innerHTML='<h2>📊 Rekapan Owner</h2><div class="muted">Laporan ringkas harian dan laporan detail dapat dipilih dari rentang tanggal.</div><div class="grid"><div><label>Dari tanggal</label><input id="ovFrom" type="date"></div><div><label>Sampai tanggal</label><input id="ovTo" type="date"></div></div><div class="actions"><button class="gold" id="ovDay">📅 Hari Ini</button><button class="dark" id="ovWeek">📆 Mingguan</button><button class="dark" id="ovMonth">🗓️ Bulanan</button><button class="blue" id="ovSearch">🔎 Tampilkan</button><button id="ovPrint">🖨️ Print</button></div><div class="card expense-box"><h3>💸 Pengeluaran</h3><div class="grid"><div><label>Tanggal</label><input id="exDate" type="date"></div><div><label>Kategori</label><input id="exCat" value="Operasional"></div><div><label>Nominal</label><input id="exAmount" type="number" min="1" placeholder="Rp"></div></div><input id="exDesc" placeholder="Keterangan pengeluaran"><button class="red" id="exSave">Simpan Pengeluaran</button><div id="exMsg"></div></div><div id="reportBox"></div>';
function setDates(k){const r=range(k);d.getElementById('ovFrom').value=r[0];d.getElementById('ovTo').value=r[1];loadReport()}
async function loadReport(){const from=d.getElementById('ovFrom').value,to=d.getElementById('ovTo').value;if(!from||!to)return;try{const orders=await w.api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:w.P})});const end=new Date(to+'T00:00:00+07:00');end.setDate(end.getDate()+1);const lo=new Date(from+'T00:00:00+07:00').getTime(),hi=end.getTime();const paid=(orders||[]).filter(o=>o.payment_status==='PAID'&&o.created_at&&new Date(o.created_at).getTime()>=lo&&new Date(o.created_at).getTime()<hi);const expenses=await api(w,'/rest/v1/rpc/owner_get_expenses',{method:'POST',body:JSON.stringify({p_owner_pin:w.P,p_from:from,p_to:to})});const exp=Array.isArray(expenses)?expenses:[];const revenue=paid.reduce((s,o)=>s+Number(o.total||0),0),expense=exp.reduce((s,e)=>s+Number(e.amount||0),0),net=revenue-expense;d.getElementById('reportBox').innerHTML='<div class="summary-v4"><div class="stat"><b>Order PAID</b><br>'+paid.length+'</div><div class="stat"><b>Pendapatan</b><br>'+money(revenue)+'</div><div class="stat"><b>Pengeluaran</b><br>'+money(expense)+'</div><div class="stat"><b>Laba Bersih</b><br>'+money(net)+'</div></div><div class="card"><h3>📋 Detail Order Masuk</h3>'+ (paid.map(o=>'<div class="item"><div class="row"><div><b>'+w.esc(o.order_number)+'</b><br>🪑 Meja: <b>'+w.esc(o.table_name||'Take Away')+'</b> • '+w.esc(o.payment_method)+' • '+w.esc(o.payment_status)+'<br><span class="muted">'+(o.created_at?new Date(o.created_at).toLocaleString('id-ID',{timeZone:'Asia/Jakarta'}):'-')+'</span></div><b>'+money(o.total)+'</b></div>'+((o.items||[]).map(i=>'<div class="item">'+w.esc(i.name)+' × '+i.qty+' — '+money(Number(i.price||0)*Number(i.qty||0))+'</div>').join(''))+'</div>').join('')||'<span class="muted">Tidak ada order PAID pada periode ini.</span>')+'</div><div class="card"><h3>💸 Detail Pengeluaran</h3>'+ (exp.map(e=>'<div class="item"><div class="row"><div><b>'+w.esc(e.category)+'</b><br>'+w.esc(e.description||'-')+'<br><span class="muted">'+e.expense_date+'</span></div><b>'+money(e.amount)+'</b></div></div>').join('')||'<span class="muted">Belum ada pengeluaran.</span>')+'</div>'}catch(e){d.getElementById('reportBox').innerHTML='<div class="err">'+w.esc(e.message)+'</div>'}}
d.getElementById('ovDay').onclick=()=>setDates('day');d.getElementById('ovWeek').onclick=()=>setDates('week');d.getElementById('ovMonth').onclick=()=>setDates('month');d.getElementById('ovSearch').onclick=loadReport;d.getElementById('ovPrint').onclick=()=>w.print();d.getElementById('exSave').onclick=async()=>{try{const amount=Number(d.getElementById('exAmount').value);if(!amount||amount<=0)throw Error('Nominal pengeluaran harus diisi.');await api(w,'/rest/v1/rpc/owner_add_expense',{method:'POST',body:JSON.stringify({p_owner_pin:w.P,p_date:d.getElementById('exDate').value||today(),p_category:d.getElementById('exCat').value||'Operasional',p_description:d.getElementById('exDesc').value||'',p_amount:amount})});d.getElementById('exMsg').innerHTML='<div class="ok">✓ Pengeluaran tersimpan.</div>';d.getElementById('exAmount').value='';d.getElementById('exDesc').value='';loadReport()}catch(e){d.getElementById('exMsg').innerHTML='<div class="err">'+w.esc(e.message)+'</div>'}};d.getElementById('exDate').value=today();d.getElementById('ovFrom').value=today();d.getElementById('ovTo').value=today();w.report=loadReport;return true}catch(e){return false}}
let tries=0;f.addEventListener('load',()=>{const timer=setInterval(()=>{tries++;if(install()||tries>80)clearInterval(timer)},250)});</script></body></html>
