<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>ISSHO CAFE — OWNER</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}#tools{position:fixed;right:12px;top:12px;z-index:99999;display:flex;gap:7px;align-items:center;background:#151515;border:1px solid #444;border-radius:12px;padding:7px;box-shadow:0 8px 25px #000}button{border:0;border-radius:9px;padding:10px 13px;font-weight:900;color:#fff;cursor:pointer}.green{background:#2f7d50}.gold{background:#b68142}.green:disabled{opacity:.6;pointer-events:none}#status{position:fixed;left:12px;bottom:12px;z-index:100000;background:#151515;color:#fff;border:1px solid #444;border-radius:9px;padding:9px 12px;display:none;font:13px Arial}#modal{display:none;position:fixed;inset:0;z-index:100001;background:rgba(0,0,0,.72);padding:24px;overflow:auto}#panel{max-width:760px;margin:40px auto;background:#151515;border:1px solid #444;border-radius:16px;padding:18px;color:#fff;box-shadow:0 20px 60px #000}.muted{color:#aaa;font-size:13px}.notice{background:#302719;border:1px solid #5a4529;color:#ffe8b2;padding:10px;border-radius:10px;margin:10px 0}#search{width:100%;box-sizing:border-box;padding:12px;border:1px solid #444;border-radius:10px;background:#1b1b1b;color:#fff;font-size:16px;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.dark{background:#242424;color:#fff;border:1px solid #444}#list{margin-top:10px;max-height:52vh;overflow:auto;border:1px solid #333;border-radius:10px}.item{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #333}.item:last-child{border-bottom:0}.item input{width:20px;height:20px;flex:0 0 auto}.name{font-weight:900}.cat{color:#aaa;font-size:12px;margin-top:3px}.empty{text-align:center;padding:22px;color:#9f9f9f}.price{color:#ddd;font-size:12px;margin-top:3px}@media(max-width:700px){#tools{left:6px;right:6px;top:6px;justify-content:flex-end}#tools button{font-size:11px;padding:8px}.gold{display:none}#modal{padding:8px}#panel{margin:55px auto 10px;padding:13px}}</style>
</head><body>
<iframe id="owner" src="owner-v3-safe.html" title="ISSHO CAFE OWNER"></iframe>
<div id="tools"><button class="green" id="restore" type="button">🟢 PULIHKAN MENU TERPILIH (0)</button><button class="gold" type="button" onclick="location.href='owner-menu-manager.html'">🍽️ Kelola Menu</button></div>
<div id="status"></div>
<div id="modal"><div id="panel"><h2>🟢 Pulihkan Menu Terpilih</h2><div class="muted">Centang hanya menu yang stoknya sudah tersedia kembali. Menu yang tidak dicentang tetap tidak dipulihkan.</div><div class="notice">Jumlah pada tombol <b>hanya menunjukkan jumlah menu yang Anda centang</b>. Jika belum memilih apa pun, tombol selalu <b>(0)</b>.</div><input id="search" placeholder="🔎 Cari menu tersembunyi..." oninput="renderList()"><div id="list"></div><div class="actions"><button class="gold" type="button" onclick="selectAllVisible()">☑ Pilih Semua</button><button id="bulk" class="green" type="button" onclick="restoreSelected()">🟢 PULIHKAN MENU TERPILIH (0)</button><button class="dark" type="button" onclick="closeModal()">Tutup</button></div><div id="modalMsg" class="muted" style="margin-top:9px"></div></div></div>
<script>
const S='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';
const f=document.getElementById('owner'),topBtn=document.getElementById('restore'),modal=document.getElementById('modal'),listEl=document.getElementById('list'),searchEl=document.getElementById('search'),bulkBtn=document.getElementById('bulk'),msgEl=document.getElementById('modalMsg'),statusEl=document.getElementById('status');
let hiddenMenus=[],selected=new Set(),loading=false;
const esc=s=>String(s??'').replace(/[&<>\\\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\\"':'&quot;',"'":'&#39;'}[m]));
const say=x=>{statusEl.textContent=x;statusEl.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>statusEl.style.display='none',3500)};
const iw=()=>f.contentWindow;const pin=()=>{try{return iw().document.getElementById('pin')?.value?.trim()||''}catch(e){return''}};
async function rpc(path,body){const r=await fetch(S+path,{method:'POST',cache:'no-store',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(body)}),t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null}
function categoryName(p){return p.category_name||'Tanpa Kategori'}
function updateCount(){const n=selected.size;topBtn.textContent='🟢 PULIHKAN MENU TERPILIH ('+n+')';bulkBtn.textContent='🟢 PULIHKAN MENU TERPILIH ('+n+')'}
function renderList(){const q=(searchEl.value||'').trim().toLowerCase();const rows=hiddenMenus.filter(p=>(p.name+' '+(p.description||'')+' '+categoryName(p)).toLowerCase().includes(q));if(!rows.length){listEl.innerHTML='<div class="empty">✓ Tidak ada menu stok kosong yang tersedia.</div>';updateCount();return}listEl.innerHTML=rows.map(p=>'<label class="item"><input type="checkbox" data-id="'+esc(p.id)+'" '+(selected.has(p.id)?'checked':'')+' onchange="toggleOne(\''+esc(p.id)+'\',this.checked)"><div><div class="name">'+esc(p.name)+'</div><div class="cat">'+esc(categoryName(p))+'</div><div class="price">'+Number(p.price||0).toLocaleString('id-ID')+'</div></div></label>').join('');updateCount()}
function toggleOne(id,on){if(on)selected.add(id);else selected.delete(id);updateCount()}
function selectAllVisible(){const q=(searchEl.value||'').trim().toLowerCase();hiddenMenus.filter(p=>(p.name+' '+(p.description||'')+' '+categoryName(p)).toLowerCase().includes(q)).forEach(p=>selected.add(p.id));renderList()}
async function loadHidden(){if(loading)return false;const p=pin();if(!p){msgEl.innerHTML='<span style="color:#ffb4ad">Login Owner terlebih dahulu, lalu tekan tombol ini.</span>';return false}loading=true;msgEl.textContent='Memuat menu stok kosong...';try{const rows=await rpc('/rest/v1/rpc/owner_list_hidden_products',{p_owner_pin:p});hiddenMenus=Array.isArray(rows)?rows:[];selected=new Set([...selected].filter(id=>hiddenMenus.some(x=>x.id===id)));renderList();msgEl.textContent=hiddenMenus.length?hiddenMenus.length+' menu stok kosong ditemukan.':'Tidak ada menu stok kosong.';return true}finally{loading=false}}
async function refreshData(){try{const p=pin();if(!p)return;const rows=await rpc('/rest/v1/rpc/owner_list_hidden_products',{p_owner_pin:p});hiddenMenus=Array.isArray(rows)?rows:[];selected=new Set([...selected].filter(id=>hiddenMenus.some(x=>x.id===id));if(modal.style.display==='block')renderList()}catch(e){}}
async function openModal(){modal.style.display='block';searchEl.value='';selected.clear();updateCount();try{await loadHidden()}catch(e){listEl.innerHTML='<div class="empty" style="color:#ffb4ad">Gagal memuat: '+esc(e.message)+'</div>';msgEl.textContent='Periksa login Owner dan koneksi Supabase.'}}
function closeModal(){modal.style.display='none'}
async function restoreSelected(){const p=pin();if(!p)return say('Silakan login Owner terlebih dahulu.');const ids=[...selected];if(!ids.length)return say('Pilih minimal satu menu.');bulkBtn.disabled=true;bulkBtn.textContent='⏳ MEMULIHKAN '+ids.length+' MENU...';try{const d=await rpc('/rest/v1/rpc/owner_restore_selected_products',{p_owner_pin:p,p_product_ids:ids});say('✓ '+(d?.message||ids.length+' menu berhasil dipulihkan.'));selected.clear();updateCount();await loadHidden();try{if(typeof iw().loadProducts==='function')await iw().loadProducts()}catch(e){}setTimeout(()=>{try{iw().location.reload()}catch(e){}},250)}catch(e){say('Gagal memulihkan: '+e.message);msgEl.innerHTML='<span style="color:#ffb4ad">Gagal: '+esc(e.message)+'</span>'}finally{bulkBtn.disabled=false;updateCount()}}
topBtn.addEventListener('click',openModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});setInterval(refreshData,5000);f.addEventListener('load',()=>{setTimeout(refreshData,1000);setTimeout(refreshData,3000)});updateCount();
</script>
<script src="/ui-standard.js?v=20260831-ui-v3"></script></body></html>
