 a=String(v||'').split('-').map(Number);return a.length===3&&!a.some(isNaN)?new Date(a[0],a[1]-1,a[2]):new Date()}function period(m){const x=d(iw().document.getElementById('date')?.value);if(m==='daily'){const a=new Date(x),b=new Date(x);a.setHours(7,0,0,0);b.setDate(b.getDate()+1);b.setHours(0,0,0,0);return[a,b,'Harian','07:00–00:00']}if(m==='weekly'){const day=x.getDay(),diff=day===0?-6:1-day,a=new Date(x);a.setDate(x.getDate()+diff);a.setHours(7,0,0,0);const b=new Date(a);b.setDate(b.getDate()+7);b.setHours(7,0,0,0);return[a,b,'Mingguan','Senin–Minggu']}const a=new Date(x.getFullYear(),x.getMonth(),1,7),b=new Date(x.getFullYear(),x.getMonth()+1,1,7);return[a,b,'Bulanan',a.toLocaleDateString('id-ID',{month:'long',year:'numeric'})]}function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}async function showReport(m){const w=iw(),box=w.document.getElementById('reportBox'),p=pin();if(!box||!p)return say('Login Owner terlebih dahulu.');try{const z=period(m),r=await rpc('/rest/v1/rpc/owner_sales_detail_report',{p_owner_pin:p,p_from:z[0].toISOString(),p_to:z[1].toISOString()}),cs=Array.isArray(r?.categories)?r.categories:[];let h='<div style="background:#111;color:#fff;border:1px solid #444;border-radius:12px;padding:14px;margin:12px 0"><b style="font-size:21px">📊 RINCIAN PENJUALAN PER KATEGORI</b><div style="color:#aaa;margin:6px 0 12px">'+z[2]+' • '+z[3]+' • transaksi PAID</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px">';[['Pesanan Lunas',r?.orders],['Total Qty',r?.total_qty],['Total Omzet',money(r?.omzet)],['Tunai',money(r?.cash)],['QRIS',money(r?.qris)]].forEach(x=>h+='<div style="background:#202020;border:1px solid #383838;border-radius:9px;padding:10px"><small style="color:#aaa">'+x[0]+'</small><br><b>'+x[1]+'</b></div>');h+='</div>';for(const c of cs){h+='<div style="margin-top:12px;border:1px solid #444;border-radius:10px;overflow:auto"><div style="background:#222;padding:11px;font-weight:900">🍽️ '+String(c.category||'Tanpa Kategori')+' <span style="float:right">'+Number(c.quantity||0)+' • '+money(c.total)+'</span></div><table style="width:100%;min-width:620px;border-collapse:collapse"><tr><th style="padding:9px;text-align:left">Nama Menu</th><th style="padding:9px;text-align:right">Harga</th><th style="padding:9px;text-align:right">Qty</th><th style="padding:9px;text-align:right">Total</th></tr>';for(const x of c.items||[])h+='<tr><td style="padding:9px;border-top:1px solid #333">'+String(x.name||'')+'</td><td style="padding:9px;text-align:right;border-top:1px solid #333">'+money(x.unit_price)+'</td><td style="padding:9px;text-align:right;border-top:1px solid #333">'+Number(x.quantity||0)+'</td><td style="padding:9px;text-align:right;border-top:1px solid #333">'+money(x.total)+'</td></tr>';h+='</table></div>'}h+='</div>';box.innerHTML=h;say('✓ Rekapan '+z[2]+' diperbarui.')}catch(e){say('Gagal rekapan: '+e.message)}}document.getElementById('reports').onclick=()=>{const w=iw(),b=w.document.getElementById('reports');if(b)b.scrollIntoView({behavior:'smooth'});let x=w.document.getElementById('reportRangeRecovery');if(!x){x=w.document.createElement('div');x.id='reportRangeRecovery';x.style.cssText='position:fixed;right:12px;top:70px;z-index:99998;background:#151515;border:1px solid #444;border-radius:10px;padding:8px';x.innerHTML='<button id="rD" class="gold">📅 Harian</button> <button id="rW" class="blue">📆 Mingguan</button> <button id="rM" class="green">🗓️ Bulanan</button>';w.document.body.appendChild(x);x.querySelector('#rD').onclick=()=>showReport('daily');x.querySelector('#rW').onclick=()=>showReport('weekly');x.querySelector('#rM').onclick=()=>showReport('monthly')} };document.getElementById('restore').onclick=async()=>{const p=pin();if(!p)return say('Login Owner terlebih dahulu.');try{const r=await rpc('/rest/v1/rpc/owner_list_hidden_products',{p_owner_pin:p})||[];if(!r.length)return say('Tidak ada menu stok kosong.');const ids=r.map(x=>x.id);if(confirm('Pulihkan '+ids.length+' menu yang stoknya kosong?')){await rpc('/rest/v1/rpc/owner_restore_selected_products',{p_owner_pin:p,p_product_ids:ids});say('✓ Menu berhasil dipulihkan.');iw().location.reload()}}catch(e){say('Gagal: '+e.message)}};</script><script src="/ui-standard.js?v=20260831-ui-v4"></script></body></html>
