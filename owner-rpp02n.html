<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>ISSHO CAFE — OWNER REKAPAN DETAIL</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}#status{position:fixed;right:14px;bottom:14px;z-index:999999;background:#151515;color:#ddd;border:1px solid #444;border-radius:10px;padding:8px 11px;font:12px Arial;box-shadow:0 8px 25px #000;display:none}.issho-order-date{color:#aaa;font-size:12px;font-weight:700;margin-top:4px;display:block}</style></head><body><iframe id="owner" src="owner.html?v=20260825-owner-report-fix-v1" title="ISSHO CAFE OWNER"></iframe><div id="status">Rekap detail siap.</div><script>const frame=document.getElementById('owner'),status=document.getElementById('status');const SUPA='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);function showStatus(t){status.textContent=t;status.style.display='block';clearTimeout(showStatus.t);showStatus.t=setTimeout(()=>status.style.display='none',2500)}function ownerApp(){try{return frame.contentWindow.document.getElementById('app').contentWindow}catch(e){return null}}function ownerPin(w){try{return w.document.getElementById('pin')?.value?.trim()||''}catch(e){return ''}}async function rpc(name,body){const r=await fetch(SUPA+'/rest/v1/rpc/'+name,{method:'POST',cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null}function localDate(v){const a=String(v||'').split('-').map(Number);return a.length===3&&!a.some(isNaN)?new Date(a[0],a[1]-1,a[2]):new Date()}function rangeDaily(w){const d=localDate(w.document.getElementById('date')?.value);const s=w.document.getElementById('session')?.value||'day';let from=new Date(d),to=new Date(d);if(s==='morning'){from.setHours(7,0,0,0);to.setHours(17,0,0,0)}else if(s==='evening'){from.setHours(17,0,0,0);to.setDate(to.getDate()+1);to.setHours(7,0,0,0)}else{from.setHours(7,0,0,0);to.setDate(to.getDate()+1);to.setHours(7,0,0,0)}return{from,to,title:'Harian',label:s==='morning'?'Pagi 07:00–17:00':s==='evening'?'Sore 17:00–Close':'Seharian 07:00–Close'}}function rangeWeekly(w){const d=localDate(w.document.getElementById('date')?.value);const day=d.getDay();const diff=day===0?-6:1-day;const from=new Date(d);from.setDate(d.getDate()+diff);from.setHours(7,0,0,0);const to=new Date(from);to.setDate(to.getDate()+7);to.setHours(7,0,0,0);return{from,to,title:'Mingguan',label:'Senin–Minggu'}}function rangeMonthly(w){const d=localDate(w.document.getElementById('date')?.value);const from=new Date(d.getFullYear(),d.getMonth(),1,7,0,0,0);const to=new Date(d.getFullYear(),d.getMonth()+1,1,7,0,0,0);return{from,to,title:'Bulanan',label:from.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}}function unitFor(category){const n=String(category||'').toLowerCase();if(n.includes('minuman')||n.includes('kopi')||n.includes('wedangan')||n.includes('teh'))return'gelas';if(n.includes('bakaran')||n.includes('dimsum'))return'pcs';return'porsi'}async function loadDetail(range){const w=ownerApp(),pin=ownerPin(w);if(!pin)throw Error('Login Owner belum aktif.');return (await rpc('owner_sales_detail_report',{p_owner_pin:pin,p_from:range.from.toISOString(),p_to:range.to.toISOString()}))||{orders:0,omzet:0,cash:0,qris:0,total_qty:0,categories:[]}}function render(data,range){let h='<div id="detailReport" style="background:#111;color:#f5f5f5;border:1px solid #444;border-radius:14px;padding:16px;margin:12px 0;font-family:Arial,sans-serif;min-height:220px;box-sizing:border-box">';h+='<div style="font-size:22px;font-weight:900;margin-bottom:4px">📊 RINCIAN PENJUALAN PER KATEGORI</div>';h+='<div style="color:#aaa;font-size:13px;margin-bottom:14px">'+esc(range.title)+' • '+esc(range.label)+' • hanya transaksi PAID</div>';h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin-bottom:14px">';[['Pesanan Lunas',data.orders],['Total Qty',data.total_qty],['Total Omzet',money(data.omzet)],['Tunai',money(data.cash)],['QRIS',money(data.qris)]].forEach(x=>h+='<div style="background:#202020;border:1px solid #383838;border-radius:10px;padding:11px"><div style="color:#aaa;font-size:12px">'+x[0]+'</div><b style="font-size:18px">'+x[1]+'</b></div>');h+='</div>';const cats=Array.isArray(data.categories)?data.categories:[];if(!cats.length)h+='<div style="padding:15px;color:#aaa">Belum ada transaksi PAID pada periode ini.</div>';for(const c of cats){const unit=unitFor(c.category);h+='<div style="border:1px solid #444;border-radius:12px;overflow:hidden;margin-top:14px"><div style="background:#222;padding:13px;font-weight:900;font-size:18px">🍽️ '+esc(c.category)+' <span style="float:right">'+Number(c.quantity||0)+' '+unit+' • '+money(c.total)+'</span></div><div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:14px;min-width:650px"><thead><tr style="background:#191919"><th style="padding:10px;text-align:left;border-bottom:1px solid #333">Nama Menu</th><th style="padding:10px;text-align:right;border-bottom:1px solid #333">Harga Satuan</th><th style="padding:10px;text-align:right;border-bottom:1px solid #333">Kuantitas Terjual</th><th style="padding:10px;text-align:right;border-bottom:1px solid #333">Total Uang</th></tr></thead><tbody>';for(const x of(c.items||[]))h+='<tr><td style="padding:10px;border-bottom:1px solid #292929"><b>'+esc(x.name)+'</b></td><td style="padding:10px;text-align:right;border-bottom:1px solid #292929">'+money(x.unit_price)+'</td><td style="padding:10px;text-align:right;border-bottom:1px solid #292929"><b>'+Number(x.quantity||0)+' '+unit+'</b></td><td style="padding:10px;text-align:right;border-bottom:1px solid #292929"><b>'+money(x.total)+'</b></td></tr>';h+='</tbody><tfoot><tr style="background:#222;font-weight:900"><td colspan="2" style="padding:11px">TOTAL '+esc(c.category)+'</td><td style="padding:11px;text-align:right">'+Number(c.quantity||0)+' '+unit+'</td><td style="padding:11px;text-align:right">'+money(c.total)+'</td></tr></tfoot></table></div></div>'}h+='<div style="margin-top:16px;background:#222;border:2px solid #666;border-radius:12px;padding:14px;font-size:17px;font-weight:900">TOTAL SEMUA KATEGORI: '+Number(data.total_qty||0)+' item • '+money(data.omzet)+'</div></div>';return h}let activeMode='daily';function getRange(w){return activeMode==='weekly'?rangeWeekly(w):activeMode==='monthly'?rangeMonthly(w):rangeDaily(w)}async function runDetail(){const w=ownerApp();if(!w)return;const box=w.document.getElementById('reportBox');if(!box)return;const scrollY=w.scrollY;const old=box.innerHTML;try{const r=getRange(w),d=await loadDetail(r);const next=render(d,r);if(old!==next)box.innerHTML=next;w.requestAnimationFrame(()=>w.scrollTo(0,scrollY));showStatus('✓ Rekapan '+r.title+' diperbarui.')}catch(e){const err='<div style="padding:14px;background:#4a1d1a;color:#ffd9d5;border-radius:10px">Gagal mengambil rekapan: '+esc(e.message)+'</div>';if(old!==err)box.innerHTML=err;w.requestAnimationFrame(()=>w.scrollTo(0,scrollY));showStatus('Gagal memuat rekapan.')}}function installToolbar(w){const reports=w.document.getElementById('reports');if(!reports||reports.dataset.detailToolbar)return;reports.dataset.detailToolbar='1';const tools=w.document.createElement('div');tools.id='detailToolbar';tools.style.cssText='margin:10px 0;padding:10px;background:#151515;border:1px solid #3a3a3a;border-radius:12px;display:flex;gap:8px;flex-wrap:wrap';tools.innerHTML='<b style="display:flex;align-items:center;margin-right:4px">📋 Rekapan Detail:</b><button type="button" data-mode="daily" style="border:0;border-radius:9px;padding:10px 13px;font-weight:900;background:#b68142;color:#fff;cursor:pointer">Harian</button><button type="button" data-mode="weekly" style="border:0;border-radius:9px;padding:10px 13px;font-weight:900;background:#315b9a;color:#fff;cursor:pointer">Mingguan</button><button type="button" data-mode="monthly" style="border:0;border-radius:9px;padding:10px 13px;font-weight:900;background:#2f7d50;color:#fff;cursor:pointer">Bulanan</button>';reports.insertBefore(tools,reports.querySelector('.actions'));tools.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{activeMode=b.dataset.mode;tools.querySelectorAll('button').forEach(x=>x.style.outline='none');b.style.outline='3px solid #fff';runDetail()}));const tampil=[...reports.querySelectorAll('.actions button')].find(b=>b.textContent.trim().toLowerCase()==='tampilkan');if(tampil)tampil.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();runDetail()},true);const print=[...reports.querySelectorAll('.actions button')].find(b=>b.textContent.toLowerCase().includes('print'));if(print)print.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();printDetail()},true)}function printDetail(){const w=ownerApp(),detail=w?.document.getElementById('reportBox')?.querySelector('#detailReport');if(!detail){runDetail().then(()=>setTimeout(printDetail,700));return}const p=window.open('','_blank');p.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Rekapan Penjualan ISSHO CAFE</title><style>body{font-family:Arial;margin:12mm;color:#111}table{width:100%;border-collapse:collapse}th,td{border:1px solid #aaa;padding:7px}tr{page-break-inside:avoid}@media print{body{margin:8mm}}</style></head><body>'+detail.outerHTML+'</body></html>');p.document.close();setTimeout(()=>p.print(),500)}function orderDateTimeFromNo(no){const m=String(no||'').match(/^ISS-(\d{6})-(\d{6})-/i);if(!m)return{date:'-',time:'-'};const ds=m[1],ts=m[2],yy=Number(ds.slice(0,2)),mm=Number(ds.slice(2,4)),dd=Number(ds.slice(4,6)),hh=Number(ts.slice(0,2)),mi=Number(ts.slice(2,4)),ss=Number(ts.slice(4,6));return{date:mm>=1&&mm<=12&&dd>=1&&dd<=31?String(dd).padStart(2,'0')+'/'+String(mm).padStart(2,'0')+'/20'+String(yy).padStart(2,'0'):'-',time:hh<=23&&mi<=59&&ss<=59?String(hh).padStart(2,'0')+':'+String(mi).padStart(2,'0')+':'+String(ss).padStart(2,'0'):'-'}}function patchOwnerOrderDates(){try{let w=frame.contentWindow,d=w.document;if(!d)return;let inner=d.getElementById('app');if(inner&&inner.contentDocument){w=inner.contentWindow;d=w.document}if(!d)return;d.querySelectorAll('.order').forEach(card=>{if(card.querySelector('.issho-order-date'))return;const b=card.querySelector('b');if(!b)return;const no=String(b.textContent||'').trim();if(!/^ISS-\d{6}-\d{6}-[A-Z0-9]+$/i.test(no))return;const dt=orderDateTimeFromNo(no);const el=d.createElement('div');el.className='issho-order-date';el.textContent='Tanggal Order: '+dt.date+' • Jam Order: '+dt.time;b.parentNode.insertBefore(el,b.nextSibling)})}catch(e){}}function attach(){try{const ow=frame.contentWindow,inner=ow.document.getElementById('app');if(!inner||!inner.contentDocument)return false;const w=inner.contentWindow;if(!w.document.getElementById('reports'))return false;installToolbar(w);patchOwnerOrderDates();return true}catch(e){return false}}function boot(){let n=0;const t=setInterval(()=>{if(attach()||++n>300)clearInterval(t)},250);setInterval(attach,1500);setInterval(patchOwnerOrderDates,700)}frame.addEventListener('load',boot);boot();</script></body></html>
