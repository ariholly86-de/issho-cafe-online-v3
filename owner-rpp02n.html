<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}#tools{display:none}</style>
</head>
<body>
<iframe id="owner" src="/owner.html?v=20260831-owner-master-restore" title="ISSHO CAFE OWNER"></iframe>
<div id="tools"></div>
<script>
const frame=document.getElementById('owner'),SUPA='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
function app(){try{return frame.contentWindow.document.getElementById('app').contentWindow}catch(e){return null}}
function ownerPin(w){try{return w?.document.getElementById('pin')?.value?.trim()||''}catch(e){return''}}
async function rpc(name,body){const r=await fetch(SUPA+'/rest/v1/rpc/'+name,{method:'POST',cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null}
function localDate(v){const a=String(v||'').split('-').map(Number);return a.length===3&&!a.some(isNaN)?new Date(a[0],a[1]-1,a[2]):new Date()}
function daily(w){const d=localDate(w.document.getElementById('date')?.value);const s=w.document.getElementById('session')?.value||'day';let from=new Date(d),to=new Date(d);if(s==='morning'){from.setHours(7,0,0,0);to.setHours(17,0,0,0)}else if(s==='evening'){from.setHours(17,0,0,0);to.setDate(to.getDate()+1);to.setHours(7,0,0,0)}else{from.setHours(7,0,0,0);to.setDate(to.getDate()+1);to.setHours(7,0,0,0)}return{from,to,title:'Harian',label:s==='morning'?'Pagi 07:00–17:00':s==='evening'?'Sore 17:00–Close':'Seharian 07:00–Close'}}
function weekly(w){const d=localDate(w.document.getElementById('date')?.value),day=d.getDay(),diff=day===0?-6:1-day,from=new Date(d);from.setDate(d.getDate()+diff);from.setHours(7,0,0,0);const to=new Date(from);to.setDate(to.getDate()+7);to.setHours(7,0,0,0);return{from,to,title:'Mingguan',label:'Senin–Minggu'}}
function monthly(w){const d=localDate(w.document.getElementById('date')?.value),from=new Date(d.getFullYear(),d.getMonth(),1,7),to=new Date(d.getFullYear(),d.getMonth()+1,1,7);return{from,to,title:'Bulanan',label:from.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}}
let mode='daily';
function getRange(w){return mode==='weekly'?weekly(w):mode==='monthly'?monthly(w):daily(w)}
async function detail(){const w=app(),box=w?.document.getElementById('reportBox'),pin=ownerPin(w);if(!w||!box||!pin){if(box)box.innerHTML='<div class="err">Silakan login Owner terlebih dahulu.</div>';return}const r=getRange(w);box.innerHTML='<div class="notice">⏳ Mengambil rekapan '+r.title+' dari Supabase...</div>';try{const d=await rpc('owner_sales_detail_report',{p_owner_pin:pin,p_from:r.from.toISOString(),p_to:r.to.toISOString()});let h='<div class="card" style="background:#111;color:#f5f5f5;border:1px solid #444"><h3>📊 RINCIAN PENJUALAN — '+r.title+'</h3><div class="muted">'+r.label+' • hanya transaksi PAID<br>'+r.from.toLocaleString('id-ID')+' s/d '+r.to.toLocaleString('id-ID')+'</div><div class="grid"><div>Pesanan Lunas<h2>'+Number(d.orders||0)+'</h2></div><div>Total Qty<h2>'+Number(d.total_qty||0)+'</h2></div><div>Total Omzet<h2>'+money(d.omzet)+'</h2></div><div>Tunai<h2>'+money(d.cash)+'</h2></div><div>QRIS<h2>'+money(d.qris)+'</h2></div></div>';for(const c of(d.categories||[])){const cn=String(c.category||'').toLowerCase(),unit=cn.includes('minuman')||cn.includes('kopi')||cn.includes('teh')?'gelas':(cn.includes('bakaran')||cn.includes('dimsum')?'pcs':'porsi');h+='<div class="card" style="background:#151515;border:1px solid #444"><h3>🍽️ '+esc(c.category)+' — '+Number(c.quantity||0)+' '+unit+' — '+money(c.total)+'</h3><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:8px">Nama Menu</th><th style="text-align:right;padding:8px">Harga</th><th style="text-align:right;padding:8px">Qty</th><th style="text-align:right;padding:8px">Total</th></tr></thead><tbody>'+(c.items||[]).map(x=>'<tr><td style="padding:8px;border-top:1px solid #333">'+esc(x.name)+'</td><td style="padding:8px;text-align:right;border-top:1px solid #333">'+money(x.unit_price)+'</td><td style="padding:8px;text-align:right;border-top:1px solid #333">'+Number(x.quantity||0)+' '+unit+'</td><td style="padding:8px;text-align:right;border-top:1px solid #333">'+money(x.total)+'</td></tr>').join('')+'</tbody></table></div></div>'}h+='<h3 style="background:#222;padding:12px;border-radius:10px">TOTAL SEMUA KATEGORI: '+Number(d.total_qty||0)+' item • '+money(d.omzet)+'</h3></div>';box.innerHTML=h}catch(e){box.innerHTML='<div class="err">Gagal memuat rekapan '+r.title+': '+esc(e.message)+'</div>'}}
function install(){try{const w=app(),r=w?.document.getElementById('reports');if(!r)return false;if(r.dataset.restoreReports)return true;r.dataset.restoreReports='1';const a=r.querySelector('.actions');if(!a)return false;const bar=w.document.createElement('div');bar.style.cssText='display:flex;gap:7px;flex-wrap:wrap;margin:10px 0;padding:8px;background:#151515;border:1px solid #444;border-radius:10px';bar.innerHTML='<b style="display:flex;align-items:center">📋 Rekapan Detail:</b><button type="button" data-m="daily">Harian</button><button type="button" data-m="weekly">Mingguan</button><button type="button" data-m="monthly">Bulanan</button>';bar.querySelectorAll('button').forEach(b=>{b.style.cssText='border:0;border-radius:9px;padding:9px 12px;background:#315b9a;color:#fff;font-weight:900;cursor:pointer';b.onclick=()=>{mode=b.dataset.m;detail()}});r.insertBefore(bar,a);const tampil=[...a.querySelectorAll('button')].find(b=>b.textContent.trim().toLowerCase()==='tampilkan');if(tampil)tampil.onclick=()=>detail();return true}catch(e){return false}}
frame.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{if(install()||++n>160)clearInterval(t)},250)});setInterval(install,1500);
</script>
