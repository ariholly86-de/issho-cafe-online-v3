<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>ISSHO CAFE — OWNER REKAPAN DETAIL</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}
#status{position:fixed;right:14px;bottom:14px;z-index:999999;background:#151515;color:#ddd;border:1px solid #444;border-radius:10px;padding:8px 11px;font:12px Arial;box-shadow:0 8px 25px #000;display:none}
</style>
</head>
<body>
<iframe id="owner" src="owner.html?v=20260825-owner-report-fix-v1" title="ISSHO CAFE OWNER"></iframe>
<div id="status">Rekap detail siap.</div>
<script>
const frame=document.getElementById('owner'),status=document.getElementById('status');
const SUPA='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
function showStatus(t){status.textContent=t;status.style.display='block';clearTimeout(showStatus.t);showStatus.t=setTimeout(()=>status.style.display='none',2500)}
function ownerApp(){try{return frame.contentWindow.document.getElementById('app').contentWindow}catch(e){return null}}
async function rest(path){const r=await fetch(SUPA+path,{method:'GET',cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+KEY}});const t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):[]}
function localDate(v){const a=String(v||'').split('-').map(Number);return a.length===3&&!a.some(isNaN)?new Date(a[0],a[1]-1,a[2]):new Date()}
function getRange(w){const d=localDate(w.document.getElementById('date')?.value);const s=w.document.getElementById('session')?.value||'day';let from=new Date(d),to=new Date(d);if(s==='morning'){from.setHours(7,0,0,0);to.setHours(17,0,0,0)}else if(s==='evening'){from.setHours(17,0,0,0);to.setDate(to.getDate()+1);to.setHours(7,0,0,0)}else{from.setHours(7,0,0,0);to.setDate(to.getDate()+1);to.setHours(7,0,0,0)}return{from,to,date:d,label:s==='morning'?'Pagi 07:00–17:00':s==='evening'?'Sore 17:00–Close':'Seharian 07:00–Close'} }
function iso(d){return encodeURIComponent(d.toISOString())}
function unitFor(category){const n=String(category||'').toLowerCase();if(n.includes('minuman')||n==='kopi'||n.includes('kopi')||n.includes('wedangan')||n.includes('sachetan'))return'gelas';if(n.includes('bakaran'))return'pcs';return'porsi'}
async function loadDetail(range){
 const orders=await rest('/rest/v1/orders?select=id,created_at,payment_status,payment_method,total&payment_status=eq.PAID&created_at=gte.'+iso(range.from)+'&created_at=lt.'+iso(range.to)+'&order=created_at.asc');
 const items=await rest('/rest/v1/order_items?select=order_id,product_id,product_name,unit_price,quantity,created_at&created_at=gte.'+iso(range.from)+'&created_at=lt.'+iso(range.to)+'&order=created_at.asc');
 const products=await rest('/rest/v1/products?select=id,name,category_id,price');
 const cats=await rest('/rest/v1/categories?select=id,name');
 const paid=new Map(orders.map(o=>[String(o.id),o]));
 const pmap=new Map(products.map(p=>[String(p.id),p]));const cmap=new Map(cats.map(c=>[String(c.id),c.name]));
 const groups=new Map();let totalQty=0,total=0,cash=0,qris=0;
 for(const o of orders){const m=String(o.payment_method||'').toUpperCase();if(m==='CASH')cash+=Number(o.total)||0;if(m==='QRIS')qris+=Number(o.total)||0}
 for(const it of items){const o=paid.get(String(it.order_id));if(!o)continue;const p=pmap.get(String(it.product_id));const category=String(cmap.get(String(p?.category_id||''))||'Tanpa Kategori');const name=String(it.product_name||p?.name||'Item').trim()||'Item';const qty=Number(it.quantity)||0;const price=Number(it.unit_price??p?.price)||0;if(qty<=0)continue;if(!groups.has(category))groups.set(category,new Map());const g=groups.get(category);const key=String(it.product_id||name);if(!g.has(key))g.set(key,{name,price,qty:0,total:0});const r=g.get(key);r.qty+=qty;r.total+=price*qty;totalQty+=qty;total+=price*qty}
 const categories=[...groups.entries()].map(([name,map])=>{const items=[...map.values()].sort((a,b)=>a.name.localeCompare(b.name));return{name,items,qty:items.reduce((s,x)=>s+x.qty,0),total:items.reduce((s,x)=>s+x.total,0),unit:unitFor(name)}}).sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name));
 return{orders:orders.length,cash,qris,totalQty,total,categories}
}
function html(data,range){
 let h='<div id="detailReport" style="background:#111;color:#f5f5f5;border:1px solid #444;border-radius:14px;padding:16px;margin:12px 0;font-family:Arial,sans-serif">';
 h+='<div style="font-size:22px;font-weight:900;margin-bottom:4px">📊 RINCIAN PENJUALAN PER KATEGORI</div>';
 h+='<div style="color:#aaa;font-size:13px;margin-bottom:14px">'+esc(range.date.toLocaleDateString('id-ID'))+' • '+esc(range.label)+' • hanya transaksi PAID</div>';
 h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin-bottom:14px">';
 [['Pesanan Lunas',data.orders],['Total Qty',data.totalQty],['Total Omzet',money(data.total)],['Tunai',money(data.cash)],['QRIS',money(data.qris)]].forEach(x=>h+='<div style="background:#202020;border:1px solid #383838;border-radius:10px;padding:11px"><div style="color:#aaa;font-size:12px">'+x[0]+'</div><b style="font-size:18px">'+x[1]+'</b></div>');h+='</div>';
 if(!data.categories.length){h+='<div style="padding:15px;color:#aaa">Tidak ada item terjual pada tanggal/sesi tersebut.</div>'}
 for(const c of data.categories){
  h+='<div style="border:1px solid #444;border-radius:12px;overflow:hidden;margin-top:14px">';
  h+='<div style="background:#222;padding:13px;font-weight:900;font-size:18px">🍽️ '+esc(c.name)+' <span style="float:right">'+c.qty+' '+esc(c.unit)+' • '+money(c.total)+'</span></div>';
  h+='<table style="width:100%;border-collapse:collapse;font-size:14px"><thead><tr style="background:#191919"><th style="padding:10px;text-align:left;border-bottom:1px solid #333">Nama Menu</th><th style="padding:10px;text-align:right;border-bottom:1px solid #333">Harga Satuan</th><th style="padding:10px;text-align:right;border-bottom:1px solid #333">Terjual</th><th style="padding:10px;text-align:right;border-bottom:1px solid #333">Jumlah Uang</th></tr></thead><tbody>';
  for(const x of c.items)h+='<tr><td style="padding:10px;border-bottom:1px solid #292929"><b>'+esc(x.name)+'</b></td><td style="padding:10px;text-align:right;border-bottom:1px solid #292929">'+money(x.price)+'</td><td style="padding:10px;text-align:right;border-bottom:1px solid #292929"><b>'+x.qty+' '+esc(c.unit)+'</b></td><td style="padding:10px;text-align:right;border-bottom:1px solid #292929"><b>'+money(x.total)+'</b></td></tr>';
  h+='</tbody><tfoot><tr style="background:#222;font-weight:900"><td colspan="2" style="padding:11px">TOTAL '+esc(c.name)+'</td><td style="padding:11px;text-align:right">'+c.qty+' '+esc(c.unit)+'</td><td style="padding:11px;text-align:right">'+money(c.total)+'</td></tr></tfoot></table></div>';
 }
 h+='<div style="margin-top:16px;background:#222;border:2px solid #666;border-radius:12px;padding:14px;font-size:17px;font-weight:900">TOTAL SEMUA KATEGORI: '+data.totalQty+' item • '+money(data.total)+'</div></div>';return h
}
async function runDetail(){const w=ownerApp();if(!w)return showStatus('Owner belum siap.');const box=w.document.getElementById('reportBox');if(!box)return showStatus('Panel Rekapan belum tersedia.');const range=getRange(w);box.innerHTML='<div style="padding:14px;background:#181818;border:1px solid #444;border-radius:10px">⏳ Mengambil penjualan dari Supabase dan mengelompokkan berdasarkan kategori menu...</div>';try{const data=await loadDetail(range);box.innerHTML=html(data,range);showStatus('✓ Detail kategori berhasil ditampilkan.')}catch(e){box.innerHTML='<div style="padding:14px;background:#4a1d1a;color:#ffd9d5;border-radius:10px">Gagal mengambil detail: '+esc(e.message)+'</div>';showStatus('Gagal memuat detail.')}}
function printDetail(){const w=ownerApp(),box=w?.document.getElementById('reportBox'),detail=box?.querySelector('#detailReport');if(!detail){runDetail().then(()=>setTimeout(printDetail,500));return}const p=window.open('','_blank');p.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Rekapan Penjualan ISSHO CAFE</title><style>body{font-family:Arial;margin:12mm;color:#111}table{width:100%;border-collapse:collapse}th,td{border:1px solid #aaa;padding:7px}tr{page-break-inside:avoid}@media print{body{margin:8mm}}</style></head><body>'+detail.outerHTML+'</body></html>');p.document.close();setTimeout(()=>p.print(),500)}
function attach(){try{const ow=frame.contentWindow,inner=ow.document.getElementById('app');if(!inner||!inner.contentDocument)return false;const w=inner.contentWindow,reports=w.document.getElementById('reports');if(!reports)return false;const tampil=[...reports.querySelectorAll('button')].find(b=>b.textContent.trim().toLowerCase()==='tampilkan');const print=[...reports.querySelectorAll('button')].find(b=>b.textContent.toLowerCase().includes('print'));if(tampil&&!tampil.dataset.detailV4){tampil.dataset.detailV4='1';tampil.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();runDetail()},true)}if(print&&!print.dataset.detailV4){print.dataset.detailV4='1';print.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();printDetail()},true)}return true}catch(e){return false}}
function boot(){let n=0;const t=setInterval(()=>{if(attach()||++n>300)clearInterval(t)},250);setInterval(attach,1500)}
frame.addEventListener('load',boot);boot();
</script>
</body></html>
