<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>ISSHO CAFE — OWNER</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}
#reportTools{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:99999;display:none;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center;padding:9px 11px;background:rgba(21,21,21,.97);border:1px solid #555;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.55);font-family:Arial,sans-serif}
#reportTools .title{font-weight:900;color:#fff;font-size:13px;margin-right:2px}#reportTools button{border:0;border-radius:9px;padding:9px 12px;color:#fff;font-weight:900;cursor:pointer}#rtDaily{background:#b68142}#rtWeekly{background:#315b9a}#rtMonthly{background:#2f7d50}#rtShow{background:#6b4a20}
@media(max-width:600px){#reportTools{left:8px;right:8px;bottom:8px;transform:none;padding:8px;gap:5px}#reportTools button{flex:1;min-width:82px;padding:9px 7px;font-size:12px}.title{width:100%;text-align:center}}
</style>
</head>
<body>
<iframe id="owner" src="/owner.html?v=20260831-owner-report-final-03" title="ISSHO CAFE OWNER"></iframe>
<div id="reportTools" aria-label="Rekapan Penjualan">
  <span class="title">📊 REKAPAN</span>
  <button id="rtDaily" type="button">Harian</button>
  <button id="rtWeekly" type="button">Mingguan</button>
  <button id="rtMonthly" type="button">Bulanan</button>
  <button id="rtShow" type="button">Tampilkan</button>
</div>
<script>
const frame=document.getElementById('owner');
const tools=document.getElementById('reportTools');
const SUPA='https://xvhimyflrqrdudijwjdn.supabase.co';
const KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';
let reportMode='daily';
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
function win(){try{return frame.contentWindow}catch(e){return null}}
function doc(){try{return frame.contentDocument||frame.contentWindow.document}catch(e){return null}}
async function rpc(name,body){const r=await fetch(SUPA+'/rest/v1/rpc/'+name,{method:'POST',cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null}
function localDateValue(d){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
function getSelectedDate(w){const el=w?.document?.getElementById('date');return el?.value||localDateValue(new Date())}
function rangeFor(mode,w){
  const ds=getSelectedDate(w);
  const base=new Date(ds+'T07:00:00+07:00');
  if(mode==='daily'){
    const session=w?.document?.getElementById('session')?.value||'day';
    if(session==='morning')return{from:ds+'T07:00:00+07:00',to:ds+'T17:00:00+07:00',title:'Harian',label:'Pagi 07:00–17:00'};
    if(session==='evening')return{from:ds+'T17:00:00+07:00',to:localDateValue(new Date(base.getTime()+86400000))+'T07:00:00+07:00',title:'Harian',label:'Sore 17:00–Close'};
    return{from:ds+'T07:00:00+07:00',to:localDateValue(new Date(base.getTime()+86400000))+'T07:00:00+07:00',title:'Harian',label:'Seharian 07:00–Close'};
  }
  if(mode==='weekly'){
    const day=base.getUTCDay();
    const mondayOffset=day===0?-6:1-day;
    const monday=new Date(base.getTime()+mondayOffset*86400000);
    const next=new Date(monday.getTime()+7*86400000);
    const md=localDateValue(monday),nd=localDateValue(next);
    return{from:md+'T07:00:00+07:00',to:nd+'T07:00:00+07:00',title:'Mingguan',label:'Senin–Minggu'};
  }
  const year=base.getUTCFullYear(),month=base.getUTCMonth();
  const first=new Date(Date.UTC(year,month,1,0,0,0));
  const next=new Date(Date.UTC(year,month+1,1,0,0,0));
  const fd=localDateValue(first),nd=localDateValue(next);
  return{from:fd+'T07:00:00+07:00',to:nd+'T07:00:00+07:00',title:'Bulanan',label:new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',month:'long',year:'numeric'}).format(first)};
}
async function showReport(mode){
  reportMode=mode||reportMode;
  const w=win(),d=doc();
  if(!w||!d)return;
  try{
    const login=d.getElementById('login'),app=d.getElementById('app');
    if(login&&!login.classList.contains('hidden')||!w.P){alert('Silakan login Owner terlebih dahulu.');return}
    if(typeof w.tab==='function')w.tab('reports');
    const box=d.getElementById('reportBox');
    if(!box)return;
    const r=rangeFor(reportMode,w);
    box.innerHTML='<div class="notice">⏳ Mengambil rekapan '+r.title.toLowerCase()+' dari Supabase...</div>';
    const data=await rpc('owner_sales_detail_report',{p_owner_pin:w.P,p_from:r.from,p_to:r.to});
    let h='<div class="card" style="background:#111;color:#f5f5f5;border:1px solid #444"><h3>📊 RINCIAN PENJUALAN — '+r.title+'</h3><div class="muted">'+r.label+' • hanya transaksi PAID</div><div class="grid"><div>Pesanan Lunas<h2>'+Number(data.orders||0)+'</h2></div><div>Total Qty<h2>'+Number(data.total_qty||0)+'</h2></div><div>Total Omzet<h2>'+money(data.omzet)+'</h2></div><div>Tunai<h2>'+money(data.cash)+'</h2></div><div>QRIS<h2>'+money(data.qris)+'</h2></div></div>';
    for(const c of(data.categories||[])){
      const cn=String(c.category||'').toLowerCase();
      const unit=cn.includes('minuman')||cn.includes('kopi')||cn.includes('teh')?'gelas':(cn.includes('bakaran')||cn.includes('dimsum')?'pcs':'porsi');
      h+='<div class="card" style="background:#151515;border:1px solid #444"><h3>🍽️ '+esc(c.category)+' — '+Number(c.quantity||0)+' '+unit+' — '+money(c.total)+'</h3><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:8px">Nama Menu</th><th style="text-align:right;padding:8px">Harga</th><th style="text-align:right;padding:8px">Qty</th><th style="text-align:right;padding:8px">Total</th></tr></thead><tbody>';
      h+=(c.items||[]).map(x=>'<tr><td style="padding:8px;border-top:1px solid #333">'+esc(x.name)+'</td><td style="padding:8px;text-align:right;border-top:1px solid #333">'+money(x.unit_price)+'</td><td style="padding:8px;text-align:right;border-top:1px solid #333">'+Number(x.quantity||0)+' '+unit+'</td><td style="padding:8px;text-align:right;border-top:1px solid #333">'+money(x.total)+'</td></tr>').join('');
      h+='</tbody></table></div></div>';
    }
    h+='<h3 style="background:#222;padding:12px;border-radius:10px">TOTAL SEMUA KATEGORI: '+Number(data.total_qty||0)+' item • '+money(data.omzet)+'</h3></div>';
    box.innerHTML=h;
  }catch(e){const box=d.getElementById('reportBox');if(box)box.innerHTML='<div class="err">Gagal memuat rekapan: '+esc(e.message)+'</div>'}
}
function installInside(){
  try{
    const d=doc(),r=d?.getElementById('reports');
    if(!r||r.dataset.reportButtonsInstalled)return false;
    const a=r.querySelector('.actions');
    if(!a)return false;
    const bar=d.createElement('div');
    bar.style.cssText='display:flex;gap:7px;flex-wrap:wrap;margin:10px 0;padding:9px;background:#151515;border:1px solid #555;border-radius:10px';
    bar.innerHTML='<b style="display:flex;align-items:center">📋 Rekapan:</b><button type="button" data-report="daily">Harian</button><button type="button" data-report="weekly">Mingguan</button><button type="button" data-report="monthly">Bulanan</button><button type="button" data-report="show">Tampilkan</button>';
    bar.querySelectorAll('button').forEach(b=>{b.style.cssText='border:0;border-radius:9px;padding:9px 12px;background:#315b9a;color:#fff;font-weight:900;cursor:pointer';b.onclick=()=>b.dataset.report==='show'?showReport(reportMode):showReport(b.dataset.report)});
    r.insertBefore(bar,a);r.dataset.reportButtonsInstalled='1';return true;
  }catch(e){return false}
}
function checkLogin(){try{const d=doc(),w=win();const logged=!!w?.P&&!!d?.getElementById('app')&&!d.getElementById('app').classList.contains('hidden');tools.style.display=logged?'flex':'none';if(logged)installInside()}catch(e){tools.style.display='none'}}
document.getElementById('rtDaily').onclick=()=>showReport('daily');
document.getElementById('rtWeekly').onclick=()=>showReport('weekly');
document.getElementById('rtMonthly').onclick=()=>showReport('monthly');
document.getElementById('rtShow').onclick=()=>showReport(reportMode);
frame.addEventListener('load',()=>{setTimeout(checkLogin,200);setTimeout(checkLogin,800);setTimeout(checkLogin,1800)});
setInterval(checkLogin,800);
</script>
<script src="/ui-standard.js?v=20260830-ui-v2"></script>
</body></html>
