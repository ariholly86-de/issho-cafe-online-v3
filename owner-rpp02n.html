<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>ISSHO CAFE — OWNER REKAPAN DETAIL</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}#status{position:fixed;right:14px;bottom:14px;z-index:999999;background:#151515;color:#ddd;border:1px solid #444;border-radius:10px;padding:8px 11px;font:12px Arial;box-shadow:0 8px 25px #000;display:none}</style>
</head>
<body>
<iframe id="owner" src="owner.html?v=20260825-owner-report-fix-v1" title="ISSHO CAFE OWNER"></iframe>
<div id="status">Rekapan detail siap.</div>
<script>
const frame=document.getElementById('owner'),status=document.getElementById('status');
const SUPA='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
function showStatus(t){status.textContent=t;status.style.display='block';clearTimeout(showStatus.t);showStatus.t=setTimeout(()=>status.style.display='none',2500)}
function ownerApp(){try{return frame.contentWindow.document.getElementById('app').contentWindow}catch(e){return null}}
function ownerPin(){try{return String(ownerApp()?.P||'').trim()}catch(e){return ''}}
async function rpc(path,body){const r=await fetch(SUPA+path,{method:'POST',cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null}
function localDate(s){const a=String(s||'').split('-').map(Number);return a.length===3&&!a.some(isNaN)?new Date(a[0],a[1]-1,a[2]):new Date()}
function selectedRange(w){const d=localDate(w.document.getElementById('date')?.value);const session=w.document.getElementById('session')?.value||'day';let from=new Date(d),to=new Date(d);if(session==='morning'){from.setHours(7,0,0,0);to.setHours(17,0,0,0)}else if(session==='evening'){from.setHours(17,0,0,0);to.setDate(to.getDate()+1);to.setHours(7,0,0,0)}else{from.setHours(7,0,0,0);to.setDate(to.getDate()+1);to.setHours(7,0,0,0)}return{from,to,label:session==='morning'?'Pagi 07:00–17:00':session==='evening'?'Sore 17:00–Close':'Seharian 07:00–Close',date:d}}
async function getProducts(w){try{return await w.api('/rest/v1/products?select=id,name,category_id,description,price&order=name')}catch(e){return[]}}
async function getCategories(pin){try{const r=await rpc('/rest/v1/rpc/owner_list_categories',{p_owner_pin:pin});return Array.isArray(r)?r:[]}catch(e){return[]}}
function categoryFor(item,products,categories){if(item.category_name)return String(item.category_name);if(item.category)return String(item.category);const p=products.get(String(item.product_id||item.id||''));if(p?.category_id&&categories.get(String(p.category_id)))return String(categories.get(String(p.category_id)));const n=String(item.name||'').toLowerCase();if(n.includes('seblak'))return'Seblak';if(n.includes('steak'))return'Steak Ayam';if(n.includes('nasi goreng'))return'Nasi Goreng';if(n.startsWith('nasi ')||n.includes(' nasi '))return'Aneka Nasi';if(n.includes('mie')||n.startsWith('mie'))return'Aneka Mie';if(['jahe','sere','uwuh','telang','kunir','secang','rempah','tape singkong'].some(x=>n.includes(x)))return'Wedangan';if(['beef','bola lobster','bola udang','crabstick','crabstik','dumpling','hokaido','kornet','otak-otak','sate bakso','siomay','sosis','sukoi','tahu bakso'].some(x=>n.includes(x)))return'Aneka Bakaran';if(n.includes('dimsum'))return'Aneka Dimsum';if(['juice','minuman','soda','kopi','americano','matcha','es teh','teh','coklat','latte'].some(x=>n.includes(x)))return'Aneka Minuman';return'Aneka Camilan'}
function aggregate(orders,range,products,categories){const groups=new Map();let paidOrders=0,totalQty=0,totalRevenue=0,cash=0,qris=0;for(const o of(Array.isArray(orders)?orders:[])){if(String(o.payment_status||'').toUpperCase()!=='PAID')continue;const created=new Date(o.created_at);if(isNaN(created)||created<range.from||created>=range.to)continue;paidOrders++;const method=String(o.payment_method||'').toUpperCase();if(method==='CASH')cash+=Number(o.total)||0;if(method==='QRIS')qris+=Number(o.total)||0;for(const it of(Array.isArray(o.items)?o.items:[])){const qty=Number(it.qty??it.quantity)||0,price=Number(it.price??it.unit_price)||0;if(qty<=0)continue;const category=categoryFor(it,products,categories),name=String(it.name??it.product_name??'Item').trim()||'Item';if(!groups.has(category))groups.set(category,new Map());const g=groups.get(category);if(!g.has(name))g.set(name,{name,unit:price,qty:0,revenue:0});const row=g.get(name);row.qty+=qty;row.revenue+=price*qty;row.unit=price;totalQty+=qty;totalRevenue+=price*qty}}
const cats=[...groups.entries()].map(([category,map])=>{const items=[...map.values()].sort((a,b)=>a.name.localeCompare(b.name));return{category,items,qty:items.reduce((s,x)=>s+x.qty,0),revenue:items.reduce((s,x)=>s+x.revenue,0)}}).sort((a,b)=>b.revenue-a.revenue||a.category.localeCompare(b.category));return{paidOrders,totalQty,totalRevenue,cash,qris,cats}}
function reportHtml(data,range){let h='<div id="detailReport" style="background:#151515;color:#f5f5f5;border:1px solid #444;border-radius:12px;padding:14px;margin-top:12px;font-family:Arial,sans-serif">';h+='<div style="font-weight:900;font-size:20px">📊 RINCIAN PENJUALAN — '+esc(range.label)+'</div>';h+='<div style="color:#aaa;font-size:12px;margin:4px 0 12px">Tanggal: '+esc(range.date.toLocaleDateString('id-ID'))+'</div>';h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px">';[['Pesanan Lunas',data.paidOrders],['Total Omzet',money(data.totalRevenue)],['Total Kuantitas',data.totalQty+' item'],['Tunai',money(data.cash)],['QRIS',money(data.qris)]].forEach(x=>h+='<div style="background:#202020;border:1px solid #383838;border-radius:9px;padding:10px">'+x[0]+'<br><b>'+x[1]+'</b></div>');h+='</div>';if(!data.cats.length){h+='<div style="color:#aaa;margin-top:14px">Tidak ada penjualan PAID pada tanggal/sesi tersebut.</div>'}else{for(const c of data.cats){h+='<div style="margin-top:18px;border:1px solid #444;border-radius:10px;overflow:hidden"><div style="background:#202020;padding:11px;font-weight:900;font-size:16px">🍽️ '+esc(c.category)+' — '+c.qty+' qty — '+money(c.revenue)+'</div><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr style="background:#1b1b1b"><th style="padding:9px;text-align:left;border-bottom:1px solid #333">Nama Item</th><th style="padding:9px;text-align:right;border-bottom:1px solid #333">Harga Satuan</th><th style="padding:9px;text-align:right;border-bottom:1px solid #333">Qty</th><th style="padding:9px;text-align:right;border-bottom:1px solid #333">Total</th></tr></thead><tbody>';for(const x of c.items)h+='<tr><td style="padding:9px;border-bottom:1px solid #292929"><b>'+esc(x.name)+'</b></td><td style="padding:9px;text-align:right;border-bottom:1px solid #292929">'+money(x.unit)+'</td><td style="padding:9px;text-align:right;border-bottom:1px solid #292929"><b>'+x.qty+'</b></td><td style="padding:9px;text-align:right;border-bottom:1px solid #292929"><b>'+money(x.revenue)+'</b></td></tr>';h+='</tbody><tfoot><tr style="background:#202020;font-weight:900"><td colspan="2" style="padding:9px">TOTAL '+esc(c.category)+'</td><td style="padding:9px;text-align:right">'+c.qty+'</td><td style="padding:9px;text-align:right">'+money(c.revenue)+'</td></tr></tfoot></table></div>'}}h+='<div style="margin-top:18px;background:#202020;border:2px solid #555;border-radius:10px;padding:12px;font-weight:900">TOTAL SEMUA KATEGORI: '+data.totalQty+' qty — '+money(data.totalRevenue)+'</div></div>';return h}
async function runReport(){const w=ownerApp();if(!w)return showStatus('Owner belum siap.');const pin=ownerPin();if(!pin)return showStatus('Silakan login Owner terlebih dahulu.');const range=selectedRange(w);const box=w.document.getElementById('reportBox');if(box)box.innerHTML='<div style="padding:12px;color:#aaa">⏳ Mengambil data penjualan dari Supabase dan menghitung detail kategori...</div>';try{const[orders,products,cats]=await Promise.all([rpc('/rest/v1/rpc/staff_get_orders',{p_pin:pin}),getProducts(w),getCategories(pin)]);const data=aggregate(orders,range,new Map(products.map(p=>[String(p.id),p])),new Map(cats.map(c=>[String(c.id),c.name])));if(box)box.innerHTML=reportHtml(data,range);showStatus('✓ Rekapan detail berhasil ditampilkan.')}catch(e){if(box)box.innerHTML='<div style="background:#4a1d1a;color:#ffd9d5;padding:12px;border-radius:9px">Gagal memuat detail: '+esc(e.message)+'</div>';showStatus('Gagal memuat rekapan.')}}
function printDetail(){const w=ownerApp(),box=w?.document.getElementById('reportBox');if(!box||!box.querySelector('#detailReport')){runReport().then(()=>setTimeout(printDetail,350));return}const p=window.open('','_blank');p.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Rekap Penjualan ISSHO CAFE</title><style>body{font-family:Arial,sans-serif;margin:18px;color:#111}table{width:100%;border-collapse:collapse}th,td{border:1px solid #bbb;padding:7px}tr{page-break-inside:avoid}@media print{body{margin:8mm}}</style></head><body>'+box.querySelector('#detailReport').outerHTML+'</body></html>');p.document.close();setTimeout(()=>p.print(),350)}
function replaceButton(w,button,handler){const n=button.cloneNode(true);button.replaceWith(n);n.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();handler()},true);return n}
function patch(){try{const ow=frame.contentWindow,inner=ow.document.getElementById('app');if(!inner||!inner.contentDocument)return false;const w=inner.contentWindow,reports=w.document.getElementById('reports');if(!reports)return false;const buttons=[...reports.querySelectorAll('button')];const tampil=buttons.find(b=>b.textContent.trim().toLowerCase()==='tampilkan');const cetak=buttons.find(b=>b.textContent.toLowerCase().includes('print'));if(tampil&&!tampil.dataset.detailPatched){tampil.dataset.detailPatched='1';replaceButton(w,tampil,runReport)}if(cetak&&!cetak.dataset.detailPatched){cetak.dataset.detailPatched='1';replaceButton(w,cetak,printDetail)}let info=w.document.getElementById('rppDetailInfo');if(!info){info=w.document.createElement('div');info.id='rppDetailInfo';info.style.cssText='margin-top:10px;padding:10px;background:#202020;border:1px solid #444;border-radius:9px;color:#ddd;font-size:13px';info.innerHTML='📌 <b>Rekapan detail aktif:</b> tombol <b>Tampilkan</b> sekarang menampilkan kategori, nama makanan/minuman, harga satuan, kuantitas dan total nominal dari penjualan PAID.';const box=w.document.getElementById('reportBox');if(box)box.before(info)}return true}catch(e){return false}}
function boot(){let n=0;const t=setInterval(()=>{if(patch()||++n>240)clearInterval(t)},250);setInterval(patch,1500)}
frame.addEventListener('load',boot);boot();
</script>
</body>
</html>
