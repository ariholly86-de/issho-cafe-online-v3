<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>ISSHO CAFE — OWNER</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}
#tools{position:fixed;right:12px;top:12px;z-index:99999;display:flex;gap:7px;align-items:center;background:#151515;border:1px solid #444;border-radius:12px;padding:7px;box-shadow:0 8px 25px #000}
button{border:0;border-radius:9px;padding:10px 13px;font-weight:900;color:#fff;cursor:pointer}.green{background:#2f7d50}.blue{background:#315b9a}.gold{background:#b68142}.green:disabled{opacity:.6;pointer-events:none}
#status{position:fixed;left:12px;bottom:12px;z-index:100000;background:#151515;color:#fff;border:1px solid #444;border-radius:9px;padding:9px 12px;display:none;font:13px Arial}
#modal{display:none;position:fixed;inset:0;z-index:100001;background:rgba(0,0,0,.72);padding:24px;overflow:auto}#panel{max-width:760px;margin:40px auto;background:#151515;border:1px solid #444;border-radius:16px;padding:18px;color:#fff;box-shadow:0 20px 60px #000}
#panel h2{margin:0 0 7px;font-size:24px}.muted{color:#aaa;font-size:13px}.notice{background:#302719;border:1px solid #5a4529;color:#ffe8b2;padding:10px;border-radius:10px;margin:10px 0}
#search{width:100%;box-sizing:border-box;padding:12px;border:1px solid #444;border-radius:10px;background:#1b1b1b;color:#fff;font-size:16px;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.dark{background:#242424;color:#fff;border:1px solid #444}
#list{margin-top:10px;max-height:52vh;overflow:auto;border:1px solid #333;border-radius:10px}.item{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #333}.item:last-child{border-bottom:0}.item input{width:20px;height:20px;flex:0 0 auto}.name{font-weight:900}.cat{color:#aaa;font-size:12px;margin-top:3px}.empty{text-align:center;padding:22px;color:#9f9f9f}.price{color:#ddd;font-size:12px;margin-top:3px}
@media(max-width:700px){#tools{left:6px;right:6px;top:6px;justify-content:flex-end}#tools button{font-size:11px;padding:8px}.gold{display:none}#modal{padding:8px}#panel{margin:55px auto 10px;padding:13px}}
</style>
</head>
<body>
<iframe id="owner" src="owner-v3-safe.html?v=20260831-owner-recovery" title="ISSHO CAFE OWNER"></iframe>
<div id="tools">
<button class="green" id="restore" type="button">🟢 PULIHKAN MENU TERPILIH (0)</button>
<button class="blue" id="reports" type="button">📊 Rekapan Detail</button>
<button class="gold" type="button" onclick="location.href='owner-menu-manager.html?v=20260831-owner-recovery'">🍽️ Kelola Menu</button>
</div>
<div id="status"></div>
<div id="modal"><div id="panel">
<h2>🟢 Pulihkan Menu Terpilih</h2>
<div class="muted">Centang hanya menu yang stoknya sudah tersedia kembali. Menu yang tidak dicentang tetap tidak dipulihkan.</div>
<div class="notice">Jumlah pada tombol mengikuti jumlah menu stok kosong yang tersedia. Jumlah pilihan di tombol akan berubah secara real time.</div>
<input id="search" placeholder="🔎 Cari menu tersembunyi..." oninput="renderList()">
<div id="list"></div>
<div class="actions"><button class="gold" type="button" onclick="selectAllVisible()">☑ Pilih Semua</button><button id="bulk" class="green" type="button" onclick="restoreSelected()">🟢 PULIHKAN MENU TERPILIH (0)</button><button class="dark" type="button" onclick="closeModal()">Tutup</button></div>
<div id="modalMsg" class="muted" style="margin-top:9px"></div>
</div></div>
<script>
const S='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';
const f=document.getElementById('owner'),topBtn=document.getElementById('restore'),modal=document.getElementById('modal'),listEl=document.getElementById('list'),searchEl=document.getElementById('search'),bulkBtn=document.getElementById('bulk'),msgEl=document.getElementById('modalMsg'),statusEl=document.getElementById('status');
let hiddenMenus=[],selected=new Set(),loading=false;
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
const say=x=>{statusEl.textContent=x;statusEl.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>statusEl.style.display='none',3500)};
const iw=()=>f.contentWindow;
const pin=()=>{try{return iw().document.getElementById('pin')?.value?.trim()||''}catch(e){return''}};
async function rpc(path,body){const r=await fetch(S+path,{method:'POST',cache:'no-store',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(body)}),t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null}
function categoryName(p){return p.category_name||'Tanpa Kategori'}
function updateCount(){const n=selected.size;topBtn.textContent='🟢 PULIHKAN MENU TERPILIH ('+n+')';bulkBtn.textContent='🟢 PULIHKAN MENU TERPILIH ('+n+')'}
function updateAvailableCount(){const n=hiddenMenus.length;if(!selected.size)topBtn.textContent='🟢 PULIHKAN MENU TERPILIH ('+n+')'}
function renderList(){const q=(searchEl.value||'').trim().toLowerCase();const rows=hiddenMenus.filter(p=>(p.name+' '+(p.description||'')+' '+categoryName(p)).toLowerCase().includes(q));if(!rows.length){listEl.innerHTML='<div class="empty">✓ Tidak ada menu stok kosong yang tersedia.</div>';updateCount();return}listEl.innerHTML=rows.map(p=>'<label class="item"><input type="checkbox" data-id="'+esc(p.id)+'" '+(selected.has(p.id)?'checked':'')+' onchange="toggleOne(\''+esc(p.id)+'\',this.checked)\"><div><div class="name">'+esc(p.name)+'</div><div class="cat">'+esc(categoryName(p))+'</div><div class="price">'+Number(p.price||0).toLocaleString('id-ID')+'</div></div></label>').join('');updateCount()}
function toggleOne(id,on){if(on)selected.add(id);else selected.delete(id);updateCount()}
function selectAllVisible(){const q=(searchEl.value||'').trim().toLowerCase();hiddenMenus.filter(p=>(p.name+' '+(p.description||'')+' '+categoryName(p)).toLowerCase().includes(q)).forEach(p=>selected.add(p.id));renderList()}
async function loadHidden(){if(loading)return false;const p=pin();if(!p){msgEl.innerHTML='<span style="color:#ffb4ad">Login Owner terlebih dahulu, lalu tekan tombol ini.</span>';return false}loading=true;msgEl.textContent='Memuat menu stok kosong...';try{const rows=await rpc('/rest/v1/rpc/owner_list_hidden_products',{p_owner_pin:p});hiddenMenus=Array.isArray(rows)?rows:[];selected=new Set([...selected].filter(id=>hiddenMenus.some(x=>x.id===id)));renderList();updateAvailableCount();msgEl.textContent=hiddenMenus.length?hiddenMenus.length+' menu stok kosong ditemukan.':'Tidak ada menu stok kosong.';return true}finally{loading=false}}
async function refreshCount(){try{const p=pin();if(!p)return;const rows=await rpc('/rest/v1/rpc/owner_list_hidden_products',{p_owner_pin:p});hiddenMenus=Array.isArray(rows)?rows:[];selected=new Set([...selected].filter(id=>hiddenMenus.some(x=>x.id===id)));updateAvailableCount()}catch(e){}}
async function openModal(){modal.style.display='block';searchEl.value='';selected.clear();updateCount();try{await loadHidden()}catch(e){listEl.innerHTML='<div class="empty" style="color:#ffb4ad">Gagal memuat: '+esc(e.message)+'</div>';msgEl.textContent='Periksa login Owner dan koneksi Supabase.'}}
function closeModal(){modal.style.display='none'}
async function restoreSelected(){const p=pin();if(!p)return say('Silakan login Owner terlebih dahulu.');const ids=[...selected];if(!ids.length)return say('Pilih minimal satu menu.');bulkBtn.disabled=true;bulkBtn.textContent='⏳ MEMULIHKAN '+ids.length+' MENU...';try{const d=await rpc('/rest/v1/rpc/owner_restore_selected_products',{p_owner_pin:p,p_product_ids:ids});say('✓ '+(d?.message||ids.length+' menu berhasil dipulihkan.'));selected.clear();await loadHidden();try{if(typeof iw().loadProducts==='function')await iw().loadProducts()}catch(e){}setTimeout(()=>{try{iw().location.reload()}catch(e){}},250)}catch(e){say('Gagal memulihkan: '+e.message);msgEl.innerHTML='<span style="color:#ffb4ad">Gagal: '+esc(e.message)+'</span>'}finally{bulkBtn.disabled=false;updateCount()}}
topBtn.addEventListener('click',openModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
setInterval(refreshCount,5000);
f.addEventListener('load',()=>{setTimeout(refreshCount,1000);setTimeout(refreshCount,3000)});
updateCount();

function d(v){const a=String(v||'').split('-').map(Number);return a.length===3&&!a.some(isNaN)?new Date(a[0],a[1]-1,a[2]):new Date()}
function period(m){const x=d(iw().document.getElementById('date')?.value);if(m==='daily'){const a=new Date(x),b=new Date(x);a.setHours(7,0,0,0);b.setDate(b.getDate()+1);b.setHours(0,0,0,0);return[a,b,'Harian','07:00–00:00']}if(m==='weekly'){const day=x.getDay(),diff=day===0?-6:1-day,a=new Date(x);a.setDate(x.getDate()+diff);a.setHours(7,0,0,0);const b=new Date(a);b.setDate(b.getDate()+7);b.setHours(7,0,0,0);return[a,b,'Mingguan','Senin–Minggu']}const a=new Date(x.getFullYear(),x.getMonth(),1,7),b=new Date(x.getFullYear(),x.getMonth()+1,1,7);return[a,b,'Bulanan',a.toLocaleDateString('id-ID',{month:'long',year:'numeric'})]}
function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}
async function showReport(m){const w=iw(),box=w.document.getElementById('reportBox'),p=pin();if(!box||!p)return say('Login Owner terlebih dahulu.');try{const z=period(m),r=await rpc('/rest/v1/rpc/owner_sales_detail_report',{p_owner_pin:p,p_from:z[0].toISOString(),p_to:z[1].toISOString()}),cs=Array.isArray(r?.categories)?r.categories:[];let h='<div style="background:#111;color:#fff;border:1px solid #444;border-radius:12px;padding:14px;margin:12px 0"><b style="font-size:21px">📊 RINCIAN PENJUALAN PER KATEGORI</b><div style="color:#aaa;margin:6px 0 12px">'+z[2]+' • '+z[3]+' • transaksi PAID</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px">';[['Pesanan Lunas',r?.orders],['Total Qty',r?.total_qty],['Total Omzet',money(r?.omzet)],['Tunai',money(r?.cash)],['QRIS',money(r?.qris)]].forEach(x=>h+='<div style="background:#202020;border:1px solid #383838;border-radius:9px;padding:10px"><small style="color:#aaa">'+x[0]+'</small><br><b>'+x[1]+'</b></div>');h+='</div>';for(const c of cs){h+='<div style="margin-top:12px;border:1px solid #444;border-radius:10px;overflow:auto"><div style="background:#222;padding:11px;font-weight:900">🍽️ '+esc(c.category||'Tanpa Kategori')+' <span style="float:right">'+Number(c.quantity||0)+' • '+money(c.total)+'</span></div><table style="width:100%;min-width:620px;border-collapse:collapse"><tr><th style="padding:9px;text-align:left">Nama Menu</th><th style="padding:9px;text-align:right">Harga</th><th style="padding:9px;text-align:right">Qty</th><th style="padding:9px;text-align:right">Total</th></tr>';for(const x of c.items||[])h+='<tr><td style="padding:9px;border-top:1px solid #333">'+esc(x.name||'')+'</td><td style="padding:9px;text-align:right;border-top:1px solid #333">'+money(x.unit_price)+'</td><td style="padding:9px;text-align:right;border-top:1px solid #333">'+Number(x.quantity||0)+'</td><td style="padding:9px;text-align:right;border-top:1px solid #333">'+money(x.total)+'</td></tr>';h+='</table></div>'}h+='</div>';box.innerHTML=h;say('✓ Rekapan '+z[2]+' diperbarui.')}catch(e){say('Gagal rekapan: '+e.message)}}
document.getElementById('reports').onclick=()=>{const w=iw(),b=w.document.getElementById('reports');if(b)b.scrollIntoView({behavior:'smooth'});let x=w.document.getElementById('reportRangeRecovery');if(!x){x=w.document.createElement('div');x.id='reportRangeRecovery';x.style.cssText='position:fixed;right:12px;top:70px;z-index:99998;background:#151515;border:1px solid #444;border-radius:10px;padding:8px';x.innerHTML='<button id="rD" class="gold">📅 Harian</button> <button id="rW" class="blue">📆 Mingguan</button> <button id="rM" class="green">🗓️ Bulanan</button>';w.document.body.appendChild(x);x.querySelector('#rD').onclick=()=>showReport('daily');x.querySelector('#rW').onclick=()=>showReport('weekly');x.querySelector('#rM').onclick=()=>showReport('monthly')}};
</script>
<script src="/ui-standard.js?v=20260830-ui-v2"></script>
</body></html>
