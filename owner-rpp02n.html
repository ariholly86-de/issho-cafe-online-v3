<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>ISSHO CAFE — OWNER REKAPAN</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}#status{position:fixed;right:14px;bottom:14px;z-index:999999;background:#151515;color:#ddd;border:1px solid #444;border-radius:10px;padding:8px 11px;font:12px Arial;box-shadow:0 8px 25px #000;display:none}</style>
</head>
<body>
<iframe id="owner" src="owner.html?v=20260825-owner-report-fix-v1" title="ISSHO CAFE OWNER"></iframe>
<div id="status">Rekapan siap.</div>
<script>
const frame=document.getElementById('owner'),status=document.getElementById('status');
const SUPA='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
function showStatus(t){status.textContent=t;status.style.display='block';clearTimeout(showStatus.t);showStatus.t=setTimeout(()=>status.style.display='none',2600)}
function ownerApp(){try{return frame.contentWindow.document.getElementById('app').contentWindow}catch(e){return null}}
function ownerPin(){try{return String(ownerApp()?.P||'').trim()}catch(e){return ''}}
function fmtDate(d){return new Intl.DateTimeFormat('id-ID',{dateStyle:'full'}).format(d)}
function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function range(kind){const now=new Date(),base=startOfDay(now);let from,to,label;if(kind==='daily'){from=base;to=new Date(base);to.setDate(to.getDate()+1);label='Harian'}else if(kind==='weekly'){const dow=base.getDay(),diff=dow===0?-6:1-dow;from=new Date(base);from.setDate(from.getDate()+diff);to=new Date(from);to.setDate(to.getDate()+7);label='Mingguan'}else{from=new Date(base.getFullYear(),base.getMonth(),1);to=new Date(base.getFullYear(),base.getMonth()+1,1);label='Bulanan'}return{from,to,label}}
function iso(d){return d.toISOString()}
async function rpc(path,body){const r=await fetch(SUPA+path,{method:'POST',cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null}
async function apiProducts(w){try{return await w.api('/rest/v1/products?select=id,name,category_id,description,price&order=name')}catch(e){return[]}}
async function categories(pin){try{const r=await rpc('/rest/v1/rpc/owner_list_categories',{p_owner_pin:pin});return Array.isArray(r)?r:[]}catch(e){return[]}}
function normalizeCategory(item,productMap,catMap){if(item.category_name)return String(item.category_name);if(item.category)return String(item.category);const p=productMap.get(String(item.product_id||item.id||''));if(p?.category_id&&catMap.get(String(p.category_id)))return catMap.get(String(p.category_id));const n=String(item.name||'').toLowerCase();if(n.includes('seblak'))return'Seblak';if(n.includes('steak'))return'Steak Ayam';if(n.includes('nasi goreng'))return'Nasi Goreng';if(n.startsWith('nasi ')||n.includes(' nasi '))return'Aneka Nasi';if(n.includes('mie')||n.startsWith('mie'))return'Aneka Mie';if(['jahe','sere','uwuh','telang','kunir','secang','rempah','tape singkong'].some(x=>n.includes(x)))return'Wedangan';if(['beef','bola lobster','bola udang','crabstick','crabstik','dumpling','hokaido','kornet','otak-otak','sate bakso','siomay','sosis','sukoi','tahu bakso'].some(x=>n.includes(x)))return'Aneka Bakaran';if(n.includes('dimsum'))return'Aneka Dimsum';if(['juice','minuman','soda','kopi','americano','matcha','es teh','teh'].some(x=>n.includes(x)))return'Aneka Minuman';return'Aneka Camilan'}
function inRange(created,from,to){const d=new Date(created);return !isNaN(d)&&d>=from&&d<to}
function aggregate(orders,from,to,products,categoriesList){const productMap=new Map(products.map(p=>[String(p.id),p])),catMap=new Map(categoriesList.map(c=>[String(c.id),c.name])),groups=new Map();let totalQty=0,totalRevenue=0,paidOrders=0,cash=0,qris=0;for(const o of (Array.isArray(orders)?orders:[])){if(String(o.payment_status).toUpperCase()!=='PAID'||!inRange(o.created_at,from,to))continue;paidOrders++;const method=String(o.payment_method||'').toUpperCase();if(method==='CASH')cash+=Number(o.total)||0;if(method==='QRIS')qris+=Number(o.total)||0;for(const it of (o.items||[])){const qty=Number(it.qty)||0,price=Number(it.price)||0;if(!qty)continue;const category=normalizeCategory(it,productMap,catMap),name=String(it.name||'Item');if(!groups.has(category))groups.set(category,new Map());const g=groups.get(category);if(!g.has(name))g.set(name,{name,qty:0,revenue:0,unit:price});const row=g.get(name);row.qty+=qty;row.revenue+=price*qty;row.unit=price;totalQty+=qty;totalRevenue+=price*qty}}const cats=[...groups.entries()].map(([category,items])=>({category,items:[...items.values()].sort((a,b)=>b.qty-a.qty||a.name.localeCompare(b.name)),qty:[...items.values()].reduce((s,x)=>s+x.qty,0),revenue:[...items.values()].reduce((s,x)=>s+x.revenue,0)})).sort((a,b)=>b.revenue-a.revenue||a.category.localeCompare(b.category));return{paidOrders,cash,qris,totalQty,totalRevenue,cats}}
function reportHtml(data,kind,from,to){let html='<div id="detailReport" style="background:#151515;color:#f5f5f5;border:1px solid #444;border-radius:12px;padding:14px;margin-top:10px;font-family:Arial,sans-serif">';html+='<div style="font-weight:900;font-size:18px">📊 REKAP PENJUALAN '+esc(kind.toUpperCase())+'</div>';html+='<div style="color:#aaa;font-size:12px;margin:4px 0 12px">'+esc(fmtDate(from))+' — '+esc(fmtDate(new Date(to.getTime()-86400000)))+'</div>';html+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px">';html+='<div style="background:#202020;border:1px solid #383838;border-radius:9px;padding:9px">Pesanan Lunas<br><b>'+data.paidOrders+'</b></div>';html+='<div style="background:#202020;border:1px solid #383838;border-radius:9px;padding:9px">Omzet Item<br><b>'+money(data.totalRevenue)+'</b></div>';html+='<div style="background:#202020;border:1px solid #383838;border-radius:9px;padding:9px">Tunai<br><b>'+money(data.cash)+'</b></div>';html+='<div style="background:#202020;border:1px solid #383838;border-radius:9px;padding:9px">QRIS<br><b>'+money(data.qris)+'</b></div>';html+='<div style="background:#202020;border:1px solid #383838;border-radius:9px;padding:9px">Kuantitas Item<br><b>'+data.totalQty+'</b></div></div>';
if(!data.cats.length){html+='<div style="color:#aaa;margin-top:14px">Belum ada penjualan lunas pada periode ini.</div>'}else{for(const c of data.cats){html+='<div style="margin-top:16px;border:1px solid #444;border-radius:10px;overflow:hidden"><div style="background:#202020;padding:10px;font-weight:900">🍽️ '+esc(c.category)+' — '+c.qty+' item — '+money(c.revenue)+'</div><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr style="background:#1b1b1b"><th style="padding:8px;text-align:left;border-bottom:1px solid #333">Nama Item</th><th style="padding:8px;text-align:right;border-bottom:1px solid #333">Harga</th><th style="padding:8px;text-align:right;border-bottom:1px solid #333">Qty</th><th style="padding:8px;text-align:right;border-bottom:1px solid #333">Nominal</th></tr></thead><tbody>';for(const x of c.items){html+='<tr><td style="padding:8px;border-bottom:1px solid #292929">'+esc(x.name)+'</td><td style="padding:8px;text-align:right;border-bottom:1px solid #292929">'+money(x.unit)+'</td><td style="padding:8px;text-align:right;border-bottom:1px solid #292929">'+x.qty+'</td><td style="padding:8px;text-align:right;border-bottom:1px solid #292929">'+money(x.revenue)+'</td></tr>'}html+='</tbody></table></div>'}}html+='</div>';return html}
async function run(kind){const w=ownerApp();if(!w)return showStatus('Owner belum siap.');const pin=ownerPin();if(!pin)return showStatus('Silakan login Owner terlebih dahulu.');const rg=range(kind);const box=w.document.getElementById('rppReportBox');if(box)box.innerHTML='<div style="padding:10px;color:#aaa">Memuat rekapan detail...</div>';try{const [orders,products,cats]=await Promise.all([rpc('/rest/v1/rpc/staff_get_orders',{p_pin:pin}),apiProducts(w),categories(pin)]);const data=aggregate(orders,rg.from,rg.to,products,cats);if(box)box.innerHTML=reportHtml(data,rg.label,rg.from,rg.to);showStatus('✓ Rekapan detail '+rg.label.toLowerCase()+' berhasil dimuat.')}catch(e){if(box)box.innerHTML='<div style="background:#4a1d1a;color:#ffd9d5;padding:10px;border-radius:9px">Gagal memuat rekapan: '+esc(e.message)+'</div>';showStatus('Rekapan gagal dimuat.')}}
function printDetail(){const w=ownerApp();const box=w?.document.getElementById('detailReport');if(!box)return alert('Tampilkan rekapan terlebih dahulu.');const p=window.open('','_blank');p.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Rekap Penjualan ISSHO CAFE</title><style>body{font-family:Arial,sans-serif;margin:18px;color:#111}table{page-break-inside:auto}tr{page-break-inside:avoid;page-break-after:auto}@media print{button{display:none}}</style></head><body>'+box.outerHTML+'</body></html>');p.document.close();p.focus();setTimeout(()=>p.print(),250)}
function patch(){try{const ow=frame.contentWindow,inner=ow.document.getElementById('app');if(!inner||!inner.contentDocument)return false;const w=inner.contentWindow,reports=w.document.getElementById('reports');if(!reports)return false;let quick=w.document.getElementById('rppQuickReports');if(!quick){quick=w.document.createElement('div');quick.id='rppQuickReports';quick.style.cssText='background:#151515;border:1px solid #444;border-radius:12px;padding:12px;margin-bottom:12px';quick.innerHTML='<h3 style="margin:0 0 8px">⚡ Rekapan Detail</h3><div style="display:flex;gap:7px;flex-wrap:wrap"><button type="button" id="rppDaily" class="gold">📅 Harian</button><button type="button" id="rppWeekly" class="blue">📆 Mingguan</button><button type="button" id="rppMonthly" class="green">🗓️ Bulanan</button><button type="button" id="rppPrint" class="dark">🖨️ Print Rekapan Detail</button></div><div id="rppReportBox"></div>';reports.insertBefore(quick,reports.children[1]||null)}w.document.getElementById('rppDaily').onclick=()=>run('daily');w.document.getElementById('rppWeekly').onclick=()=>run('weekly');w.document.getElementById('rppMonthly').onclick=()=>run('monthly');w.document.getElementById('rppPrint').onclick=printDetail;return true}catch(e){return false}}
function boot(){let n=0;const t=setInterval(()=>{if(patch()||++n>240)clearInterval(t)},250);setInterval(patch,1500)}
frame.addEventListener('load',boot);boot();
</script>
</body></html>
