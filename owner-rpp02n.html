<title>ISSHO CAFE — OWNER</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}</style>
</head><body>
<iframe id="owner" src="owner.html?v=20260831-owner-stable-shell" title="ISSHO CAFE OWNER"></iframe>
<script>
const ownerFrame=document.getElementById('owner');
function useStableEditor(){
  try{
    const appFrame=ownerFrame.contentDocument&&ownerFrame.contentDocument.getElementById('app');
    if(!appFrame)return false;
    if(!appFrame.dataset.stableEditor){
      appFrame.dataset.stableEditor='1';
      appFrame.src='/owner-v3-fixed.html?v=20260831-stable-owner';
    }
    return true;
  }catch(e){console.warn('Stable Owner route:',e);return false}
}
ownerFrame.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{n++;if(useStableEditor()||n>40)clearInterval(t)},250)});
</script>
<script src="/ui-standard.js?v=20260830-ui-v2"></script>
</body></html>
