<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>ISSHO CAFE — OWNER</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}#tools{display:none;position:fixed;right:12px;top:12px;z-index:99999;gap:7px;background:#151515;border:1px solid #444;border-radius:12px;padding:7px;box-shadow:0 8px 25px #000}.btn{border:0;border-radius:9px;padding:12px 16px;font-weight:900;color:#fff;cursor:pointer}.green{background:#2f7d50}.gold{background:#b68142}#modal{display:none;position:fixed;inset:0;z-index:100001;background:rgba(0,0,0,.75);padding:20px;overflow:auto}#panel{max-width:760px;margin:35px auto;background:#151515;border:1px solid #444;border-radius:16px;padding:18px;color:#fff;font-family:Arial,sans-serif;box-shadow:0 20px 60px #000}.muted{color:#aaa;font-size:14px}.notice{background:#302719;border:1px solid #5a4529;color:#ffe8b2;padding:10px;border-radius:10px;margin:10px 0}#search{width:100%;box-sizing:border-box;padding:12px;border:1px solid #444;border-radius:10px;background:#1b1b1b;color:#fff;font-size:16px}#list{margin-top:10px;max-height:55vh;overflow:auto;border:1px solid #333;border-radius:10px}.item{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #333}.item input{width:21px;height:21px}.name{font-weight:900}.cat{color:#aaa;font-size:12px;margin-top:3px}.price{color:#ddd;font-size:12px;margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.dark{background:#242424;color:#fff;border:1px solid #444}.empty{text-align:center;padding:22px;color:#aaa}@media(max-width:700px){#tools{left:6px;right:6px;justify-content:flex-end}.btn{font-size:12px;padding:9px}.gold{display:none}#panel{margin:50px auto 10px;padding:13px}}</style></head><body>
<iframe id="owner" src="owner-v3-safe.html?v=20260831-cat20" title="ISSHO CAFE OWNER"></iframe>
<div id="tools"><button id="restore" class="btn green" type="button">🟢 PULIHKAN MENU TERPILIH (0)</button><button class="btn gold" type="button" onclick="location.href='owner-menu-manager.html'">🍽️ Kelola Menu</button></div>
<div id="modal"><div id="panel"><h2>🟢 Pulihkan Menu Terpilih</h2><div class="muted">Centang hanya menu yang stoknya sudah tersedia kembali. Menu yang tidak dicentang tetap tidak dipulihkan.</div><div class="notice">Jumlah pada tombol menunjukkan jumlah menu yang Anda centang.</div><input id="search" placeholder="🔎 Cari menu stok kosong..." oninput="renderList()"><div id="list"></div><div class="actions"><button class="btn gold" type="button" onclick="selectAllVisible()">☑ Pilih Semua</button><button id="bulk" class="btn green" type="button" onclick="restoreSelected()">🟢 PULIHKAN MENU TERPILIH (0)</button><button class="btn dark" type="button" onclick="closeModal()">Tutup</button></div><div id="msg" class="muted" style="margin-top:9px"></div></div></div>
<script>
const S='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';const f=document.getElementById('owner'),tools=document.getElementById('tools'),topBtn=document.getElementById('restore'),modal=document.getElementById('modal'),list=document.getElementById('list'),search=document.getElementById('search'),bulk=document.getElementById('bulk'),msg=document.getElementById('msg');let hidden=[],selected=new Set(),busy=false;
const doc=()=>f.contentDocument||f.contentWindow.document;const pin=()=>{try{return doc().getElementById('pin')?.value?.trim()||''}catch(e){return''}};const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
async function rpc(path,body){const r=await fetch(S+path,{method:'POST',cache:'no-store',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null}
function loggedIn(){try{return doc().getElementById('login')?.classList.contains('hidden')&& !doc().getElementById('app')?.classList.contains('hidden')}catch(e){return false}}
function sync(){tools.style.display=loggedIn()?'flex':'none';if(!loggedIn())modal.style.display='none'}
function count(){const n=selected.size;topBtn.textContent='🟢 PULIHKAN MENU TERPILIH ('+n+')';bulk.textContent='🟢 PULIHKAN MENU TERPILIH ('+n+')'}
function cat(p){return p.category_name||'Tanpa Kategori'}
function renderList(){const q=search.value.trim().toLowerCase(),rows=hidden.filter(p=>(p.name+' '+(p.description||'')+' '+cat(p)).toLowerCase().includes(q));list.innerHTML=rows.length?rows.map(p=>'<label class="item"><input type="checkbox" data-id="'+esc(p.id)+'" '+(selected.has(p.id)?'checked':'')+'><div><div class="name">'+esc(p.name)+'</div><div class="cat">'+esc(cat(p))+'</div><div class="price">'+Number(p.price||0).toLocaleString('id-ID')+'</div></div></label>').join(''):'<div class="empty">Tidak ada menu stok kosong.</div>';list.querySelectorAll('input[data-id]').forEach(x=>x.addEventListener('change',()=>{x.checked?selected.add(x.dataset.id):selected.delete(x.dataset.id);count()}));count()}
async function loadHidden(){const p=pin();if(!p)throw Error('Login Owner terlebih dahulu.');const r=await rpc('/rest/v1/rpc/owner_list_hidden_products',{p_owner_pin:p});hidden=Array.isArray(r)?r:[];selected=new Set([...selected].filter(id=>hidden.some(x=>x.id===id)));renderList();msg.textContent=hidden.length?hidden.length+' menu stok kosong ditemukan.':'Tidak ada menu stok kosong.'}
async function openModal(){sync();if(!loggedIn())return;modal.style.display='block';search.value='';selected.clear();count();msg.textContent='Memuat menu stok kosong...';try{await loadHidden()}catch(e){list.innerHTML='<div class="empty">Gagal memuat: '+esc(e.message)+'</div>';msg.textContent=e.message}}
function closeModal(){modal.style.display='none'}
function selectAllVisible(){const q=search.value.trim().toLowerCase();hidden.filter(p=>(p.name+' '+(p.description||'')+' '+cat(p)).toLowerCase().includes(q)).forEach(p=>selected.add(p.id));renderList()}
async function restoreSelected(){if(busy)return;const p=pin(),ids=[...selected];if(!p)return msg.textContent='Login Owner terlebih dahulu.';if(!ids.length)return msg.textContent='Pilih minimal satu menu.';busy=true;bulk.disabled=true;bulk.textContent='⏳ MEMULIHKAN '+ids.length+' MENU...';try{const r=await rpc('/rest/v1/rpc/owner_restore_selected_products',{p_owner_pin:p,p_product_ids:ids});msg.textContent='✓ '+(r?.message||ids.length+' menu berhasil dipulihkan.');selected.clear();await loadHidden();try{doc().defaultView.loadProducts();doc().defaultView.loadCategories()}catch(e){} }catch(e){msg.textContent='Gagal memulihkan: '+e.message}finally{busy=false;bulk.disabled=false;count()}}
function resizeProof(){try{const d=doc(),s=d.getElementById('owner-proof-size-fix');if(!s){const st=d.createElement('style');st.id='owner-proof-size-fix';st.textContent='.proof{width:120px!important;max-width:120px!important;height:auto!important;max-height:150px!important;object-fit:contain!important;display:block!important;margin:6px 0;border-radius:7px!important}@media(max-width:700px){.proof{width:90px!important;max-width:90px!important;max-height:120px!important}}';d.head.appendChild(st)}}catch(e){}}
topBtn.addEventListener('click',openModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});f.addEventListener('load',()=>{setTimeout(sync,300);setTimeout(sync,1000);setTimeout(resizeProof,400);setTimeout(()=>{try{if(loggedIn()){doc().defaultView.loadCategories();doc().defaultView.loadProducts();resizeProof()}}catch(e){}},1200)});setInterval(()=>{sync();resizeProof()},1000);count();
</script></body></html>
