<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>ISSHO CAFE</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" title="ISSHO CAFE"></iframe><script>const f=document.getElementById('app');f.src='customer-v2.html?catfix=20260822'+location.search+location.hash;f.addEventListener('load',()=>{let tries=0;const fix=()=>{try{const d=f.contentDocument,c=d&&d.getElementById('cats');if(!c){if(tries++<100)setTimeout(fix,100);return}const apply=()=>{try{const cats=d.getElementById('cats');if(!cats)return;const buttons=cats.querySelectorAll('button.cat');buttons.forEach(b=>{if(b.textContent.trim().toLowerCase()==='semua')b.style.setProperty('display','none','important')});if(typeof f.contentWindow.activeCat!=='undefined'&&f.contentWindow.activeCat==='Semua'){f.contentWindow.activeCat='Aneka Nasi';if(typeof f.contentWindow.renderCats==='function')f.contentWindow.renderCats();if(typeof f.contentWindow.renderMenu==='function')f.contentWindow.renderMenu()}}catch(e){}};apply();const obs=new MutationObserver(apply);obs.observe(c,{childList:true,subtree:true});}catch(e){if(tries++<100)setTimeout(fix,100)}};fix()});</script></body></html>
