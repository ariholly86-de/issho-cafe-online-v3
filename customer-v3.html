mage:url('${esc(p.image_url)}')"></div>`:`<div class="photo" style="display:grid;place-items:center;color:#777;background:#171717">Belum ada gambar</div>`;return `<div class="menu" style="position:relative;${on?'':'border-color:#8b3d36;opacity:.96'}">${photo}<span class="tag">${esc(w.category(p))}</span><h3>${esc(p.name)}</h3><div class="muted">${esc(p.description||'')}</div><div style="margin-top:6px;padding:7px 9px;border-radius:9px;background:${on?'#193b25':'#4a1d1a'};color:${on?'#d9ffe5':'#ffd9d5'};font-weight:900;font-size:12px;text-align:center">${on?'✓ TERSEDIA':'⚠ STOK HABIS / KOSONG'}</div><div class="row" style="margin-top:auto;padding-top:9px"><b class="price">${w.money(p.price)}</b>${on?`<button class="gold" onclick="add('${p.id}')">Tambah</button>`:`<button class="dark" disabled style="opacity:.65;cursor:not-allowed">Stok Habis</button>`}</div></div>`}).join(''):`<div class="card">Menu tidak ditemukan pada kategori ini.</div>`};w.renderMenu=render;render();const oldCats=w.renderCats;w.renderCats=function(){oldCats();d.getElementById('cats').querySelectorAll('button.cat').forEach(b=>{if(b.textContent.trim().toLowerCase()==='semua')b.style.setProperty('display','none','important')})};const oldSearch=d.getElementById('search');if(oldSearch&&!oldSearch.dataset.stockNotice){oldSearch.dataset.stockNotice='1';oldSearch.addEventListener('input',render)}new MutationObserver(()=>{d.getElementById('cats')?.querySelectorAll('button.cat').forEach(b=>{if(b.textContent.trim().toLowerCase()==='semua')b.style.setProperty('display','none','important')})}).observe(cats,{childList:true,subtree:true});}catch(e){console.error(e)}}f.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{sync();if(++n>40)clearInterval(t)},500);setInterval(sync,30000)});</script></body></html>
