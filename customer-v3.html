<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISSHO CAFE</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" title="ISSHO CAFE"></iframe><script>const f=document.getElementById('app');f.src='customer-v2.html'+location.search+location.hash;f.addEventListener('load',()=>{let tries=0;const fix=()=>{try{const d=f.contentDocument,c=d&&d.getElementById('cats');if(!c){if(tries++<40)setTimeout(fix,100);return}const b=c.querySelectorAll('button');if(b.length){b[0].style.display='none';if(typeof f.contentWindow.activeCat!=='undefined'){f.contentWindow.activeCat=b[1]?b[1].textContent:'Aneka Nasi';f.contentWindow.renderCats();f.contentWindow.renderMenu()}}}catch(e){if(tries++<40)setTimeout(fix,100)}};fix()});</script></body></html>
