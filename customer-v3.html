const f=document.getElementById('app'),URL='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';f.src='customer-v2.html?catfix=20260823-dynamic'+location.search+location.hash;let sig='';
function esc(s){return String(s??'').replace(/[&<>\\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[m]))}
async function get(path){const r=await fetch(URL+path,{cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error(await r.text());return r.json()}
async function sync(){try{const w=f.contentWindow;if(!w||!w.document)return;const [cats,products]=await Promise.all([get('/rest/v1/categories?select=id,name,active,sort_order&active=eq.true&order=sort_order,name'),get('/rest/v1/products?select=id,category_id,name,description,price,image_url,sort_order,active&active=eq.true&order=sort_order,name')]);const visible=products.filter(p=>typeof p.image_url==='string'&&p.image_url.trim()!=='');const map=Object.fromEntries(cats.map(c=>[c.id,c.name]));const visibleCats=cats.filter(c=>visible.some(p=>p.category_id===c.id));const s=visible.map(p=>p.id+':'+p.price+':'+p.name+':'+(p.image_url||'')).join('|')+'#'+visibleCats.map(c=>c.id+':'+c.name).join('|');if(s===sig)return;sig=s;w.products=visible;w.__DYNAMIC_CATEGORIES=visibleCats;w.__CATEGORY_MAP=map;w.activeCat=(w.activeCat&&visibleCats.some(c=>c.name===w.activeCat))?w.activeCat:(visibleCats[0]?.name||'');w.category=function(p){return w.__CATEGORY_MAP?.[p.category_id]||'Tanpa Kategori'};w.renderCats=function(){const el=w.document.getElementById('cats');if(!el)return;el.innerHTML=visibleCats.map(c=>'<button class="cat '+(w.activeCat===c.name?'active':'')+'" onclick="activeCat='+JSON.stringify(c.name)+';renderCats();renderMenu()">'+esc(c.name)+'</button>').join('')};w.renderMenu();w.renderCats()}catch(e){console.error('Customer menu sync:',e)}}
f.addEventListener('load',()=>{let n=0;const wait=()=>{try{if(f.contentDocument?.getElementById('cats')){sync();setInterval(sync,3000);return}}catch(e){}if(n++<100)setTimeout(wait,100)};wait()});
</script></body></html>
