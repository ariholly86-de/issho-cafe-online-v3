<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>ISSHO CAFE — DAPUR</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="dapur" src="/dapur-v6.html?v=20260826-food-drink-time-v3" title="ISSHO CAFE DAPUR"></iframe><script>(function(){const f=document.getElementById('dapur');let observer=null,patching=false;function orderObj(ref){try{const a=f.contentWindow.ORD;if(Array.isArray(a)){return a.find(o=>String(o?.order_number||'').trim()===String(ref||'').trim())||null}}catch(e){}return null}function dateTime(o,ref){const raw=o?.created_at||o?.order_date||o?.ordered_at||o?.createdAt||o?.orderDate;if(raw){const d=new Date(raw);if(!isNaN(d)){return{date:d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Asia/Jakarta'}),time:d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Asia/Jakarta'})+' WIB'}}}const m=String(ref||'').match(/^ISS-(\d{6})-(\d{6})-/i);if(m){const ds=m[1],ts=m[2];return{date:ds.slice(4,6)+'/'+ds.slice(2,4)+'/20'+ds.slice(0,2),time:ts.slice(0,2)+':'+ts.slice(2,4)+':'+ts.slice(4,6)+' WIB'}}return{date:'-',time:'-'}}function patch(){if(patching)return;try{const d=f.contentDocument;if(!d||!d.body)return;patching=true;let style=d.getElementById('issho-time-patch');if(!style){style=d.createElement('style');style.id='issho-time-patch';style.textContent='.issho-order-time{color:#c9c9c9;font-size:13px;margin-top:2px;font-weight:700;line-height:1.25}.issho-alarm-time{font-size:13px;color:#c9c9c9;font-weight:700;margin-bottom:8px;line-height:1.25}';d.head.appendChild(style)}d.querySelectorAll('.order').forEach(card=>{const h=card.querySelector('h2');if(!h)return;const ref=(h.textContent||'').trim();if(!/^ISS-\d{6}-\d{6}-/i.test(ref))return;const date=card.querySelector('.order-date');if(!date)return;const o=orderObj(ref),dt=dateTime(o,ref);let x=card.querySelector('.issho-order-time');const value='Jam Order: '+dt.time;if(!x){x=d.createElement('div');x.className='issho-order-time';date.insertAdjacentElement('afterend',x)}if(x.textContent!==value)x.textContent=value;const dateValue='Tanggal Order: '+dt.date;if(date.textContent!==dateValue)date.textContent=dateValue});const alarmOrder=d.getElementById('alarmOrder'),alarmDate=d.getElementById('alarmDate');if(alarmOrder&&alarmDate){const ref=alarmOrder.textContent.trim(),dt=dateTime(orderObj(ref),ref);let x=d.getElementById('alarmTime');const value='Jam Order: '+dt.time;if(!x){x=d.createElement('div');x.id='alarmTime';x.className='issho-alarm-time';alarmDate.insertAdjacentElement('afterend',x)}if(x.textContent!==value)x.textContent=value;const dateValue='Tanggal Order: '+dt.date;if(alarmDate.textContent!==dateValue)alarmDate.textContent=dateValue}}catch(e){}finally{patching=false}}function observe(){const d=f.contentDocument;if(!d||!d.body)return;patch();if(observer)observer.disconnect();observer=new MutationObserver(function(){patch()});observer.observe(d.body,{subtree:true,childList:true,characterData:true})}f.addEventListener('load',()=>setTimeout(observe,150));if(f.contentDocument&&f.contentDocument.readyState==='complete')setTimeout(observe,150)})();</script></body></html>
