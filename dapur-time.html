<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>ISSHO CAFE — DAPUR</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="dapur" src="/dapur-v6.html?v=20260826-food-drink-time-v1" title="ISSHO CAFE DAPUR"></iframe><script>(function(){const f=document.getElementById('dapur');function timeFromISS(ref){const m=String(ref||'').match(/^ISS-\d{6}-(\d{6})-/i);if(!m)return'-';const t=m[1];return t.slice(0,2)+':'+t.slice(2,4)+':'+t.slice(4,6)+' WIB'}function dateFromISS(ref){const m=String(ref||'').match(/^ISS-(\d{6})-/i);if(!m)return'-';const s=m[1];return s.slice(4,6)+'/'+s.slice(2,4)+'/20'+s.slice(0,2)}function patch(){try{const d=f.contentDocument;if(!d||!d.body)return;let style=d.getElementById('issho-time-patch');if(!style){style=d.createElement('style');style.id='issho-time-patch';style.textContent='.issho-order-time{color:#c9c9c9;font-size:13px;margin-top:2px;font-weight:700}.issho-alarm-time{font-size:13px;color:#c9c9c9;font-weight:700;margin-bottom:8px}';d.head.appendChild(style)}d.querySelectorAll('.order').forEach(card=>{if(card.querySelector('.issho-order-time'))return;const h=card.querySelector('h2');if(!h)return;const ref=(h.textContent||'').trim();if(!/^ISS-\d{6}-\d{6}-/i.test(ref))return;const date=card.querySelector('.order-date');if(!date)return;const x=d.createElement('div');x.className='issho-order-time';x.textContent='Jam Order: '+timeFromISS(ref);date.insertAdjacentElement('afterend',x)});const alarmOrder=d.getElementById('alarmOrder'),alarmDate=d.getElementById('alarmDate');if(alarmOrder&&alarmDate&&!d.getElementById('alarmTime')){const x=d.createElement('div');x.id='alarmTime';x.className='issho-alarm-time';x.textContent='Jam Order: '+timeFromISS(alarmOrder.textContent);alarmDate.insertAdjacentElement('afterend',x)}else if(alarmOrder&&d.getElementById('alarmTime')){d.getElementById('alarmTime').textContent='Jam Order: '+timeFromISS(alarmOrder.textContent)} }catch(e){}}f.addEventListener('load',()=>{setTimeout(patch,250);setInterval(patch,500)});setInterval(patch,700);})();</script></body></html>
