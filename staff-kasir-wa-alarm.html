<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — KASIR</title><style>html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}#kasir{width:100%;height:100%;border:0;display:block}#waFab{position:fixed;right:18px;bottom:18px;z-index:2147483647;width:54px;height:54px;border:0;border-radius:50%;background:#20b95a;color:#fff;font-size:27px;font-weight:900;box-shadow:0 5px 22px #0009;cursor:pointer}#waHint{position:fixed;right:78px;bottom:22px;z-index:2147483646;background:#151515;border:1px solid #444;border-radius:10px;padding:9px 12px;font-size:12px;color:#ddd;display:none}.shade{display:none;position:fixed;inset:0;z-index:2147483647;background:#000b;align-items:center;justify-content:center;padding:16px}.modal{width:min(460px,94vw);background:#171717;border:1px solid #555;border-radius:16px;padding:18px;box-shadow:0 10px 40px #000}.modal h3{margin:0 0 10px}.modal input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #555;background:#101010;color:#fff;margin:8px 0}.modal button{border:0;border-radius:10px;padding:12px 15px;font-weight:900;color:#fff;cursor:pointer}.send{background:#20b95a}.close{background:#444}.preview{background:#101010;border-radius:10px;padding:10px;font-size:13px;line-height:1.5;max-height:180px;overflow:auto}.alarmBadge{position:fixed;left:12px;bottom:14px;z-index:2147483646;background:#208b57;color:#fff;border-radius:10px;padding:8px 11px;font-weight:900;font-size:12px;box-shadow:0 4px 16px #0008}</style></head><body><iframe id="kasir" src="/staff-kasir-final.html?v=20260825-wa-alarm-v1" title="ISSHO CAFE KASIR"></iframe><div id="alarmBadge" class="alarmBadge">🔔 ALARM AKTIF ✓</div><button id="waFab" title="WhatsApp pelanggan">☘</button><div id="waHint">Tombol WhatsApp per order akan muncul di samping Print Pelanggan.</div><div id="shade" class="shade"><div class="modal"><h3>📱 WhatsApp Nota Pelanggan</h3><div id="orderPreview" class="preview">Pilih order PAID terlebih dahulu.</div><input id="phone" inputmode="tel" autocomplete="tel" placeholder="Nomor WhatsApp pelanggan, contoh 0812xxxx atau +62..."><div style="display:flex;gap:7px;justify-content:flex-end;margin-top:8px"><button class="close" id="cancel">Batal</button><button class="send" id="send">Kirim WhatsApp</button></div></div></div><script>const frame=document.getElementById('kasir'),shade=document.getElementById('shade'),phone=document.getElementById('phone'),preview=document.getElementById('orderPreview');let selected=null;function esc(s){return String(s??'').replace(/[&<>\\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[m]))}function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}function staff(){try{let a=frame.contentWindow;if(a&&a.staff)return a.staff();let b=a.document.getElementById('kasir');if(b){let c=b.contentWindow,d=c.document.getElementById('kasir');return d?d.contentWindow:c}return null}catch(e){return null}}function findOrder(id){const w=staff();return w&&Array.isArray(w.ORD)?w.ORD.find(o=>String(o.id)===String(id)):null}function normalize(n){n=String(n||'').replace(/\\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);if(n&&!n.startsWith('62'))n='62'+n;return n}function text(o){const items=(o.items||[]).map(i=>'- '+i.name+' × '+Number(i.qty||0)+' — '+money((Number(i.price)||0)*(Number(i.qty)||0))).join('\\n');return 'Halo, ini rincian pembelian Anda di ISSHO CAFE.\\n\\nISSN: '+(o.order_number||'-')+'\\nMeja: '+(o.table_name||'Take Away')+'\\nPembayaran: '+(o.payment_method||'-')+'\\nStatus: PAID\\n\\n'+items+'\\n\\nTOTAL: '+money(o.total)+'\\n\\nTerima kasih telah berkunjung ke ISSHO CAFE.'}function openWA(id){const o=findOrder(id);if(!o){alert('Order tidak ditemukan. Pastikan order sudah tampil.');return}if(o.payment_status!=='PAID'){alert('WhatsApp nota hanya tersedia setelah pembayaran PAID.');return}selected=o;preview.textContent='ISSN: '+(o.order_number||'-')+' | Meja: '+(o.table_name||'Take Away')+' | '+(o.payment_method||'-')+' | '+money(o.total);const key='issho_customer_wa_by_table_v3';let map={};try{map=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}phone.value=map[String(o.table_name||'Take Away')]||'';shade.style.display='flex';setTimeout(()=>phone.focus(),80)}function send(){if(!selected)return;let n=normalize(phone.value);if(!n){alert('Masukkan nomor WhatsApp pelanggan.');phone.focus();return}let map={};try{map=JSON.parse(localStorage.getItem('issho_customer_wa_by_table_v3')||'{}')}catch(e){}map[String(selected.table_name||'Take Away')]=n;localStorage.setItem('issho_customer_wa_by_table_v3',JSON.stringify(map));window.open('https://wa.me/'+n+'?text='+encodeURIComponent(text(selected)),'_blank');shade.style.display='none'}document.getElementById('send').onclick=send;document.getElementById('cancel').onclick=()=>shade.style.display='none';document.getElementById('waFab').onclick=()=>{document.getElementById('waHint').style.display='block';setTimeout(()=>document.getElementById('waHint').style.display='none',3000)};function patchOrders(){try{const w=staff();if(!w)return;w.document.querySelectorAll('button').forEach(b=>{const t=(b.textContent||'').trim();if(/Print Pelanggan/i.test(t)){const idm=(b.getAttribute('onclick')||'').match(/printCustomer\\(['\"]([^'\"]+)['\"]\\)/);if(!idm)return;const id=idm[1];if(b.parentElement.querySelector('[data-wa-id="'+id+'"]'))return;const x=w.document.createElement('button');x.type='button';x.textContent='📱';x.title='WhatsApp Nota Pelanggan';x.setAttribute('data-wa-id',id);x.style.cssText='background:#20b95a;color:#fff;border:0;border-radius:9px;padding:10px 13px;margin-left:5px;font-weight:900;cursor:pointer';x.onclick=()=>openWA(id);b.parentElement.appendChild(x)}});document.getElementById('alarmBadge').textContent='🔔 ALARM AKTIF ✓';try{const outer=frame.contentWindow;if(outer&&typeof outer.enable==='function')outer.enable()}catch(e){}}catch(e){}}frame.addEventListener('load',()=>{patchOrders();setInterval(patchOrders,1000)});setInterval(patchOrders,1200);</script></body></html>
