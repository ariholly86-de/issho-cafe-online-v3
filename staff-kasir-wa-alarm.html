<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store">
<title>ISSHO CAFE — KASIR</title>
<style>
html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}#kasir{width:100%;height:100%;border:0;display:block}
#waModal{display:none;position:fixed;inset:0;z-index:2147483647;background:#000b;align-items:center;justify-content:center;padding:16px}.box{width:min(440px,94vw);background:#171717;border:1px solid #555;border-radius:16px;padding:18px;box-shadow:0 10px 40px #000}.box h3{margin:0 0 10px}.box input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #555;background:#101010;color:#fff;margin:8px 0}.box button{border:0;border-radius:10px;padding:12px 15px;font-weight:900;color:#fff;cursor:pointer}.send{background:#20b95a}.close{background:#444}.preview{background:#101010;border-radius:10px;padding:10px;font-size:13px;line-height:1.5;max-height:180px;overflow:auto}.waInline{display:inline-flex!important;align-items:center;justify-content:center;width:42px;height:40px;padding:0!important;margin-left:4px;border:0!important;border-radius:10px!important;background:#20b95a!important;color:#fff!important;font-size:20px!important;font-weight:900!important;cursor:pointer!important;vertical-align:middle}.waInline span{font-size:21px}.waInline:hover{filter:brightness(1.12)}
#waStatus{position:fixed;left:12px;bottom:14px;z-index:2147483646;background:#20a95a;color:#fff;border-radius:10px;padding:8px 11px;font-weight:900;font-size:12px;box-shadow:0 4px 16px #0008}
</style>
</head>
<body>
<iframe id="kasir" src="/staff-kasir-final.html?v=20260825-wa-alarm-v2" title="ISSHO CAFE KASIR"></iframe>
<div id="waStatus">📱 WhatsApp per order aktif</div>
<div id="waModal"><div class="box"><h3>📱 Kirim Nota WhatsApp</h3><div id="preview" class="preview">Pilih order PAID.</div><input id="phone" inputmode="tel" autocomplete="tel" placeholder="Nomor WhatsApp pelanggan, contoh 0812xxxx atau +62..."><div style="display:flex;gap:7px;justify-content:flex-end;margin-top:8px"><button class="close" id="cancel">Batal</button><button class="send" id="send">Kirim WhatsApp</button></div></div></div>
<script>
const frame=document.getElementById('kasir'),modal=document.getElementById('waModal'),phone=document.getElementById('phone'),preview=document.getElementById('preview');let selected=null,observer=null;
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
function deepWindow(){try{let w=frame.contentWindow;for(let i=0;i<5;i++){const f=w.document.querySelector('iframe#kasir');if(!f)break;w=f.contentWindow}return w}catch(e){return null}}
function orders(){const w=deepWindow();return w&&Array.isArray(w.ORD)?w.ORD:[]}
function orderFromButton(b){try{const card=b.closest('.order');if(!card)return null;const first=card.querySelector('b');const number=first?.textContent?.trim();return orders().find(o=>String(o.order_number)===String(number))||null}catch(e){return null}}
function normalize(n){n=String(n||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);if(n&&!n.startsWith('62'))n='62'+n;return n}
function message(o){const items=(o.items||[]).map(i=>'- '+i.name+' × '+Number(i.qty||0)+' — '+money((Number(i.price)||0)*(Number(i.qty)||0))).join('\n');return 'Halo, ini rincian pembelian Anda di ISSHO CAFE.\n\nISSN: '+(o.order_number||'-')+'\nMeja: '+(o.table_name||'Take Away')+'\nPembayaran: '+(o.payment_method||'-')+'\nStatus: PAID\n\n'+items+'\n\nTOTAL: '+money(o.total)+'\n\nTerima kasih telah berkunjung ke ISSHO CAFE.'}
function openWA(o){if(!o)return;if(o.payment_status!=='PAID'){alert('Nota WhatsApp hanya dapat dikirim setelah pembayaran PAID.');return}selected=o;preview.textContent='ISSN: '+(o.order_number||'-')+' | Meja: '+(o.table_name||'Take Away')+' | '+(o.payment_method||'-')+' | '+money(o.total);let map={};try{map=JSON.parse(localStorage.getItem('issho_customer_wa_by_table_v4')||'{}')}catch(e){}phone.value=map[String(o.table_name||'Take Away')]||'';modal.style.display='flex';setTimeout(()=>phone.focus(),80)}
function sendWA(){if(!selected)return;const n=normalize(phone.value);if(!n){alert('Masukkan nomor WhatsApp pelanggan.');phone.focus();return}let map={};try{map=JSON.parse(localStorage.getItem('issho_customer_wa_by_table_v4')||'{}')}catch(e){}map[String(selected.table_name||'Take Away')]=n;localStorage.setItem('issho_customer_wa_by_table_v4',JSON.stringify(map));window.open('https://wa.me/'+n+'?text='+encodeURIComponent(message(selected)),'_blank');modal.style.display='none'}
document.getElementById('send').onclick=sendWA;document.getElementById('cancel').onclick=()=>modal.style.display='none';modal.addEventListener('click',e=>{if(e.target===modal)modal.style.display='none'});
function patchWA(){try{const w=deepWindow();if(!w)return false;const list=w.document.getElementById('list');if(!list)return false;list.querySelectorAll('button').forEach(b=>{if(!/Print Pelanggan/i.test(b.textContent||''))return;const o=orderFromButton(b);if(!o||o.payment_status!=='PAID')return;if(b.parentElement.querySelector('.waInline'))return;const x=w.document.createElement('button');x.type='button';x.className='waInline';x.title='Kirim nota ke WhatsApp pelanggan';x.setAttribute('aria-label','Kirim nota WhatsApp');x.innerHTML='<span>☏</span>';x.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();openWA(o)});b.insertAdjacentElement('afterend',x)});return true}catch(e){return false}}
function installObserver(){try{const w=deepWindow();const list=w?.document?.getElementById('list');if(!list)return false;if(observer)observer.disconnect();observer=new w.MutationObserver(()=>patchWA());observer.observe(list,{childList:true,subtree:true});patchWA();return true}catch(e){return false}}
frame.addEventListener('load',()=>{setTimeout(installObserver,250);setTimeout(installObserver,1000);setInterval(patchWA,1000)});setInterval(patchWA,1500);
window.addEventListener('message',e=>{if(e.data?.type==='kasir-gesture'){try{const a=new AudioContext();a.resume().catch(()=>{});a.close()}catch(_){}}});
</script>
</body></html>
