<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>ISSHO CAFE — Kelola Menu Owner</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:#151515;border:1px solid #303030;border-radius:15px;padding:15px;margin:12px 0}.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}.cats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.item{background:#191919;border:1px solid #333;border-radius:12px;padding:12px}.thumb{width:100%;height:140px;object-fit:cover;border-radius:9px;background:#090909}.gold{background:#b68142;color:#fff}.green{background:#2f7d50;color:#fff}.dark{background:#242424;color:#fff;border:1px solid #444}button{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.muted{color:#aaa;font-size:13px}.badge{display:inline-block;padding:5px 8px;border-radius:99px;font-size:11px;font-weight:900}.on{background:#193b25;color:#d9ffe5}.off{background:#4a1d1a;color:#ffd9d5}input{width:100%;padding:11px;margin-top:8px;background:#1b1b1b;color:#fff;border:1px solid #444;border-radius:9px;font:inherit}.empty{text-align:center;color:#aaa;padding:30px}</style></head><body><main class="wrap"><header class="card"><div class="row"><div><h1 style="margin:0">🍽️ Kelola Menu Owner</h1><div class="muted">Kategori dibaca langsung dari database. Kategori baru tidak dikunci.</div></div><div><button class="gold" onclick="location.href='owner-add-menu.html?v=category-open-final'">➕ Tambah Menu</button><button class="dark" onclick="location.href='owner.html?v=back'">← Owner</button></div></div></header><section class="card"><div class="row"><h2 style="margin:0">Kategori Menu</h2><button class="dark" onclick="load()">🔄 Refresh</button></div><input id="search" placeholder="🔎 Cari menu..." oninput="render()"><div id="cats" class="cats"></div></section><section class="card"><div id="summary" class="muted"></div><div id="items" class="grid"></div></section></main><script>const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';let C=[],P=[],selected='__ALL__';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));async function api(path){const r=await fetch(U+path,{cache:'no-store',headers:{apikey:K,Authorization:'Bearer '+K}});if(!r.ok)throw Error(await r.text());return r.json()}function catName(id){return C.find(c=>c.id===id)?.name||'Tanpa Kategori'}function render(){const q=($('search').value||'').toLowerCase().trim();let a=P;if(selected!=='__ALL__')a=a.filter(p=>p.category_id===selected);if(q)a=a.filter(p=>(p.name+' '+(p.description||'')+' '+catName(p.category_id)).toLowerCase().includes(q));$('cats').innerHTML='<button class="'+(selected==='__ALL__'?'gold':'dark')+'" onclick="selected=\'__ALL__\';render()">Semua ('+P.length+')</button>'+C.map(c=>'<button class="'+(selected===c.id?'gold':'dark')+'" onclick="selected=\''+c.id+'\';render()">'+esc(c.name)+' ('+P.filter(p=>p.category_id===c.id).length+')</button>').join('');$('summary').textContent='Menampilkan '+a.length+' menu dari '+P.length+' menu. Kategori: '+(selected==='__ALL__'?'Semua':catName(selected));$('items').innerHTML=a.length?a.map(p=>'<div class="item">'+(p.image_url?'<img class="thumb" src="'+esc(p.image_url)+'">':'<div class="thumb"></div>')+'<h3>'+esc(p.name)+'</h3><div class="muted">Kategori: '+esc(catName(p.category_id))+'</div><b>Rp '+Number(p.price||0).toLocaleString('id-ID')+'</b><div style="margin-top:7px"><span class="badge '+(p.active?'on':'off')+'">'+(p.active?'AKTIF / TAMPIL':'STOK HABIS / NONAKTIF')+'</span></div></div>').join(''):'<div class="empty">Tidak ada menu pada kategori/pencarian ini.</div>'}async function load(){try{C=await api('/rest/v1/categories?select=id,name,active,sort_order&active=eq.true&order=sort_order,name');P=await api('/rest/v1/products?select=id,category_id,name,description,price,image_url,active&order=name');render()}catch(e){$('items').innerHTML='<div class="empty">Gagal memuat data: '+esc(e.message)+'</div>'}}load();</script></body></html>
