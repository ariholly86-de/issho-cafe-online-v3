<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>ISSHO CAFE — Kelola Menu Owner</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:#151515;border:1px solid #303030;border-radius:15px;padding:15px;margin:12px 0}.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}.cats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.item{background:#191919;border:1px solid #333;border-radius:12px;padding:12px}.thumb{width:100%;height:140px;object-fit:cover;border-radius:9px;background:#090909}.gold{background:#b68142;color:#fff}.green{background:#2f7d50;color:#fff}.dark{background:#242424;color:#fff;border:1px solid #444}.blue{background:#315b9a;color:#fff}button{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer;position:relative;z-index:2}input{width:100%;padding:11px;margin-top:8px;background:#1b1b1b;color:#fff;border:1px solid #444;border-radius:9px;font:inherit}.muted{color:#aaa;font-size:13px}.badge{display:inline-block;padding:5px 8px;border-radius:99px;font-size:11px;font-weight:900}.on{background:#193b25;color:#d9ffe5}.off{background:#4a1d1a;color:#ffd9d5}.empty{text-align:center;color:#aaa;padding:30px}.err{background:#4a1d1a;color:#ffd9d5;padding:10px;border-radius:9px}.ok{background:#193b25;color:#d9ffe5;padding:10px;border-radius:9px}.cat{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.addcat{background:#2f7d50;color:#fff;padding:8px 10px;font-size:12px}</style></head><body><main class="wrap"><header class="card"><div class="row"><div><h1 style="margin:0">🍽️ Kelola Menu Owner</h1><div class="muted">Pilih kategori untuk melihat menunya. Tombol 📷 Upload / Tambah Menu membuka form foto dan menyimpan langsung ke database pusat.</div></div><div><button class="gold" onclick="location.href='owner-add-menu.html?v=category-open-final'">➕ Tambah Menu</button><button class="dark" onclick="location.href='owner.html?v=back'">← Owner</button></div></div></header><section class="card"><h3 style="margin:0">🔐 Verifikasi Owner</h3><div class="muted">Masukkan PIN Owner satu kali. PIN hanya disimpan sementara di sesi browser.</div><input id="pin" type="password" inputmode="numeric" placeholder="PIN Owner"><div class="row" style="margin-top:8px"><button class="green" onclick="load()">Tampilkan Kategori</button><button class="dark" onclick="load()">🔄 Refresh</button></div><div id="msg"></div></section><section class="card"><input id="search" placeholder="🔎 Cari nama menu atau kategori..." oninput="render()"><div id="cats" class="cats"></div></section><section class="card"><div id="summary" class="muted"></div><div id="items" class="grid"></div></section></main><script>const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',PIN_KEY='issho_owner_pin_session';let C=[],P=[],selected='';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));async function rpc(path,body){const r=await fetch(U+path,{method:'POST',cache:'no-store',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}async function api(path){const r=await fetch(U+path,{cache:'no-store',headers:{apikey:K,Authorization:'Bearer '+K}});if(!r.ok)throw Error(await r.text());return r.json()}function catName(id){return C.find(c=>c.id===id)?.name||'Tanpa Kategori'}function addFor(name){location.href='owner-add-menu.html?category='+encodeURIComponent(name)+'&v=category-menu-clickfix-'+Date.now()}function render(){const q=($('search').value||'').toLowerCase().trim();let a=P;if(selected)a=a.filter(p=>p.category_id===selected);if(q)a=a.filter(p=>(p.name+' '+(p.description||'')+' '+catName(p.category_id)).toLowerCase().includes(q));$('cats').innerHTML='<div class="cat">'+C.map(c=>{const n=JSON.stringify(c.name);return '<button class="'+(selected===c.id?'gold':'dark')+'" onclick="selected='+JSON.stringify(c.id)+';render()">'+esc(c.name)+' ('+P.filter(p=>p.category_id===c.id).length+')</button><button type="button" class="addcat" onclick=\'addFor('+n+')\'>📷 Upload / Tambah Menu</button>'}).join('')+'</div>';$('summary').textContent='Menampilkan '+a.length+' menu. '+(selected?'Kategori terpilih: '+catName(selected):'Pilih kategori di atas.');$('items').innerHTML=a.length?a.map(p=>'<div class="item">'+(p.image_url?'<img class="thumb" src="'+esc(p.image_url)+'">':'<div class="thumb"></div>')+'<h3>'+esc(p.name)+'</h3><div class="muted">Kategori: '+esc(catName(p.category_id))+'</div><b>Rp '+Number(p.price||0).toLocaleString('id-ID')+'</b><div style="margin-top:7px"><span class="badge '+(p.active?'on':'off')+'">'+(p.active?'AKTIF / TAMPIL':'NONAKTIF')+'</span></div></div>').join(''):'<div class="empty">Belum ada menu pada kategori ini. Klik 📷 Upload / Tambah Menu.</div>'}async function load(){const pin=$('pin').value.trim();if(!pin){$('msg').innerHTML='<div class="err">Masukkan PIN Owner terlebih dahulu.</div>';return}sessionStorage.setItem(PIN_KEY,pin);try{$('msg').innerHTML='<div class="muted">⏳ Memuat database...</div>';C=await rpc('/rest/v1/rpc/owner_list_categories',{p_owner_pin:pin});if(!Array.isArray(C))C=[];P=await api('/rest/v1/products?select=id,category_id,name,description,price,image_url,active&order=name');$('msg').innerHTML='<div class="ok">✅ '+C.length+' kategori dan '+P.length+' menu dimuat dari database pusat.</div>';render()}catch(e){$('msg').innerHTML='<div class="err">Gagal memuat: '+esc(e.message)+'</div>'}}$('pin').addEventListener('input',()=>sessionStorage.setItem(PIN_KEY,$('pin').value.trim()));const savedPin=sessionStorage.getItem(PIN_KEY);if(savedPin){$('pin').value=savedPin;load(true)}</script></body></html>
