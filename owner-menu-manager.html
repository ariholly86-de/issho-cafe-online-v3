<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — Owner Menu</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:#151515;border:1px solid #333;border-radius:16px;padding:15px;margin:12px 0}.cats{display:flex;gap:8px;flex-wrap:wrap}.cat{border:1px solid #555;background:#242424;color:#fff;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer;touch-action:manipulation}.cat.active{background:#b68142;border-color:#b68142}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.item{background:#191919;border:1px solid #333;border-radius:14px;padding:11px}.thumb{width:100%;height:150px;object-fit:cover;border-radius:10px;background:#080808}.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:800;cursor:pointer}.gold{background:#b68142;color:#fff}.green{background:#2f7d50;color:#fff}.dark{background:#242424;color:#fff;border:1px solid #555}.muted{color:#aaa;font-size:13px}.ok{background:#193b25;padding:10px;border-radius:9px}.err{background:#4a1d1a;padding:10px;border-radius:9px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input{width:100%;padding:11px;margin:7px 0;background:#1b1b1b;color:#fff;border:1px solid #444;border-radius:9px}.camera{display:flex;gap:7px;margin-top:8px}.camera input{display:none}.camera label{display:inline-block;background:#315b9a;color:#fff;padding:10px 12px;border-radius:9px;font-weight:800;cursor:pointer}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.item{padding:8px}.thumb{height:115px}.cat{padding:9px 11px;font-size:12px}}</style></head><body><main class="wrap"><div class="card"><div class="row"><div><h1 style="margin:0">👑 Kelola Menu Owner</h1><div class="muted">Klik kategori untuk menampilkan hanya menu kategori tersebut. Foto bisa diambil langsung dari kamera HP Android.</div></div><button class="dark btn" id="backBtn" type="button">← Owner</button></div></div><div class="card"><b>PIN Owner</b><input id="pin" type="password" inputmode="numeric" placeholder="PIN Owner"><div class="row"><button class="green btn" id="loadBtn" type="button">🔄 Muat Database</button><button class="gold btn" id="addBtn" type="button">➕ Tambah Menu</button></div><div id="msg" style="margin-top:8px"></div></div><div class="card"><input id="search" placeholder="🔎 Cari menu..."><div id="cats" class="cats"></div></div><div class="card"><div id="summary" class="muted"></div><div id="items" class="grid" style="margin-top:10px"></div></div></main><script>const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',B='catalog-images';let C=[],P=[],selected=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[m]));async function req(path,opt={}){const r=await fetch(U+path,Object.assign({cache:'no-store',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'}},opt));const t=await r.text();if(!r.ok)throw Error(t||r.status);return t?JSON.parse(t):null}async function rpc(path,body){return req(path,{method:'POST',body:JSON.stringify(body)})}function same(a,b){return String(a)===String(b)}function addNew(){const c=C.find(x=>same(x.id,selected));location.href='owner-add-menu.html?category='+encodeURIComponent(c?.name||'')+'&v='+Date.now()}function choose(id){selected=id;render(true)}function render(scrollTop=false){const q=($('search').value||'').toLowerCase().trim();const cats=C.filter(c=>P.some(p=>same(p.category_id,c.id)));if(selected==null||!cats.some(c=>same(c.id,selected)))selected=cats[0]?.id??null;$('cats').innerHTML='';cats.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='cat'+(same(c.id,selected)?' active':'');b.textContent=c.name+' ('+P.filter(p=>same(p.category_id,c.id)).length+')';b.dataset.categoryId=String(c.id);b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();choose(c.id)});$('cats').appendChild(b)});const list=P.filter(p=>same(p.category_id,selected)&&(!q||(p.name+' '+(p.description||'')).toLowerCase().includes(q)));$('summary').textContent=(cats.find(c=>same(c.id,selected))?.name||'')+' • '+list.length+' menu';$('items').innerHTML=list.length?list.map(p=>'<div class="item">'+(p.image_url?'<img class="thumb" src="'+esc(p.image_url)+'">':'<div class="thumb"></div>')+'<h3>'+esc(p.name)+'</h3><div class="muted">Rp '+Number(p.price||0).toLocaleString('id-ID')+'</div><div class="camera"><label for="cam-'+esc(p.id)+'">📷 Ganti Foto</label><input id="cam-'+esc(p.id)+'" type="file" accept="image/*" capture="environment"></div></div>').join(''):'<div class="muted">Tidak ada menu pada kategori ini.</div>';list.forEach(p=>{const el=$('cam-'+p.id);if(el)el.addEventListener('change',e=>replacePhoto(p.id,e.target.files?.[0]))});if(scrollTop)$('summary').scrollIntoView({behavior:'smooth',block:'nearest'})}async function load(){const pin=$('pin').value.trim();if(!pin){$('msg').innerHTML='<div class="err">Masukkan PIN Owner.</div>';return}sessionStorage.setItem('issho_owner_pin_session',pin);try{$('msg').innerHTML='<div class="muted">⏳ Memuat...</div>';C=await rpc('/rest/v1/rpc/owner_list_categories',{p_owner_pin:pin});P=await req('/rest/v1/products?select=id,category_id,name,description,price,image_url,active&order=name');C=Array.isArray(C)?C:[];P=Array.isArray(P)?P:[];$('msg').innerHTML='<div class="ok">✅ Database tersambung: '+C.length+' kategori, '+P.length+' menu.</div>';selected=null;render()}catch(e){$('msg').innerHTML='<div class="err">Gagal: '+esc(e.message)+'</div>'}}async function replacePhoto(id,file){if(!file)return;try{if(file.size>5*1024*1024)throw Error('Foto maksimal 5 MB.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path='products/'+id+'-'+Date.now()+'.'+ext,r=await fetch(U+'/storage/v1/object/'+B+'/'+path,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':file.type,'x-upsert':'true'},body:file});if(!r.ok)throw Error(await r.text());const url=U+'/storage/v1/object/public/'+B+'/'+path;await req('/rest/v1/products?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({image_url:url})});const p=P.find(x=>same(x.id,id));if(p)p.image_url=url;$('msg').innerHTML='<div class="ok">✅ Foto berhasil diambil/upload dan disimpan ke database.</div>';render()}catch(e){$('msg').innerHTML='<div class="err">Upload foto gagal: '+esc(e.message)+'</div>'}}$('backBtn').addEventListener('click',()=>location.href='owner.html?v='+Date.now());$('loadBtn').addEventListener('click',load);$('addBtn').addEventListener('click',addNew);$('search').addEventListener('input',()=>render());const saved=sessionStorage.getItem('issho_owner_pin_session');if(saved){$('pin').value=saved;load()}</script></body></html>
