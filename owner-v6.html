<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — OWNER</title><style>html,body{margin:0;width:100%;height:100%;background:#0b0b0b}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="owner" src="owner-v3.html?v=20260823-owner-final-categories-reports" title="ISSHO CAFE OWNER"></iframe><script>const f=document.getElementById('owner');const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){const h={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},r=await fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h})),t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'});function catOf(p){const n=String((p.name||'')+' '+(p.description||'')).toLowerCase();if(n.includes('alkohol')||n.includes('alcohol')||n.includes('ice land'))return'Minuman Alkohol -5%';if(n.includes('sachet')||n.includes('abc ')||n.includes('caffino')||n.includes('chocolatos')||n.includes('energen'))return'Minum Sachetan';if(n.includes('kopi')||n.includes('americano')||n.includes('v60')||n.includes('drip')||n.includes('tubruk'))return'Kopi';if(n.includes('nasi orak')||n.includes('orak-arik'))return'Nasi Orak-Arik';if(n.includes('nasi goreng'))return'Nasi Goreng';if(n.includes('seblak'))return'Seblak';if(n.includes('steak ayam'))return'Steak Ayam';if(n.includes('mie')||n.startsWith('mie '))return'Aneka Mie';if(n.includes('dimsum'))return'Aneka Dimsum';if(n.includes('wedang')||n.includes('jahe')||n.includes('uwuh')||n.includes('telang')||n.includes('secang'))return'Wedangan';if(n.startsWith('nasi ')||n.includes(' nasi '))return'Aneka Nasi';if(n.includes('juice')||n.includes('soda')||n.includes('teh')||n.includes('matcha'))return'Aneka Minuman';if(n.includes('sosis')||n.includes('dumpling')||n.includes('bakso')||n.includes('otak-otak')||n.includes('crab'))return'Aneka Bakaran';if(n.includes('snack'))return'Snack';if(n.includes('makanan'))return'Makanan';if(n.includes('minuman'))return'Minuman';return'Aneka Camilan'}function install(){try{const w=f.contentWindow,d=w.document;if(!d)return false;const cats=d.getElementById('cats');if(cats&&!d.getElementById('owner-cat-final-style')){const st=d.createElement('style');st.id='owner-cat-final-style';st.textContent='#cats{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;overflow-y:hidden!important;white-space:nowrap!important;gap:7px!important;padding:8px 4px!important;min-height:50px!important;scroll-behavior:auto!important}#cats button{display:inline-flex!important;flex:0 0 auto!important;white-space:nowrap!important;min-height:38px!important;align-items:center!important;justify-content:center!important}';d.head.appendChild(st);const catsList=['Semua','Kopi','Minuman','Makanan','Snack','Aneka Camilan','Aneka Nasi','Aneka Bakaran','Nasi Goreng','Aneka Mie','Aneka Minuman','Nasi Orak-Arik','Wedangan','Aneka Dimsum','Steak Ayam','Seblak','Minum Sachetan','Minuman Alkohol -5%'];const fn=catOf.toString();try{w.eval('category = '+fn)}catch(e){}const paint=()=>{const cur=w.eval('typeof CAT!=="undefined"?CAT:"Semua"');cats.replaceChildren(...catsList.map(c=>{const b=d.createElement('button');b.textContent=c;b.className=cur===c?'gold':'dark';b.onclick=()=>{w.eval('CAT='+JSON.stringify(c)+';renderProducts()');paint()};return b}))};paint()}
const sec=d.getElementById('reports');if(sec&&!d.getElementById('owner-report-final')){const box=d.createElement('section');box.id='owner-report-final';box.className='card';box.innerHTML='<h2>📊 Rekapan Owner — Harian / Mingguan / Bulanan</h2><div class="muted">Tambahan laporan ini tidak mengubah menu, kategori, stok, order, atau fungsi Owner yang sudah ada.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><input id="rf" type="date"><input id="rt" type="date"></div><div class="actions" style="display:flex;gap:7px;flex-wrap:wrap;margin-top:8px"><button id="rd" class="blue">📅 Harian</button><button id="rw" class="blue">📆 Mingguan</button><button id="rm" class="blue">🗓️ Bulanan</button><button id="rs" class="blue">🔎 Tampilkan</button><button id="rp" class="blue">🖨️ Print Rekapan</button></div><div id="ro" style="margin-top:10px"></div>';sec.parentNode.insertBefore(box,sec.nextSibling);const q=id=>d.getElementById(id);function ranges(k){if(k==='day')return[today(),today()];const now=new Date();if(k==='week'){const a=new Date(now),n=a.getDay()||7;a.setDate(a.getDate()-n+1);const b=new Date(a);b.setDate(b.getDate()+6);return[a.toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'}),b.toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'})]}return[new Date(now.getFullYear(),now.getMonth(),1).toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'}),new Date(now.getFullYear(),now.getMonth()+1,0).toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'})]}async function load(){const from=q('rf').value,to=q('rt').value,p=(q('pin')?.value||'').trim();if(!p||!from||!to)return;try{const orders=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:p})});const ex=await api('/rest/v1/rpc/owner_get_expenses',{method:'POST',body:JSON.stringify({p_owner_pin:p,p_from:from,p_to:to})});const end=new Date(to+'T00:00:00+07:00');end.setDate(end.getDate()+1);const lo=new Date(from+'T00:00:00+07:00').getTime(),hi=end.getTime(),paid=(orders||[]).filter(o=>String(o.payment_status||'').toUpperCase()==='PAID'&&o.created_at&&new Date(o.created_at).getTime()>=lo&&new Date(o.created_at).getTime()<hi),exp=Array.isArray(ex)?ex:[],rev=paid.reduce((s,o)=>s+Number(o.total||0),0),out=exp.reduce((s,e)=>s+Number(e.amount||0),0);q('ro').innerHTML='<div class="stats"><span class="stat">Order: '+paid.length+'</span><span class="stat">Pendapatan: '+money(rev)+'</span><span class="stat">Pengeluaran: '+money(out)+'</span><span class="stat">Laba: '+money(rev-out)+'</span></div><div class="card"><h3>📋 Order Masuk</h3>'+(paid.map(o=>'<div class="item"><b>'+esc(o.order_number)+'</b> • Meja '+esc(o.table_name||'-')+' • '+esc(o.payment_method||'-')+' • '+money(o.total)+'</div>').join('')||'Tidak ada order')+'</div><div class="card"><h3>💸 Pengeluaran</h3>'+(exp.map(e=>'<div class="item"><b>'+esc(e.category||'Operasional')+'</b> — '+money(e.amount)+'<br>Keterangan: <b>'+esc(e.description||'-')+'</b><br>Tanggal: '+esc(e.expense_date||'-')+'</div>').join('')||'Tidak ada pengeluaran')+'</div>'}catch(e){q('ro').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}const set=k=>{const r=ranges(k);q('rf').value=r[0];q('rt').value=r[1];load()};q('rd').onclick=()=>set('day');q('rw').onclick=()=>set('week');q('rm').onclick=()=>set('month');q('rs').onclick=load;q('rp').onclick=()=>w.print();q('rf').value=today();q('rt').value=today()}
return true}catch(e){return false}}let n=0;f.addEventListener('load',()=>{const t=setInterval(()=>{if(install()||++n>160)clearInterval(t)},250)});setInterval(install,1200)</script></body></html>
