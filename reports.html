<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISSHO CAFE - Laporan</title><style>body{font-family:Arial;margin:0;background:#f6f0e7;color:#211d18}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd2c5;border-radius:16px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.stat{padding:16px;border-radius:12px;background:#faf6ef}.gold{background:#b68142;color:white}.dark{background:#171411;color:white}button{border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer}input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;box-sizing:border-box}.err{background:#ffe1de;padding:10px;border-radius:9px}.ok{background:#dff3e5;padding:10px;border-radius:9px}.muted{color:#777;font-size:13px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left}</style></head><body><main class="wrap"><div class="card"><h1>ISSHO CAFE — Laporan Penjualan</h1><p class="muted">Khusus Kasir / Owner. Rekap dapat dilihat per 8 jam atau per hari.</p><input id="pin" type="password" placeholder="PIN Kasir / Owner"><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><select id="period"><option value="8">8 Jam Terakhir</option><option value="24">Hari Ini</option></select><button class="gold" onclick="load()">Tampilkan Laporan</button><a href="staff.html"><button class="dark">Kembali Staff</button></a></div><div id="msg"></div></div><div id="report" class="hidden"></div><div class="card"><h2>Ganti PIN</h2><p class="muted">PIN harus 4–8 angka. PIN lama tidak ditampilkan.</p><input id="old" type="password" placeholder="PIN lama"><br><br><input id="newp" type="password" placeholder="PIN baru"><br><br><button class="gold" onclick="changePin()">Simpan PIN Baru</button><div id="pinmsg"></div></div></main><script>const URL='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',$=x=>document.getElementById(x),money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);async function api(path,opt={}){const r=await fetch(URL+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',...(opt.headers||{})}}),t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}async function load(){try{const p=$('pin').value.trim(),h=Number($('period').value),to=new Date(),from=new Date(Date.now()-h*3600000),r=await api('/rest/v1/rpc/staff_sales_report',{method:'POST',body:JSON.stringify({p_pin:p,p_from:from.toISOString(),p_to:to.toISOString()})});$('report').className='card';$('report').innerHTML='<div class="grid"><div class="stat"><b>Total Penjualan</b><h2>'+money(r.revenue)+'</h2></div><div class="stat"><b>Jumlah Order</b><h2>'+r.orders+'</h2></div><div class="stat"><b>Tunai</b><h2>'+money(r.cash)+'</h2></div><div class="stat"><b>QRIS</b><h2>'+money(r.qris)+'</h2></div><div class="stat"><b>Item Terjual</b><h2>'+r.items_sold+'</h2></div></div><h2>Menu Favorit</h2><table><tr><th>Menu</th><th>Terjual</th><th>Pendapatan</th></tr>'+((r.favorite_menus||[]).map(x=>'<tr><td>'+x.name+'</td><td>'+x.qty+'</td><td>'+money(x.revenue)+'</td></tr>').join('')||'<tr><td colspan="3">Belum ada penjualan.</td></tr>')+'</table>'}catch(e){$('msg').innerHTML='<div class="err">'+e.message+'</div>'}}async function changePin(){try{const r=await api('/rest/v1/rpc/staff_change_pin',{method:'POST',body:JSON.stringify({p_pin:$('old').value.trim(),p_new_pin:$('newp').value.trim()})});$('pinmsg').className='ok';$('pinmsg').textContent='PIN '+r.role+' berhasil diganti.';$('old').value='';$('newp').value=''}catch(e){$('pinmsg').className='err';$('pinmsg').textContent=e.message}}</script></body></html>
