<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — KASIR WP58D</title><style>html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial}#kasir{width:100%;height:100%;border:0;display:block}#bridge{position:fixed;right:12px;top:12px;z-index:99999;background:#151515;border:1px solid #444;border-radius:12px;padding:10px;box-shadow:0 4px 18px #0008;max-width:420px}#bridge button{border:0;border-radius:8px;padding:9px 11px;margin:2px;font-weight:800;background:#1687f7;color:white}#bridge button.gold{background:#d08a24}#bridge button.red{background:#b83a32}#bridge button.chrome{background:#1f8b4c}#bridge small{display:block;margin-top:6px;color:#ddd;line-height:1.35}.ok{color:#9cff9c}.err{color:#ff8b8b}.diag{font-size:12px;white-space:pre-wrap;line-height:1.35;max-height:220px;overflow:auto;margin-top:8px;color:#ddd}</style></head><body><div id="bridge"><button id="bt">📶 Hubungkan WP58D</button><button id="test" class="gold">🧾 Test Print</button><button id="diag" class="red">🔎 Cek Browser/Printer</button><button id="chrome" class="chrome" style="display:none">🌐 Buka dengan Google Chrome</button><small id="st">WP58D • Bluetooth Classic/SPP • ESC/POS 58mm</small><div id="dg" class="diag"></div></div><iframe id="kasir" src="staff-v6.html?v=20260825-wp58d-final-v3" title="ISSHO CAFE KASIR"></iframe><script>
const f=document.getElementById('kasir'),st=document.getElementById('st'),dg=document.getElementById('dg'),chromeBtn=document.getElementById('chrome');let port=null,writer=null;
const SPP='00001101-0000-1000-8000-00805f9b34fb';
const E=s=>new TextEncoder().encode(String(s).replace(/[^\\x00-\\xFF]/g,'')),L=s=>[...E(s),10],U=a=>new Uint8Array(a);
const C={init:[27,64],center:[27,97,1],left:[27,97,0],bold:[27,69,1],normal:[27,69,0],cut:[29,86,0]};
function isSamsung(){return /SamsungBrowser/i.test(navigator.userAgent||'')}
function browserName(){const ua=navigator.userAgent||'';if(/SamsungBrowser/i.test(ua))return'Samsung Internet';if(/Edg\\//i.test(ua))return'Edge';if(/Chrome\\//i.test(ua))return'Google Chrome';return'Browser lain'}
function openChrome(){const target=location.href;const intent='intent://'+target.replace(/^https?:\\/\\//,'')+'#Intent;scheme=https;package=com.android.chrome;end';try{location.href=intent}catch(_){try{location.href='googlechrome://navigate?url='+encodeURIComponent(target)}catch(__){}}}
function status(msg,bad=false){st.textContent=msg;st.className=bad?'err':'ok';try{const d=f.contentWindow?.document,s=d?.getElementById('wp58dStatus');if(s){s.textContent=msg;s.className=bad?'err':'ok'}}catch(_){} }
async function diagnose(){const ua=navigator.userAgent||'';let ports=[];let lines=[];lines.push('Browser: '+browserName());lines.push('HTTPS: '+(location.protocol==='https:'?'YA':'TIDAK'));lines.push('Web Serial: '+(('serial' in navigator)?'TERSEDIA':'TIDAK TERSEDIA'));lines.push('User-Agent: '+ua);if(isSamsung()){chromeBtn.style.display='inline-block';lines.push('KESIMPULAN: Samsung Internet tidak menyediakan Web Serial untuk printer Bluetooth Classic/SPP.');lines.push('SOLUSI: tekan "🌐 Buka dengan Google Chrome".');}else{chromeBtn.style.display='none'}if('serial' in navigator){try{ports=await navigator.serial.getPorts();lines.push('Port yang sudah diberi izin: '+ports.length);ports.forEach((p,i)=>{const x=p.getInfo?.()||{};lines.push('Port '+(i+1)+': bluetoothServiceClassId='+(x.bluetoothServiceClassId||'-')+' usbVendorId='+(x.usbVendorId||'-'))})}catch(e){lines.push('getPorts error: '+e.message)}}if(!isSamsung()&&!('serial'in navigator)){lines.push('KESIMPULAN: browser ini tidak menyediakan Web Serial.');lines.push('SOLUSI: gunakan Google Chrome Android terbaru.')}else if(!isSamsung()){lines.push('KESIMPULAN: Web Serial tersedia. Tekan Hubungkan WP58D dan pilih printer.')}dg.textContent=lines.join('\\n');return lines}
function printerData(o,k){let a=[...C.init,...C.center,...C.bold,...E('ISSHO CAFE'),10,...C.normal,...E(k==='k'?'NOTA DAPUR':'TANDA TERIMA PELANGGAN'),10,...C.left,...L('--------------------------------')];a.push(...L('Order : '+(o.order_number||'-')),...L('Meja  : '+(o.table_name||'Take Away')));if(k!=='k')a.push(...L('Bayar : '+(o.payment_method||'-')));a.push(...L('--------------------------------'));for(const i of(o.items||[])){const n=String(i.name||''),q=Number(i.qty||0),p=k==='k'?'':new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(i.price||0)*q);let x=n;while(x.length>25){a.push(...L(x.slice(0,25)));x=x.slice(25)}a.push(...L(x+' x'+q+(p?' '+p:'')))}a.push(...L('--------------------------------'));if(k!=='k')a.push(...C.bold,...L('TOTAL'),...C.normal,...L(new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(o.total)||0)),...C.center,...L('Terima kasih'),...C.left);else a.push(...C.center,...C.bold,...L('SEGERA DIPROSES'),...C.normal,...C.left);return U([...a,...L(''),...L(''),...C.cut])}
async function selectPrinter(){if(!('serial'in navigator))throw Error('Web Serial tidak tersedia di '+browserName()+'. Gunakan Google Chrome Android terbaru.');if(isSamsung())throw Error('Samsung Internet tidak dapat mencetak WP58D Bluetooth Classic. Tekan "Buka dengan Google Chrome".');try{const saved=await navigator.serial.getPorts();if(saved.length){const connected=saved.find(p=>p.connected);port=connected||saved[0]}}catch(_){}if(!port){try{port=await navigator.serial.requestPort({filters:[]})}catch(e){if(e?.name==='NotFoundError')throw Error('Dialog pemilihan printer dibatalkan/tidak menampilkan printer. Pastikan WP58D ON dan sudah PAIR di Bluetooth Android, lalu pilih WP58D.');throw e}}return port}
async function connectPrinter(){const p=await selectPrinter();try{if(p.readable||p.writable){try{if(p.writable)writer=p.writable.getWriter()}catch(_){}if(!writer&&p.readable){try{p.readable.cancel()}catch(_){}}}if(!p.readable&&!p.writable)await p.open({baudRate:9600,dataBits:8,stopBits:1,parity:'none',flowControl:'none'});if(!p.writable)throw Error('Port WP58D terbuka tetapi jalur tulis tidak tersedia.');port=p;writer=p.writable.getWriter();const info=p.getInfo?.()||{};status('✓ WP58D tersambung. SPP/RFCOMM '+(info.bluetoothServiceClassId||'terdeteksi'));await diagnose();return true}catch(e){port=null;writer=null;throw Error('WP58D dipilih tetapi gagal dibuka: '+e.message)}}
async function send(data){if(!writer)await connectPrinter();for(let i=0;i<data.length;i+=256)await writer.write(data.slice(i,i+256))}
async function testPrint(){await send(U([...C.init,...C.center,...C.bold,...E('ISSHO CAFE'),10,...C.normal,...E('TEST PRINT WP58D'),10,...E('WP58D USB + BLUETOOTH'),10,...E('ESC/POS 58mm'),10,...L('--------------------------------'),...L('PRINTER SIAP'),...L(''),...L(''),...C.cut]));status('✓ TEST PRINT WP58D BERHASIL');}
async function printOrder(id,k){const w=f.contentWindow,o=(w.ORD||[]).find(x=>x.id===id);if(!o)return;try{await send(printerData(o,k));status('✓ Nota '+(k==='k'?'dapur':'pelanggan')+' tercetak ke WP58D.')}catch(e){status('Gagal print WP58D: '+e.message,true)}}
function addPanel(){try{const w=f.contentWindow,d=w.document,app=d.getElementById('app');if(!app)return false;let p=d.getElementById('wp58d-panel');if(!p){p=d.createElement('div');p.id='wp58d-panel';p.className='card noprint';app.insertBefore(p,app.children[1]||null)}p.innerHTML='<h3 style="margin-top:0">🖨️ Printer Thermal WP58D — 58mm</h3><div class="muted">Model sesuai label mesin: <b>WP58D</b> • USB + Bluetooth • 58mm • ESC/POS. Bluetooth Android membutuhkan Google Chrome dengan Web Serial + Bluetooth RFCOMM.</div><div class="actions"><button class="blue" id="wpConnect">📶 Hubungkan WP58D</button><button class="gold" id="wpTest">🧾 Test Print</button><button class="red" id="wpDiag">🔎 Cek Browser/Printer</button><button class="blue" id="wpChrome" style="display:none">🌐 Buka dengan Google Chrome</button></div><div id="wp58dStatus" class="muted" style="margin-top:8px">Belum terhubung.</div>';d.getElementById('wpConnect').onclick=async()=>{try{await connectPrinter()}catch(e){status(e.message,true)}};d.getElementById('wpTest').onclick=async()=>{try{await testPrint()}catch(e){status('Test print gagal: '+e.message,true)}};d.getElementById('wpDiag').onclick=async()=>{try{await diagnose()}catch(e){status('Diagnosa gagal: '+e.message,true)}};const wc=d.getElementById('wpChrome');if(isSamsung()){wc.style.display='inline-block';wc.onclick=openChrome}if(!w.__wp58d_direct_v3){w.printCustomer=id=>printOrder(id,'c');w.printKitchen=id=>printOrder(id,'k');w.__wp58d_direct_v3=true}return true}catch(e){return false}}
let n=0;f.addEventListener('load',()=>{const t=setInterval(()=>{if(addPanel()||++n>160)clearInterval(t)},250)});setInterval(addPanel,1000);
document.getElementById('bt').onclick=()=>connectPrinter().catch(e=>status(e.message,true));document.getElementById('test').onclick=()=>testPrint().catch(e=>status('Test print gagal: '+e.message,true));document.getElementById('diag').onclick=()=>diagnose();chromeBtn.onclick=openChrome;
diagnose();
</script></body></html>
