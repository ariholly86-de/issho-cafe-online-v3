<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — KASIR</title><style>html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial}#kasir{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="kasir" src="staff-v6.html?v=20260825-wp58d-final-v1" title="ISSHO CAFE KASIR"></iframe><script>
const f=document.getElementById('kasir');let port=null,writer=null;const SPP='00001101-0000-1000-8000-00805f9b34fb';const E=s=>new TextEncoder().encode(String(s).replace(/[^\x00-\xFF]/g,''));const L=s=>[...E(s),10];const U=a=>new Uint8Array(a);const C={init:[27,64],center:[27,97,1],left:[27,97,0],bold:[27,69,1],normal:[27,69,0],cut:[29,86,0]};
function status(msg,bad=false){const d=f.contentWindow?.document,s=d?.getElementById('wp58dStatus');if(s){s.textContent=msg;s.className=bad?'err':'ok'}}
function printerData(o,k){let a=[...C.init,...C.center,...C.bold,...E('ISSHO CAFE'),10,...C.normal,...E(k==='k'?'NOTA DAPUR':'TANDA TERIMA PELANGGAN'),10,...C.left,...L('--------------------------------')];a.push(...L('Order : '+(o.order_number||'-')),...L('Meja  : '+(o.table_name||'Take Away')));if(k!=='k')a.push(...L('Bayar : '+(o.payment_method||'-')));a.push(...L('--------------------------------'));for(const i of(o.items||[])){const n=String(i.name||''),q=Number(i.qty||0),p=k==='k'?'':new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(i.price||0)*q);let x=n;while(x.length>25){a.push(...L(x.slice(0,25)));x=x.slice(25)}a.push(...L(x+' x'+q+(p?' '+p:'')))}a.push(...L('--------------------------------'));if(k!=='k')a.push(...C.bold,...L('TOTAL'),...C.normal,...L(new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(o.total)||0)),...C.center,...L('Terima kasih'),...C.left);else a.push(...C.center,...C.bold,...L('SEGERA DIPROSES'),...C.normal,...C.left);return U([...a,...L(''),...L(''),...C.cut])}
async function connectPrinter(){if(!('serial'in navigator))throw Error('Web Serial tidak tersedia. Gunakan Chrome terbaru.');try{const saved=await navigator.serial.getPorts();if(saved.length){const bt=saved.find(p=>{const x=p.getInfo?.()||{};return String(x.bluetoothServiceClassId||'').toLowerCase().includes('1101')});port=bt||saved[0]}}catch(_){}if(!port){try{port=await navigator.serial.requestPort({filters:[{bluetoothServiceClassId:SPP}]})}catch(e){try{port=await navigator.serial.requestPort()}catch(e2){if(e2?.name==='NotFoundError')throw Error('Tidak ada printer dipilih. Pair WP58D terlebih dahulu di Bluetooth Android, lalu pilih WP58D pada dialog.');throw e2}}}try{if(!port.readable&&!port.writable)await port.open({baudRate:9600,dataBits:8,stopBits:1,parity:'none',flowControl:'none'});if(!port.writable)throw Error('Port terbuka tetapi tidak memiliki jalur tulis.');writer=port.writable.getWriter();const info=port.getInfo?.()||{};status('✓ WP58D tersambung. Bluetooth SPP/RFCOMM '+(info.bluetoothServiceClassId||'terdeteksi'));return true}catch(e){port=null;writer=null;throw Error('WP58D dipilih tetapi gagal dibuka: '+e.message)}}
async function send(data){if(!writer)await connectPrinter();for(let i=0;i<data.length;i+=256)await writer.write(data.slice(i,i+256))}
async function testPrint(){await send(U([...C.init,...C.center,...C.bold,...E('ISSHO CAFE'),10,...C.normal,...E('TEST PRINT WP58D'),10,...E('WP58D USB + BLUETOOTH'),10,...E('ESC/POS 58mm'),10,...L('--------------------------------'),...L('PRINTER SIAP'),...L(''),...L(''),...C.cut]));status('✓ Test print WP58D berhasil.')}
async function printOrder(id,k){const w=f.contentWindow,o=(w.ORD||[]).find(x=>x.id===id);if(!o)return;try{await send(printerData(o,k));status('✓ Nota '+(k==='k'?'dapur':'pelanggan')+' tercetak ke WP58D.')}catch(e){status('Gagal print WP58D: '+e.message,true)}}
function addPanel(){try{const w=f.contentWindow,d=w.document,app=d.getElementById('app');if(!app)return false;let p=d.getElementById('wp58d-panel');if(!p){p=d.createElement('div');p.id='wp58d-panel';p.className='card noprint';app.insertBefore(p,app.children[1]||null)}p.innerHTML='<h3 style="margin-top:0">🖨️ Printer Thermal WP58D — 58mm</h3><div class="muted">Model sesuai label mesin: <b>WP58D</b> • USB + Bluetooth • 58mm • ESC/POS. Untuk Bluetooth Android gunakan Bluetooth Classic/SPP melalui Web Serial. Untuk USB gunakan USB/COM bila perangkat mengekspos serial.</div><div class="actions"><button class="blue" id="wpConnect">📶 Hubungkan WP58D</button><button class="gold" id="wpTest">🧾 Test Print</button></div><div id="wp58dStatus" class="muted" style="margin-top:8px">Belum terhubung. Pair WP58D di Bluetooth Android terlebih dahulu.</div>';d.getElementById('wpConnect').onclick=async()=>{try{await connectPrinter()}catch(e){status(e.message,true)}};d.getElementById('wpTest').onclick=async()=>{try{await testPrint()}catch(e){status('Test print gagal: '+e.message,true)}};if(!w.__wp58d_direct_v1){w.printCustomer=id=>printOrder(id,'c');w.printKitchen=id=>printOrder(id,'k');w.__wp58d_direct_v1=true}return true}catch(e){return false}}
let n=0;f.addEventListener('load',()=>{const t=setInterval(()=>{if(addPanel()||++n>160)clearInterval(t)},250)});setInterval(addPanel,1000);
</script></body></html>
