<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — KASIR WP58D</title><style>html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial}#kasir{width:100%;height:100%;border:0;display:block}#bridge{position:fixed;right:10px;top:10px;z-index:2147483647;background:#151515;border:1px solid #555;border-radius:12px;padding:10px;box-shadow:0 4px 18px #0008;max-width:430px;box-sizing:border-box}#bridge button{border:0;border-radius:8px;padding:10px 12px;margin:2px;font-weight:800;cursor:pointer;touch-action:manipulation;position:relative;z-index:2147483647}#bt{background:#1687f7;color:white}#test{background:#d08a24;color:white}#diag{background:#b83a32;color:white}#chrome{background:#1f8b4c;color:white}.busy{opacity:.65;cursor:wait!important}.ok{color:#9cff9c}.err{color:#ff8b8b}.diag{font-size:12px;white-space:pre-wrap;line-height:1.35;max-height:240px;overflow:auto;margin-top:8px;color:#ddd}</style></head><body><div id="bridge"><button type="button" id="bt">📶 Hubungkan WP58D</button><button type="button" id="test">🧾 Test Print</button><button type="button" id="diag">🔎 Periksa Browser/Printer</button><button type="button" id="chrome" style="display:none">🌐 Buka Google Chrome</button><small id="st">WP58D • Bluetooth Classic/SPP • ESC/POS 58mm</small><div id="dg" class="diag">Menyiapkan pemeriksaan…</div></div><iframe id="kasir" src="staff-v6.html?v=20260825-wp58d-final-v5" title="ISSHO CAFE KASIR"></iframe><script>
const f=document.getElementById('kasir'),st=document.getElementById('st'),dg=document.getElementById('dg'),chromeBtn=document.getElementById('chrome');let port=null,writer=null,diagBusy=false;
const SPP='00001101-0000-1000-8000-00805f9b34fb';
const E=s=>new TextEncoder().encode(String(s).replace(/[^\x00-\xFF]/g,'')),L=s=>[...E(s),10],U=a=>new Uint8Array(a),C={init:[27,64],center:[27,97,1],left:[27,97,0],bold:[27,69,1],normal:[27,69,0],cut:[29,86,0]};
function isSamsung(){return /SamsungBrowser/i.test(navigator.userAgent||'')}
function browserName(){const ua=navigator.userAgent||'';if(isSamsung())return'Samsung Internet';if(/Edg\//i.test(ua))return'Edge';if(/Chrome\//i.test(ua))return'Google Chrome';return'Browser lain'}
function setStatus(text,bad=false){st.textContent=text;st.className=bad?'err':'ok';try{const s=f.contentWindow?.document?.getElementById('wp58dStatus');if(s){s.textContent=text;s.className=bad?'err':'ok'}}catch(_){} }
function setBusy(btn,busy){if(!btn)return;btn.classList.toggle('busy',busy);btn.disabled=busy}
function openChrome(){const target=location.href;const clean=target.replace(/^https?:\/\//i,'');location.href='intent://'+clean+'#Intent;scheme=https;package=com.android.chrome;end'}
async function diagnose(){if(diagBusy)return;diagBusy=true;dg.textContent='Memeriksa…';try{const lines=[];const serial=('serial'in navigator);lines.push('Browser: '+browserName());lines.push('HTTPS: '+(location.protocol==='https:'?'YA':'TIDAK'));lines.push('Web Serial: '+(serial?'TERSEDIA':'TIDAK TERSEDIA'));if(isSamsung()){chromeBtn.style.display='inline-block';lines.push('STATUS: Samsung Internet tidak cocok untuk koneksi WP58D Bluetooth Classic.');lines.push('SOLUSI: buka halaman ini di Google Chrome Android terbaru.')}else if(serial){lines.push('STATUS: Web Serial tersedia.');lines.push('Pastikan WP58D sudah PAIR di Bluetooth Android.')}else{lines.push('STATUS: Web Serial tidak tersedia pada browser ini.')}if(serial){try{const ports=await Promise.race([navigator.serial.getPorts(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),5000))]);lines.push('Port yang sudah diberi izin: '+ports.length);ports.forEach((p,i)=>{const x=p.getInfo?.()||{};lines.push('Port '+(i+1)+': SPP='+(x.bluetoothServiceClassId||'-')+' VID='+(x.usbVendorId||'-')+' PID='+(x.usbProductId||'-'))})}catch(e){lines.push('Pemeriksaan port: '+e.message)}}dg.textContent=lines.join('\n');try{const q=f.contentWindow?.document?.getElementById('wp58dDiag');if(q)q.textContent=lines.join('\n')}catch(_){}return lines}finally{diagBusy=false}}
async function selectPrinter(){if(!('serial'in navigator))throw Error('Web Serial tidak tersedia di '+browserName()+'. Gunakan Google Chrome Android terbaru.');if(isSamsung())throw Error('Samsung Internet tidak dapat digunakan untuk WP58D Bluetooth Classic. Tekan Buka Google Chrome.');try{const saved=await navigator.serial.getPorts();if(saved.length){port=saved[0];return port}}catch(_){}try{port=await navigator.serial.requestPort({filters:[{bluetoothServiceClassId:SPP}]})}catch(e){if(e?.name==='NotFoundError')throw Error('Tidak ada printer yang dipilih. Pastikan WP58D ON, sudah PAIR di Bluetooth, lalu pilih WP58D pada dialog Chrome.');try{port=await navigator.serial.requestPort({filters:[]})}catch(e2){if(e2?.name==='NotFoundError')throw Error('Tidak ada printer yang dipilih. Pastikan WP58D ON dan sudah PAIR, lalu pilih WP58D pada dialog Chrome.');throw e2}}return port}
async function connectPrinter(){const p=await selectPrinter();try{if(p.readable||p.writable){try{if(p.readable)p.readable.cancel()}catch(_){}try{if(p.writable)await p.writable.close()}catch(_){} }await p.open({baudRate:9600,dataBits:8,stopBits:1,parity:'none',flowControl:'none'});if(!p.writable)throw Error('Port WP58D terbuka tetapi jalur tulis tidak tersedia.');port=p;writer=p.writable.getWriter();const x=p.getInfo?.()||{};setStatus('✓ WP58D TERSAMBUNG • SPP '+(x.bluetoothServiceClassId?'OK':'PORT OK'));await diagnose();return true}catch(e){port=null;writer=null;throw Error('WP58D dipilih tetapi gagal dibuka: '+e.message)}}
async function send(data){if(!writer)await connectPrinter();if(!writer)throw Error('Printer belum tersambung.');for(let i=0;i<data.length;i+=256)await writer.write(data.slice(i,i+256))}
async function testPrint(){await send(U([...C.init,...C.center,...C.bold,...E('ISSHO CAFE'),10,...C.normal,...E('TEST PRINT WP58D'),10,...E('BLUETOOTH CLASSIC / SPP'),10,...E('ESC/POS 58mm'),10,...L('--------------------------------'),...L('PRINTER SIAP'),...L('Koneksi aplikasi BERHASIL'),...L(''),...L(''),...C.cut]));setStatus('✓ TEST PRINT WP58D BERHASIL')}
function printerData(o,k){let a=[...C.init,...C.center,...C.bold,...E('ISSHO CAFE'),10,...C.normal,...E(k==='k'?'NOTA DAPUR':'TANDA TERIMA PELANGGAN'),10,...C.left,...L('--------------------------------'),...L('Order : '+(o.order_number||'-')),...L('Meja  : '+(o.table_name||'Take Away'))];for(const i of(o.items||[]))a.push(...L(String(i.name||'')+' x'+Number(i.qty||0)));a.push(...L('--------------------------------'));if(k!=='k')a.push(...C.bold,...L('TOTAL'),...C.normal,...L(String(o.total||0)),...C.center,...L('Terima kasih'));else a.push(...C.center,...C.bold,...L('SEGERA DIPROSES'),...C.normal);return U([...a,...L(''),...C.cut])}
async function printOrder(id,k){try{const w=f.contentWindow,o=(w.ORD||[]).find(x=>x.id===id);if(!o)throw Error('Pesanan tidak ditemukan. Tekan Refresh Pesanan.');await send(printerData(o,k));setStatus('✓ Nota '+(k==='k'?'dapur':'pelanggan')+' tercetak ke WP58D')}catch(e){setStatus('Gagal print WP58D: '+e.message,true)}}
function addPanel(){try{const w=f.contentWindow,d=w.document,app=d.getElementById('app');if(!app)return false;let p=d.getElementById('wp58d-panel');if(!p){p=d.createElement('div');p.id='wp58d-panel';p.className='card noprint';app.insertBefore(p,app.children[1]||null)}p.innerHTML='<h3>🖨️ Printer Thermal WP58D — 58mm</h3><div class="muted">WP58D • USB + Bluetooth • ESC/POS 58mm</div><div class="actions"><button type="button" class="blue" id="wpConnect">📶 Hubungkan WP58D</button><button type="button" class="gold" id="wpTest">🧾 Test Print</button><button type="button" class="red" id="wpDiag">🔎 Periksa Browser/Printer</button></div><div id="wp58dStatus" class="muted" style="margin-top:8px">Belum terhubung.</div><pre id="wp58dDiag" class="muted" style="white-space:pre-wrap"></pre>';d.getElementById('wpConnect').onclick=()=>connectPrinter().catch(e=>setStatus(e.message,true));d.getElementById('wpTest').onclick=()=>testPrint().catch(e=>setStatus('Test print gagal: '+e.message,true));d.getElementById('wpDiag').onclick=()=>diagnose().catch(e=>setStatus('Periksa gagal: '+e.message,true));if(!w.__wp58d_direct_v5){w.printCustomer=id=>printOrder(id,'c');w.printKitchen=id=>printOrder(id,'k');w.__wp58d_direct_v5=true}return true}catch(e){return false}}
const bt=document.getElementById('bt'),test=document.getElementById('test'),diag=document.getElementById('diag');bt.onclick=async e=>{e.preventDefault();setBusy(bt,true);try{await connectPrinter()}catch(err){setStatus(err.message,true)}finally{setBusy(bt,false)}};test.onclick=async e=>{e.preventDefault();setBusy(test,true);try{await testPrint()}catch(err){setStatus('Test print gagal: '+err.message,true)}finally{setBusy(test,false)}};diag.onclick=async e=>{e.preventDefault();setBusy(diag,true);try{await diagnose()}catch(err){setStatus('Periksa gagal: '+err.message,true)}finally{setBusy(diag,false)}};chromeBtn.onclick=e=>{e.preventDefault();openChrome()};
(async()=>{try{await diagnose()}catch(e){dg.textContent='Pemeriksaan gagal: '+e.message}})();let n=0;f.addEventListener('load',()=>{const t=setInterval(()=>{if(addPanel()||++n>160)clearInterval(t)},250)});setInterval(addPanel,1000);
</script></body></html>
