<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — KASIR WP58D</title><style>html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial}#kasir{width:100%;height:100%;border:0;display:block}#bridge{position:fixed;right:10px;top:10px;z-index:2147483647;background:#151515;border:1px solid #555;border-radius:12px;padding:10px;box-shadow:0 4px 18px #0008;max-width:430px;box-sizing:border-box}#bridge button{border:0;border-radius:8px;padding:10px 12px;margin:2px;font-weight:800;cursor:pointer;touch-action:manipulation;position:relative;z-index:2147483647}#bt{background:#1687f7;color:white}#test{background:#d08a24;color:white}#diag{background:#b83a32;color:white}#chrome{background:#1f8b4c;color:white}#bridge small{display:block;margin-top:6px;color:#ddd;line-height:1.35}.ok{color:#9cff9c}.err{color:#ff8b8b}.diag{font-size:12px;white-space:pre-wrap;line-height:1.35;max-height:240px;overflow:auto;margin-top:8px;color:#ddd}</style></head><body><div id="bridge"><button type="button" id="bt">📶 Hubungkan WP58D</button><button type="button" id="test">🧾 Test Print</button><button type="button" id="diag">🔎 Periksa Browser/Printer</button><button type="button" id="chrome" style="display:none">🌐 Buka Google Chrome</button><small id="st">WP58D • Bluetooth Classic/SPP • ESC/POS 58mm</small><div id="dg" class="diag">Pemeriksaan otomatis sedang berjalan…</div></div><iframe id="kasir" src="staff-v6.html?v=20260825-wp58d-final-v4" title="ISSHO CAFE KASIR"></iframe><script>
const f=document.getElementById('kasir'),st=document.getElementById('st'),dg=document.getElementById('dg'),chromeBtn=document.getElementById('chrome');let port=null,writer=null;
const E=s=>new TextEncoder().encode(String(s).replace(/[^\\x00-\\xFF]/g,'')),L=s=>[...E(s),10],U=a=>new Uint8Array(a),C={init:[27,64],center:[27,97,1],left:[27,97,0],bold:[27,69,1],normal:[27,69,0],cut:[29,86,0]};
function isSamsung(){return /SamsungBrowser/i.test(navigator.userAgent||'')}function browserName(){const ua=navigator.userAgent||'';if(isSamsung())return'Samsung Internet';if(/Edg\\//i.test(ua))return'Edge';if(/Chrome\\//i.test(ua))return'Google Chrome';return'Browser lain'}function openChrome(){const target=location.href;location.href='intent://'+target.replace(/^https?:\\/\\//,'')+'#Intent;scheme=https;package=com.android.chrome;end'}function status(msg,bad=false){st.textContent=msg;st.className=bad?'err':'ok';try{const s=f.contentWindow?.document?.getElementById('wp58dStatus');if(s){s.textContent=msg;s.className=bad?'err':'ok'}}catch(_){} }
async function diagnose(){let lines=[];lines.push('Browser: '+browserName());lines.push('HTTPS: '+(location.protocol==='https:'?'YA':'TIDAK'));lines.push('Web Serial: '+(('serial'in navigator)?'TERSEDIA':'TIDAK TERSEDIA'));lines.push('User-Agent: '+navigator.userAgent);if(isSamsung()){chromeBtn.style.display='inline-block';lines.push('STATUS: Samsung Internet terdeteksi.');lines.push('SOLUSI: gunakan Google Chrome Android terbaru untuk WP58D Bluetooth Classic.')}else if('serial'in navigator)lines.push('STATUS: Web Serial siap digunakan.');if('serial'in navigator){try{const ports=await navigator.serial.getPorts();lines.push('Port yang sudah diberi izin: '+ports.length);ports.forEach((p,i)=>{const x=p.getInfo?.()||{};lines.push('Port '+(i+1)+': Bluetooth SPP='+(x.bluetoothServiceClassId||'-')+' USB VID='+(x.usbVendorId||'-'))})}catch(e){lines.push('getPorts error: '+e.message)}}dg.textContent=lines.join('\n');try{const q=f.contentWindow?.document?.getElementById('wp58dDiag');if(q)q.textContent=lines.join('\n')}catch(_){}return lines}
async function selectPrinter(){if(!('serial'in navigator))throw Error('Web Serial tidak tersedia di '+browserName()+'. Gunakan Google Chrome Android terbaru.');if(isSamsung())throw Error('Samsung Internet tidak dapat digunakan untuk WP58D Bluetooth Classic. Tekan Buka Google Chrome.');try{const saved=await navigator.serial.getPorts();if(saved.length)port=saved[0]}catch(_){}if(!port){try{port=await navigator.serial.requestPort({filters:[]})}catch(e){if(e?.name==='NotFoundError')throw Error('Pemilihan printer dibatalkan. Pastikan WP58D ON dan sudah PAIR, lalu pilih WP58D pada dialog Chrome.');throw e}}return port}
async function connectPrinter(){const p=await selectPrinter();try{if(!p.readable&&!p.writable)await p.open({baudRate:9600,dataBits:8,stopBits:1,parity:'none',flowControl:'none'});if(!p.writable)throw Error('WP58D terbuka tetapi jalur tulis tidak tersedia.');port=p;writer=p.writable.getWriter();const x=p.getInfo?.()||{};status('✓ WP58D TERSAMBUNG • SPP '+(x.bluetoothServiceClassId||'OK'));await diagnose();return true}catch(e){port=null;writer=null;throw Error('WP58D gagal dibuka: '+e.message)}}
async function send(data){if(!writer)await connectPrinter();for(let i=0;i<data.length;i+=256)await writer.write(data.slice(i,i+256))}async function testPrint(){await send(U([...C.init,...C.center,...C.bold,...E('ISSHO CAFE'),10,...C.normal,...E('TEST PRINT WP58D'),10,...E('BLUETOOTH CLASSIC / SPP'),10,...E('ESC/POS 58mm'),10,...L('--------------------------------'),...L('PRINTER SIAP'),...L(''),...L(''),...C.cut]));status('✓ TEST PRINT WP58D BERHASIL')}
function printerData(o,k){let a=[...C.init,...C.center,...C.bold,...E('ISSHO CAFE'),10,...C.normal,...E(k==='k'?'NOTA DAPUR':'TANDA TERIMA PELANGGAN'),10,...C.left,...L('--------------------------------'),...L('Order : '+(o.order_number||'-')),...L('Meja  : '+(o.table_name||'Take Away'))];for(const i of(o.items||[]))a.push(...L(String(i.name||'')+' x'+Number(i.qty||0)));a.push(...L('--------------------------------'));if(k!=='k')a.push(...C.bold,...L('TOTAL'),...C.normal,...L(String(o.total||0)),...C.center,...L('Terima kasih'));else a.push(...C.center,...C.bold,...L('SEGERA DIPROSES'),...C.normal);return U([...a,...L(''),...C.cut])}async function printOrder(id,k){const w=f.contentWindow,o=(w.ORD||[]).find(x=>x.id===id);if(!o)return;try{await send(printerData(o,k));status('✓ Nota '+(k==='k'?'dapur':'pelanggan')+' tercetak ke WP58D')}catch(e){status('Gagal print WP58D: '+e.message,true)}}
function addPanel(){try{const w=f.contentWindow,d=w.document,app=d.getElementById('app');if(!app)return false;let p=d.getElementById('wp58d-panel');if(!p){p=d.createElement('div');p.id='wp58d-panel';p.className='card noprint';app.insertBefore(p,app.children[1]||null)}p.innerHTML='<h3>🖨️ Printer Thermal WP58D — 58mm</h3><div class="muted">WP58D • USB + Bluetooth • ESC/POS 58mm</div><div class="actions"><button type="button" class="blue" id="wpConnect">📶 Hubungkan WP58D</button><button type="button" class="gold" id="wpTest">🧾 Test Print</button><button type="button" class="red" id="wpDiag">🔎 Periksa Browser/Printer</button></div><div id="wp58dStatus" class="muted" style="margin-top:8px">Belum terhubung.</div><pre id="wp58dDiag" class="muted" style="white-space:pre-wrap"></pre>';d.getElementById('wpConnect').onclick=()=>connectPrinter().catch(e=>status(e.message,true));d.getElementById('wpTest').onclick=()=>testPrint().catch(e=>status('Test print gagal: '+e.message,true));d.getElementById('wpDiag').onclick=()=>diagnose().catch(e=>status('Periksa gagal: '+e.message,true));if(!w.__wp58d_direct_v4){w.printCustomer=id=>printOrder(id,'c');w.printKitchen=id=>printOrder(id,'k');w.__wp58d_direct_v4=true}return true}catch(e){return false}}
function wireTop(){document.getElementById('bt').onclick=()=>connectPrinter().catch(e=>status(e.message,true));document.getElementById('test').onclick=()=>testPrint().catch(e=>status('Test print gagal: '+e.message,true));document.getElementById('diag').onclick=()=>diagnose().catch(e=>status('Periksa gagal: '+e.message,true));document.getElementById('chrome').onclick=openChrome}wireTop();diagnose();let n=0;f.addEventListener('load',()=>{const t=setInterval(()=>{if(addPanel()||++n>160)clearInterval(t)},250)});setInterval(addPanel,1000);
</script></body></html>
