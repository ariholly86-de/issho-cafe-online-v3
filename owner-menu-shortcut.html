<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — Shortcut Menu Owner</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0b0b0b;color:#f3f3f3}.wrap{max-width:1100px;margin:auto;padding:14px}.head,.card{background:#151515;border:1px solid #303030;border-radius:15px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}button{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.gold{background:#b68142;color:#fff}.green{background:#2f7d50;color:#fff}.blue{background:#315b9a;color:#fff}.dark{background:#242424;color:#fff;border:1px solid #444}.red{background:#a73d35;color:#fff}input,select{width:100%;padding:11px;border:1px solid #3b3b3b;border-radius:9px;background:#1b1b1b;color:#fff;font:inherit;margin:5px 0}.muted{color:#aaa;font-size:13px}.hidden{display:none}.err{background:#4a1d1a;color:#ffd9d5;padding:10px;border-radius:9px}.ok{background:#193b25;color:#d9ffe5;padding:10px;border-radius:9px}.item{background:#1b1b1b;border:1px solid #333;border-radius:12px;padding:12px}.badge{display:inline-block;padding:5px 8px;border-radius:8px;font-size:12px;font-weight:800}.inactive{background:#5a2925;color:#ffd8d3}.active{background:#1e5135;color:#d9ffe5}.noimg{background:#5b4b20;color:#ffe9a8}.search{font-size:18px}.small{font-size:12px}@media(max-width:600px){.wrap{padding:9px}.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><h1 style="margin:0">ISSHO CAFE — SHORTCUT MENU OWNER</h1><div class="muted">Pencarian cepat menu • khusus OWNER • aktif/nonaktif • tanpa gambar</div></header><section id="login" class="card"><h2>🔐 Login Owner</h2><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN Owner"><button class="gold" onclick="login()">Masuk</button><div id="msg"></div></section><section id="app" class="hidden"><div class="card"><div class="row"><div><h2 style="margin:0">🔎 Cari / Aktifkan Menu</h2><div class="muted">Gunakan shortcut ini untuk menemukan menu yang sebelumnya di-uncheck.</div></div><button class="dark" onclick="location.href='owner-v3.html?v=20260822shortcut'">← Kembali Owner</button></div><div class="grid" style="margin-top:10px"><div><label>Pencarian nama menu</label><input id="q" class="search" placeholder="Contoh: mie, nasi, es teh..." oninput="render()"></div><div><label>Tampilkan</label><select id="filter" onchange="render()"><option value="inactive">🔴 Nonaktif / Uncheck</option><option value="noimage">🟡 Aktif tapi belum ada gambar</option><option value="active">🟢 Aktif</option><option value="all">Semua menu</option></select></div></div><div class="actions"><button class="red" onclick="quickInactive()">🔴 Hanya Menu Uncheck</button><button class="blue" onclick="quickNoImage()">🟡 Aktif Tanpa Gambar</button><button class="green" onclick="quickActive()">🟢 Menu Aktif</button><button class="dark" onclick="load()">↻ Refresh</button></div></div><div id="info" class="muted"></div><div id="list" class="grid"></div></section></main><script>const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';let P='',PS=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){const h=Object.assign({apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},opt.headers||{}),r=await fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h})),t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}async function login(){const p=$('pin').value.trim();if(!/^\d{4,8}$/.test(p))return $('msg').innerHTML='<div class="err">PIN harus 4–8 angka.</div>';try{const raw=await api('/rest/v1/rpc/staff_role',{method:'POST',body:JSON.stringify({p_pin:p})}),role=String(typeof raw==='string'?raw:(Array.isArray(raw)?raw[0]:(raw&&raw.role)||'')).trim().toUpperCase();if(role!=='OWNER')throw Error('PIN Owner tidak cocok.');P=p;$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){$('msg').innerHTML='<div class="err">Login gagal: '+esc(e.message)+'</div>'}}async function load(){try{PS=await api('/rest/v1/products?select=id,name,description,price,image_url,active&order=name');render()}catch(e){$('list').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}function setFilter(v){$('filter').value=v;render()}function quickInactive(){setFilter('inactive');$('q').focus()}function quickNoImage(){setFilter('noimage');$('q').focus()}function quickActive(){setFilter('active');$('q').focus()}function render(){const q=$('q').value.trim().toLowerCase(),f=$('filter').value;let a=PS.filter(p=>(p.name+' '+(p.description||'')).toLowerCase().includes(q));if(f==='inactive')a=a.filter(p=>p.active!==true);if(f==='noimage')a=a.filter(p=>p.active===true&&!p.image_url);if(f==='active')a=a.filter(p=>p.active===true);$('info').textContent='Menampilkan '+a.length+' menu dari '+PS.length+' menu.';$('list').innerHTML=a.length?a.map(p=>`<div class="item"><div class="row"><div><b>${esc(p.name)}</b><br><span class="muted">Rp ${Number(p.price||0).toLocaleString('id-ID')}</span></div><span class="badge ${p.active===true?'active':'inactive'}">${p.active===true?'AKTIF':'NONAKTIF / UNCHECK'}</span></div><div class="small muted" style="margin-top:7px">${p.image_url?'✓ Sudah ada gambar':'⚠ Belum ada gambar'}</div><div class="actions">${p.active===true?'':'<button class="green" onclick="activate(\''+p.id+'\')">✓ Aktifkan Menu</button>'}${p.active===true?'<button class="red" onclick="deactivate(\''+p.id+'\')">Uncheck</button>':''}<button class="dark" onclick="focusOwner(\''+p.id+'\')">Edit di Owner</button></div></div>`).join(''):'<div class="card" style="grid-column:1/-1;text-align:center">Tidak ada menu yang cocok.</div>'}async function setActive(id,active){const p=PS.find(x=>String(x.id)===String(id));if(!p)return;try{await api('/rest/v1/rpc/owner_update_product',{method:'POST',body:JSON.stringify({p_owner_pin:P,p_product_id:id,p_name:p.name,p_price:Number(p.price),p_description:p.description||'',p_active:active})});await load()}catch(e){alert('Gagal mengubah status: '+e.message)}}function activate(id){if(confirm('Aktifkan menu ini agar tampil di Pelanggan & Kasir?'))setActive(id,true)}function deactivate(id){if(confirm('Nonaktifkan menu ini dari Pelanggan & Kasir?'))setActive(id,false)}function focusOwner(id){location.href='owner-v3.html?v=20260822shortcut#menu-'+encodeURIComponent(id)}</script></body></html>
