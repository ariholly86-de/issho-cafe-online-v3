<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>ISSHO CAFE — Menu Pelanggan</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080909}iframe{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="app" title="ISSHO CAFE Menu Pelanggan"></iframe>
<script>
const f=document.getElementById('app');
const qs=new URLSearchParams(location.search);
const src=new URL('customer-ui-v5.html?v=20260904-cash-popup-v7',location.href);
if(qs.get('table'))src.searchParams.set('table',qs.get('table'));
if(location.hash)src.hash=location.hash.slice(1);
f.src=src.toString();

f.addEventListener('load',()=>{
  try{
    const outer=f.contentDocument;
    if(!outer)return;
    const getCustomer=()=>{
      const inner=outer.querySelector('iframe#app');
      if(!inner||!inner.contentDocument)return null;
      return {doc:inner.contentDocument,win:inner.contentWindow};
    };
    const install=()=>{
      const c=getCustomer();
      if(!c||!c.doc.body)return false;
      const d=c.doc;
      if(d.documentElement.dataset.isshoTablePopupFix==='4')return true;
      d.documentElement.dataset.isshoTablePopupFix='4';
      const css=d.createElement('style');
      css.textContent=`
        /* MENU: nama dan harga dibuat benar-benar berdekatan untuk SEMUA menu */
        #menu .menu{display:flex!important;flex-direction:column!important;min-height:0!important;height:auto!important;overflow:hidden!important}
        #menu .menu h3{margin:1px 0 0!important;padding:0!important;line-height:1.15!important}
        #menu .menu>.muted{min-height:0!important;height:auto!important;margin:0!important;padding:0!important;line-height:1.05!important}
        #menu .menu>.row{margin-top:0!important;margin-bottom:0!important;padding-top:0!important;flex:0 0 auto!important;align-items:center!important}
        #menu .menu .price{margin:0!important;padding:0!important;line-height:1.1!important}
        @media(max-width:600px){
          #menu .menu{min-height:0!important;height:auto!important}
          #menu .menu h3{font-size:14px!important;margin:1px 0 0!important;line-height:1.1!important}
          #menu .menu>.muted{font-size:11px!important;line-height:1!important}
          #menu .menu>.row{margin-top:0!important}
          #menu .menu .price{font-size:14px!important;line-height:1.05!important}
        }
      `;
      d.head.appendChild(css);

      /* Directly remove any old inline margin:auto so the price cannot be pushed to the bottom. */
      const tightenMenus=()=>{
        d.querySelectorAll('#menu .menu').forEach(menu=>{
          menu.style.setProperty('min-height','0','important');
          menu.style.setProperty('height','auto','important');
          const title=menu.querySelector('h3');
          const desc=menu.querySelector(':scope > .muted');
          const row=menu.querySelector(':scope > .row');
          if(title){title.style.setProperty('margin','1px 0 0','important');title.style.setProperty('padding','0','important');}
          if(desc){desc.style.setProperty('margin','0','important');desc.style.setProperty('padding','0','important');desc.style.setProperty('min-height','0','important');}
          if(row){row.style.setProperty('margin-top','0','important');row.style.setProperty('margin-bottom','0','important');row.style.setProperty('padding-top','0','important');}
        });
      };
      tightenMenus();
      const menuObserver=new MutationObserver(tightenMenus);
      const menuRoot=d.getElementById('menu');
      if(menuRoot)menuObserver.observe(menuRoot,{childList:true,subtree:true});

      const addTable=()=>{
        const popup=d.querySelector('.cash-reminder-v6');
        if(!popup||popup.querySelector('.table-inline'))return;
        const order=popup.querySelector('.order');
        const tn=d.getElementById('tn');
        if(!order||!tn)return;
        const tableText=(tn.textContent||'').trim();
        if(!tableText)return;
        const wrap=d.createElement('div');
        wrap.className='table-inline';
        const label=d.createElement('div');
        label.className='table-label';
        label.textContent='Nomor Meja';
        const no=d.createElement('div');
        no.className='table-no';
        no.textContent=tableText;
        wrap.append(label,no);
        order.appendChild(wrap);
      };
      const observer=new MutationObserver(addTable);
      observer.observe(d.body,{childList:true,subtree:true});
      addTable();
      return true;
    };
    if(!install()){
      const timer=setInterval(()=>{if(install())clearInterval(timer)},200);
      setTimeout(()=>clearInterval(timer),20000);
    }
  }catch(e){console.warn('ISSHO table/menu fix failed',e)}
});
</script>
</body>
</html>
