<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — OWNER</title><style>html,body{margin:0;width:100%;height:100%;background:#0b0b0b}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="owner" src="owner-v3.html?v=20260823-owner-report-categories-v1" title="ISSHO CAFE OWNER"></iframe><script>const f=document.getElementById('owner');function install(){try{const w=f.contentWindow,d=w.document;if(!d)return false;const sec=d.getElementById('reports');if(sec&&!d.getElementById('owner-report-v5')){const s=d.createElement('section');s.id='owner-report-v5';s.className='card';s.style.marginTop='12px';s.innerHTML='<h2>📊 Rekapan Owner — Harian / Mingguan / Bulanan</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="ov5from" type="date"><input id="ov5to" type="date"></div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:8px"><button id="ov5day" style="background:#1687f7;color:#fff">📅 Harian</button><button id="ov5week" style="background:#1687f7;color:#fff">📆 Mingguan</button><button id="ov5month" style="background:#1687f7;color:#fff">🗓️ Bulanan</button><button id="ov5show" style="background:#1687f7;color:#fff">🔎 Tampilkan</button><button id="ov5print" style="background:#1687f7;color:#fff">🖨️ Print Rekapan</button></div><div id="ov5out" style="margin-top:10px"></div>';sec.parentNode.insertBefore(s,sec.nextSibling);const q=id=>d.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m])),money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0),today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'});async function load(){const from=q('ov5from').value,to=q('ov5to').value,p=(q('pin')?.value||'').trim();if(!from||!to||!p)return;try{const orders=await fetch('https://xvhimyflrqrdudijwjdn.supabase.co/rest/v1/rpc/staff_get_orders',{method:'POST',headers:{apikey:'sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',Authorization:'Bearer sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St','Content-Type':'application/json'},body:JSON.stringify({p_pin:p})}).then(r=>r.json());const ex=await fetch('https://xvhimyflrqrdudijwjdn.supabase.co/rest/v1/rpc/owner_get_expenses',{method:'POST',headers:{apikey:'sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',Authorization:'Bearer sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St','Content-Type':'application/json'},body:JSON.stringify({p_owner_pin:p,p_from:from,p_to:to})}).then(r=>r.json());const end=new Date(to+'T00:00:00+07:00');end.setDate(end.getDate()+1);const lo=new Date(from+'T00:00:00+07:00').getTime(),hi=end.getTime();const paid=(orders||[]).filter(o=>String(o.payment_status||'').toUpperCase()==='PAID'&&o.created_at&&new Date(o.created_at).getTime()>=lo&&new Date(o.created_at).getTime()<hi),expenses=Array.isArray(ex)?ex:[],rev=paid.reduce((s,o)=>s+Number(o.total||0),0),out=expenses.reduce((s,e)=>s+Number(e.amount||0),0);q('ov5out').innerHTML='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px"><div>Total Order<br><b>'+paid.length+'</b></div><div>Pendapatan<br><b>'+money(rev)+'</b></div><div>Pengeluaran<br><b>'+money(out)+'</b></div><div>Laba Bersih<br><b>'+money(rev-out)+'</b></div></div><hr><h3>📋 Order Masuk</h3>'+(paid.map(o=>'<div style="padding:8px 0;border-bottom:1px solid #333"><b>'+esc(o.order_number)+'</b> • Meja '+esc(o.table_name||'-')+' • '+esc(o.payment_method||'-')+' • '+money(o.total)+'</div>').join('')||'Tidak ada order')+'<h3>💸 Pengeluaran</h3>'+(expenses.map(e=>'<div style="padding:8px 0;border-bottom:1px solid #333"><b>'+esc(e.category||'Operasional')+'</b> — '+money(e.amount)+'<br>Keterangan: <b>'+esc(e.description||'-')+'</b><br>'+esc(e.expense_date||'-')+'</div>').join('')||'Tidak ada pengeluaran')}catch(e){q('ov5out').textContent='Gagal memuat: '+e.message}}function setRange(k){let a,b;if(k==='day'){a=b=today()}else if(k==='week'){const d=new Date(),n=d.getDay()||7;d.setDate(d.getDate()-n+1);const e=new Date(d);e.setDate(e.getDate()+6);a=d.toLocaleDateString('en-CA');b=e.toLocaleDateString('en-CA')}else{const d=new Date();a=new Date(d.getFullYear(),d.getMonth(),1).toLocaleDateString('en-CA');b=new Date(d.getFullYear(),d.getMonth()+1,0).toLocaleDateString('en-CA')}q('ov5from').value=a;q('ov5to').value=b;load()}q('ov5day').onclick=()=>setRange('day');q('ov5week').onclick=()=>setRange('week');q('ov5month').onclick=()=>setRange('month');q('ov5show').onclick=load;q('ov5print').onclick=()=>w.print();q('ov5from').value=today();q('ov5to').value=today();}
const menu=d.getElementById('menu'),cats=d.getElementById('cats');if(menu&&cats&&!d.getElementById('owner-cat-restore-v1')){const st=d.createElement('style');st.id='owner-cat-restore-v1';st.textContent='#cats{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;overflow-y:hidden!important;gap:7px!important;white-space:nowrap!important;scrollbar-width:auto!important;min-height:48px;padding:8px 4px!important}#cats button{flex:0 0 auto!important;white-space:nowrap!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;min-height:38px!important}';d.head.appendChild(st);const list=['Semua','Kopi','Minuman','Makanan','Snack','Aneka Camilan','Aneka Nasi','Aneka Bakaran','Nasi Goreng','Aneka Mie','Aneka Minuman','Nasi Orak-Arik','Wedangan','Aneka Dimsum','Steak Ayam','Seblak','Minum Sachetan','Minuman Alkohol -5%'];const norm=s=>String(s||'').toLowerCase();const classify=p=>{const n=norm(p.name+' '+(p.description||''));if(n.includes('alcohol')||n.includes('alkohol')||n.includes('ice land'))return'Minuman Alkohol -5%';if(n.includes('sachet')||n.includes('abc ')||n.includes('caffino')||n.includes('chocolatos')||n.includes('energen'))return'Minum Sachetan';if(n.includes('kopi')||n.includes('americano')||n.includes('v60')||n.includes('drip')||n.includes('tubruk'))return'Kopi';if(n.includes('nasi orak')||n.includes('orak-arik'))return'Nasi Orak-Arik';if(n.includes('nasi goreng'))return'Nasi Goreng';if(n.includes('seblak'))return'Seblak';if(n.includes('steak ayam'))return'Steak Ayam';if(n.includes('mie')||n.startsWith('mie '))return'Aneka Mie';if(n.includes('dimsum'))return'Aneka Dimsum';if(n.includes('wedang')||n.includes('jahe')||n.includes('uwuh')||n.includes('telang')||n.includes('secang'))return'Wedangan';if(n.startsWith('nasi ')||n.includes(' nasi '))return'Aneka Nasi';if(n.includes('juice')||n.includes('soda')||n.includes('teh')||n.includes('matcha'))return'Aneka Minuman';if(n.includes('sosis')||n.includes('dumpling')||n.includes('bakso')||n.includes('otak-otak')||n.includes('crab'))return'Aneka Bakaran';if(n.includes('snack'))return'Snack';return'Aneka Camilan'};window.renderOwnerCats=()=>{const items=list.map(c=>{const b=d.createElement('button');b.textContent=c;b.className=(w.CAT===c?'gold':'dark');b.onclick=()=>{w.CAT=c;w.renderProducts()};return b});cats.replaceChildren(...items)};w.CAT='Semua';w.category=classify;w.renderOwnerCats();}
return true}catch(e){return false}}let n=0;f.addEventListener('load',()=>{const t=setInterval(()=>{if(install()||++n>120)clearInterval(t)},250)});setInterval(install,1500)</script></body></html>
