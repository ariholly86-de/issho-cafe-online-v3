<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISSHO CAFE - STAFF</title><style>body{font-family:Arial;margin:0;background:#f6f0e7;color:#222}.wrap{max-width:1150px;margin:auto;padding:16px}.head,.dark{background:#171411;color:#fff}.card,.order,.product{background:#fff;border:1px solid #ddd2c5;border-radius:14px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:9px;padding:10px 13px;font-weight:bold;cursor:pointer}.gold{background:#b68142;color:#fff}.green{background:#2f7d50;color:#fff}.red{background:#a73d35;color:#fff}input,select{padding:10px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box}.hidden{display:none}.muted{color:#777;font-size:13px}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#eee;font-size:12px}.err{background:#ffe1de;padding:10px;border-radius:8px}.ok{background:#dff3e5;padding:10px;border-radius:8px}.thumb{width:100%;height:130px;object-fit:cover;border-radius:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.item{padding:6px 0;border-bottom:1px solid #eee}@media print{.noprint{display:none!important}.printarea{display:block!important}}#printarea{display:none}</style></head><body><header class="head"><div class="wrap"><h2>ISSHO CAFE — KASIR / OWNER / DAPUR</h2><small>Dashboard internal</small></div></header><main class="wrap"><section id="login" class="card"><h3>Login Staff</h3><input id="pin" type="password" inputmode="numeric" placeholder="PIN Staff"><div class="actions"><button class="gold" onclick="login()">Masuk</button><a href="./customer.html">Menu Pelanggan</a></div><div id="err"></div></section><section id="app" class="hidden"><div class="card noprint"><div class="row"><h2 id="role"></h2><button class="dark" onclick="location.reload()">Keluar</button></div><div class="actions"><button onclick="tab('orders')">Pesanan</button><button onclick="tab('report')">📊 Rekapan Penjualan</button><button onclick="tab('pinchange')">🔐 Ganti PIN</button><button onclick="tab('upload')">📷 Gambar Menu</button></div></div><section id="orders" class="tab"><div class="card"><div class="row"><h3>Pesanan</h3><button class="gold" onclick="loadOrders()">Refresh</button></div><div id="ordersList"></div></div></section><section id="report" class="tab hidden"><div class="card noprint"><h3>📊 Rekapan Penjualan</h3><div class="grid"><div><label>Tanggal</label><input id="date" type="date"></div><div><label>Sesi</label><select id="session"><option value="morning">Pagi 07:00–17:00</option><option value="evening">Sore 17:00–Close</option><option value="day">Seharian 07:00–Close</option></select></div></div><div class="actions"><button class="gold" onclick="report()">Tampilkan Rekapan</button><button onclick="printReport()">🖨️ Print Rekapan</button></div></div><div id="reportOut"></div></section><section id="pinchange" class="tab hidden"><div class="card noprint"><h3>🔐 Ganti PIN <span id="pinRole"></span></h3><p class="muted">PIN baru 4–8 angka. Hanya mengubah PIN akun yang sedang login.</p><input id="oldpin" type="password" placeholder="PIN lama"><br><br><input id="newpin" type="password" inputmode="numeric" placeholder="PIN baru 4–8 angka"><br><br><input id="newpin2" type="password" inputmode="numeric" placeholder="Ulangi PIN baru"><div class="actions"><button class="green" onclick="changePin()">Simpan PIN Baru</button></div><div id="pinmsg"></div></div></section><section id="upload" class="tab hidden"><div class="card noprint"><h3>📷 Gambar Menu</h3><div id="products" class="grid"></div></div></section></section></main><div id="printarea"></div><script>const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',B='catalog-images';let P='',R='',ORD=[];const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){let h={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',...(opt.headers||{})};let r=await fetch(U+path,{...opt,headers:h}),t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}function login(){P=$('pin').value.trim();if(!/^[0-9]{4,8}$/.test(P))return $('err').innerHTML='<div class="err">PIN tidak valid.</div>';api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:P})}).then(()=>{R=P==='1234'?'KASIR':P==='5678'?'DAPUR':P==='9999'?'OWNER':'';if(!R)throw Error('PIN tidak berwenang');$('login').className='hidden';$('app').className='';$('role').textContent='Dashboard '+R;$('pinRole').textContent=R;loadOrders();if(R==='KASIR'||R==='OWNER')loadProducts()}).catch(e=>$('err').innerHTML='<div class="err">'+esc(e.message)+'</div>')}function tab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');if(id==='report')report();if(id==='upload')loadProducts()}async function loadOrders(){try{ORD=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:P})});if(!ORD.length)return $('ordersList').innerHTML='<p class="muted">Belum ada pesanan.</p>'; $('ordersList').innerHTML=ORD.map(o=>{let proof=o.payment_proof_url||'';return `<div class="order"><div class="row"><b>${esc(o.order_number)}</b><b>${money(o.total)}</b></div><div><span class="badge">${esc(o.table_name||'Take Away')}</span> <span class="badge">${esc(o.payment_method)}</span> <span class="badge">${esc(o.payment_status)}</span></div>${(o.items||[]).map(i=>`<div class="item">${esc(i.name)} × ${i.qty} — ${money(i.price*i.qty)}</div>`).join('')}${proof?`<p><b>Bukti QRIS</b><br><a href="${esc(proof)}" target="_blank"><img src="${esc(proof)}" style="max-width:260px;border-radius:8px"></a></p>`:''}<div class="actions">${R==='KASIR'&&o.payment_method==='QRIS'&&o.payment_status!=='PAID'?`<button class="green" onclick="verify('${o.id}',true)">✓ Verifikasi QRIS</button><button class="red" onclick="verify('${o.id}',false)">Tolak</button>`:''}${R==='KASIR'&&o.payment_method==='CASH'&&o.payment_status!=='PAID'?`<button class="green" onclick="paid('${o.id}')">Terima Tunai</button>`:''}${R==='KASIR'&&o.payment_status==='PAID'?`<button class="gold" onclick="accept('${o.id}')">Terima Order</button><button onclick="printOrder('${o.id}')">🖨️ Print 2 Nota</button>`:''}${R==='DAPUR'&&o.payment_status==='PAID'&&['NEW','ACCEPTED'].includes(o.order_status)?`<button class="gold" onclick="status('${o.id}','PREPARING')">Mulai Masak</button>`:''}${R==='DAPUR'&&o.order_status==='PREPARING'?`<button class="green" onclick="status('${o.id}','READY')">Pesanan Siap</button>`:''}${R==='OWNER'&&o.payment_status==='PAID'?`<button onclick="status('${o.id}','COMPLETED')">Selesaikan</button><button onclick="printOrder('${o.id}')">🖨️ Print 2 Nota</button>`:''}</div></div>`}).join('')}catch(e){$('ordersList').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}async function verify(id,a){try{await api('/rest/v1/rpc/staff_verify_payment',{method:'POST',body:JSON.stringify({p_pin:P,p_order_id:id,p_approved:a})});loadOrders()}catch(e){alert(e.message)}}async function paid(id){try{await api('/rest/v1/rpc/staff_mark_paid',{method:'POST',body:JSON.stringify({p_pin:P,p_order_id:id})});loadOrders()}catch(e){alert(e.message)}}async function accept(id){status(id,'ACCEPTED')}async function status(id,s){try{await api('/rest/v1/rpc/staff_update_order',{method:'POST',body:JSON.stringify({p_pin:P,p_order_id:id,p_status:s})});loadOrders()}catch(e){alert(e.message)}}function bounds(){let d=$('date').value, s=$('session').value;let a=s==='morning'?'07:00:00':s==='evening'?'17:00:00':'07:00:00',b=s==='morning'?'17:00:00':'00:00:00';if(s==='day')b='00:00:00';let from=new Date(d+'T'+a+'+07:00'),to;if(s==='evening'||s==='day'){let nd=new Date(from);nd.setDate(nd.getDate()+1);to=new Date(nd.toISOString());if(s==='day'){} }else to=new Date(d+'T17:00:00+07:00');return [from.toISOString(),to.toISOString()]}async function report(){if(!$('date').value)$('date').value=new Date().toLocaleDateString('en-CA');try{let [f,t]=bounds(),r=await api('/rest/v1/rpc/staff_sales_report',{method:'POST',body:JSON.stringify({p_pin:P,p_from:f,p_to:t})}),fav=r.favorite_menus||[];$('reportOut').innerHTML=`<div class="card" id="reportCard"><h3>Rekap ${esc($('date').value)} — ${esc($('session').selectedOptions[0].text)}</h3><div class="grid"><div class="card"><b>Total Pesanan</b><h2>${r.orders}</h2></div><div class="card"><b>Total Penjualan</b><h2>${money(r.revenue)}</h2></div><div class="card"><b>Tunai</b><h2>${money(r.cash)}</h2></div><div class="card"><b>QRIS</b><h2>${money(r.qris)}</h2></div><div class="card"><b>Item Terjual</b><h2>${r.items_sold||0}</h2></div></div><h3>⭐ Menu Favorit</h3>${fav.length?fav.map((x,i)=>`<div class="item"><b>${i+1}. ${esc(x.name)}</b> — ${x.qty} porsi — ${money(x.revenue)}</div>`).join(''):'<p class="muted">Belum ada penjualan pada sesi ini.</p>'}</div>`}catch(e){$('reportOut').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}function printReport(){let x=$('reportCard');if(!x)return alert('Tampilkan rekapan dulu');$('printarea').innerHTML='<div style="font-family:Arial;padding:15px">'+x.innerHTML+'</div>';window.print()}async function changePin(){let a=$('oldpin').value,b=$('newpin').value,c=$('newpin2').value;if(a!==P)return $('pinmsg').innerHTML='<div class="err">PIN lama tidak sesuai dengan PIN login.</div>';if(b!==c)return $('pinmsg').innerHTML='<div class="err">Konfirmasi PIN berbeda.</div>';try{let r=await api('/rest/v1/rpc/staff_change_pin',{method:'POST',body:JSON.stringify({p_pin:a,p_new_pin:b})});$('pinmsg').innerHTML='<div class="ok">PIN '+r.role+' berhasil diganti. Silakan login ulang dengan PIN baru.</div>';setTimeout(()=>location.reload(),1200)}catch(e){$('pinmsg').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}async function loadProducts(){try{let ps=await api('/rest/v1/products?select=id,name,price,image_url&active=eq.true&order=sort_order,name');$('products').innerHTML=ps.map(p=>`<div class="product"><img class="thumb" src="${esc(p.image_url||'')}"><b>${esc(p.name)}</b><div>${money(p.price)}</div><input id="f-${p.id}" type="file" accept="image/jpeg,image/png,image/webp"><button class="green" style="margin-top:7px" onclick="up('${p.id}')">Upload / Ganti Gambar</button><div id="m-${p.id}" class="muted"></div></div>`).join('')}catch(e){$('products').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}async function up(id){let f=$('f-'+id).files[0],m=$('m-'+id);if(!f)return m.textContent='Pilih gambar';if(f.size>5*1024*1024)return m.textContent='Maksimal 5 MB';try{m.textContent='Mengupload...';let ext=f.type.split('/')[1].replace('jpeg','jpg'),path='products/'+id+'-'+Date.now()+'.'+ext,r=await fetch(`${U}/storage/v1/object/${B}/${path}`,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':f.type},body:f});if(!r.ok)throw Error(await r.text());await api('/rest/v1/rpc/staff_update_product_image',{method:'POST',body:JSON.stringify({p_pin:P,p_product_id:id,p_image_url:`${U}/storage/v1/object/public/${B}/${path}`})});m.textContent='✓ Tersimpan';loadProducts()}catch(e){m.textContent='Gagal: '+e.message}}function printOrder(id){let o=ORD.find(x=>x.id===id);if(!o)return;let items=(o.items||[]).map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price*i.qty)}</td></tr>`).join(''),customer=`<h2 style="text-align:center">ISSHO CAFE</h2><p><b>NOTA PELANGGAN</b><br>${esc(o.order_number)} • ${esc(o.table_name||'Take Away')}<br>Pembayaran: ${esc(o.payment_method)} — ${esc(o.payment_status)}</p><table width="100%">${items}</table><h3 style="text-align:right">TOTAL ${money(o.total)}</h3>`,kitchen=`<div style="page-break-before:always"></div><h2 style="text-align:center">ISSHO CAFE</h2><h3>NOTA DAPUR — ${esc(o.order_number)}</h3><p>MEJA: <b>${esc(o.table_name||'Take Away')}</b></p><table width="100%">${(o.items||[]).map(i=>`<tr><td>${esc(i.name)}</td><td><b>${i.qty}</b></td></tr>`).join('')}</table><p><b>PROSES PESANAN</b></p>`;$('printarea').innerHTML='<div style="font-family:Arial;padding:15px">'+customer+kitchen+'</div>';window.print()}if(new Date().toLocaleDateString('en-CA'))$('date').value=new Date().toLocaleDateString('en-CA');</script></body></html>
