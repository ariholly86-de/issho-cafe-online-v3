<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>ISSHO CAFE — KASIR</title>
<style>
html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}#kasir{width:100%;height:100%;min-height:100vh;border:0;display:block}.live{position:fixed;right:10px;top:10px;z-index:999997;background:#193b25;border:1px solid #2f7d50;border-radius:18px;padding:12px 18px;font-size:16px;font-weight:900}.waBtn{display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:7px!important;height:42px!important;padding:10px 14px!important;margin-left:0!important;border:0!important;border-radius:9px!important;background:#25D366!important;color:#fff!important;font-weight:800!important;cursor:pointer!important;pointer-events:auto!important;position:relative!important;z-index:9999!important}.waBtn:hover{filter:brightness(1.12)}.waBtn svg{width:20px;height:20px;flex:0 0 auto}.waModal{display:none;position:fixed;inset:0;z-index:1000000;background:#000c;align-items:center;justify-content:center;padding:16px}.waBox{width:min(520px,94vw);max-height:90vh;overflow:auto;background:#171717;border:2px solid #25D366;border-radius:18px;padding:18px;box-shadow:0 10px 40px #000}.waHead{display:flex;align-items:center;gap:10px}.waHead h3{margin:0}.waIcon{width:38px;height:38px;border-radius:50%;background:#25D366;display:inline-flex;align-items:center;justify-content:center}.waIcon svg{width:25px;height:25px}.waBox label{display:block;font-size:13px;font-weight:800;margin-top:14px}.waBox input{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:1px solid #555;background:#101010;color:#fff;margin:7px 0;font-size:17px}.hint{font-size:12px;color:#aaa}.receipt{background:#fff;color:#111;border-radius:12px;padding:16px;margin:14px 0;font-size:14px}.receipt h2{text-align:center;margin:0}.sub{text-align:center;color:#666}.line{border-top:1px dashed #aaa;margin:10px 0}.row{display:flex;justify-content:space-between;gap:10px;margin:5px 0}.total{font-weight:900;font-size:17px}.actions{display:flex;gap:8px;justify-content:flex-end}.actions button{border:0;border-radius:10px;padding:13px 16px;font-weight:900;color:#fff;cursor:pointer}.send{background:#25D366}.cancel{background:#555}
</style>
</head>
<body>
<div class="live">🔔 ALARM OTOMATIS AKTIF • LIVE</div>
<iframe id="kasir" src="/staff-v6.html?v=20260825-kasir-wa-v6" title="ISSHO CAFE KASIR"></iframe>
<div id="waModal" class="waModal"><div class="waBox">
<div class="waHead"><span class="waIcon"><svg viewBox="0 0 32 32"><path fill="#fff" d="M16 3.2C8.94 3.2 3.2 8.94 3.2 16c0 2.27.6 4.4 1.73 6.27L3 29l6.91-1.81A12.74 12.74 0 0 0 16 28.8c7.06 0 12.8-5.74 12.8-12.8S23.06 3.2 16 3.2Zm0 23.4c-2.03 0-4.01-.55-5.73-1.59l-.41-.25-4.1 1.07 1.09-3.99-.27-.42A10.64 10.64 0 1 1 16 26.6Z"/></svg></span><h3>Kirim Invoice via WhatsApp</h3></div>
<label>Nomor WhatsApp pelanggan</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="0812xxxx atau 62812xxxx"><div class="hint">0812... otomatis diubah menjadi 62812...</div><div id="preview" class="receipt"></div>
<div class="actions"><button class="cancel" id="cancel">Batal</button><button class="send" id="send">📱 Kirim Invoice</button></div>
</div></div>
<script>
const $=id=>document.getElementById(id);let selected=null;
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function frame(){return $('kasir').contentWindow}
function getOrders(){const w=frame();return w&&Array.isArray(w.ORD)?w.ORD:[]}
function getOrder(id){return getOrders().find(o=>String(o.id)===String(id))||null}
function normalize(n){n=String(n||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);else if(n&&!n.startsWith('62'))n='62'+n;return n}
function message(o){const a=['🧾 INVOICE PEMBAYARAN — ISSHO CAFE','','No. Order: '+(o.order_number||'-'),'Meja: '+(o.table_name||'Take Away'),'Pembayaran: '+(o.payment_method||'-'),'Status: '+(o.payment_status==='PAID'?'LUNAS':'BELUM LUNAS'),''];(o.items||[]).forEach(i=>a.push('- '+i.name+' × '+Number(i.qty||0)+' — '+money((Number(i.price)||0)*Number(i.qty||0))));a.push('','TOTAL: '+money(o.total),'','Terima kasih telah berbelanja di ISSHO CAFE.');return a.join('\n')}
function preview(o){let h='<h2>ISSHO CAFE</h2><div class="sub">INVOICE PEMBAYARAN</div><div class="line"></div>';h+='<div class="row"><span>No. Order</span><b>'+esc(o.order_number||'-')+'</b></div>';h+='<div class="row"><span>Meja</span><b>'+esc(o.table_name||'Take Away')+'</b></div>';h+='<div class="row"><span>Pembayaran</span><b>'+esc(o.payment_method||'-')+'</b></div>';h+='<div class="row"><span>Status</span><b>'+esc(o.payment_status==='PAID'?'LUNAS':'BELUM LUNAS')+'</b></div><div class="line"></div>';(o.items||[]).forEach(i=>{h+='<div class="row"><span>'+esc(i.name)+' × '+Number(i.qty||0)+'</span><b>'+money((Number(i.price)||0)*Number(i.qty||0))+'</b></div>'});h+='<div class="line"></div><div class="row total"><span>TOTAL</span><span>'+money(o.total)+'</span></div>';return h}
function openWA(o){if(!o)return;selected=o;$('preview').innerHTML=preview(o);let saved='';try{const m=JSON.parse(localStorage.getItem('issho_wa_by_table_v10')||'{}');saved=m[String(o.table_name||'Take Away')]||''}catch(e){}$('phone').value=saved;$('waModal').style.display='flex';setTimeout(()=>$('phone').focus(),80)}
$('cancel').onclick=()=>{$('waModal').style.display='none';selected=null};
$('send').onclick=()=>{if(!selected)return;const n=normalize($('phone').value);if(!n)return alert('Masukkan nomor WhatsApp pelanggan.');if(n.length<10||n.length>15)return alert('Nomor WhatsApp tidak valid.');try{const m=JSON.parse(localStorage.getItem('issho_wa_by_table_v10')||'{}');m[String(selected.table_name||'Take Away')]=n;localStorage.setItem('issho_wa_by_table_v10',JSON.stringify(m))}catch(e){}window.open('https://wa.me/'+n+'?text='+encodeURIComponent(message(selected)),'_blank','noopener');$('waModal').style.display='none';selected=null};
function addButton(card,o){if(!o||o.payment_status!=='PAID'||card.querySelector('.waBtn'))return;const d=frame().document;const b=d.createElement('button');b.type='button';b.className='waBtn';b.title='Kirim invoice via WhatsApp';b.setAttribute('aria-label','Kirim invoice via WhatsApp');b.innerHTML='<svg viewBox="0 0 32 32"><path fill="#fff" d="M16 3.2C8.94 3.2 3.2 8.94 3.2 16c0 2.27.6 4.4 1.73 6.27L3 29l6.91-1.81A12.74 12.74 0 0 0 16 28.8c7.06 0 12.8-5.74 12.8-12.8S23.06 3.2 16 3.2Zm0 23.4c-2.03 0-4.01-.55-5.73-1.59-1.72-1.04-3.99-1.59-5.73-1.59l-4.1 1.07 1.09-3.99-.27-.42A10.64 10.64 0 1 1 16 26.6Z"/></svg><span>WhatsApp</span>';
b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openWA(getOrder(o.id))});
const buttons=[...card.querySelectorAll('button')];const pd=buttons.find(x=>/Print Dapur/i.test(x.textContent||''));const pp=buttons.find(x=>/Print Pelanggan/i.test(x.textContent||''));const anchor=pd||pp;const parent=anchor&&anchor.parentElement?anchor.parentElement:card.querySelector('.actions');if(parent){if(anchor)parent.insertBefore(b,anchor.nextSibling);else parent.appendChild(b)}}
function patch(){try{const w=frame();if(!w||!w.document)return;const list=w.document.getElementById('list');if(!list)return;list.querySelectorAll('.order').forEach(card=>{const bold=card.querySelector('b');if(!bold)return;const o=getOrders().find(x=>String(x.order_number)===String(bold.textContent.trim()));if(o)addButton(card,o)})}catch(e){console.error('WhatsApp patch:',e)}}
$('kasir').addEventListener('load',()=>{setTimeout(patch,300);setInterval(patch,500)});setInterval(patch,700);
</script>
</body>
</html>
