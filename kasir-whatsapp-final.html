<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>ISSHO CAFE — KASIR FINAL</title>
<style>
html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}
#kasir{width:100%;height:100%;min-height:100vh;border:0;display:block}
.waModal{display:none;position:fixed;inset:0;z-index:999999;background:#000c;align-items:center;justify-content:center;padding:16px}
.waBox{width:min(520px,94vw);max-height:90vh;overflow:auto;background:#171717;border:2px solid #25D366;border-radius:18px;padding:18px;box-shadow:0 10px 40px #000}
.waHead{display:flex;align-items:center;gap:10px}.waHead h3{margin:0}.waIcon{width:38px;height:38px;border-radius:50%;background:#25D366;display:inline-flex;align-items:center;justify-content:center}.waIcon svg{width:25px;height:25px}
.waBox label{display:block;font-size:13px;font-weight:800;margin-top:14px}.waBox input{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:1px solid #555;background:#101010;color:#fff;margin:7px 0;font-size:17px}.hint{font-size:12px;color:#aaa}
.receipt{background:#fff;color:#111;border-radius:12px;padding:16px;margin:14px 0;font-size:14px}.receipt h2{text-align:center;margin:0}.sub{text-align:center;color:#666}.line{border-top:1px dashed #aaa;margin:10px 0}.row{display:flex;justify-content:space-between;gap:10px;margin:5px 0}.total{font-weight:900;font-size:17px}.actions{display:flex;gap:8px;justify-content:flex-end}.actions button{border:0;border-radius:10px;padding:13px 16px;font-weight:900;color:#fff;cursor:pointer}.send{background:#25D366}.cancel{background:#555}
.waBtn{display:inline-flex!important;align-items:center;justify-content:center!important;width:44px!important;height:42px!important;padding:0!important;margin-left:6px!important;border:0!important;border-radius:10px!important;background:#25D366!important;color:#fff!important;cursor:pointer!important;pointer-events:auto!important;position:relative!important;z-index:20!important}.waBtn svg{width:23px;height:23px}.waBtn:hover{filter:brightness(1.12)}
#alarm{display:none;position:fixed;inset:0;z-index:999998;background:#000d;align-items:center;justify-content:center;padding:18px}.alarmBox{width:min(600px,94vw);background:#171717;border:4px solid #d34a3f;border-radius:20px;padding:24px;text-align:center;box-shadow:0 10px 50px #000}.alarmBox button{border:0;border-radius:12px;padding:14px 22px;font-weight:900;background:#c98a2e;color:#fff;cursor:pointer}.live{position:fixed;right:10px;top:10px;z-index:999997;background:#193b25;border:1px solid #2f7d50;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:900}
</style>
</head>
<body>
<div class="live">🔔 ALARM OTOMATIS AKTIF • LIVE</div>
<iframe id="kasir" src="/staff-v6.html?v=20260825-kasir-direct-v4" title="ISSHO CAFE KASIR"></iframe>
<div id="waModal" class="waModal">
  <div class="waBox">
    <div class="waHead"><span class="waIcon"><svg viewBox="0 0 32 32"><path fill="#fff" d="M16 3.2C8.94 3.2 3.2 8.94 3.2 16c0 2.27.6 4.4 1.73 6.27L3 29l6.91-1.81A12.74 12.74 0 0 0 16 28.8c7.06 0 12.8-5.74 12.8-12.8S23.06 3.2 16 3.2Zm0 23.4c-2.03 0-4.01-.55-5.73-1.59l-.41-.25-4.1 1.07 1.09-3.99-.27-.42A10.64 10.64 0 1 1 16 26.6Z"/></svg></span><h3>Kirim Kwitansi via WhatsApp</h3></div>
    <label>Nomor WhatsApp pelanggan</label>
    <input id="phone" inputmode="tel" autocomplete="tel" placeholder="0812xxxx atau 62812xxxx">
    <div class="hint">0812... otomatis diubah menjadi 62812...</div>
    <div id="preview" class="receipt"></div>
    <div class="actions"><button class="cancel" id="cancel">Batal</button><button class="send" id="send">📱 Kirim Kwitansi</button></div>
  </div>
</div>
<div id="alarm"><div class="alarmBox"><h2 id="alarmTitle">🔔 ORDER MASUK</h2><div id="alarmInfo" style="font-size:18px;line-height:1.6;margin:15px"></div><button id="ack">✓ SUDAH DILIHAT</button></div></div>
<script>
const $=id=>document.getElementById(id);
let selected=null,seen=new Map(),first=true,ctx=null;
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function deep(){try{return $('kasir').contentWindow}catch(e){return null}}
function orders(){const w=deep();return w&&Array.isArray(w.ORD)?w.ORD:[]}
function getOrderById(id){return orders().find(o=>String(o.id)===String(id))||null}
function getOrderByNumber(num){return orders().find(o=>String(o.order_number)===String(num))||null}
function orderFromCard(card){try{const b=card.querySelector('b');return b?getOrderByNumber(b.textContent.trim()):null}catch(e){return null}}
function normalize(n){n=String(n||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);else if(n&&!n.startsWith('62'))n='62'+n;return n}
function waMessage(o){const lines=['🧾 KWITANSI PEMBAYARAN — ISSHO CAFE','','No. Order: '+(o.order_number||'-'),'Meja: '+(o.table_name||'Take Away'),'Pembayaran: '+(o.payment_method||'-'),'Status: LUNAS',''];(o.items||[]).forEach(i=>lines.push('- '+i.name+' × '+Number(i.qty||0)+' — '+money((Number(i.price)||0)*Number(i.qty||0))));lines.push('','TOTAL: '+money(o.total),'','Terima kasih telah berbelanja di ISSHO CAFE.');return lines.join(String.fromCharCode(10))}
function receipt(o){let h='<h2>ISSHO CAFE</h2><div class="sub">KWITANSI PEMBAYARAN</div><div class="line"></div>';h+='<div class="row"><span>No. Order</span><b>'+esc(o.order_number||'-')+'</b></div>';h+='<div class="row"><span>Meja</span><b>'+esc(o.table_name||'Take Away')+'</b></div>';h+='<div class="row"><span>Pembayaran</span><b>'+esc(o.payment_method||'-')+'</b></div>';h+='<div class="row"><span>Status</span><b>LUNAS</b></div><div class="line"></div>';(o.items||[]).forEach(i=>{h+='<div class="row"><span>'+esc(i.name)+' × '+Number(i.qty||0)+'</span><b>'+money((Number(i.price)||0)*Number(i.qty||0))+'</b></div>'});h+='<div class="line"></div><div class="row total"><span>TOTAL</span><span>'+money(o.total)+'</span></div><div class="sub">Terima kasih telah berbelanja di ISSHO CAFE.</div>';return h}
function openWA(o){if(!o||o.payment_status!=='PAID')return alert('Kwitansi WhatsApp hanya tersedia setelah pembayaran LUNAS.');selected=o;$('preview').innerHTML=receipt(o);let map={};try{map=JSON.parse(localStorage.getItem('issho_wa_by_table_v8')||'{}')}catch(e){}$('phone').value=map[String(o.table_name||'Take Away')]||'';$('waModal').style.display='flex';setTimeout(()=>$('phone').focus(),60)}
$('cancel').onclick=()=>{$('waModal').style.display='none';selected=null};
$('send').onclick=()=>{if(!selected)return;const n=normalize($('phone').value);if(!n)return alert('Masukkan nomor WhatsApp pelanggan.');if(n.length<10||n.length>15)return alert('Nomor WhatsApp tidak valid.');let map={};try{map=JSON.parse(localStorage.getItem('issho_wa_by_table_v8')||'{}')}catch(e){}map[String(selected.table_name||'Take Away')]=n;localStorage.setItem('issho_wa_by_table_v8',JSON.stringify(map));window.open('https://wa.me/'+n+'?text='+encodeURIComponent(waMessage(selected)),'_blank');$('waModal').style.display='none';selected=null};
function printCustomerDirect(o){if(!o)return;const items=(o.items||[]).map(i=>'<tr><td>'+esc(i.name)+' × '+Number(i.qty||0)+'</td><td style="text-align:right">'+money((Number(i.price)||0)*Number(i.qty||0))+'</td></tr>').join('');const html='<!doctype html><html><head><meta charset="utf-8"><title>'+esc(o.order_number||'Nota')+'</title><style>@page{size:58mm auto;margin:0}html,body{width:58mm;margin:0;padding:0;background:#fff;color:#000}body{font-family:Arial,sans-serif;font-size:11px;padding:4mm 3mm}h2{text-align:center;font-size:16px;margin:0 0 5px}p{margin:3px 0}.line{border-top:1px dashed #000;margin:6px 0}table{width:100%;border-collapse:collapse}td{padding:2px 0;vertical-align:top}.total{font-size:14px;font-weight:900;text-align:right}</style></head><body><h2>ISSHO CAFE</h2><p style="text-align:center">TANDA TERIMA PELANGGAN</p><div class="line"></div><p><b>Order:</b> '+esc(o.order_number||'-')+'</p><p><b>Meja:</b> '+esc(o.table_name||'Take Away')+'</p><p><b>Pembayaran:</b> '+esc(o.payment_method||'-')+'</p><div class="line"></div><table>'+items+'</table><div class="line"></div><p class="total">TOTAL '+money(o.total)+'</p><p style="text-align:center;margin-top:10px">Terima kasih 🙏</p></body></html>';const w=window.open('','_blank','width=420,height=700');if(!w)return alert('Popup printer diblokir browser. Izinkan popup untuk mencetak nota.');w.document.open();w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),300)}
function patch(){try{const w=deep();if(!w)return;const d=w.document,list=d.getElementById('list');if(!list)return;list.querySelectorAll('.order').forEach(card=>{const o=orderFromCard(card);if(!o)return;let buttons=[...card.querySelectorAll('button')];buttons.forEach(b=>{if(/Print Dapur/i.test(b.textContent||'')){b.remove()}if(/Print Pelanggan/i.test(b.textContent||'')){b.onclick=e=>{e.preventDefault();e.stopPropagation();printCustomerDirect(o);return false};b.disabled=false;b.removeAttribute('disabled');b.style.pointerEvents='auto';b.style.cursor='pointer';b.style.position='relative';b.style.zIndex='30'}});if(o.payment_status==='PAID'&&!card.querySelector('.waBtn')){const b=d.createElement('button');b.type='button';b.className='waBtn';b.title='Kirim kwitansi via WhatsApp';b.setAttribute('aria-label','Kirim kwitansi via WhatsApp');b.innerHTML='<svg viewBox="0 0 32 32"><path fill="#fff" d="M16 3.2C8.94 3.2 3.2 8.94 3.2 16c0 2.27.6 4.4 1.73 6.27L3 29l6.91-1.81A12.74 12.74 0 0 0 16 28.8c7.06 0 12.8-5.74 12.8-12.8S23.06 3.2 16 3.2Zm0 23.4c-2.03 0-4.01-.55-5.73-1.59-1.72-1.04-3.99-1.59-5.73-1.59l-4.1 1.07 1.09-3.99-.27-.42A10.64 10.64 0 1 1 16 26.6Z"/></svg>';b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openWA(o)},true);const pb=[...card.querySelectorAll('button')].find(x=>/Print Pelanggan/i.test(x.textContent||''));if(pb&&pb.parentElement)pb.parentElement.insertBefore(b,pb.nextSibling);else{const a=card.querySelector('.actions');if(a)a.appendChild(b)}}})}catch(e){console.error('Kasir patch error',e)}}
function unlock(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}}
['click','pointerdown','touchstart','keydown'].forEach(e=>window.addEventListener(e,unlock,{passive:true}));
function beep(){try{unlock();if(!ctx)return;const t=ctx.currentTime;for(let i=0;i<8;i++){const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=i%2?1046:784;g.gain.setValueAtTime(.0001,t+i*.2);g.gain.exponentialRampToValueAtTime(.25,t+i*.2+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.2+.14);o.connect(g);g.connect(ctx.destination);o.start(t+i*.2);o.stop(t+i*.2+.16)}}catch(e){}}
function showAlarm(o,type){$('alarmTitle').textContent=type==='proof'?'💳 BUKTI QRIS MASUK':type==='paid'?'💰 PEMBAYARAN DITERIMA':'🔔 ORDER MASUK';$('alarmInfo').innerHTML='<b>'+esc(o.order_number||'-')+'</b><br>Meja '+esc(o.table_name||'Take Away')+' • '+esc(o.payment_method||'-')+' • '+money(o.total)+'<br>'+esc((o.items||[]).map(i=>i.name+' × '+i.qty).join(' • '));$('alarm').style.display='flex';beep();try{navigator.vibrate?.([300,100,300,100,700])}catch(e){}}
$('ack').onclick=()=>{$('alarm').style.display='none';unlock()};
async function api(path,opt={}){const r=await fetch('https://xvhimyflrqrdudijwjdn.supabase.co'+path,{...opt,cache:'no-store',headers:{apikey:'sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',Authorization:'Bearer sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St','Content-Type':'application/json'}});if(!r.ok)throw Error(await r.text());return r.json()}
async function poll(){try{patch();const w=deep();if(!w||!w.P)return;let rows=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:w.P})});rows=Array.isArray(rows)?rows:[];if(first){rows.forEach(o=>seen.set(String(o.id),{pay:o.payment_status,proof:o.payment_proof_url||''}));first=false;return}rows.forEach(o=>{const id=String(o.id),old=seen.get(id);if(!old){seen.set(id,{pay:o.payment_status,proof:o.payment_proof_url||''});showAlarm(o,'new');return}if(old.proof!==String(o.payment_proof_url||'')&&o.payment_proof_url)showAlarm(o,'proof');else if(old.pay!=='PAID'&&o.payment_status==='PAID')showAlarm(o,'paid');seen.set(id,{pay:o.payment_status,proof:o.payment_proof_url||''})})}catch(e){console.error('Kasir poll error',e)}}
$('kasir').addEventListener('load',()=>{patch();poll();setInterval(poll,1000);setInterval(patch,500)});
setInterval(patch,1000);
</script>
</body>
</html>
