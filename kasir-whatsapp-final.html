gan. 0812... otomatis menjadi 62812...</div><div id="preview" class="receipt"></div><div class="actions"><button class="cancel" id="cancel">Batal</button><button class="send" id="send">📱 Kirim Kwitansi</button></div></div></div><div id="alarm"><div class="alarmBox"><h2 id="alarmTitle">🔔 ORDER MASUK</h2><div id="alarmInfo" style="font-size:18px;line-height:1.6;margin:15px"></div><button id="ack">✓ SUDAH DILIHAT</button></div></div><script>const $=id=>document.getElementById(id),SUPA='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';let selected=null,seen=new Map(),first=true,ctx=null;const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));function deep(){try{let w=$('kasir').contentWindow;for(let i=0;i<6;i++){let f=w.document.querySelector('iframe#kasir');if(!f)break;w=f.contentWindow}return w}catch(e){return null}}function helper(){let w=deep();if(!w)return null;try{if(!w.getKasirOrder)w.getKasirOrder=id=>w.ORD.find(x=>String(x.id)===String(id));if(!w.getKasirPin)w.getKasirPin=()=>w.P;return w}catch(e){return null}}function normalize(n){n=String(n||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);else if(n&&!n.startsWith('62'))n='62'+n;return n}function message(o){let items=(o.items||[]).map(i=>'- '+i.name+' × '+Number(i.qty||0)+' — '+money((Number(i.price)||0)*Number(i.qty||0))).join('\n');return '🧾 KWITANSI PEMBAYARAN — ISSHO CAFE\n\nNo. Order: '+(o.order_number||'-')+'\nMeja: '+(o.table_name||'Take Away')+'\nPembayaran: '+(o.payment_method||'-')+'\nStatus: LUNAS\n\n'+items+'\n\nTOTAL: '+money(o.total)+'\n\nTerima kasih telah berbelanja di ISSHO CAFE.'}function receipt(o){return '<h2>ISSHO CAFE</h2><div class="sub">KWITANSI PEMBAYARAN</div><div class="line"></div><div class="row"><span>No. Order</span><b>'+esc(o.order_number||'-')+'</b></div><div class="row"><span>Meja</span><b>'+esc(o.table_name||'Take Away')+'</b></div><div class="row"><span>Pembayaran</span><b>'+esc(o.payment_method||'-')+'</b></div><div class="row"><span>Status</span><b>LUNAS</b></div><div class="line"></div>'+(o.items||[]).map(i=>'<div class="row"><span>'+esc(i.name)+' × '+Number(i.qty||0)+'</span><b>'+money((Number(i.price)||0)*Number(i.qty||0))+'</b></div>').join('')+'<div class="line"></div><div class="row total"><span>TOTAL</span><span>'+money(o.total)+'</span></div><div class="sub">Terima kasih telah berbelanja di ISSHO CAFE.</div>'}function openWA(o){if(!o||o.payment_status!=='PAID')return alert('Kwitansi WhatsApp hanya tersedia setelah status PAID/LUNAS.');selected=o;$('preview').innerHTML=receipt(o);let map={};try{map=JSON.parse(localStorage.getItem('issho_wa_by_table_v7')||'{}')}catch(e){}$('phone').value=map[String(o.table_name||'Take Away')]||'';$('waModal').style.display='flex';setTimeout(()=>$('phone').focus(),60)}$('cancel').onclick=()=>{$('waModal').style.display='none'};$('send').onclick=()=>{if(!selected)return;let n=normalize($('phone').value);if(!n)return alert('Masukkan nomor WhatsApp pelanggan.');if(n.length<10||n.length>15)return alert('Nomor WhatsApp tidak valid.');let map={};try{map=JSON.parse(localStorage.getItem('issho_wa_by_table_v7')||'{}')}catch(e){}map[String(selected.table_name||'Take Away')]=n;localStorage.setItem('issho_wa_by_table_v7',JSON.stringify(map));window.open('https://wa.me/'+n+'?text='+encodeURIComponent(message(selected)),'_blank');$('waModal').style.display='none'};function patch(){try{let w=helper();if(!w)return;let d=w.document,list=d.getElementById('list');if(!list)return;list.querySelectorAll('button').forEach(b=>{if(/Print Dapur/i.test(b.textContent||'')){b.remove();return}if(/Print Pelanggan/i.test(b.textContent||'')){b.disabled=false;b.removeAttribute('disabled');b.style.pointerEvents='auto';b.style.position='relative';b.style.zIndex='10'}});list.querySelectorAll('.order').forEach(card=>{let text=card.innerText||'',m=text.match(/ISS-[A-Z0-9-]+/);if(!m)return;let o=w.getKasirOrder(m[0]);if(!o||o.payment_status!=='PAID'||card.querySelector('.waBtn'))return;let b=d.createElement('button');b.type='button';b.className='waBtn';b.title='Kirim kwitansi via WhatsApp';b.setAttribute('aria-label','Kirim kwitansi via WhatsApp');b.innerHTML='<svg viewBox="0 0 32 32"><path fill="#fff" d="M16 3.2C8.94 3.2 3.2 8.94 3.2 16c0 2.27.6 4.4 1.73 6.27L3 29l6.91-1.81A12.74 12.74 0 0 0 16 28.8c7.06 0 12.8-5.74 12.8-12.8S23.06 3.2 16 3.2Zm0 23.4c-2.03 0-4.01-.55-5.73-1.59-2.03-.55-4.01-1.59l-4.1 1.07 1.09-3.99-.27-.42A10.64 10.64 0 1 1 16 26.6Z"/></svg>';b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openWA(o)},true);let pb=[...card.querySelectorAll('button')].find(x=>/Print Pelanggan/i.test(x.textContent||''));if(pb)pb.parentElement.insertBefore(b,pb.nextSibling);else card.querySelector('.actions')?.appendChild(b)});return true}catch(e){return false}}function unlock(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}}['click','pointerdown','touchstart','keydown'].forEach(e=>window.addEventListener(e,unlock,{passive:true}));function beep(){try{unlock();if(!ctx)return;let t=ctx.currentTime;for(let i=0;i<8;i++){let o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=i%2?1046:784;g.gain.setValueAtTime(.0001,t+i*.2);g.gain.exponentialRampToValueAtTime(.25,t+i*.2+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.2+.14);o.connect(g);g.connect(ctx.destination);o.start(t+i*.2);o.stop(t+i*.2+.16)}}catch(e){}}function showAlarm(o,type){$('alarmTitle').textContent=type==='proof'?'💳 BUKTI QRIS MASUK':type==='paid'?'💰 PEMBAYARAN DITERIMA':'🔔 ORDER MASUK';$('alarmInfo').innerHTML='<b>'+esc(o.order_number||'-')+'</b><br>Meja '+esc(o.table_name||'Take Away')+' • '+esc(o.payment_method||'-')+' • '+money(o.total)+'<br>'+esc((o.items||[]).map(i=>i.name+' × '+i.qty).join(' • '));$('alarm').style.display='flex';beep();try{navigator.vibrate?.([300,100,300,100,700])}catch(e){}}$('ack').onclick=()=>{$('alarm').style.display='none';unlock()};async function api(path,opt={}){let r=await fetch(SUPA+path,{...opt,cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'}});if(!r.ok)throw Error(await r.text());return r.json()}async function poll(){try{helper();patch();let w=helper();if(!w)return;let p=w.getKasirPin();if(!p)return;let rows=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:p})});rows=Array.isArray(rows)?rows:[];if(first){rows.forEach(o=>seen.set(String(o.id),{pay:o.payment_status,proof:o.payment_proof_url||''}));first=false;return}for(let o of rows){let id=String(o.id),old=seen.get(id);if(!old){seen.set(id,{pay:o.payment_status,proof:o.payment_proof_url||''});showAlarm(o,'new');continue}if(old.proof!==String(o.payment_proof_url||'')&&o.payment_proof_url){showAlarm(o,'proof')}else if(old.pay!=='PAID'&&o.payment_status==='PAID'){showAlarm(o,'paid')}seen.set(id,{pay:o.payment_status,proof:o.payment_proof_url||''})}}catch(e){}}$('kasir').addEventListener('load',()=>{helper();patch();poll();setInterval(poll,1000);setInterval(patch,500)});setInterval(patch,1000);</script></body></html>
