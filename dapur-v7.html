<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>ISSHO CAFE — DAPUR v7</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:14px}.head,.card,.order{background:#151515;border:1px solid #333;border-radius:16px}.head,.card{padding:18px;margin:10px 0}.order{padding:16px;margin:12px 0;border-left:6px solid #b68142}.new{box-shadow:0 0 0 2px #b68142 inset}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;font-size:15px;cursor:pointer}.gold{background:#b68142;color:#fff}.green{background:#2f8b59;color:#fff}.blue{background:#315f9b;color:#fff}.dark{background:#292929;color:#fff;border:1px solid #444}.disabled{opacity:.45;cursor:not-allowed}.badge{display:inline-block;padding:6px 9px;border-radius:99px;background:#292929;margin:3px;font-size:12px}.item{padding:9px 0;border-bottom:1px solid #333;font-size:16px}.muted{color:#aaa;font-size:13px}.err{background:#5b201b;color:#ffdeda;padding:12px;border-radius:10px;margin-top:10px}input{width:100%;padding:13px;border:1px solid #444;border-radius:10px;background:#1b1b1b;color:#fff;font-size:17px}.hidden{display:none}.status-live{color:#71e39d;font-weight:800}
.component-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.component{border:1px solid #3a3a3a;border-radius:14px;padding:14px;background:#111}.component.food{border-left:6px solid #b68142}.component.drink{border-left:6px solid #315f9b}.component h3{margin:0 0 6px;font-size:20px}.component-status{font-weight:800;font-size:14px;margin-bottom:8px}.done{color:#71e39d}.pending{color:#ffc76b}.not-needed{color:#777}.component button{width:100%;margin-top:4px}.summary{margin-top:12px;padding:10px 12px;border-radius:10px;background:#202020;font-weight:800}.all-done{border:1px solid #2f8b59;background:#102319;color:#8ff0b0}
.top-alarm{display:none;position:fixed;top:0;left:0;right:0;z-index:10000;background:#e21f26;color:#fff;text-align:center;font-size:30px;font-weight:900;padding:15px 20px;box-shadow:0 4px 22px rgba(255,0,0,.65);animation:flash .55s steps(2,end) infinite}.top-alarm.show{display:block}@keyframes flash{50%{filter:brightness(1.55)}}
.alarm-card{display:none;position:fixed;right:18px;bottom:18px;z-index:10001;width:min(440px,calc(100vw - 36px));background:#171717;color:#fff;border:4px solid #e21f26;border-radius:18px;padding:18px;box-shadow:0 10px 45px rgba(0,0,0,.8)}.alarm-card.show{display:block}.alarm-title{font-size:23px;font-weight:900;color:#ff4b4b;margin-bottom:8px}.alarm-order{font-size:22px;font-weight:900;margin-bottom:8px}.alarm-info{font-size:16px;line-height:1.55}.alarm-card button{width:100%;margin-top:14px;font-size:17px}
@media(max-width:700px){.wrap{padding:8px}.top-alarm{font-size:20px;padding:12px 8px}.alarm-card{right:10px;bottom:10px;width:calc(100vw - 20px)}.component-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="topAlarm" class="top-alarm">🔔 ORDER BARU — SEGERA DITANGANI</div>
<main class="wrap">
<header class="head"><div class="row"><div><h1 style="margin:0">🍳 ISSHO CAFE — DAPUR</h1><div class="muted">Order terverifikasi dari Kasir • Alarm otomatis • Pengerjaan Makanan & Minuman</div></div><div id="live" class="status-live">● SIAP</div></div></header>
<section id="login" class="card"><h2 style="margin-top:0">🔐 Login Dapur</h2><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN Dapur"><div class="actions"><button class="gold" onclick="login()">Masuk Dapur</button></div><div id="msg"></div></section>
<section id="app" class="hidden">
<div class="card"><div class="row"><div><h2 style="margin:0">Order Dapur</h2><div id="state" class="muted">Menunggu order...</div></div><div class="actions"><button class="gold" onclick="load(true)">🔄 Refresh</button><button class="dark" onclick="logout()">Keluar</button></div></div></div>
<div id="list"></div>
</section>
</main>
<div id="alarmCard" class="alarm-card"><div class="alarm-title">🔔 ORDER DAPUR MASUK</div><div id="alarmOrder" class="alarm-order">ORDER BARU</div><div id="alarmInfo" class="alarm-info"></div><button class="gold" onclick="ackAlarm()">✓ LIHAT ORDER & HENTIKAN ALARM</button></div>
<script>
const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';
let P='',ORD=[],known=new Set(),ctx=null,alarmTimer=null,voiceTimer=null,firstLoad=true;
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>\\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&quot;',"'":'&#39;'}[m]));
async function api(path,opt={}){const h=Object.assign({apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},opt.headers||{});const r=await fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h}));const t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}
async function unlockAudio(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state!=='running')await ctx.resume()}catch(e){}}
function tone(freq,start,dur=.16,vol=.48){if(!ctx||ctx.state!=='running')return;const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(vol,start+.015);g.gain.exponentialRampToValueAtTime(.0001,start+dur);o.connect(g);g.connect(ctx.destination);o.start(start);o.stop(start+dur+.02)}
function beep(){try{if(!ctx||ctx.state!=='running')return;const n=ctx.currentTime;[0,.18,.36,.54,.72,.90,1.08,1.26,1.44].forEach((t,i)=>tone(i%2?1450:720,n+t,.15,.55))}catch(e){}}
function speak(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('PERHATIAN. ORDER BARU MASUK. '+text);u.lang='id-ID';u.rate=.82;u.pitch=.75;u.volume=1;speechSynthesis.speak(u)}catch(e){}}
function startAlarm(o){$('alarmOrder').textContent=o.order_number||'ORDER BARU';$('alarmInfo').innerHTML='<b>Meja '+esc(o.table_name||'Take Away')+'</b><br><span class="badge">'+esc(o.payment_method||'-')+'</span> <span class="badge">'+esc(o.payment_status||'-')+'</span><br><b>'+money(o.total)+'</b><br><br>'+(o.items||[]).map(i=>esc(i.name)+' × '+Number(i.qty||0)).join('<br>');$('alarmCard').classList.add('show');$('topAlarm').classList.add('show');beep();speak('Meja '+(o.table_name||'Take Away')+'. '+(o.order_number||'Order baru')+'.');try{navigator.vibrate?.([900,120,900,120,900,120,1400])}catch(e){}clearInterval(alarmTimer);clearInterval(voiceTimer);alarmTimer=setInterval(()=>{beep();try{navigator.vibrate?.([650,100,650])}catch(e){}},3000);voiceTimer=setInterval(()=>speak('Meja '+(o.table_name||'Take Away')+'. Order baru masuk.'),7500)}
function ackAlarm(){$('alarmCard').classList.remove('show');$('topAlarm').classList.remove('show');clearInterval(alarmTimer);clearInterval(voiceTimer);alarmTimer=voiceTimer=null;try{speechSynthesis.cancel()}catch(e){}unlockAudio()}
async function login(){await unlockAudio();const p=$('pin').value.trim();if(!/^\d{4,8}$/.test(p))return $('msg').innerHTML='<div class="err">PIN tidak valid.</div>';try{const raw=await api('/rest/v1/rpc/staff_role',{method:'POST',body:JSON.stringify({p_pin:p})});const role=String(typeof raw==='string'?raw:(Array.isArray(raw)?raw[0]:(raw&&raw.role)||'')).trim().toUpperCase();if(role!=='DAPUR')throw Error('PIN bukan akun Dapur.');P=p;$('login').className='hidden';$('app').className='';firstLoad=true;await load()}catch(e){$('msg').innerHTML='<div class="err">Login gagal: '+esc(e.message)+'</div>'}}
function logout(){ackAlarm();P='';location.reload()}
function isDrink(i){const c=String(i.category||'').toLowerCase();return c.includes('minum')||c.includes('kopi')||c.includes('wedang')||c.includes('alkohol')}
function splitItems(o){const items=o.items||[];return {food:items.filter(i=>!isDrink(i)),drink:items.filter(i=>isDrink(i))}}
function itemHtml(items){return items.map(i=>'<div class="item"><b>'+esc(i.name)+'</b> × '+Number(i.qty||0)+(i.category?'<span class="badge">'+esc(i.category)+'</span>':'')+(i.note?'<div class="muted">'+esc(i.note)+'</div>':'')+'</div>').join('')}
function componentHtml(o,type,items,done){const label=type==='food'?'🍳 MAKANAN':'🥤 MINUMAN';const cls=type==='food'?'food':'drink';const needed=items.length>0;const status=done?'✓ SUDAH SELESAI':needed?'⏳ BELUM SELESAI':'— TIDAK ADA';const statusClass=done?'done':needed?'pending':'not-needed';const disabled=!needed||done||o.order_status==='COMPLETED'||o.order_status==='CANCELLED';return '<div class="component '+cls+'"><h3>'+label+'</h3><div class="component-status '+statusClass+'">'+status+'</div>'+(needed?itemHtml(items):'<div class="muted">Tidak ada item '+(type==='food'?'makanan':'minuman')+' pada order ini.</div>')+'<button class="'+(type==='food'?'gold':'blue')+' '+(disabled?'disabled':'')+'" '+(disabled?'disabled':'onclick="completeComponent(\''+o.id+'\',\''+type+'\')"')+'>'+ (done?'✓ '+(type==='food'?'Makanan':'Minuman')+' Selesai':type==='food'?'✓ Tandai Makanan Selesai':'✓ Tandai Minuman Selesai')+'</button></div>'}
function render(){const rows=ORD.filter(o=>o.payment_status==='PAID'&&o.order_status!=='COMPLETED'&&o.order_status!=='CANCELLED');$('state').textContent=rows.length?rows.length+' order aktif':'Tidak ada order aktif';$('list').innerHTML=rows.length?rows.map(o=>{const s=splitItems(o);const allDone=(s.food.length===0||o.food_done)&&(s.drink.length===0||o.drink_done);return '<div class="order '+(o.order_status==='NEW'?'new':'')+'"><div class="row"><div><h2 style="margin:0">'+esc(o.order_number)+'</h2><span class="badge">Meja '+esc(o.table_name||'Take Away')+'</span><span class="badge">'+esc(o.payment_method)+'</span><span class="badge">'+esc(o.payment_status)+'</span><span class="badge">'+esc(o.order_status)+'</span></div><b>'+money(o.total)+'</b></div><div class="muted" style="margin-top:7px">Item makanan dan minuman diproses terpisah.</div>'+(o.order_status==='NEW'||o.order_status==='ACCEPTED'?'<div class="actions"><button class="gold" onclick="setStatus(\''+o.id+'\',\'PREPARING\')">👨‍🍳 Mulai Dikerjakan</button></div>':'')+'<div class="component-grid">'+componentHtml(o,'food',s.food,!!o.food_done)+componentHtml(o,'drink',s.drink,!!o.drink_done)+'</div>'+(allDone?'<div class="summary all-done">✓ SEMUA PEKERJAAN MAKANAN & MINUMAN SUDAH SELESAI</div>':'<div class="summary">⏳ Order menunggu penyelesaian semua bagian yang tersedia.</div>')+(o.order_status==='READY'?'<div class="actions"><button class="green" onclick="setStatus(\''+o.id+'\',\'COMPLETED\')">✓ Selesai / Tutup Order</button></div>':'')+'</div>'}).join(''):'<div class="card"><div class="muted">Belum ada order yang sudah dibayar.</div></div>'}
async function load(manual=false){try{if(!P)return;const oldIds=new Set(ORD.map(o=>String(o.id)));const next=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:P})});ORD=Array.isArray(next)?next:[];render();$('live').textContent='● TERHUBUNG • '+new Date().toLocaleTimeString('id-ID');const active=ORD.filter(o=>o.payment_status==='PAID'&&(o.order_status==='NEW'||o.order_status==='ACCEPTED'));for(const o of active){const id=String(o.id);if(!known.has(id)){known.add(id);if(!firstLoad||manual||oldIds.size===0)startAlarm(o)}}firstLoad=false}catch(e){$('live').textContent='● KONEKSI GAGAL';$('list').innerHTML='<div class="err">Gagal memuat order: '+esc(e.message)+'</div>'}}
async function completeComponent(id,type){try{const component=type==='food'?'FOOD':'DRINK';await api('/rest/v1/rpc/staff_update_kitchen_component',{method:'POST',body:JSON.stringify({p_pin:P,p_order_id:id,p_component:component})});await load(true)}catch(e){alert('Gagal menyimpan status: '+e.message)}}
async function setStatus(id,s){try{await api('/rest/v1/rpc/staff_update_order',{method:'POST',body:JSON.stringify({p_pin:P,p_order_id:id,p_status:s})});await load(true)}catch(e){alert(e.message)}}
document.addEventListener('pointerdown',unlockAudio,{once:true});$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});setInterval(()=>{if(P)load(false)},2500);
</script>
</body>
</html>
