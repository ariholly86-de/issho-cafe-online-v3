name: Fix Menu UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-menu-ui:
    if: github.event.head_commit.message != 'Fix menu active state and dark catalog'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply menu behavior and dark theme
        run: |
          python - <<'PY'
          from pathlib import Path

          # Customer: dark, low-glare menu cards while keeping inputs readable.
          p = Path('customer-v2.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'body{margin:0;font-family:Arial,sans-serif;background:#f6f0e7;color:#211d18}',
              'body{margin:0;font-family:Arial,sans-serif;background:#0b0b0b;color:#f2f2f2}'
          )
          s = s.replace(
              '.tools{position:sticky;top:72px;z-index:10;background:#f6f0e7;padding:8px 0}',
              '.tools{position:sticky;top:72px;z-index:10;background:#0b0b0b;padding:8px 0}'
          )
          s = s.replace(
              '.count{font-size:12px;color:#777;',
              '.count{font-size:12px;color:#b8b8b8;'
          )
          s = s.replace(
              '.menu{background:#fff;border:1px solid #e3d8ca;',
              '.menu{background:#171717;color:#f5f5f5;border:1px solid #333;'
          )
          s = s.replace(
              '.tag{display:inline-block;align-self:flex-start;background:#f1e5d3;',
              '.tag{display:inline-block;align-self:flex-start;background:#2a2a2a;color:#f2f2f2;'
          )
          s = s.replace(
              '.muted{color:#777;font-size:12px}',
              '.muted{color:#b8b8b8;font-size:12px}'
          )
          s = s.replace(
              '.card{background:#fff;border:1px solid #e3d8ca;',
              '.card{background:#171717;color:#f5f5f5;border:1px solid #333;'
          )
          s = s.replace(
              '.item{padding:9px 0;border-bottom:1px solid #eee}',
              '.item{padding:9px 0;border-bottom:1px solid #333}'
          )
          s = s.replace(
              '.hint{background:#fff6dd;padding:12px;border-radius:10px;font-size:13px}',
              '.hint{background:#29230f;color:#f5e8bd;padding:12px;border-radius:10px;font-size:13px}'
          )
          p.write_text(s, encoding='utf-8')

          # Owner: make the active checkbox authoritative and immediately refresh the card.
          p = Path('owner.html')
          s = p.read_text(encoding='utf-8')
          old = '<label><input id="a-${p.id}" type="checkbox" ${p.active?\'checked\':\'\'}> Menu aktif</label>'
          new = '<label style="display:flex;gap:8px;align-items:center"><input id="a-${p.id}" type="checkbox" ${p.active?\'checked\':\'\'}> <b>${p.active?\'AKTIF — tampil di Pelanggan & Kasir\':\'NONAKTIF — disembunyikan\'}</b></label>'
          s = s.replace(old, new)
          old2 = "alert('Menu dan harga tersimpan. Menu pelanggan langsung diperbarui.')"
          new2 = "alert($('a-'+id).checked?'Menu AKTIF. Sekarang tampil di Pelanggan & Kasir.':'Menu NONAKTIF. Sekarang disembunyikan dari Pelanggan & Kasir.');loadProducts()"
          s = s.replace(old2, new2)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer-v2.html owner.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix menu active state and dark catalog'
          git push