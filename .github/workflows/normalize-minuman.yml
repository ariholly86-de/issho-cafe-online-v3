name: Normalize Minuman Images
on:
  push:
    paths:
      - '.github/workflows/normalize-minuman.yml'
  workflow_dispatch:
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Process all Minuman images in batches
        shell: bash
        run: |
          set -e
          base='https://xvhimyflrqrdudijwjdn.supabase.co/functions/v1/run-minuman-normalizer'
          for offset in 0 20 40 60 80 100 120 140 160 180 200; do
            echo "Processing offset ${offset}"
            curl --fail --show-error --silent --max-time 900 "${base}?offset=${offset}&limit=20"
            echo
          done
