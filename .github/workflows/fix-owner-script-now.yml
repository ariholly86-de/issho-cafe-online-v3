name: Fix Owner Script Parser
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch broken printReport script tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('owner-v3.html')
          s=p.read_text()
          old="<script src=\"/ui-standard.js?v=20260830-ui-v2\"></script>"
          new="<scr'+'ipt src=\"/ui-standard.js?v=20260830-ui-v2\"></scr'+'ipt>"
          if old not in s:
              print('Target script tag not found; no change needed.')
              raise SystemExit(0)
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add owner-v3.html
          git commit -m 'Fix Owner report script parsing' || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          git rm -f .github/workflows/fix-owner-script-now.yml
          git commit -m 'Remove temporary Owner script fixer'
          git push
