name: Apply selected menu restore UX
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply selected restore UX') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch selected restore and faster catalog refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('owner-v3.html')
          s=p.read_text()
          s=s.replace('🟢 Aktifkan & Tampilkan','♻️ Pulihkan Menu Ini')
          old="async function setStock(id,active){const p=PS.find(x=>x.id===id);if(!p)return;try{await api('/rest/v1/rpc/owner_update_product',{method:'POST',body:JSON.stringify({p_owner_pin:P,p_product_id:id,p_name:p.name,p_price:Number(p.price),p_description:p.description||'',p_active:active})});await loadProducts()}catch(e){alert('Gagal mengubah status menu: '+e.message)}}"
          new="async function setStock(id,active){const p=PS.find(x=>x.id===id);if(!p)return;const old=p.active;p.active=active;renderProducts();try{const r=await api('/rest/v1/rpc/owner_update_product',{method:'POST',body:JSON.stringify({p_owner_pin:P,p_product_id:id,p_name:p.name,p_price:Number(p.price),p_description:p.description||'',p_active:active})});const saved=Array.isArray(r)?r[0]:r;if(!saved||saved.active!==active)throw Error('Status menu gagal disimpan.');await loadProducts()}catch(e){p.active=old;renderProducts();alert('Gagal mengubah status menu: '+e.message)}}"
          if old not in s:
              raise SystemExit('owner-v3 setStock signature not found')
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('customer-live-fixed.html')
          s=p.read_text()
          s=s.replace('setInterval(()=>loadCatalog(false),3000)','setInterval(()=>loadCatalog(false),1000)')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner-v3.html customer-live-fixed.html
          git diff --cached --quiet || git commit -m "Apply selected restore UX"
          git push