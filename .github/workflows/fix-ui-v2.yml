name: Fix UI v2

on:
  push:
    branches: [main]

concurrency:
  group: issho-ui-fix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix-ui:
    if: github.event.head_commit.message != 'Apply menu visibility categories and dark UI'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # CUSTOMER: make active=false impossible to render even if a future API response includes it.
          p = Path('customer-v2.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("select=id,name,description,price,image_url,sort_order&active=eq.true", "select=id,name,description,price,image_url,sort_order,active&active=eq.true")
          s = s.replace("const q=($('search').value||'').trim().toLowerCase();const list=products.filter(p=>", "const q=($('search').value||'').trim().toLowerCase();const list=products.filter(p=>p.active===true&&")
          s = s.replace("`<div class=\"card\">Menu tidak ditemukan.</div>`", "`<div class=\"card\" style=\"grid-column:1/-1;text-align:center;padding:35px\"><h2>Menu sedang tidak tersedia</h2><p class=\"muted\">Belum ada menu aktif. Silakan cek kembali stok/menu dari Owner.</p></div>`")
          p.write_text(s, encoding='utf-8')

          # OWNER: dark/no-glare interface + category-based menu editor.
          p = Path('owner.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('body{font-family:Arial;margin:0;background:#f6f0e7;color:#211d18}', 'body{font-family:Arial;margin:0;background:#0b0b0b;color:#f2f2f2}')
          s = s.replace('.card{background:#fff;border:1px solid #ddd2c5;', '.card{background:#151515;color:#f2f2f2;border:1px solid #333;')
          s = s.replace('.muted{color:#777;font-size:13px}', '.muted{color:#b8b8b8;font-size:13px}')
          s = s.replace('.order{border:1px solid #ddd;', '.order{background:#171717;border:1px solid #333;')
          s = s.replace('.item{padding:4px 0;border-bottom:1px solid #eee}', '.item{padding:6px 0;border-bottom:1px solid #333}')
          s = s.replace('input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;box-sizing:border-box;margin:5px 0}', 'input,select{width:100%;padding:11px;border:1px solid #3b3b3b;border-radius:9px;box-sizing:border-box;margin:5px 0;background:#1b1b1b;color:#fff}')
          s = s.replace('.report{background:#fffaf2;border:1px solid #d9c5a5;', '.report{background:#171717;border:1px solid #3b3b3b;color:#f2f2f2;')
          s = s.replace('<div id="products" class="grid"></div>', '<div id="menuCats" class="actions"></div><div id="products" class="grid"></div>')

          category_js = '''function menuCategory(p){const n=(p.name+' '+(p.description||'')).toLowerCase();if(n.includes('seblak'))return'Seblak';if(n.includes('steak'))return'Steak Ayam';if(n.includes('nasi goreng'))return'Nasi Goreng';if(n.startsWith('nasi ')||n.includes(' nasi '))return'Aneka Nasi';if(n.includes('mie')||n.startsWith('mie'))return'Aneka Mie';if(['jahe','sere','uwuh','telang','kunir','secang','rempah','tape singkong'].some(x=>n.includes(x)))return'Wedangan';if(['beef','bola lobster','bola udang','crabstick','crabstik','dumpling','hokaido','kornet','otak-otak','sate bakso','siomay','sosis','sukoi','tahu bakso'].some(x=>n.includes(x)))return'Aneka Bakaran';if(n.includes('dimsum'))return'Aneka Dimsum';if(['juice','minuman','soda','kopi','americano','matcha','es teh','teh'].some(x=>n.includes(x)))return'Aneka Minuman';return'Aneka Camilan'}
          let ownerCat='Semua';
          function renderOwnerCats(ps){const cats=['Semua','Aneka Nasi','Nasi Goreng','Aneka Mie','Seblak','Steak Ayam','Aneka Camilan','Aneka Bakaran','Aneka Dimsum','Aneka Minuman','Wedangan'];$('menuCats').innerHTML=cats.map(c=>`<button class="${ownerCat===c?'gold':'dark'}" onclick="ownerCat='${c}';renderOwnerProducts(window.ownerProducts||[])">${c}</button>`).join('')}
          function renderOwnerProducts(ps){const list=ownerCat==='Semua'?ps:ps.filter(p=>menuCategory(p)===ownerCat);$('products').innerHTML=list.map(p=>`<div class="card"><div class="muted" style="margin-bottom:6px">Kategori: <b>${menuCategory(p)}</b></div><img class="thumb" src="${esc(p.image_url||'')}" onerror="this.style.display='none'"><input id="n-${p.id}" value="${esc(p.name)}"><input id="p-${p.id}" type="number" min="0" value="${p.price}"><input id="d-${p.id}" value="${esc(p.description||'')}"><label style="display:flex;gap:8px;align-items:center"><input id="a-${p.id}" type="checkbox" ${p.active?'checked':''}> <b>${p.active?'AKTIF — tampil di Pelanggan & Kasir':'NONAKTIF — disembunyikan'}</b></label><input id="f-${p.id}" type="file" accept="image/jpeg,image/png,image/webp"><div class="actions"><button class="gold" onclick="saveProduct('${p.id}')">Simpan Menu & Harga</button><button class="green" onclick="uploadImage('${p.id}')">Upload Gambar</button></div><div id="s-${p.id}"></div></div>`).join('')||'<div class="card" style="grid-column:1/-1;text-align:center"><h3>Tidak ada menu pada kategori ini.</h3></div>'}
          '''
          marker = "async function loadProducts(){"
          idx = s.find(marker)
          if idx != -1:
              end = s.find("async function saveProduct", idx)
              if end != -1:
                  new_load = '''async function loadProducts(){try{const ps=await api('/rest/v1/products?select=id,name,description,price,image_url,active&order=name');window.ownerProducts=ps;renderOwnerCats(ps);renderOwnerProducts(ps)}catch(e){$('products').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}'''
                  s = s[:idx] + category_js + new_load + s[end:]
          p.write_text(s, encoding='utf-8')

          # STAFF/KASIR: dark, low-glare interface.
          for name in ('staff-v3.html','staff.html'):
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = s.replace('body{font-family:Arial;margin:0;background:#f6f0e7;color:#222}', 'body{font-family:Arial;margin:0;background:#0b0b0b;color:#f2f2f2}')
              s = s.replace('.card,.order,.product{background:#fff;border:1px solid #ddd2c5;', '.card,.order,.product{background:#151515;color:#f2f2f2;border:1px solid #333;')
              s = s.replace('.muted{color:#777;font-size:13px}', '.muted{color:#b8b8b8;font-size:13px}')
              s = s.replace('input,select{padding:10px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box}', 'input,select{padding:10px;border:1px solid #3b3b3b;border-radius:8px;width:100%;box-sizing:border-box;background:#1b1b1b;color:#fff}')
              s = s.replace('.item{padding:6px 0;border-bottom:1px solid #eee}', '.item{padding:6px 0;border-bottom:1px solid #333}')
              p.write_text(s, encoding='utf-8')

          # DAPUR: add order time directly below the order date, using the real order creation time in WIB.
          p = Path('dapur-v6.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('.order-date{color:#c9c9c9;font-size:13px;margin-top:5px;font-weight:700}', '.order-date{color:#c9c9c9;font-size:13px;margin-top:5px;font-weight:700}.order-time{color:#c9c9c9;font-size:13px;margin-top:2px;font-weight:700}')
          s = s.replace('.alarm-date{font-size:13px;color:#c9c9c9;font-weight:700;margin-bottom:8px}', '.alarm-date{font-size:13px;color:#c9c9c9;font-weight:700;margin-bottom:3px}.alarm-time{font-size:13px;color:#c9c9c9;font-weight:700;margin-bottom:8px}')
          s = s.replace('<div id="alarmDate" class="alarm-date"></div>', '<div id="alarmDate" class="alarm-date"></div><div id="alarmTime" class="alarm-time"></div>')
          pattern = r"function orderDate\(o\)\{.*?\}\nasync function api"
          replacement = '''function orderDateTime(o){const raw=o?.created_at||o?.order_date||o?.ordered_at||o?.createdAt||o?.orderDate;if(raw){const d=new Date(raw);if(!isNaN(d))return{date:d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Asia/Jakarta'}),time:d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Asia/Jakarta'})}}const m=String(o?.order_number||'').match(/^ISS-(\\d{6})-(\\d{6})-/i);if(m){const ds=m[1],ts=m[2];return{date:ds.slice(4,6)+'/'+ds.slice(2,4)+'/20'+ds.slice(0,2),time:ts.slice(0,2)+':'+ts.slice(2,4)+':'+ts.slice(4,6)}}return{date:'-',time:'-'}}
          function orderDate(o){return orderDateTime(o).date}
          async function api'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n == 1:
              s = s2
          s = s.replace("$('alarmDate').textContent='Tanggal Order: '+orderDate(o);", "const dt=orderDateTime(o);$('alarmDate').textContent='Tanggal Order: '+dt.date;$('alarmTime').textContent='Jam Order: '+dt.time+' WIB';")
          s = s.replace('<div class="order-date">Tanggal Order: '+orderDate(o)+'</div>', '<div class="order-date">Tanggal Order: '+orderDate(o)+'</div><div class="order-time">Jam Order: '+orderDateTime(o).time+' WIB</div>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer-v2.html owner.html staff-v3.html staff.html dapur-v6.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply menu visibility categories and dark UI'
          git push
