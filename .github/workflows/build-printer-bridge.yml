name: Build ISSHO Printer Bridge APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'printer-bridge-android/**'
      - 'android-printer-bridge/**'
      - '.github/workflows/build-printer-bridge.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-printer-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: issho-printer-bridge-debug-apk
          path: android-printer-bridge/app/build/outputs/apk/debug/app-debug.apk
