name: Optimize Dapur and Kasir Egress

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply safe polling reductions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []

          # KASIR: Realtime is already the primary event source. Remove the
          # aggressive 3-second RPC poll; the existing 60-second seed remains
          # as a low-frequency fallback/resync.
          p = Path('staff-alarm-optimized.html')
          s = p.read_text(encoding='utf-8')
          old = 'setTimeout(()=>setInterval(pollAlarm,3000),2500)'
          if old in s:
              s = s.replace(old, 'setTimeout(()=>{},2500)', 1)
              p.write_text(s, encoding='utf-8')
              changed.append(str(p))
          elif 'setInterval(pollAlarm,3000)' in s:
              s2 = s.replace('setInterval(pollAlarm,3000)', 'setInterval(pollAlarm,60000)', 1)
              if s2 != s:
                  p.write_text(s2, encoding='utf-8')
                  changed.append(str(p))
          else:
              raise SystemExit('KASIR safety check failed: expected 3-second poll pattern not found')

          # DAPUR: keep all existing order/printer/status logic intact and only
          # reduce the high-frequency refresh from 2.5s to 10s.
          p = Path('dapur-v8.html')
          s = p.read_text(encoding='utf-8')
          patterns = [
              (r'setInterval\(\s*load\s*,\s*2500\s*\)', 'setInterval(load,10000)'),
              (r'setInterval\(\s*\(\)\s*=>\s*load\(\)\s*,\s*2500\s*\)', 'setInterval(()=>load(),10000)'),
              (r'setInterval\(\s*refresh\s*,\s*2500\s*\)', 'setInterval(refresh,10000)'),
              (r'setInterval\(\s*\(\)\s*=>\s*refresh\(\)\s*,\s*2500\s*\)', 'setInterval(()=>refresh(),10000)'),
          ]
          found = False
          for pat, repl in patterns:
              s2, n = re.subn(pat, repl, s, count=1)
              if n:
                  s = s2
                  found = True
                  break
          if not found:
              raise SystemExit('DAPUR safety check failed: expected 2.5-second load/refresh interval not found')
          p.write_text(s, encoding='utf-8')
          changed.append(str(p))

          print('Changed:', ', '.join(changed))
          PY

      - name: Commit optimized files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staff-alarm-optimized.html dapur-v8.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Reduce Dapur and Kasir Supabase polling egress'
            git push
          fi
