name: Optimize Dapur and Kasir Egress

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply safe polling reductions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []

          # KASIR: Realtime remains primary. Remove the aggressive 3-second
          # RPC poll; keep the existing 60-second seed as resync/fallback.
          p = Path('staff-alarm-optimized.html')
          s = p.read_text(encoding='utf-8')
          cashier_patterns = [
              ('setTimeout(()=>setInterval(pollAlarm,3000),2500)', 'setTimeout(()=>{},2500)'),
              ('setInterval(pollAlarm,3000)', 'setInterval(pollAlarm,60000)'),
          ]
          cashier_done = False
          for old, new in cashier_patterns:
              if old in s:
                  s = s.replace(old, new, 1)
                  cashier_done = True
                  break
          if not cashier_done:
              raise SystemExit('KASIR safety check failed: 3-second poll pattern not found')
          p.write_text(s, encoding='utf-8')
          changed.append(str(p))

          # DAPUR: only reduce the existing 2.5-second polling cadence.
          # Do not alter order, payment, printer, status, date/time, or UI logic.
          p = Path('dapur-v8.html')
          s = p.read_text(encoding='utf-8')
          matches = list(re.finditer(r'setInterval\((.{0,800}?),2500\)', s, flags=re.S))
          if len(matches) != 1:
              print('DAPUR interval candidates:', len(matches))
              for m in matches:
                  print('CANDIDATE:', m.group(0)[:500])
              raise SystemExit('DAPUR safety check failed: expected exactly one 2.5-second interval')
          m = matches[0]
          target = m.group(0)
          replacement = target[:-5] + '10000)'  # replace trailing ,2500)
          s = s[:m.start()] + replacement + s[m.end():]
          p.write_text(s, encoding='utf-8')
          changed.append(str(p))

          print('Changed:', ', '.join(changed))
          PY

      - name: Commit optimized files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staff-alarm-optimized.html dapur-v8.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Reduce Dapur and Kasir Supabase polling egress'
            git push
          fi
