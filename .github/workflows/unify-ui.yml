name: ISSHO CAFE - Unify UI
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize all public and nested screens
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = [
            'staff-alarm.html',
            'dapur-v8.html',
            'owner-rpp02n.html',
            'customer.html',
            'qr-meja.html',
            'stock-v2.html',
            'owner.html',
            'owner-v3.html',
            'customer-live-fixed.html',
            'staff-printer-universal.html',
          ]
          script = '<script src="/ui-standard.js?v=20260830-ui-v2"></script>'

          for name in pages:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'<html(?:\s+lang=["\'][^"\']*["\'])?', '<html lang="id"', s, count=1, flags=re.I)
              s=s.replace('/ui-standard.js?v=20260830-ui-v1', '/ui-standard.js?v=20260830-ui-v2')
              if '/ui-standard.js' not in s:
                  s=s.replace('</body>', script+'</body>', 1)
              p.write_text(s,encoding='utf-8')

          # Never let production navigation fall back to obsolete snapshots.
          p=Path('stock-v2.html')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              s=s.replace('/customer-v3.html','/customer.html')
              s=s.replace('/dapur-v7.html','/dapur-v8.html')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staff-alarm.html dapur-v8.html owner-rpp02n.html customer.html qr-meja.html stock-v2.html owner.html owner-v3.html customer-live-fixed.html staff-printer-universal.html ui-standard.js .github/workflows/unify-ui.yml
          git diff --cached --quiet && exit 0
          git commit -m "Unify ISSHO CAFE UI across devices"
          git push
