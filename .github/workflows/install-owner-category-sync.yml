name: Install Owner Category Sync
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject category sync into Owner wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('owner.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/owner-category-sync.js?v=20260831-category-20"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s: raise SystemExit('owner.html body marker not found; aborting')
              s=s.replace(marker,tag+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit Owner wrapper patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner.html
          git diff --cached --quiet && exit 0
          git commit -m "Load shared 20-category Owner sync"
          git push
