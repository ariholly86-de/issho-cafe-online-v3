name: Restore Owner Stable
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore stable Owner files and remove only test order button
        run: |
          set -e
          # Keep owner-rpp02n.html untouched so its selected-menu restore UX is preserved.
          git checkout 3d6f131c222a67cc3249bc7d552dbb5e3dfddbd6 -- owner-v3.html owner.html
          python3 - <<'PY'
          from pathlib import Path
          # Remove only the test-order button from the stable Owner UI.
          p=Path('owner-v3.html')
          s=p.read_text()
          s=s.replace('<button class="red" onclick="clearSim()">🧹 Hapus Order Uji Coba</button>','')
          p.write_text(s)
          # Make transfer/payment proof thumbnails very compact in the order list.
          p=Path('owner.html')
          s=p.read_text()
          marker='.proof{max-width:320px;width:100%;border-radius:10px}'
          compact='.proof{max-width:82px;width:82px;height:62px;object-fit:contain;border-radius:7px;cursor:zoom-in;display:block}'
          if marker in s:
              s=s.replace(marker,compact)
          elif '.proof{' in s:
              import re
              s=re.sub(r'\.proof\{[^}]*\}',compact,s,count=1)
          else:
              s=s.replace('</style>',compact+'</style>',1)
          p.write_text(s)
          PY
          git add owner-v3.html owner.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Compact transfer proof thumbnail in Owner'
          git push
