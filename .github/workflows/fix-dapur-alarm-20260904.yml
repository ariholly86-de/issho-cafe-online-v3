name: Fix Dapur Alarm Audio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch alarm audio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('staff-alarm-optimized.html')
          s = p.read_text(encoding='utf-8')
          if 'ALARM_AUDIO_FIX_20260904' in s:
              print('Alarm fix already applied')
              raise SystemExit(0)

          old = "function beep(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const n=audioCtx.currentTime;for(let i=0;i<6;i++){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=i%2?1046:784;g.gain.setValueAtTime(.0001,n+i*.16);g.gain.exponentialRampToValueAtTime(.25,n+i*.16+.02);g.gain.exponentialRampToValueAtTime(.0001,n+i*.16+.11);o.connect(g);g.connect(audioCtx.destination);o.start(n+i*.16);o.stop(n+i*.16+.13)}}catch(e){}}"
          new = """/* ALARM_AUDIO_FIX_20260904 */
          async function unlockAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();if(audioCtx.state==='running'){const o=audioCtx.createOscillator(),g=audioCtx.createGain();g.gain.value=.00001;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.01);return true}}catch(e){}return false}
          async function beep(){try{if(!await unlockAudio())return;const n=audioCtx.currentTime+.03;for(let i=0;i<8;i++){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=i%2?1046:784;const t=n+i*.18;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.28,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.13);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.15)}}catch(e){}}"""
          if old not in s:
              raise SystemExit('Original beep function not found; no changes made')
          s = s.replace(old, new, 1)

          marker = "$('ack').onclick=()=>{$('alarm').style.display='none';clearTimeout(alarmTimer)};"
          replacement = marker + "document.addEventListener('pointerdown',unlockAudio,{once:false,passive:true});document.addEventListener('keydown',unlockAudio,{once:false});window.addEventListener('focus',()=>unlockAudio());"
          if marker not in s:
              raise SystemExit('Alarm acknowledge handler not found')
          s = s.replace(marker, replacement, 1)

          p.write_text(s, encoding='utf-8')
          print('Alarm audio patch applied')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staff-alarm-optimized.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix dapur alarm sound and audio unlock"
          git push
