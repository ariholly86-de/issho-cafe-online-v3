name: Normalize Minuman Images Parallel
on:
  push:
    paths:
      - '.normalize-trigger'
  workflow_dispatch:
jobs:
  normalize:
    strategy:
      fail-fast: false
      matrix:
        offset: [0,20,40,60,80,100,120,140,160,180,200]
    runs-on: ubuntu-latest
    steps:
      - name: Process batch
        shell: bash
        run: |
          set -e
          curl --fail --show-error --silent --max-time 900 "https://xvhimyflrqrdudijwjdn.supabase.co/functions/v1/run-minuman-normalizer?offset=${{ matrix.offset }}&limit=20"
          echo