name: Owner Menu Layout One-Time
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Improve Owner menu editing layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve menu editor layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('owner-v3.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* OWNER MENU EDITOR LAYOUT V1 */'
          css = '''\n/* OWNER MENU EDITOR LAYOUT V1 */\n#menu{max-width:100%;}\n#menu .menu-tools{padding:14px 0 16px;}\n#cats{display:flex;flex-wrap:wrap;gap:8px;overflow:visible;align-items:stretch;padding:10px 0;}\n#cats button{min-height:44px;padding:10px 14px;white-space:normal;line-height:1.15;}\n#products{display:grid;grid-template-columns:repeat(3,minmax(330px,1fr));gap:16px;align-items:start;}\n#products>.card{margin:0;padding:16px;min-width:0;}\n#products .thumb{height:190px;object-fit:contain;padding:6px;border:1px solid #303030;}\n#products input[type=text],#products input[type=number],#products input:not([type]),#products input[type=file]{min-height:44px;font-size:15px;}\n#products input[type=checkbox]{width:20px!important;height:20px;margin:0;}\n#products .actions{gap:8px;}\n#products .actions button{min-height:44px;}\n@media (max-width:1250px){#products{grid-template-columns:repeat(2,minmax(320px,1fr));}}\n@media (max-width:760px){#products{grid-template-columns:1fr;gap:12px;}#products>.card{padding:14px;}#products .thumb{height:170px;}#cats button{flex:1 1 auto;min-width:130px;}}\n@media (max-width:480px){#cats button{min-width:calc(50% - 4px);font-size:13px;}#products .actions button{flex:1 1 100%;}#products .thumb{height:150px;}}\n'''
          if marker not in s:
              s = s.replace('</style>', css + '</style>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit layout and remove temporary workflow
        run: |
          git config user.name 'ariholly86-de'
          git config user.email 'ariholly86@gmail.com'
          git add owner-v3.html
          git rm .github/workflows/owner-menu-layout-once.yml
          git commit -m 'Improve Owner menu editing layout'
          git push
