name: Fix Owner Report Frame
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix report iframe context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('owner-rpp02n.html')
          s=p.read_text()
          old="function app(){try{return frame.contentWindow.document.getElementById('app').contentWindow}catch(e){return null}}"
          new="function app(){try{const inner=frame.contentWindow.document.getElementById('app');return inner&&inner.contentWindow?inner.contentWindow:null}catch(e){return null}}"
          if old not in s:
              raise SystemExit('Target app() function not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add owner-rpp02n.html
          git commit -m 'Fix Owner report iframe connection'
          git push
      - name: Remove temporary workflow
        run: |
          git rm -f .github/workflows/fix-owner-report-frame.yml
          git commit -m 'Remove temporary Owner report fixer'
          git push
