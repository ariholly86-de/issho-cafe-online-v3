name: Fix Owner Login Regex
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix login regex only
        shell: python
        run: |
          from pathlib import Path
          p = Path('owner-v3-safe.html')
          s = p.read_text(encoding='utf-8')
          old = r"/^\\d{4,8}$/.test(p)"
          new = r"/^\d{4,8}$/.test(p)"
          if old not in s:
              print('No broken regex found; nothing to change.')
              raise SystemExit(0)
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner-v3-safe.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Owner login PIN validation regex"
          git push
