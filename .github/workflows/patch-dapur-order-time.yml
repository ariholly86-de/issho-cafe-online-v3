name: Patch Dapur Order Time
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dapur-v6.html
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('dapur-v6.html')
          s = p.read_text(encoding='utf-8')
          if 'order-time' in s and 'function orderDateTime(o)' in s and 'id="alarmTime"' in s:
              print('Already patched')
              Path('.github/workflows/patch-dapur-order-time.yml').unlink(missing_ok=True)
              raise SystemExit(0)

          s = s.replace(
              '.order-date{color:#c9c9c9;font-size:13px;margin-top:5px;font-weight:700}',
              '.order-date{color:#c9c9c9;font-size:13px;margin-top:5px;font-weight:700}.order-time{color:#c9c9c9;font-size:13px;margin-top:2px;font-weight:700}'
          )
          s = s.replace(
              '.alarm-date{font-size:13px;color:#c9c9c9;font-weight:700;margin-bottom:8px}',
              '.alarm-date{font-size:13px;color:#c9c9c9;font-weight:700;margin-bottom:3px}.alarm-time{font-size:13px;color:#c9c9c9;font-weight:700;margin-bottom:8px}'
          )
          s = s.replace(
              '<div id="alarmDate" class="alarm-date"></div>',
              '<div id="alarmDate" class="alarm-date"></div><div id="alarmTime" class="alarm-time"></div>'
          )

          pattern = r"function orderDate\(o\)\{.*?\}\nasync function api"
          replacement = '''function orderDateTime(o){const raw=o?.created_at||o?.order_date||o?.ordered_at||o?.createdAt||o?.orderDate;if(raw){const d=new Date(raw);if(!isNaN(d))return{date:d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Asia/Jakarta'}),time:d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Asia/Jakarta'})}}const m=String(o?.order_number||'').match(/^ISS-(\\d{6})-(\\d{6})-/i);if(m){const ds=m[1],ts=m[2];return{date:ds.slice(4,6)+'/'+ds.slice(2,4)+'/20'+ds.slice(0,2),time:ts.slice(0,2)+':'+ts.slice(2,4)+':'+ts.slice(4,6)}}return{date:'-',time:'-'}}\nfunction orderDate(o){return orderDateTime(o).date}\nasync function api'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not locate orderDate function')
          s = s2

          s = s.replace(
              "$('alarmDate').textContent='Tanggal Order: '+orderDate(o);",
              "const dt=orderDateTime(o);$('alarmDate').textContent='Tanggal Order: '+dt.date;$('alarmTime').textContent='Jam Order: '+dt.time+' WIB';"
          )
          s = s.replace(
              '<div class="order-date">Tanggal Order: '+orderDate(o)+'</div>',
              '<div class="order-date">Tanggal Order: '+orderDate(o)+'</div><div class="order-time">Jam Order: '+orderDateTime(o).time+' WIB</div>'
          )

          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/patch-dapur-order-time.yml').unlink(missing_ok=True)
          print('Patched dapur-v6.html with order date/time from created_at, WIB fallback to ISS timestamp')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dapur-v6.html .github/workflows/patch-dapur-order-time.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add order date and time to kitchen display"
            git push
          fi
