name: Restore Owner Login Safely
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good Owner runtime
        shell: bash
        run: |
          set -e
          git checkout 7ed80144c33f8593f145547630f0074fd06e8b9c -- owner-v3-safe.html
          python - <<'PY'
          from pathlib import Path
          p=Path('owner-v3-safe.html')
          s=p.read_text()
          s=s.replace('.proof{max-width:320px;width:100%;border-radius:10px}', '.proof{width:auto!important;max-width:120px!important;height:auto!important;max-height:150px!important;object-fit:contain!important;border-radius:7px;border:1px solid #303030;display:block;cursor:zoom-in}')
          s=s.replace('@media(max-width:700px){', '@media(max-width:700px){.proof{max-width:90px!important;max-height:120px!important}')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add owner-v3-safe.html
          if git diff --cached --quiet; then
            echo 'Owner runtime already repaired.'
          else
            git commit -m 'Restore Owner login and keep proof thumbnail small'
            git push origin HEAD:main
          fi
