name: TEMP Owner Font Normalization
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-owner-font-normal.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply style-only Owner font override
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('owner-rpp02n.html')
          s=p.read_text(encoding='utf-8')
          old='<style id="issho-global-normal-font">*,*::before,*::after{font-weight:400!important}.material-icons,.icon,[aria-hidden="true"]{font-weight:400!important}</style>'
          new='<style id="issho-global-normal-font">*,*::before,*::after{font-weight:400!important}button,.btn,b,strong,h1,h2,h3,h4,h5,h6,.name,.badge,.stat,.order,.item,.actions,.muted,.cat,.price,.empty{font-weight:400!important}.material-icons,.icon,[aria-hidden="true"]{font-weight:400!important}</style>'
          if old not in s:
              raise SystemExit('Expected Owner global font style not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('owner-v3-safe.html')
          s=p.read_text(encoding='utf-8')
          old='<style id="issho-global-normal-font">*,*::before,*::after{font-weight:400!important}.material-icons,.icon,[aria-hidden="true"]{font-weight:400!important}</style>'
          new='<style id="issho-global-normal-font">*,*::before,*::after{font-weight:400!important}button,.btn,b,strong,h1,h2,h3,h4,h5,h6,.badge,.stat,.order,.item,.actions,.muted,.cat,.price,.empty,label{font-weight:400!important}.material-icons,.icon,[aria-hidden="true"]{font-weight:400!important}</style>'
          if old not in s:
              raise SystemExit('Expected Owner safe global font style not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit style-only change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add owner-rpp02n.html owner-v3-safe.html
          git diff --cached --quiet || git commit -m 'Normalize Owner text weight only'
          git push