name: Fix Kasir All Fonts Normal
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply style-only override to actual Kasir page
        shell: bash
        run: |
          set -euo pipefail
          css='<style id="issho-kasir-normal-font">*,*::before,*::after{font-weight:400!important}b,strong,h1,h2,h3,h4,h5,h6,button,.badge,.order-datetime,.expense-table tfoot td,.newpay{font-weight:400!important}</style>'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('staff-v6.html')
          css='<style id="issho-kasir-normal-font">*,*::before,*::after{font-weight:400!important}b,strong,h1,h2,h3,h4,h5,h6,button,.badge,.order-datetime,.expense-table tfoot td,.newpay{font-weight:400!important}</style>'
          s=p.read_text(encoding='utf-8')
          if 'id="issho-kasir-normal-font"' not in s:
              if '</head>' not in s: raise SystemExit('Missing </head> in staff-v6.html')
              s=s.replace('</head>',css+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staff-v6.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make Kasir and order history text normal weight'
          git pull --rebase origin main
          git push origin HEAD:main
