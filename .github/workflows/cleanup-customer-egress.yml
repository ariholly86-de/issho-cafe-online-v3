name: Cleanup Customer Catalog Polling

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove only the 1-second catalog poll
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('customer-live-fixed.html')
          s = p.read_text(encoding='utf-8')
          old = 'async function start(){await loadCatalog(true);setInterval(()=>loadCatalog(false),1000)}'
          new = 'async function start(){await loadCatalog(true)}'
          if old not in s:
              raise SystemExit('Safety check failed: exact 1-second catalog polling code was not found. No changes made.')
          if s.count(old) != 1:
              raise SystemExit('Safety check failed: expected exactly one target. No changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('Customer catalog 1-second polling removed; initial catalog load preserved.')
          PY
      - name: Commit exact change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer-live-fixed.html
          git commit -m 'Stop customer catalog polling to reduce egress'
          git push
