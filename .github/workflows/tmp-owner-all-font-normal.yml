name: Owner all font normal
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force every Owner text to regular
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for fn in ['owner-v3-safe.html','owner-rpp02n.html','owner-detail-repair.js']:
              p=Path(fn)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'font-weight\s*:\s*[5-9]00', 'font-weight:400', s, flags=re.I)
              s=re.sub(r'font-weight\s*:\s*bold', 'font-weight:400', s, flags=re.I)
              s=s.replace('<b>','<span>').replace('</b>','</span>')
              s=s.replace('<strong>','<span>').replace('</strong>','</span>')
              s=s.replace('owner-v3-safe.html?v=20260901-no-orders-01','owner-v3-safe.html?v=20260906-all-font-normal')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for fn in ['owner-v3-safe.html','owner-rpp02n.html','owner-detail-repair.js']:
              s=Path(fn).read_text(encoding='utf-8')
              bad=['font-weight:900','font-weight:800','font-weight:700','font-weight:bold']
              if any(x in s.lower() for x in bad):
                  raise SystemExit(f'Bold weight remains in {fn}; refusing deployment')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add owner-v3-safe.html owner-rpp02n.html owner-detail-repair.js
          git commit -m 'Make all Owner text regular weight' || exit 0
          git push