name: Fix Customer Font
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only font-weight/size fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('customer-ui-v6.html')
          s=p.read_text(encoding='utf-8')
          old=s
          s=s.replace('font-size:14px!important;font-weight:700!important;line-height:1.15!important;margin:0!important;padding:0!important;color:#fff!important;min-height:0!important;transition:none!important;animation:none!important;transform:none!important','font-size:11px!important;font-weight:400!important;line-height:1.15!important;margin:0!important;padding:0!important;color:#fff!important;min-height:0!important;transition:none!important;animation:none!important;transform:none!important')
          s=s.replace('font-size:18px!important;font-weight:900!important;line-height:1.1!important;margin:0!important;padding:0!important;color:#fff!important','font-size:11px!important;font-weight:400!important;line-height:1.1!important;margin:0!important;padding:0!important;color:#fff!important')
          s=s.replace("#menu .menu>h3{font-size:14px!important;font-weight:700!important;line-height:1.1!important;margin:0!important}","#menu .menu>h3{font-size:11px!important;font-weight:400!important;line-height:1.1!important;margin:0!important}")
          s=s.replace("#menu .menu .price{font-size:16px!important;font-weight:900!important;line-height:1.05!important}","#menu .menu .price{font-size:11px!important;font-weight:400!important;line-height:1.05!important}")
          s=s.replace("title.style.setProperty('font-size','14px','important');title.style.setProperty('font-weight','700','important')","title.style.setProperty('font-size','11px','important');title.style.setProperty('font-weight','400','important')")
          s=s.replace("price.style.setProperty('font-size',win&&win.innerWidth<=600?'16px':'18px','important');price.style.setProperty('font-weight','900','important')","price.style.setProperty('font-size','11px','important');price.style.setProperty('font-weight','400','important')")
          if s==old:
            raise SystemExit('No expected font patterns found; refusing unrelated changes')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer-ui-v6.html
          git commit -m 'Make customer food names and prices regular' || exit 0
          git push
