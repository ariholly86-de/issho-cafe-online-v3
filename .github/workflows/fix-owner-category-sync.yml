name: Fix Owner Category Sync Startup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Owner startup sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('owner-rpp02n.html')
          s=p.read_text(encoding='utf-8')
          old="function attach(){try{const inner=frame.contentWindow.document.getElementById('app');if(!inner||!inner.contentDocument)return false;const w=inner.contentWindow;if(!w.document.getElementById('reports'))return false;install(w);enhanceMenu(w);return true}catch(e){return false}}"
          new="function attach(){try{const inner=frame.contentWindow.document.getElementById('app');if(!inner||!inner.contentDocument)return false;const w=inner.contentWindow;if(!w.document.getElementById('reports'))return false;install(w);enhanceMenu(w);sync();return true}catch(e){return false}}"
          if old not in s:
              print('Owner attach target already patched or not found; leaving unchanged.')
          else:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner-rpp02n.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Owner category sync startup"
          git push
