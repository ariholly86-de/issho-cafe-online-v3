name: Add Owner order date time display
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: !contains(github.event.head_commit.message, 'Add Owner order date time display')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add non-invasive date/time display
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('owner-rpp02n.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- OWNER ORDER DATETIME V1 -->'
          if marker in s: raise SystemExit(0)
          code='''<!-- OWNER ORDER DATETIME V1 -->\n<script>(function(){function fmt(n){var m=String(n||'').match(/^ISS-(\\d{6})-(\\d{6})-/i);if(!m)return null;var d=m[1],t=m[2];return {date:d.slice(4,6)+'/'+d.slice(2,4)+'/20'+d.slice(0,2),time:t.slice(0,2)+':'+t.slice(2,4)+':'+t.slice(4,6)};}function run(){try{var f=document.getElementById('owner'),w=f&&f.contentDocument;if(!w)return;w.querySelectorAll('#orderList .order').forEach(function(c){if(c.dataset.dtV1)return;var b=c.querySelector('.row b');var x=fmt(b&&b.textContent);if(!x)return;var q=c.querySelector('.row div');if(!q)return;var e=w.createElement('span');e.className='issho-order-date';e.innerHTML='📅 Tanggal Order: <b>'+x.date+'</b><br>🕐 Jam Order: <b>'+x.time+' WIB</b>';q.appendChild(e);c.dataset.dtV1='1';});}catch(e){}}var f=document.getElementById('owner');if(f)f.addEventListener('load',function(){setTimeout(run,500)});setInterval(run,1500);setTimeout(run,1000)})();</script>\n'''
          i=s.rfind('</body>')
          if i<0: raise SystemExit('No body tag; abort safely')
          p.write_text(s[:i]+code+s[i:],encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add owner-rpp02n.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Owner order date time display"
          git push
