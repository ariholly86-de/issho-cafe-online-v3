<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — KASIR</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="/staff-alarm.html?v=20260826-kasir-ready-v2"></iframe><script>const f=document.getElementById('app');function patch(){try{const d=f.contentDocument;if(!d)return;const b=d.getElementById('readyWa');if(!b||b.dataset.invoicePatched)return;b.dataset.invoicePatched='1';b.onclick=function(){const o=f.contentWindow.readyOrder;if(!o)return;let p=String(o.customer_whatsapp||'').replace(/\D/g,'');if(p.startsWith('0'))p='62'+p.slice(1);else if(p.startsWith('8'))p='62'+p;if(!/^62\d{8,15}$/.test(p)){alert('Nomor WhatsApp pelanggan belum tersedia pada order ini.');return}const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);const items=(o.items||[]).map(i=>`• ${i.name} × ${Number(i.qty||0)} — ${money(Number(i.price||0)*Number(i.qty||0))}`).join('\n');const msg=`*ISSHO CAFE — PESANAN SUDAH SIAP*\n\nHalo, pesanan Anda *${o.order_number||'-'}* sudah selesai disiapkan.\n\n🍽️ *Pesanan sudah siap, silakan diambil di meja kasir.*\n\n*INVOICE*\nNo. Order: ${o.order_number||'-'}\nMeja: ${o.table_name||'Take Away'}\nPembayaran: ${o.payment_method||'-'}\n${items||'• -'}\n\n*TOTAL: ${money(o.total)}*\n\nTerima kasih 🙏`;f.contentWindow.open('https://web.whatsapp.com/send?phone='+p+'&text='+encodeURIComponent(msg),'_blank','noopener,noreferrer');const ready=d.getElementById('ready');if(ready)ready.style.display='none';f.contentWindow.readyOrder=null}catch(e){}}}f.addEventListener('load',()=>{setTimeout(patch,500);setInterval(patch,1000)});setInterval(patch,1500);</script></body></html>
