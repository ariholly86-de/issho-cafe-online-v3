<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Center — Cafe SaaS</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.card{background:#151515;border:1px solid #333;border-radius:18px;padding:22px;margin:14px 0}.brand{text-align:center}.brand h1{margin:0 0 6px}.muted{color:#999;font-size:13px}.input{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#0d0d0d;color:#fff;margin:6px 0 12px;font-size:15px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;background:#b68142;color:#fff}.btn.dark{background:#292929;border:1px solid #444}.danger{background:#7b2727}.hidden{display:none}.msg{margin-top:12px;padding:11px;border-radius:10px;background:#3b1919}.ok{background:#193b25}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.stat{font-size:13px;line-height:1.7;color:#bbb}.stat b{color:#fff}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.green{background:#1c5a35}.red{background:#642323}.small{font-size:11px;color:#777;margin-top:12px}@media(max-width:560px){.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><section id="login" class="card"><div class="brand"><h1>ADMIN CENTER</h1><div class="muted">Pusat kontrol aplikasi cafe & langganan</div></div><label>Username Admin</label><input class="input" id="user" value="ADMIN"><label>Password Admin</label><input class="input" id="pass" type="password" placeholder="Masukkan password admin"><button class="btn" onclick="login()">MASUK ADMIN</button><div id="loginmsg"></div><div class="small">Pusat administrasi produksi untuk seluruh cafe dan masa langganannya.</div></section><section id="panel" class="hidden"><div class="card"><div class="top"><div><h1 style="margin:0">Dashboard Cafe</h1><div class="muted">Kelola akun, masa berlaku, dan seluruh akses aplikasi.</div></div><button class="btn dark" onclick="logout()">KELUAR</button></div><div id="list" class="grid" style="margin-top:18px"></div></div></section></main><script>const SUPA='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';let token=sessionStorage.getItem('admin_token');function api(fn,body){return fetch(SUPA+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'}).then(async r=>{const t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null})}async function login(){const m=document.getElementById('user').value.trim(),p=document.getElementById('pass').value.trim(),el=document.getElementById('loginmsg');el.innerHTML='';try{const r=await api('admin_login',{p_username:m,p_password:p});if(!r?.[0]?.ok)throw Error(r?.[0]?.message||'Login gagal');token=r[0].token;sessionStorage.setItem('admin_token',token);document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');load()}catch(e){el.innerHTML='<div class="msg">'+e.message+'</div>'}}async function load(){try{const rows=await api('admin_list_cafes',{p_token:token});render(rows||[])}catch(e){if(String(e.message).includes('Sesi'))logout();else document.getElementById('list').innerHTML='<div class="msg">'+e.message+'</div>'}}function render(rows){const el=document.getElementById('list');if(!rows.length){el.innerHTML='<div class="card">Belum ada cafe.</div>';return}el.innerHTML=rows.map(r=>{const active=r.access_allowed;return `<div class="card"><div class="top"><h2 style="margin:0">${esc(r.cafe_name)}</h2><span class="badge ${active?'green':'red'}">${active?'AKTIF':'TERKUNCI'}</span></div><div class="stat">Member: <b>${esc(r.member_code||'-')}</b><br>Paket: <b>${esc(r.plan_name||'-')}</b><br>Mulai: <b>${fmt(r.starts_at)}</b><br>Berakhir: <b>${fmt(r.expires_at)}</b><br>Sisa: <b>${r.remaining_days||0} hari</b><br>Status akun: <b>${r.is_active?'Aktif':'Nonaktif'}</b></div><div class="actions"><button class="btn" onclick="trial('${r.cafe_id}')">TRIAL 7 HARI</button><button class="btn" onclick="extend('${r.cafe_id}')">PERPANJANG</button><button class="btn ${r.is_active?'danger':'dark'}" onclick="toggle('${r.cafe_id}',${r.is_active})">${r.is_active?'NONAKTIFKAN':'AKTIFKAN'}</button></div></div>`}).join('')}async function trial(id){await setSub(id,'TRIAL 7 HARI',7)}async function extend(id){const d=prompt('Berapa hari perpanjangan?','30');if(!d)return;const n=parseInt(d,10);if(!Number.isInteger(n)||n<1||n>3650)return alert('Durasi 1–3650 hari.');await setSub(id,'LANGGANAN',n)}async function setSub(id,name,days){try{await api('admin_set_subscription',{p_token:token,p_cafe_id:id,p_plan_name:name,p_days:days,p_starts_at:new Date().toISOString()});await load();alert('Berhasil. Masa berlaku diperbarui.')}catch(e){alert(e.message)}}async function toggle(id,current){if(!confirm(current?'Nonaktifkan akses cafe ini? Semua link cafe akan terkunci.':'Aktifkan kembali akses cafe ini?'))return;try{await api('admin_set_cafe_status',{p_token:token,p_cafe_id:id,p_is_active:!current});await load()}catch(e){alert(e.message)}}function fmt(v){return v?new Date(v).toLocaleString('id-ID'):'-'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function logout(){sessionStorage.removeItem('admin_token');token=null;document.getElementById('panel').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}if(token){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');load()}</script></body></html>
