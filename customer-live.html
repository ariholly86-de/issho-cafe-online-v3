<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>ISSHO CAFE — Menu Pelanggan</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="app" title="ISSHO CAFE"></iframe>
<script>
const f=document.getElementById('app');
f.src='customer.html?v=customer-live-refresh-20260827'+location.search+location.hash;
let timer=0;
f.addEventListener('load',()=>{
  clearInterval(timer);
  timer=setInterval(()=>{
    try{
      if(f.contentWindow && typeof f.contentWindow.start==='function') f.contentWindow.start();
    }catch(e){}
  },3000);
});
</script>
</body>
</html>
