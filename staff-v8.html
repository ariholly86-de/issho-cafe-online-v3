<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>ISSHO CAFE — KASIR</title>
<style>html,body{margin:0;width:100%;height:100%;background:#0b0b0b}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="kasir" src="staff-v6.html?v=20260823-expense-fix-v8" title="ISSHO CAFE KASIR"></iframe>
<script>
const U='https://xvhimyflrqrdudijwjdn.supabase.co';
const K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';
const f=document.getElementById('kasir');
async function api(path,opt={}){
  const h=Object.assign({apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},opt.headers||{});
  const r=await fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h}));
  const t=await r.text();
  if(!r.ok)throw Error(t);
  return t?JSON.parse(t):null;
}
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function install(){
  try{
    const w=f.contentWindow,d=w.document;
    if(!d||!d.body)return false;
    let st=d.getElementById('expense-fix-v8');
    if(!st){
      st=d.createElement('style');
      st.id='expense-fix-v8';
      st.textContent=`
        .gold{background:#1976d2!important;color:#fff!important;border:1px solid #42a5f5!important}
        .gold:hover{background:#1565c0!important}
        .expense-detail-v8{margin-top:12px;padding:14px;border:1px solid #383838;border-radius:12px;background:#151515}
        .expense-detail-v8 .expense-row{padding:12px 0;border-bottom:1px solid #333}
        .expense-detail-v8 .expense-row:last-child{border-bottom:0}
        .expense-detail-v8 .expense-desc{color:#fff;font-size:14px;margin-top:5px}
        .expense-detail-v8 .expense-meta{color:#aaa;font-size:12px;margin-top:4px}
        .expense-detail-v8 .expense-amount{font-size:15px;white-space:nowrap}
      `;
      d.head.appendChild(st);
    }
    if(!w.__expenseReportPatchedV8){
      w.__expenseReportPatchedV8=true;
      const original=w.report;
      w.report=async function(){
        await original.apply(w,arguments);
        await renderExpenseDetail(w,d);
      };
    }
    return true;
  }catch(e){return false}
}
async function renderExpenseDetail(w,d){
  const date=d.getElementById('date')?.value;
  const box=d.getElementById('reportOut');
  const pin=d.getElementById('pin')?.value?.trim();
  if(!date||!box||!pin)return;
  let el=d.getElementById('expense-detail-v8');
  if(!el){
    el=d.createElement('div');
    el.id='expense-detail-v8';
    el.className='card expense-detail-v8';
    box.appendChild(el);
  }
  el.innerHTML='<h3 style="margin-top:0">💸 Detail Pengeluaran Harian</h3><div class="muted">Memuat keterangan pengeluaran...</div>';
  try{
    const rows=await api('/rest/v1/rpc/staff_get_expenses',{
      method:'POST',
      body:JSON.stringify({p_pin:pin,p_from:date,p_to:date})
    });
    const list=Array.isArray(rows)?rows:[];
    el.innerHTML='<h3 style="margin-top:0">💸 Detail Pengeluaran Harian</h3>'+
      (list.length?list.map(e=>`<div class="expense-row"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><b>${esc(e.category||'Operasional')}</b><div class="expense-desc">Keterangan: ${esc(e.description||'Tidak ada keterangan')}</div><div class="expense-meta">Tanggal: ${esc(e.expense_date||date)}</div></div><b class="expense-amount">${money(e.amount)}</b></div></div>`).join(''):'<div class="muted">Tidak ada pengeluaran pada tanggal ini.</div>');
  }catch(e){
    el.innerHTML='<h3 style="margin-top:0">💸 Detail Pengeluaran Harian</h3><div class="err">Detail pengeluaran gagal dimuat: '+esc(e.message)+'</div>';
  }
}
let tries=0;
function start(){
  const timer=setInterval(()=>{tries++;if(install()||tries>240)clearInterval(timer)},250);
}
f.addEventListener('load',start);
start();
</script>
</body>
</html>
