<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — KASIR RPP02N</title><style>html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial}#kasir{width:100%;height:100%;border:0;display:block}#bridge{position:fixed;right:12px;top:12px;z-index:99999;background:#151515;border:1px solid #444;border-radius:12px;padding:9px;box-shadow:0 4px 18px #0008;max-width:340px}#bridge button{border:0;border-radius:8px;padding:9px 11px;margin:2px;font-weight:800;background:#1687f7;color:white}#bridge button.gold{background:#d08a24}#bridge small{display:block;margin-top:5px;color:#ddd;line-height:1.35}</style></head><body><div id="bridge"><button id="bt">📶 RPP02N Bluetooth</button><button id="test" class="gold">🧾 Test Print</button><small id="st">Printer target: RPP02N • Bluetooth ESC/POS 58mm • Siapkan printer di Bluetooth Android.</small></div><iframe id="kasir" src="staff-v9.html?v=20260825-rpp02n-bt-v1"></iframe><script>const f=document.getElementById('kasir'),st=document.getElementById('st'),BRIDGE='http://localhost:9100';let port=null,writer=null;const B={i:[27,64],c:[27,97,1],l:[27,97,0],b:[27,69,1],n:[27,69,0],cut:[29,86,0]};const enc=s=>new TextEncoder().encode(String(s).replace(/[^\\x00-\\xFF]/g,'')),line=s=>[...enc(s),10],u=a=>new Uint8Array(a),money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);function msg(s,bad=false){st.textContent=s;st.style.color=bad?'#ff8b8b':'#9cff9c'}function bridgePayload(o,k){const content=[{type:'text',text:'ISSHO CAFE',align:'center',bold:true,size:'large'},{type:'text',text:k==='k'?'NOTA DAPUR':'TANDA TERIMA PELANGGAN',align:'center',bold:true},{type:'divider'},{type:'row',left:'Order',right:String(o.order_number||'-')},{type:'row',left:'Meja',right:String(o.table_name||'Take Away')}];if(k!=='k')content.push({type:'row',left:'Bayar',right:String(o.payment_method||'-')});content.push({type:'divider'});for(const i of(o.items||[])){const name=String(i.name||''),qty=Number(i.qty||0),price=k==='k'?'':money(Number(i.price||0)*qty);content.push({type:'row',left:name+' x'+qty,right:price})}content.push({type:'divider'});if(k!=='k'){content.push({type:'row',left:'TOTAL',right:money(o.total),bold:true},{type:'feed',lines:1},{type:'text',text:'Terima kasih',align:'center'})}else content.push({type:'text',text:'SEGERA DIPROSES',align:'center',bold:true});content.push({type:'feed',lines:3});return{cut:true,paperWidth:58,content}}async function bridgePrint(o,k){const r=await fetch(BRIDGE+'/print',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(bridgePayload(o,k))});let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw Error(d.error||d.message||('Bridge HTTP '+r.status));return d}async function bridgeTest(){const r=await fetch(BRIDGE+'/print',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cut:true,paperWidth:58,content:[{type:'text',text:'ISSHO CAFE',align:'center',bold:true,size:'large'},{type:'text',text:'TEST PRINTER RPP02N',align:'center',bold:true},{type:'text',text:'Bluetooth ESC/POS 58mm',align:'center'},{type:'divider'},{type:'text',text:'PRINTER SIAP',align:'center',bold:true},{type:'feed',lines:3}]})});if(!r.ok)throw Error('Printer RPP02N tidak merespons');return r.json()}async function connect(){try{const r=await fetch(BRIDGE+'/health');const d=await r.json();if(!r.ok||d.status!=='ok')throw Error('Bridge printer belum siap');msg('✓ RPP02N terdeteksi. '+(d.printer?.name||d.printer?.model||'Bluetooth printer')+' siap print.')}catch(e){msg('RPP02N belum terhubung. Pair Bluetooth dengan nama RPP02N lalu pilih RPP02N sebagai printer default di aplikasi bridge.',true)}}async function serialConnect(){if(!('serial'in navigator))throw Error('Web Serial tidak tersedia di browser ini.');port=await navigator.serial.requestPort();await port.open({baudRate:9600,dataBits:8,stopBits:1,parity:'none',flowControl:'none'});writer=port.writable.getWriter()}async function serialSend(data){if(!writer)await serialConnect();for(let i=0;i<data.length;i+=256)await writer.write(data.slice(i,i+256))}function rawPayload(o,k){let a=[...B.i,...B.c,...B.b,...enc('ISSHO CAFE'),10,...B.n,...enc(k==='k'?'NOTA DAPUR':'TANDA TERIMA PELANGGAN'),10,...B.l,...line('-'.repeat(32)),...line('Order : '+(o.order_number||'-')),...line('Meja  : '+(o.table_name||'Take Away'))];if(k!=='k')a.push(...line('Bayar : '+(o.payment_method||'-')));a.push(...line('-'.repeat(32)));for(const i of(o.items||[])){const name=String(i.name||''),qty=Number(i.qty||0),p=k==='k'?'':money(Number(i.price||0)*qty);let x=name;while(x.length>26){a.push(...line(x.slice(0,26)));x=x.slice(26)}a.push(...line(x+(p?(' '.repeat(Math.max(1,32-x.length-p.length))+p):'')+' x'+qty))}a.push(...line('-'.repeat(32)));if(k!=='k')a.push(...B.b,...line('TOTAL'),...B.n,...line(money(o.total)),...B.c,...line('Terima kasih'),...B.l);else a.push(...B.c,...B.b,...line('SEGERA DIPROSES'),...B.n,...B.l);return u([...a,...line(''),...line(''),...B.cut])}async function printOrder(id,k){const w=f.contentWindow,o=(w.ORD||[]).find(x=>x.id===id);if(!o)return;try{await bridgePrint(o,k);msg('✓ Nota '+(k==='k'?'dapur':'pelanggan')+' tercetak via RPP02N')}catch(e){try{await serialSend(rawPayload(o,k));msg('✓ Nota tercetak via Serial RPP02N')}catch(_){msg('Gagal print RPP02N: '+e.message+' | Pair RPP02N + aktifkan bridge printer.',true)}}}function install(){try{const w=f.contentWindow,d=w.document;if(!d||!w.login)return false;if(w.__rpp02n_bt_v1)return true;w.printCustomer=id=>printOrder(id,'c');w.printKitchen=id=>printOrder(id,'k');w.__rpp02n_bt_v1=true;return true}catch(e){return false}}document.getElementById('bt').onclick=connect;document.getElementById('test').onclick=()=>bridgeTest().then(()=>msg('✓ Test print RPP02N berhasil')).catch(e=>msg('Test gagal: '+e.message,true));f.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{if(install()||++n>160)clearInterval(t)},250)});setInterval(install,1500)</script></body></html>
