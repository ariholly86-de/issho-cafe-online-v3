<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — KASIR RPP02N</title><style>html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial}#kasir{width:100%;height:100%;border:0;display:block}#bridge{position:fixed;right:12px;top:12px;z-index:99999;background:#151515;border:1px solid #444;border-radius:12px;padding:9px;box-shadow:0 4px 18px #0008;max-width:370px}#bridge button{border:0;border-radius:8px;padding:9px 11px;margin:2px;font-weight:800;background:#1687f7;color:white}#bridge button.gold{background:#d08a24}#bridge small{display:block;margin-top:5px;color:#ddd;line-height:1.35}.ok{color:#9cff9c}.err{color:#ff8b8b}</style></head><body><div id="bridge"><button id="bt">📶 Hubungkan RPP02N</button><button id="test" class="gold">🧾 Test Print</button><small id="st">RPP02N • Bluetooth Classic • ESC/POS 58mm. Pastikan RPP02N sudah <b>paired</b> di Bluetooth Android.</small></div><iframe id="kasir" src="staff-v6.html?v=20260825-rpp02n-direct-v3" title="ISSHO CAFE KASIR"></iframe><script>
const f=document.getElementById('kasir'),st=document.getElementById('st');let port=null,writer=null;
const B={i:[27,64],c:[27,97,1],l:[27,97,0],b:[27,69,1],n:[27,69,0],cut:[29,86,0]};
const enc=s=>new TextEncoder().encode(String(s).replace(/[^\\x00-\\xFF]/g,'')),line=s=>[...enc(s),10],u=a=>new Uint8Array(a),money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
function msg(s,bad=false){st.innerHTML=s;st.className=bad?'err':'ok'}
async function connectRPP(){
 if(!('serial'in navigator))throw Error('Web Serial tidak tersedia pada browser ini. Gunakan Chrome Android yang mendukung Web Serial.');
 try{const saved=await navigator.serial.getPorts();if(saved.length===1)port=saved[0]}catch(_){}
 if(!port){
   try{port=await navigator.serial.requestPort({filters:[]})}
   catch(e){port=null;writer=null;if(e?.name==='NotFoundError')throw Error('Tidak ada perangkat yang dipilih. Pastikan RPP02N sudah Paired di Bluetooth Android, lalu tekan tombol ini dan pilih RPP02N pada pemilih perangkat.');throw e}
 }
 try{
   if(!port.readable&&!port.writable)await port.open({baudRate:9600,dataBits:8,stopBits:1,parity:'none',flowControl:'none'});
   if(!port.writable)throw Error('Port RPP02N terbuka tetapi jalur tulis tidak tersedia.');
   writer=port.writable.getWriter();msg('✓ RPP02N tersambung langsung via Bluetooth.');return true
 }catch(e){port=null;writer=null;throw Error('RPP02N dipilih tetapi gagal dibuka: '+e.message)}
}
async function send(data){if(!writer)await connectRPP();for(let i=0;i<data.length;i+=256)await writer.write(data.slice(i,i+256))}
function rawPayload(o,k){let a=[...B.i,...B.c,...B.b,...enc('ISSHO CAFE'),10,...B.n,...enc(k==='k'?'NOTA DAPUR':'TANDA TERIMA PELANGGAN'),10,...B.l,...line('-'.repeat(32)),...line('Order : '+(o.order_number||'-')),...line('Meja  : '+(o.table_name||'Take Away'))];if(k!=='k')a.push(...line('Bayar : '+(o.payment_method||'-')));a.push(...line('-'.repeat(32)));for(const i of(o.items||[])){const name=String(i.name||''),qty=Number(i.qty||0),p=k==='k'?'':money(Number(i.price||0)*qty);let x=name;while(x.length>26){a.push(...line(x.slice(0,26)));x=x.slice(26)}a.push(...line(x+(p?(' '.repeat(Math.max(1,32-x.length-p.length))+p):'')+' x'+qty))}a.push(...line('-'.repeat(32)));if(k!=='k')a.push(...B.b,...line('TOTAL'),...B.n,...line(money(o.total)),...B.c,...line('Terima kasih'),...B.l);else a.push(...B.c,...B.b,...line('SEGERA DIPROSES'),...B.n,...B.l);return u([...a,...line(''),...line(''),...B.cut])}
async function testPrint(){await send(u([...B.i,...B.c,...B.b,...enc('ISSHO CAFE'),10,...B.n,...enc('TEST PRINT RPP02N'),10,...enc('Bluetooth Classic / ESC-POS'),10,...line('-'.repeat(32)),...line('PRINTER SIAP'),...line(''),...line(''),...B.cut]));msg('✓ Test print RPP02N berhasil.')}
async function printOrder(id,k){const w=f.contentWindow,o=(w.ORD||[]).find(x=>x.id===id);if(!o)return;try{await send(rawPayload(o,k));msg('✓ Nota '+(k==='k'?'dapur':'pelanggan')+' tercetak di RPP02N')}catch(e){msg('Gagal print RPP02N: '+e.message,true)}}
function patchInnerPrinter(){try{const w=f.contentWindow,d=w.document;if(!d)return false;const app=d.getElementById('app');if(!app)return false;let p=d.getElementById('wp58d-panel');if(!p){p=d.createElement('div');p.id='wp58d-panel';p.className='card noprint';app.insertBefore(p,app.children[1]||null)}p.innerHTML='<h3 style="margin-top:0">🖨️ Printer Thermal RPP02N — 58mm</h3><div class="muted">Target: <b>RPP02N</b> • Bluetooth Classic • ESC/POS • 58mm. Koneksi printer dilakukan langsung dari Chrome melalui Web Serial.</div><div class="actions"><button class="blue" id="rppConnectInner">📶 Hubungkan RPP02N</button><button class="gold" id="rppTestInner">🧾 Test Print</button></div><div id="rppStatusInner" class="muted" style="margin-top:8px">Belum terhubung. Pair RPP02N di Bluetooth Android terlebih dahulu.</div>';const s=d.getElementById('rppStatusInner');d.getElementById('rppConnectInner').onclick=async()=>{try{await connectRPP();s.textContent='✓ RPP02N tersambung langsung via Bluetooth.';s.style.color='#9cff9c'}catch(e){s.textContent=e.message;s.style.color='#ff8b8b'}};d.getElementById('rppTestInner').onclick=async()=>{try{await testPrint();s.textContent='✓ Test print RPP02N berhasil.';s.style.color='#9cff9c'}catch(e){s.textContent='Test print gagal: '+e.message;s.style.color='#ff8b8b'}};if(!w.__rpp02n_direct_v3){w.printCustomer=id=>printOrder(id,'c');w.printKitchen=id=>printOrder(id,'k');w.__rpp02n_direct_v3=true}return true}catch(e){return false}}
let tries=0;f.addEventListener('load',()=>{const t=setInterval(()=>{if(patchInnerPrinter()||++tries>160)clearInterval(t)},250)});setInterval(patchInnerPrinter,1000);
document.getElementById('bt').onclick=()=>connectRPP().catch(e=>msg('Gagal menghubungkan RPP02N: '+e.message,true));document.getElementById('test').onclick=()=>testPrint().catch(e=>msg('Test print gagal: '+e.message,true));
</script></body></html>
