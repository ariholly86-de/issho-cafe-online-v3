<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISSHO CAFE - STAFF</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f6f0e7;color:#211d18}.wrap{max-width:1100px;margin:auto;padding:18px}.card,.order{background:#fff;border:1px solid #ddd2c5;border-radius:16px;padding:16px;margin:14px 0}.head{background:#171411;color:#fff}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.gold{background:#b68142;color:#fff}.dark{background:#171411;color:#fff}.green{background:#2f7d50;color:#fff}.red{background:#a73d35;color:#fff}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px}.err{background:#ffe1de;color:#8d2d27;padding:12px;border-radius:10px}.ok{background:#dff3e5;color:#25633b;padding:12px;border-radius:10px}.muted{color:#777;font-size:13px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eee;font-size:12px;font-weight:800}.qris{background:#e8e1ff}.pending{background:#fff0cf}.approved{background:#dff3e5}.rejected{background:#ffe0dd}.proof{max-width:360px;width:100%;border-radius:12px;border:1px solid #ddd;margin-top:10px}.item{padding:7px 0;border-bottom:1px solid #eee}.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}</style></head><body><header class="head"><div class="wrap"><div style="font-size:24px;font-weight:900">ISSHO CAFE — STAFF</div><div class="muted" style="color:#bbb">Area Kasir • Dapur • Owner</div></div></header><main class="wrap"><section id="login" class="card"><h2>Login Staff</h2><p class="muted">Masukkan PIN staff. PIN tidak ditampilkan di area pelanggan.</p><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN Staff"><div class="actions"><button class="gold" onclick="loginStaff()">Masuk</button><a href="./" style="padding:10px">Kembali ke Menu Pelanggan</a></div><div id="lerr"></div></section><section id="dash" class="hidden"><div class="card"><div class="row"><h2 id="title">Dashboard</h2><button class="dark" onclick="logout()">Keluar</button></div><div id="summary"></div></div><div class="card"><div class="row"><h2>Pesanan</h2><button class="gold" onclick="loadStaff()">Refresh</button></div><div id="orders"></div></div></section></main><script>const URL='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';let pin='',role='';const $=x=>document.getElementById(x),money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){const h=Object.assign({apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},opt.headers||{}),r=await fetch(URL+path,Object.assign({},opt,{headers:h})),t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}async function loginStaff(){const p=$('pin').value.trim();if(!['1234','5678','9999'].includes(p))return $('lerr').innerHTML='<div class="err">PIN salah.</div>';pin=p;role=p==='1234'?'KASIR':p==='5678'?'DAPUR':'OWNER';$('login').className='hidden';$('dash').className='';$('title').textContent='Dashboard '+role;loadStaff()}function logout(){location.reload()}async function loadStaff(){try{const [orders,sum]=await Promise.all([api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:pin})}),api('/rest/v1/rpc/staff_summary',{method:'POST',body:JSON.stringify({p_pin:pin})})]);$('summary').innerHTML=`<div class="row"><span>Pesanan hari ini: <b>${sum.orders}</b></span><span>Omzet: <b>${money(sum.total)}</b></span></div>`;renderOrders(orders)}catch(e){$('orders').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}function renderOrders(list){if(!list.length)return $('orders').innerHTML='<div class="muted">Belum ada pesanan.</div>';$('orders').innerHTML=list.map(o=>{const proof=o.payment_proof_url||o.proof_url||'';return `<div class="order"><div class="row"><div><b>${esc(o.order_number)}</b><br><span class="badge">${esc(o.table_name||'Take Away')}</span> <span class="badge qris">${esc(o.payment_method)}</span> <span class="badge">${esc(o.payment_status)}</span></div><b>${money(o.total)}</b></div><div>${(o.items||[]).map(i=>`<div class="item">${esc(i.name)} × ${i.qty} — ${money(i.price*i.qty)}</div>`).join('')}</div>${o.note?`<p class="muted">Catatan: ${esc(o.note)}</p>`:''}${proof?`<div><b>Bukti Pembayaran QRIS</b><br><a href="${esc(proof)}" target="_blank"><img class="proof" src="${esc(proof)}" alt="Bukti pembayaran"></a></div>`:''}<div class="actions">${role==='KASIR'&&o.payment_method==='QRIS'&&o.payment_status!=='PAID'?`<button class="green" onclick="verify('${o.id}','approve')">✓ Verifikasi Pembayaran</button><button class="red" onclick="verify('${o.id}','reject')">Tolak Bukti</button>`:''}${role==='KASIR'&&o.payment_method==='CASH'&&o.payment_status!=='PAID'?`<button class="green" onclick="paid('${o.id}')">Terima Pembayaran Tunai</button>`:''}${role==='KASIR'&&o.payment_status==='PAID'?`<button class="gold" onclick="status('${o.id}','ACCEPTED')">Terima Order</button>`:''}${role==='DAPUR'&&(o.order_status==='NEW'||o.order_status==='ACCEPTED')&&o.payment_status==='PAID'?`<button class="gold" onclick="status('${o.id}','PREPARING')">Mulai Masak</button>`:''}${role==='DAPUR'&&o.order_status==='PREPARING'?`<button class="green" onclick="status('${o.id}','READY')">Pesanan Siap</button>`:''}${role==='OWNER'?`<button class="dark" onclick="status('${o.id}','COMPLETED')">Selesaikan</button>`:''}</div></div>`}).join('')}async function verify(id,a){try{await api('/rest/v1/rpc/staff_verify_payment',{method:'POST',body:JSON.stringify({p_pin:pin,p_order_id:id,p_action:a})});loadStaff()}catch(e){alert(e.message)}}async function paid(id){try{await api('/rest/v1/rpc/staff_mark_paid',{method:'POST',body:JSON.stringify({p_pin:pin,p_order_id:id})});loadStaff()}catch(e){alert(e.message)}}async function status(id,s){try{await api('/rest/v1/rpc/staff_update_order',{method:'POST',body:JSON.stringify({p_pin:pin,p_order_id:id,p_status:s})});loadStaff()}catch(e){alert(e.message)}}setInterval(()=>{if(pin)loadStaff()},10000)</script></body></html>
