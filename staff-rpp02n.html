<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — KASIR</title><style>html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}#kasir{width:100%;height:100%;border:0;display:block}#printer{position:fixed;right:10px;top:10px;z-index:2147483647;background:#151515;border:1px solid #555;border-radius:12px;padding:10px;box-shadow:0 4px 18px #0008;max-width:460px}#printer button{border:0;border-radius:8px;padding:10px 12px;margin:2px;font-weight:800;cursor:pointer;touch-action:manipulation}#connect{background:#1687f7;color:#fff}#test{background:#d08a24;color:#fff}#diag{background:#b83a32;color:#fff}.ok{color:#9cff9c}.err{color:#ff8b8b}#status,#diagout{display:block;margin-top:7px;font-size:13px;line-height:1.35;white-space:pre-wrap}</style></head><body><div id="printer"><button id="connect" type="button">📶 Hubungkan RPP02N</button><button id="test" type="button">🧾 Test Print</button><button id="diag" type="button">🔎 Periksa Printer</button><span id="status">Printer Bluetooth RPP02N • ESC/POS 58mm</span><span id="diagout">Memeriksa koneksi printer…</span></div><iframe id="kasir" src="staff-v6.html?v=20260825-rpp02n-single-v1" title="ISSHO CAFE KASIR"></iframe><script>
const BR='http://127.0.0.1:9100',f=document.getElementById('kasir'),status=document.getElementById('status'),diagout=document.getElementById('diagout');
const E=s=>new TextEncoder().encode(String(s)); const U=a=>new Uint8Array(a); const C={init:[27,64],center:[27,97,1],left:[27,97,0],bold:[27,69,1],normal:[27,69,0],cut:[29,86,0]};
function msg(s,bad=false){status.textContent=s;status.className=bad?'err':'ok'}
async function bridgeFetch(path,opt={}){const r=await fetch(BR+path,{...opt,cache:'no-store'});const t=await r.text();let j;try{j=JSON.parse(t)}catch(_){j={ok:false,error:t}}if(!r.ok||j.ok===false)throw Error(j.error||('Bridge HTTP '+r.status));return j}
async function checkBridge(){try{const j=await bridgeFetch('/status');diagout.textContent=j.connected?'✓ RPP02N terhubung\n✓ Printer siap menerima cetak\nMetode: Bluetooth Classic/SPP':'✓ Aplikasi printer aktif\nRPP02N belum terhubung\nTekan Hubungkan RPP02N';return true}catch(e){diagout.textContent='✕ Koneksi printer belum aktif.\nPastikan aplikasi ISSHO CAFE — KASIR ini sudah terpasang di Samsung Tab A9 dan RPP02N sudah paired.';return false}}
async function connect(){try{const j=await bridgeFetch('/connect',{method:'POST'});msg('✓ RPP02N TERSAMBUNG • siap mencetak');await checkBridge();return j}catch(e){msg('Gagal menghubungkan RPP02N: '+e.message,true);throw e}}
async function test(){try{await bridgeFetch('/test',{method:'POST'});msg('✓ TEST PRINT RPP02N BERHASIL');await checkBridge()}catch(e){msg('Test print gagal: '+e.message,true);throw e}}
function orderBytes(o,k){let a=[...C.init,...C.center,...C.bold,...E('ISSHO CAFE'),10,...C.normal,...E(k==='k'?'NOTA DAPUR':'TANDA TERIMA PELANGGAN'),10,...C.left,45,45,45,45,45,45,45,45,45,45,10,...E('Order : '+(o.order_number||'-')),10,...E('Meja  : '+(o.table_name||'Take Away')),10];for(const i of(o.items||[]))a.push(...E(String(i.name||'')+' x'+Number(i.qty||0)),10);a.push(45,45,45,45,45,45,45,45,45,45,10);if(k!=='k')a.push(...C.bold,...E('TOTAL'),10,...C.normal,...E(String(o.total||0)),10,...C.center,...E('Terima kasih'),10);else a.push(...C.center,...C.bold,...E('SEGERA DIPROSES'),10,...C.normal);a.push(10,10,...C.cut);return U(a)}
async function printOrder(id,k){try{const w=f.contentWindow;const o=(w?.ORD||[]).find(x=>x.id===id);if(!o)throw Error('Pesanan tidak ditemukan.');await bridgeFetch('/print',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:orderBytes(o,k)});msg('✓ Nota '+(k==='k'?'dapur':'pelanggan')+' terkirim ke RPP02N')}catch(e){msg('Gagal print RPP02N: '+e.message,true)}}
function patch(){try{const w=f.contentWindow,d=w.document,app=d.getElementById('app');if(!app)return false;let p=d.getElementById('rpp02n-panel');if(!p){p=d.createElement('div');p.id='rpp02n-panel';p.className='card noprint';app.insertBefore(p,app.children[1]||null)}p.innerHTML='<h3>🖨️ Printer Thermal RPP02N — 58mm</h3><div class="muted">Samsung Tab A9 → Bluetooth Classic/SPP → RPP02N</div><div class="actions"><button type="button" class="blue" id="r1">📶 Hubungkan RPP02N</button><button type="button" class="gold" id="r2">🧾 Test Print</button><button type="button" class="red" id="r3">🔎 Periksa Printer</button></div><div id="r4" class="muted">Belum terhubung.</div>';d.getElementById('r1').onclick=()=>connect();d.getElementById('r2').onclick=()=>test();d.getElementById('r3').onclick=()=>checkBridge();if(!w.__rpp02n_single){w.printCustomer=id=>printOrder(id,'c');w.printKitchen=id=>printOrder(id,'k');w.__rpp02n_single=true}return true}catch(e){return false}}
connect.onclick=()=>connect();test.onclick=()=>test();diag.onclick=()=>checkBridge();checkBridge();f.addEventListener('load',()=>{let n=0,t=setInterval(()=>{if(patch()||++n>160)clearInterval(t)},250)});setInterval(patch,1000);
</script></body></html>
