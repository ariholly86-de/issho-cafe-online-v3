urn;busy=true;try{const a=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:p})});cache=new Map((Array.isArray(a)?a:[]).map(o=>[String(o.order_number),o]));const w=f.contentWindow;if(w&&typeof w.loadOrders==='function')await w.loadOrders();patch()}catch(e){}finally{busy=false}}async function clickOrder(ref){const p=pin();if(!p)throw Error('Sesi Kasir belum terbaca.');const a=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:p})});const o=(Array.isArray(a)?a:[]).find(x=>String(x.id)===String(ref)||String(x.order_number)===String(ref));if(!o)throw Error('Order belum ditemukan. Klik Refresh.');cache.set(String(o.order_number),o);return o}function patch(){const d=getDoc();if(!d||!d.body)return;d.querySelectorAll('[data-issho-patch]').forEach(x=>x.remove());d.querySelectorAll('b').forEach(b=>{const ref=String(b.textContent||'').trim();if(!/^ISS-\d{6}-\d{6}-[A-Z0-9]+$/i.test(ref))return;const o=cache.get(ref);if(!o)return;const x=d.createElement('div');x.dataset.isshoPatch='1';x.style.cssText='color:#c9c9c9;font-size:13px;font-weight:700;line-height:1.5;margin-top:3px';const t=dt(o);x.textContent='Tanggal Order: '+t.date+' • '+t.time+' WIB';b.insertAdjacentElement('afterend',x)});d.querySelectorAll('button').forEach(b=>{const label=(b.textContent||'').replace(/\s+/g,' ').trim();if(!/Print Pelanggan/i.test(label))return;const parent=b.parentElement;if(!parent||parent.querySelector('[data-issho-wa]'))return;const ref=findRef(b);if(!ref)return;const wb=d.createElement('button');wb.type='button';wb.dataset.isshoWa='1';wb.textContent='🟢 WhatsApp';wb.style.cssText='background:#25D366;color:#07150c;border:0;border-radius:10px;padding:12px 18px;font-weight:900;font-size:16px;cursor:pointer;margin-left:7px';wb.onclick=async e=>{e.preventDefault();e.stopPropagation();try{const o=await clickOrder(ref);pending=o;const t=dt(o);info.textContent='Order: '+o.order_number+'\nTanggal: '+t.date+'\nJam: '+t.time+' WIB\nMeja: '+(o.table_name||'Take Away')+'\nTotal: '+money(o.total)+'\n\nNomor WhatsApp pelanggan:';phone.value=o.customer_whatsapp||localStorage.getItem('issho_last_wa_phone')||'';modal.style.display='flex';setTimeout(()=>phone.focus(),60)}catch(err){alert('Invoice belum siap: '+err.message)}};parent.appendChild(wb)})})}function connect(){if(rt||!window.supabase)return;try{rt=supabase.createClient(U,K,{realtime:{params:{eventsPerSecond:10}}}).channel('kasir-egress-optimized').on('postgres_changes',{event:'*',schema:'public',table:'orders',select:['id']},()=>{clearTimeout(timer);timer=setTimeout(refresh,150)}).subscribe()}catch(e){}}f.addEventListener('load',()=>{setTimeout(connect,200);setTimeout(refresh,500);setTimeout(patch,1200)});setInterval(()=>{if(document.visibilityState==='visible')refresh()},10000);setInterval(()=>{if(document.visibilityState==='visible')patch()},2000);document.getElementById('waCancel').onclick=()=>{modal.style.display='none';pending=null};document.getElementById('waSend').onclick=()=>{let s=String(phone.value||'').replace(/[^0-9]/g,'');if(s.startsWith('0'))s='62'+s.slice(1);else if(s.startsWith('8'))s='62'+s;if(!/^62\d{8,15}$/.test(s)){alert('Nomor WhatsApp tidak valid.');return}localStorage.setItem('issho_last_wa_phone',phone.value.trim());window.open('https://web.whatsapp.com/send?phone='+s+'&text='+encodeURIComponent('*ISSHO CAFE — INVOICE*\n\n*No. Order:* '+pending.order_number+'\n*Meja:* '+(pending.table_name||'Take Away')+'\n*Pembayaran:* '+(pending.payment_method||'-')+'\n*Status:* '+(pending.payment_status||'-')+'\n\n*TOTAL:* '+money(pending.total)+'\n\n🍽️ *Pesanan Anda Sudah Siap!*\nSilakan ambil di *meja kasir*.\n\nTerima kasih 🙏'),'_blank','noopener,noreferrer');modal.style.display='none';pending=null};connect();</script><script src="/ui-standard.js?v=20260831-kasir-no-restore"></script></body></html>
