k aktif tetap tersimpan. Centang menu yang sudah tersedia untuk mengembalikannya ke Pelanggan & Kasir.</div><input id="search" placeholder="🔎 Cari menu..." style="width:100%;box-sizing:border-box;margin:9px 0;padding:11px;border:1px solid #444;border-radius:9px;background:#1b1b1b;color:#fff;font-size:15px"><div id="list"></div><div class="actions"><button class="gold" id="all">☑ Pilih Semua</button><button class="green" id="bulk">🟢 PULIHKAN TERPILIH (0)</button><button class="dark" id="close">Tutup</button></div><div id="msg" class="muted" style="margin-top:9px"></div></div></div><script>const F=document.getElementById('app'),SUPA='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',restore=document.getElementById('restore'),modal=document.getElementById('modal'),list=document.getElementById('list'),search=document.getElementById('search'),bulk=document.getElementById('bulk'),msg=document.getElementById('msg'),status=document.getElementById('status');let hidden=[],selected=new Set(),installed=false,reportMode='daily';const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);const W=()=>F.contentWindow;const pin=()=>W().document.getElementById('pin')?.value?.trim()||'';const say=t=>{status.textContent=t;status.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>status.style.display='none',3000)};async function api(path,opt={}){const h={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',...(opt.headers||{})};const r=await fetch(SUPA+path,{cache:'no-store',...opt,headers:h});const t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null}function renderHidden(){const q=search.value.trim().toLowerCase(),rows=hidden.filter(p=>(p.name+' '+(p.description||'')+' '+(p.category_name||'')).toLowerCase().includes(q));list.innerHTML=rows.length?rows.map(p=>`<label class="item"><input type="checkbox" ${selected.has(p.id)?'checked':''} onchange="toggle('${p.id}',this.checked')"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.category_name||'Tanpa Kategori')} • ${money(p.price)}</div></div></label>`).join(''):'<div style="padding:20px;text-align:center;color:#aaa">✓ Tidak ada menu stok kosong.</div>';restore.textContent=`🟢 PULIHKAN MENU (${selected.size})`;bulk.textContent=`🟢 PULIHKAN TERPILIH (${selected.size})`}window.toggle=(id,on)=>{on?selected.add(id):selected.delete(id);renderHidden()};async function loadHidden(){const p=pin();if(!p){msg.textContent='Login Owner terlebih dahulu.';return}msg.textContent='Memuat menu stok kosong...';try{hidden=await api('/rest/v1/rpc/owner_list_hidden_products',{method:'POST',body:JSON.stringify({p_owner_pin:p})})||[];selected=new Set([...selected].filter(id=>hidden.some(x=>x.id===id)));renderHidden();msg.textContent=hidden.length?hidden.length+' menu ditemukan.':'Tidak ada menu tersembunyi.'}catch(e){msg.textContent='Gagal memuat: '+e.message}}restore.onclick=async()=>{modal.style.display='block';selected.clear();search.value='';await loadHidden()};document.getElementById('close').onclick=()=>modal.style.display='none';document.getElementById('all').onclick=()=>{hidden.forEach(p=>selected.add(p.id));renderHidden()};search.oninput=renderHidden;bulk.onclick=async()=>{const p=pin(),ids=[...selected];if(!p)return say('Silakan login Owner.');if(!ids.length)return say('Pilih minimal satu menu.');if(!confirm('Pulihkan '+ids.length+' menu ke Pelanggan & Kasir?'))return;bulk.disabled=true;try{const d=await api('/rest/v1/rpc/owner_restore_selected_products',{method:'POST',body:JSON.stringify({p_owner_pin:p,p_product_ids:ids})});say('✓ '+(d?.message||ids.length+' menu berhasil dipulihkan.'));selected.clear();await loadHidden();try{if(typeof W().loadProducts==='function')await W().loadProducts()}catch(e){}}catch(e){say('Gagal: '+e.message)}finally{bulk.disabled=false;renderHidden()}};function date(v){const a=String(v||'').split('-').map(Number);return a.length===3&&!a.some(isNaN)?new Date(a[0],a[1]-1,a[2]):new Date()}function range(w,mode){const d=date(w.document.getElementById('date')?.value);if(mode==='weekly'){const day=d.getDay(),diff=day===0?-6:1-day,f=new Date(d);f.setDate(d.getDate()+diff);f.setHours(7,0,0,0);const t=new Date(f);t.setDate(t.getDate()+7);return{from:f,to:t,title:'Mingguan',label:'Senin–Minggu'}}if(mode==='monthly'){const f=new Date(d.getFullYear(),d.getMonth(),1,7),t=new Date(d.getFullYear(),d.getMonth()+1,1,7);return{from:f,to:t,title:'Bulanan',label:f.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}}const f=new Date(d),t=new Date(d);f.setHours(7,0,0,0);t.setDate(t.getDate()+1);t.setHours(0,0,0,0);return{from:f,to:t,title:'Harian',label:'07:00–00:00'}}async function report(mode){const w=W(),box=w.document.getElementById('reportBox');if(!box)return;const p=pin();if(!p)return say('Login Owner belum aktif.');try{const r=range(w,mode),d=await api('/rest/v1/rpc/owner_sales_detail_report',{method:'POST',body:JSON.stringify({p_owner_pin:p,p_from:r.from.toISOString(),p_to:r.to.toISOString()})});let h=`<div id="detailReport" style="background:#111;color:#f5f5f5;border:1px solid #444;border-radius:14px;padding:15px;margin:12px 0"><div style="font-size:21px;font-weight:900">📊 RINCIAN PENJUALAN PER KATEGORI</div><div style="color:#aaa;font-size:13px;margin:5px 0 13px">${r.title} • ${r.label} • hanya transaksi PAID</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px">${[['Pesanan Lunas',d.orders],['Total Qty',d.total_qty],['Total Omzet',money(d.omzet)],['Tunai',money(d.cash)],['QRIS',money(d.qris)]].map(x=>`<div style="background:#202020;border:1px solid #383838;border-radius:9px;padding:10px"><small style="color:#aaa">${x[0]}</small><br><b>${x[1]}</b></div>`).join('')}</div>`;for(const c of (d.categories||[])){h+=`<div style="border:1px solid #444;border-radius:11px;overflow:auto;margin-top:13px"><div style="background:#222;padding:12px;font-weight:900">🍽️ ${esc(c.category)} <span style="float:right">${Number(c.quantity||0)} item • ${money(c.total)}</span></div><table style="width:100%;min-width:620px;border-collapse:collapse"><thead><tr><th style="padding:9px;text-align:left">Nama Menu</th><th style="padding:9px;text-align:right">Harga</th><th style="padding:9px;text-align:right">Qty</th><th style="padding:9px;text-align:right">Total</th></tr></thead><tbody>${(c.items||[]).map(x=>`<tr><td style="padding:9px;border-top:1px solid #292929"><b>${esc(x.name)}</b></td><td style="padding:9px;text-align:right;border-top:1px solid #292929">${money(x.unit_price)}</td><td style="padding:9px;text-align:right;border-top:1px solid #292929">${Number(x.quantity||0)}</td><td style="padding:9px;text-align:right;border-top:1px solid #292929">${money(x.total)}</td></tr>`).join('')}</tbody><tfoot><tr style="background:#222;font-weight:900"><td colspan="2" style="padding:10px">TOTAL ${esc(c.category)}</td><td style="padding:10px;text-align:right">${Number(c.quantity||0)}</td><td style="padding:10px;text-align:right">${money(c.total)}</td></tr></tfoot></table></div>`}h+=`<div style="margin-top:14px;background:#222;border:2px solid #666;border-radius:11px;padding:12px;font-weight:900">TOTAL SEMUA KATEGORI: ${Number(d.total_qty||0)} item • ${money(d.omzet)}</div></div>`;box.innerHTML=h;say('✓ Rekapan '+r.title+' diperbarui.')}catch(e){say('Gagal rekapan: '+e.message)}}function installReports(){try{const w=W(),r=w.document.getElementById('reports');if(!r||r.dataset.finalReports)return false;r.dataset.finalReports='1';const tools=w.document.createElement('div');tools.style.cssText='margin:10px 0;padding:10px;background:#151515;border:1px solid #3a3a3a;border-radius:11px';tools.innerHTML='<b>📋 REKAPAN DETAIL</b><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:8px"><button id="rd" type="button" style="background:#b68142;color:#fff;border:0;border-radius:9px;padding:10px;font-weight:900">📅 Harian</button><button id="rw" type="button" style="background:#315b9a;color:#fff;border:0;border-radius:9px;padding:10px;font-weight:900">📆 Mingguan</button><button id="rm" type="button" style="background:#2f7d50;color:#fff;border:0;border-radius:9px;padding:10px;font-weight:900">🗓️ Bulanan</button><button id="rp" type="button" style="background:#242424;color:#fff;border:1px solid #444;border-radius:9px;padding:10px;font-weight:900">🖨️ Print</button></div>';r.insertBefore(tools,r.querySelector('.actions'));tools.querySelector('#rd').onclick=()=>report('daily');tools.querySelector('#rw').onclick=()=>report('weekly');tools.querySelector('#rm').onclick=()=>report('monthly');tools.querySelector('#rp').onclick=()=>{const x=w.document.getElementById('detailReport');if(!x)return say('Tampilkan rekapan terlebih dahulu.');const q=w.open('','_blank');q.document.write('<html><head><title>Rekapan ISSHO CAFE</title></head><body>'+x.outerHTML+'</body></html>');q.document.close();q.focus();q.print()};return true}catch(e){console.error(e);return false}}function boot(){let n=0;const t=setInterval(()=>{try{if(W().document.readyState==='complete'){installReports();if(++n>80)clearInterval(t)}}catch(e){}},300);setInterval(()=>{try{installReports()}catch(e){}},1500)}F.addEventListener('load',boot);boot();</script><script src="/ui-standard.js?v=20260831-final"></script></body></html>
