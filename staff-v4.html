<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — KASIR</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0b0b0b;color:#f2f2f2}.wrap{max-width:1150px;margin:auto;padding:14px}.head,.card,.order{background:#151515;border:1px solid #303030;border-radius:14px}.head{padding:15px;margin-bottom:12px}.card,.order{padding:14px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}button{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.gold{background:#b68142;color:#fff}.green{background:#2f7d50;color:#fff}.red{background:#a73d35;color:#fff}.dark{background:#242424;color:#fff;border:1px solid #444}input,select{width:100%;padding:11px;border:1px solid #3b3b3b;border-radius:9px;background:#1b1b1b;color:#fff}.muted{color:#aaa;font-size:13px}.hidden{display:none}.err{background:#4a1d1a;color:#ffd9d5;padding:10px;border-radius:9px}.ok{background:#193b25;color:#d9ffe5;padding:10px;border-radius:9px}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#292929;margin:2px;font-size:12px}.item{padding:6px 0;border-bottom:1px solid #333}.proof{max-width:300px;width:100%;border-radius:10px}@media print{.noprint{display:none!important}}@media(max-width:600px){.wrap{padding:9px}}
</style></head><body><main class="wrap"><header class="head"><h1 style="margin:0">ISSHO CAFE — KASIR</h1><div class="muted">Pembayaran • Verifikasi QRIS • Pesanan • Rekapan • Print</div></header><section id="login" class="card"><h2>🔐 Login Kasir</h2><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN Kasir"><button class="gold" onclick="login()">Masuk Kasir</button><div id="msg"></div></section><section id="app" class="hidden"><div class="card noprint"><div class="row"><h2>Dashboard Kasir</h2><button class="dark" onclick="location.reload()">Keluar</button></div><div class="actions"><button class="gold" onclick="loadOrders()">📦 Pesanan</button><button class="gold" onclick="showReport()">📊 Rekapan</button><button class="gold" onclick="changePinBox()">🔐 Ganti PIN</button><button class="gold" onclick="uploadBox()">📷 Gambar Menu</button></div></div><section id="orders"><div class="card"><div class="row"><h3>Pesanan Masuk</h3><button class="gold" onclick="loadOrders()">Refresh</button></div><div id="list"></div></div></section><section id="report" class="hidden"><div class="card"><h3>📊 Rekapan Penjualan</h3><div class="row"><input id="date" type="date"><select id="session"><option value="morning">Pagi 07:00–17:00</option><option value="evening">Sore 17:00–Close</option><option value="day">Seharian 07:00–Close</option></select></div><div class="actions"><button class="gold" onclick="report()">Tampilkan</button><button onclick="window.print()">🖨️ Print</button></div><div id="reportOut"></div></div></section><section id="pinbox" class="hidden"><div class="card"><h3>🔐 Ganti PIN Kasir</h3><input id="oldpin" type="password" placeholder="PIN lama"><input id="newpin" type="password" inputmode="numeric" placeholder="PIN baru 4–8 angka"><input id="newpin2" type="password" inputmode="numeric" placeholder="Ulangi PIN baru"><button class="green" onclick="changePin()">Simpan PIN</button><div id="pinmsg"></div></div></section><section id="upload" class="hidden"><div class="card"><h3>📷 Gambar Menu</h3><div id="products"></div></div></section></section></main><script>const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',B='catalog-images';let P='',ORD=[],R=null;const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){const h=Object.assign({apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},opt.headers||{}),r=await fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h})),t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}async function login(){const p=$('pin').value.trim();if(!/^\d{4,8}$/.test(p))return $('msg').innerHTML='<div class="err">PIN tidak valid.</div>';try{const raw=await api('/rest/v1/rpc/staff_role',{method:'POST',body:JSON.stringify({p_pin:p})}),role=String(typeof raw==='string'?raw:(Array.isArray(raw)?raw[0]:(raw&&raw.role)||'')).trim().toUpperCase();if(role!=='KASIR')throw Error('PIN bukan akun Kasir.');P=p;$('login').className='hidden';$('app').className='';$('date').value=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'});loadOrders()}catch(e){$('msg').innerHTML='<div class="err">Login gagal: '+esc(e.message)+'</div>'}}async function loadOrders(){showOnly('orders');try{ORD=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:P})});$('list').innerHTML=ORD.length?ORD.map(o=>`<div class="order"><div class="row"><div><b>${esc(o.order_number)}</b><br><span class="badge">${esc(o.table_name||'Take Away')}</span><span class="badge">${esc(o.payment_method)}</span><span class="badge">${esc(o.payment_status)}</span><span class="badge">${esc(o.order_status)}</span></div><b>${money(o.total)}</b></div>${(o.items||[]).map(i=>`<div class="item">${esc(i.name)} × ${i.qty} — ${money(i.price*i.qty)}</div>`).join('')}${o.payment_proof_url?`<p><b>Bukti QRIS</b><br><a href="${esc(o.payment_proof_url)}" target="_blank"><img class="proof" src="${esc(o.payment_proof_url)}"></a></p>`:''}<div class="actions">${o.payment_method==='QRIS'&&o.payment_status!=='PAID'?`<button class="green" onclick="verify('${o.id}',true)">✓ Verifikasi QRIS</button><button class="red" onclick="verify('${o.id}',false)">Tolak</button>`:''}${o.payment_method==='CASH'&&o.payment_status!=='PAID'?`<button class="green" onclick="paid('${o.id}')">Terima Tunai</button>`:''}${o.payment_status==='PAID'&&o.order_status==='NEW'?`<button class="gold" onclick="status('${o.id}','ACCEPTED')">Terima Order</button>`:''}${o.payment_status==='PAID'?`<button class="dark" onclick="printOrder('${o.id}')">🖨️ Print 2 Nota</button>`:''}</div></div>`).join(''):'<p class="muted">Belum ada pesanan.</p>'}catch(e){$('list').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}async function verify(id,a){try{await api('/rest/v1/rpc/staff_verify_payment',{method:'POST',body:JSON.stringify({p_pin:P,p_order_id:id,p_approved:a})});loadOrders()}catch(e){alert(e.message)}}async function paid(id){try{await api('/rest/v1/rpc/staff_mark_paid',{method:'POST',body:JSON.stringify({p_pin:P,p_order_id:id})});loadOrders()}catch(e){alert(e.message)}}async function status(id,s){try{await api('/rest/v1/rpc/staff_update_order',{method:'POST',body:JSON.stringify({p_pin:P,p_order_id:id,p_status:s})});loadOrders()}catch(e){alert(e.message)}}function showOnly(id){['orders','report','pinbox','upload'].forEach(x=>$(x).className=x===id?'':'hidden')}function showReport(){showOnly('report');report()}function changePinBox(){showOnly('pinbox')}function uploadBox(){showOnly('upload');loadProducts()}function bounds(){const d=$('date').value,s=$('session').value;if(!d)return null;const f=s==='evening'?d+'T17:00:00+07:00':d+'T07:00:00+07:00',t=s==='morning'?d+'T17:00:00+07:00':new Date(new Date(d+'T00:00:00+07:00').getTime()+86400000).toISOString();return[f,t]}async function report(){try{const b=bounds();if(!b)return;R=await api('/rest/v1/rpc/staff_sales_report',{method:'POST',body:JSON.stringify({p_pin:P,p_from:b[0],p_to:b[1]})});$('reportOut').innerHTML=`<div class="card"><div class="row"><b>Transaksi</b><b>${R.orders}</b><b>Pendapatan ${money(R.revenue)}</b></div><h3>Menu Favorit</h3>${(R.favorite_menus||[]).map((x,i)=>`<div class="item">${i+1}. ${esc(x.name)} × ${x.qty} — ${money(x.revenue)}</div>`).join('')||'<span class="muted">Belum ada penjualan.</span>'}</div>`}catch(e){$('reportOut').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}async function changePin(){const a=$('oldpin').value,b=$('newpin').value,c=$('newpin2').value;if(a!==P)return $('pinmsg').innerHTML='<div class="err">PIN lama tidak sesuai.</div>';if(b!==c)return $('pinmsg').innerHTML='<div class="err">Konfirmasi PIN berbeda.</div>';try{await api('/rest/v1/rpc/staff_change_pin',{method:'POST',body:JSON.stringify({p_pin:a,p_new_pin:b})});$('pinmsg').innerHTML='<div class="ok">✓ PIN berhasil diubah. Login berikutnya gunakan PIN baru.</div>';P=b}catch(e){$('pinmsg').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}async function loadProducts(){try{const ps=await api('/rest/v1/products?select=id,name,price,image_url,active&order=name');$('products').innerHTML=ps.map(p=>`<div class="card"><b>${esc(p.name)}</b><div>${money(p.price)} • ${p.active?'AKTIF':'NONAKTIF'}</div><input id="f-${p.id}" type="file" accept="image/jpeg,image/png,image/webp"><button class="green" onclick="up('${p.id}')">Upload / Ganti Gambar</button></div>`).join('')}catch(e){$('products').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}async function up(id){const f=$('f-'+id).files[0];if(!f)return alert('Pilih gambar');if(f.size>5*1024*1024)return alert('Maksimal 5 MB');try{const ext=f.type==='image/png'?'png':f.type==='image/webp'?'webp':'jpg',path='products/'+id+'-'+Date.now()+'.'+ext,r=await fetch(`${U}/storage/v1/object/${B}/${path}`,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':f.type},body:f});if(!r.ok)throw Error(await r.text());await api('/rest/v1/rpc/staff_update_product_image',{method:'POST',body:JSON.stringify({p_pin:P,p_product_id:id,p_image_url:`${U}/storage/v1/object/public/${B}/${path}`})});alert('Gambar berhasil diperbarui');loadProducts()}catch(e){alert(e.message)}}function printOrder(id){const o=ORD.find(x=>x.id===id);if(!o)return;const items=(o.items||[]).map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price*i.qty)}</td></tr>`).join('');const a=`<h2 style="text-align:center">ISSHO CAFE</h2><b>NOTA PELANGGAN</b><p>${esc(o.order_number)} • ${esc(o.table_name||'Take Away')}<br>Pembayaran: ${esc(o.payment_method)}</p><table width="100%">${items}</table><h3 style="text-align:right">TOTAL ${money(o.total)}</h3>`;const b=`<div style="page-break-before:always"></div><h2 style="text-align:center">ISSHO CAFE</h2><b>NOTA DAPUR</b><p>Pesanan ${esc(o.order_number)} • ${esc(o.table_name||'Take Away')}</p><table width="100%">${(o.items||[]).map(i=>`<tr><td>${esc(i.name)}</td><td><b>${i.qty}</b></td></tr>`).join('')}</table>`;const w=window.open('','_blank');w.document.write('<html><body style="font-family:Arial">'+a+b+'</body></html>');w.print()}$('date').value=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'});</script></body></html>
