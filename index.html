<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISSHO CAFE V3</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f0e7;color:#211d18}header{background:#171411;color:#fff;padding:16px}.wrap{max-width:1100px;margin:auto;padding:0 14px}.brand{font-size:25px;font-weight:900}.sub{font-size:12px;opacity:.7;margin-top:3px}nav,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:800}.navbtn{background:#3b332c;color:#fff}.navbtn.active,.gold{background:#b68142;color:#fff}.dark{background:#171411;color:#fff}.green{background:#2f7d50;color:#fff}.red{background:#a73d35;color:#fff}.card{background:#fff;border:1px solid #e3d8ca;border-radius:16px;padding:16px;margin:14px 0}.hero{background:#171411;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.menu,.order{border:1px solid #e3d8ca;border-radius:14px;padding:13px;background:#fff}.pic{height:110px;background:#eee3d1;border-radius:12px;display:grid;place-items:center;font-size:48px}.pic img{width:100%;height:100%;object-fit:cover;border-radius:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:#777;font-size:13px}.price,.total{font-weight:900}.total{font-size:22px}select,input,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px}.itemline{padding:8px 0;border-bottom:1px solid #eee}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eee;font-size:12px;font-weight:800}.new{background:#fff0cf}.paid{background:#dff3e5}.qris{background:#e8e1ff}.danger{background:#ffe0dd}.pending{background:#fff0cf}.approved{background:#dff3e5}.rejected{background:#ffe0dd}.hidden{display:none}.err{background:#ffe1de;color:#8d2d27;padding:12px;border-radius:10px}.ok{background:#dff3e5;color:#25633b;padding:12px;border-radius:10px}.qrisbox{text-align:center}.qrisimg{width:min(420px,100%);height:auto;border-radius:14px;border:1px solid #ddd;margin:10px auto;display:block}.paytotal{font-size:20px}.paytotal b{font-size:30px}.proof{max-width:320px;width:100%;border-radius:12px;border:1px solid #ddd;margin-top:10px}.hint{background:#fff6dd;padding:12px;border-radius:10px;margin:12px 0;font-size:13px}</style></head><body><header><div class="wrap"><div class="brand">ISSHO CAFE</div><div class="sub">ONLINE ORDERING • KASIR • DAPUR • OWNER</div><nav><button class="navbtn active" onclick="show('customer')">Pelanggan</button><button class="navbtn" onclick="show('staff')">Kasir / Dapur / Owner</button></nav></div></header><main class="wrap"><section id="customer"><div id="load" class="card">Menghubungkan ke Issho Cafe...</div><div id="custApp" class="hidden"><div class="card hero"><div style="font-size:12px;opacity:.7">DINE IN</div><h2 id="tn">Meja 01</h2><select id="ts"></select><div style="font-size:12px;margin-top:7px;color:#ddd">Scan QR meja akan mengisi meja otomatis.</div></div><div id="menu" class="grid"></div><div class="card"><h3>Keranjang</h3><div id="cart"></div><div class="row"><b>Total</b><span class="total" id="tot">Rp0</span></div><textarea id="note" rows="2" placeholder="Catatan pesanan"></textarea><div class="actions"><button class="gold" onclick="place('QRIS')">Pesan & QRIS</button><button class="dark" onclick="place('CASH')">Pesan & Tunai</button></div><div id="cres"></div></div><div id="qrisbox" class="hidden"></div></div></section><section id="staff" class="hidden"><div id="login" class="card"><h2>Login Staff</h2><p class="muted">Kasir <b>1234</b> • Dapur <b>5678</b> • Owner <b>9999</b></p><input id="pin" type="password" placeholder="Masukkan PIN"><div class="actions"><button class="gold" onclick="loginStaff()">Masuk</button></div><div id="lerr"></div></div><div id="dash" class="hidden"><div class="card"><div class="row"><h2 id="roleTitle">Dashboard</h2><button class="dark" onclick="logout()">Keluar</button></div><div id="summary"></div></div><div class="card"><div class="row"><h2>Pesanan</h2><button class="gold" onclick="loadStaff()">Refresh</button></div><div id="orders"></div></div></div></section></main><script>const URL='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',BUCKET='payment-proofs';let tables=[],products=[],cart=[],tableId=null,pin='',role='';const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){const h=Object.assign({apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},opt.headers||{});const r=await fetch(URL+path,Object.assign({},opt,{headers:h})),t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}function tableKey(v){return String(v??'').trim().replace(/^meja\s*/i,'').padStart(2,'0')}async function start(){try{[tables,products]=await Promise.all([api('/rest/v1/tables?select=id,table_number,name,qr_slug&active=eq.true&order=table_number'),api('/rest/v1/products?select=id,name,description,price,image_url&active=eq.true&order=sort_order,name')]);const qp=new URLSearchParams(location.search).get('table'),q=tableKey(qp),t=tables.find(x=>x.qr_slug===qp)||tables.find(x=>tableKey(x.table_number)===q)||tables[0];if(!t)throw Error('Belum ada meja aktif di database.');tableId=t.id;$('ts').innerHTML=tables.map(x=>`<option value="${x.id}" ${x.id===tableId?'selected':''}>${esc(x.name)}</option>`).join('');$('ts').onchange=e=>{tableId=e.target.value;$('tn').textContent=tables.find(x=>x.id===tableId).name};$('tn').textContent=t.name;renderMenu();renderCart();$('load').className='hidden';$('custApp').className=''}catch(e){$('load').innerHTML=`<b>Koneksi gagal</b><div class="err">${esc(e.message)}</div><button class="gold" onclick="start()">Coba lagi</button>`}}function renderMenu(){$('menu').innerHTML=products.map(p=>`<div class="menu"><div class="pic">${p.image_url?`<img src="${esc(p.image_url)}">`:'☕'}</div><div class="muted">ISSHO CAFE</div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.description||'')}</div><div class="row"><b class="price">${money(p.price)}</b><button class="gold" onclick="add('${p.id}')">Tambah</button></div></div>`).join('')}function add(id){const x=cart.find(a=>a.id===id);x?x.qty++:cart.push({id,qty:1});renderCart()}function ch(id,d){const x=cart.find(a=>a.id===id);if(!x)return;x.qty+=d;if(x.qty<1)cart=cart.filter(a=>a.id!==id);renderCart()}function renderCart(){let total=0;$('cart').innerHTML=cart.length?cart.map(x=>{const p=products.find(a=>a.id===x.id);total+=p.price*x.qty;return `<div class="row itemline"><span>${esc(p.name)}<br><small>${money(p.price)}</small></span><span><button onclick="ch('${x.id}',-1)">−</button> ${x.qty} <button onclick="ch('${x.id}',1)">+</button></span></div>`}).join(''):'Keranjang masih kosong.';$('tot').textContent=money(total)}function showQRIS(order,total){$('qrisbox').className='card qrisbox';$('qrisbox').innerHTML=`<h2>PEMBAYARAN QRIS</h2><p>Scan QRIS ISSHO CAFE dengan mobile banking/e-wallet.</p><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAcgAAAHIAQAAAADi2kdHAAADmUlEQVR42u1cwW5cQQizq/7/L7sHMENuVU881ZGyWWUfFyPAeDxL4R9/fiGRiUxkIhOZyP81EpI0b9FvBQiChH4D7Y8hScH2YuRv5w8gIAogBIBivVAQQIH7yWB7OZ8gnMT6A4CVXaevEjxPBtvT+XQfJVjt1yXa9VrJVLD9WKQEEiBIEKxy1AzUIPSR+nyNVSAogF2b3WZVtbpqNNjejSTJSqa45mnPShMi8D0ZbA/X56whlcritJ3SJkVc9DbYHo+ciVnZk8SuxTdYnelgezqSWu8oyv+p1M4v1iYTbO/Pz1pO2MJBSwskunJnDSVdtsH2eKTXkpc39fbZFNcTtTbUYHs4Uk1yS1CojaWXTjXHXUQp9Xl7ftK81RLuqHqWbSH342G5wfZspLxXSp6TQ4rwlCE35NTn8f2TzWw7a1zFCogQVcctzZpSn8f1hNkst2jQOZRTqGnRVLC9zocEidYWKsfdXL2TsphtC7rB9jIfMtUR3/bi4Un90B6c3mB7t9+CZrY+8py0dhsWe7DKJ6TB9mw+fUDmGdoHKoT4BD61ZOSCDbZ3+a06hwJfRY5cJHMjAWNCCbaH67MpblVgC3uLGPWxC9jsNvPz+r4yTiHKO+dofJb+2ugXfegDkXYf1Hrirtu548hD40gJtqcjNfI7JI6oMErunGOPsSjYHt4/sdNVDIj7IfVsXUJDsL0dqfZqsqrVMvyTiMonr6fYB9u7+pBlvGK3c+thiUUYX7UXlmB7eV+pE5S2nOAZTJYIH2w/Famyl2j88FR3YHJsm3jTNtje7bdzymn5vVQ9LsFoGm30oQ/w27Ei1Mubp76UZIar6EMfqs/JbOu1jwKNypD7K/f5UGkHrkgfhY4mZCu1tp062B7ut1V5PSpnw3zd91XnXOcNtncj69IK5zC7bwiClhPqGmi1ZC8uwfZwpDjnKD+khUqsIPKZNXPf4Xy/9UHYarCtyk9y14cIvz0eSdYX19T9Bj4DtclQFyeecTPYnt5X5tXOav3wyS89N/6+L+gJwLRc6wlv5RwWHH/CF/ZPn35Wb+3rZXUXdGR4+gMbFoLt3X67aO1mQqMczUK6CjrYnq1Pz87n4PvRfifTc1E79fmJSM7VB7arumxh6sWlv6Ex8/N8fVpVkHVarmuCz2RdzrCcr5zP574L6D1FbaV2qrlIUbA9nU8OOeL4NNcXvNlV7QsPqc9v7J9BKJGJTGQiE5nIv/r5A9qxLqE4kbhwAAAAAElFTkSuQmCC" class="qrisimg"><div class="paytotal">Total: <b>${money(total)}</b></div><div class="hint">Setelah membayar, upload <b>bukti pembayaran</b>. Kasir akan memeriksa bukti sebelum order diproses dapur.</div><input id="proof" type="file" accept="image/jpeg,image/png,image/webp"><div class="actions"><button class="green" onclick="uploadProof('${order}')">Upload Bukti Pembayaran</button></div><div id="proofmsg"></div>`}async function uploadProof(orderId){const f=$('proof').files[0];if(!f)return $('proofmsg').innerHTML='<div class="err">Pilih foto bukti pembayaran terlebih dahulu.</div>';if(f.size>5*1024*1024)return $('proofmsg').innerHTML='<div class="err">Ukuran foto maksimal 5 MB.</div>';try{$('proofmsg').innerHTML='<div class="hint">Mengupload bukti...</div>';const path=orderId+'/'+crypto.randomUUID()+'.'+(f.type.split('/')[1]||'jpg');const r=await fetch(`${URL}/storage/v1/object/${BUCKET}/${path}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':f.type},body:f});if(!r.ok)throw Error(await r.text());const url=`${URL}/storage/v1/object/public/${BUCKET}/${path}`;await api('/rest/v1/rpc/submit_payment_proof',{method:'POST',body:JSON.stringify({p_order_id:orderId,p_proof_url:url})});$('proofmsg').innerHTML='<div class="ok"><b>Bukti pembayaran berhasil dikirim.</b><br>Kasir akan memeriksa sebelum pesanan diproses.</div>';$('proof').disabled=true}catch(e){$('proofmsg').innerHTML=`<div class="err">Upload gagal: ${esc(e.message)}</div>`}}async function place(method){if(!cart.length)return alert('Keranjang masih kosong.');try{const d=await api('/rest/v1/rpc/create_customer_order',{method:'POST',body:JSON.stringify({p_table_id:tableId,p_payment_method:method,p_items:cart.map(x=>({product_id:x.id,quantity:x.qty})),p_note:$('note').value||null})});cart=[];$('note').value='';renderCart();$('cres').className='ok';$('cres').innerHTML=`<h3>Pesanan berhasil</h3><p>Nomor: <b>${esc(d.order_number)}</b></p><p>Total: <b>${money(d.total)}</b></p>`;if(method==='QRIS')showQRIS(d.id,d.total);else $('cres').innerHTML+=`<p>Silakan bayar tunai di kasir.</p>`}catch(e){$('cres').className='err';$('cres').textContent=e.message}}function show(x){$('customer').classList.toggle('hidden',x!=='customer');$('staff').classList.toggle('hidden',x!=='staff');document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.navbtn')[x==='customer'?0:1].classList.add('active')}async function loginStaff(){const p=$('pin').value.trim();if(!['1234','5678','9999'].includes(p))return $('lerr').innerHTML='<div class="err">PIN salah.</div>';pin=p;role=p==='1234'?'KASIR':p==='5678'?'DAPUR':'OWNER';$('login').className='hidden';$('dash').className='';$('roleTitle').textContent='Dashboard '+role;loadStaff()}function logout(){pin='';role='';$('dash').className='hidden';$('login').className='card';$('pin').value=''}async function loadStaff(){try{const [orders,sum]=await Promise.all([api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:pin})}),api('/rest/v1/rpc/staff_summary',{method:'POST',body:JSON.stringify({p_pin:pin})})]);$('summary').innerHTML=`<div class="grid"><div class="card"><b>Lunas Hari Ini</b><h2>${sum.orders}</h2></div><div class="card"><b>Omzet</b><h2>${money(sum.total)}</h2></div><div class="card"><b>Tunai</b><h2>${money(sum.cash)}</h2></div><div class="card"><b>QRIS</b><h2>${money(sum.qris)}</h2></div></div>`;renderOrders(orders)}catch(e){$('orders').innerHTML=`<div class="err">${esc(e.message)}</div>`}}function renderOrders(list){if(!list.length)return $('orders').innerHTML='<div class="muted">Belum ada pesanan.</div>';$('orders').innerHTML=list.map(o=>{const q=o.payment_method==='QRIS',verified=o.payment_status==='PAID'&&o.payment_proof_status==='APPROVED',canProcess=!q||verified;return `<div class="order"><div class="row"><div><b>${esc(o.order_number)}</b><br><span class="badge">${esc(o.table_name||'Take Away')}</span> <span class="badge ${q?'qris':'new'}">${esc(o.payment_method)}</span> <span class="badge ${verified?'paid':o.payment_proof_status==='PENDING'?'pending':'danger'}">${q?esc(o.payment_proof_status||'NONE')+' / '+esc(o.payment_status):esc(o.payment_status)}</span></div><b>${money(o.total)}</b></div><div>${(o.items||[]).map(i=>`<div class="itemline">${esc(i.name)} × ${i.qty} — ${money(i.price*i.qty)}</div>`).join('')}</div>${q&&o.payment_proof_url?`<div><b>Bukti Pembayaran QRIS:</b><br><img class="proof" src="${esc(o.payment_proof_url)}"><div class="actions">${role==='KASIR'&&o.payment_proof_status==='PENDING'?`<button class="green" onclick="verifyPay('${o.id}',true)">✓ Verifikasi Pembayaran</button><button class="red" onclick="verifyPay('${o.id}',false)">Tolak Bukti</button>`:''}</div></div>`:q?`<div class="hint">Menunggu pelanggan upload bukti pembayaran.</div>`:''}<div class="actions">${role==='KASIR'&&(!q)&&o.payment_status!=='PAID'?`<button class="green" onclick="paid('${o.id}')">Terima Pembayaran Tunai</button>`:''}${role==='KASIR'&&canProcess?`<button class="gold" onclick="status('${o.id}','ACCEPTED')">Terima Order</button>`:''}${role==='DAPUR'&&canProcess&&(o.order_status==='NEW'||o.order_status==='ACCEPTED')?`<button class="gold" onclick="status('${o.id}','PREPARING')">Mulai Masak</button>`:''}${role==='DAPUR'&&canProcess&&o.order_status==='PREPARING'?`<button class="green" onclick="status('${o.id}','READY')">Pesanan Siap</button>`:''}${role==='OWNER'?`<button class="dark" onclick="status('${o.id}','COMPLETED')">Selesaikan</button>`:''}</div></div>`}).join('')}async function verifyPay(id,ok){try{await api('/rest/v1/rpc/staff_verify_payment',{method:'POST',body:JSON.stringify({p_pin:pin,p_order_id:id,p_approved:ok})});loadStaff()}catch(e){alert(e.message)}}async function paid(id){try{await api('/rest/v1/rpc/staff_mark_paid',{method:'POST',body:JSON.stringify({p_pin:pin,p_order_id:id})});loadStaff()}catch(e){alert(e.message)}}async function status(id,s){try{await api('/rest/v1/rpc/staff_update_order',{method:'POST',body:JSON.stringify({p_pin:pin,p_order_id:id,p_status:s})});loadStaff()}catch(e){alert(e.message)}}start();setInterval(()=>{if(pin)loadStaff()},10000);</script></body></html>
