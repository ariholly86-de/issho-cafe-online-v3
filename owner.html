<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>ISSHO CAFE — OWNER</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}#bar{position:fixed;right:14px;top:14px;z-index:99999;display:flex;gap:7px;background:#151515;border:1px solid #444;border-radius:12px;padding:7px;box-shadow:0 8px 25px #000}button{border:0;border-radius:9px;padding:10px 13px;font-weight:900;cursor:pointer}.add{background:#b68142;color:#fff}.manager{background:#315b9a;color:#fff}</style></head><body><div id="bar"><button class="manager" onclick="location.href='owner-menu-manager.html?v=dynamic-category-live'">🍽️ Kelola Menu & Kategori</button><button class="add" onclick="location.href='owner-add-menu.html?v=dynamic-category-live'">➕ Tambah Menu Baru</button></div><iframe id="app" title="ISSHO CAFE OWNER" src="owner-v3.html?v=dynamic-category-live"></iframe><script>const SUPA='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',frame=document.getElementById('app');let lastCategorySignature='';async function getCategories(){const r=await fetch(SUPA+'/rest/v1/categories?select=id,name,active,sort_order&active=eq.true&order=sort_order,name',{cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error(await r.text());return await r.json()}function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m])}async function syncOwnerCategories(force){try{const cats=await getCategories();const sig=cats.map(c=>c.id+':'+c.name+':'+c.active).join('|');const w=frame.contentWindow;if(!w||!w.document)return;if(!force&&sig===lastCategorySignature)return;lastCategorySignature=sig;w.__OWNER_CATEGORIES=cats;w.__OWNER_CATEGORY_MAP=Object.fromEntries(cats.map(c=>[c.id,c.name]));w.category=function(p){return w.__OWNER_CATEGORY_MAP?.[p.category_id]||'Tanpa Kategori'};w.cats=function(){const el=w.document.getElementById('cats');if(!el)return;const current=w.CAT||'Semua';const counts={};(w.PS||[]).forEach(p=>{const n=w.__OWNER_CATEGORY_MAP?.[p.category_id]||'Tanpa Kategori';counts[n]=(counts[n]||0)+1});const all=['Semua',...cats.map(c=>c.name)];el.innerHTML=all.map(c=>'<button class="'+(current===c?'gold':'dark')+'" onclick="CAT='+JSON.stringify(c)+';renderProducts()">'+esc(c)+(c==='Semua'?' ('+(w.PS||[]).length+')':' ('+(counts[c]||0)+')')+'</button>').join('')};w.loadProducts=async function(){try{w.PS=await w.api('/rest/v1/products?select=id,category_id,name,description,price,image_url,active&order=name');w.cats();w.renderProducts()}catch(e){const el=w.document.getElementById('products');if(el)el.innerHTML='<div class="err">'+esc(e.message)+'</div>'}};w.cats();if(typeof w.renderProducts==='function')w.renderProducts();if(w.document.getElementById('menu')&&!w.document.getElementById('menu').classList.contains('hidden'))w.loadProducts()}catch(e){console.error('Owner category sync:',e)}}frame.addEventListener('load',()=>{syncOwnerCategories(true);setInterval(()=>syncOwnerCategories(false),3000)});</script></body></html>
