<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>ISSHO CAFE — OWNER</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}#bar{position:fixed;right:14px;top:14px;z-index:99999;display:flex;gap:7px;background:#151515;border:1px solid #444;border-radius:12px;padding:7px;box-shadow:0 8px 25px #000}button{border:0;border-radius:9px;padding:10px 13px;font-weight:900;cursor:pointer}.add{background:#b68142;color:#fff}</style></head><body><div id="bar"><button class="add" onclick="location.href='owner-add-menu.html?v=20260823-category-open'">➕ Tambah Menu Baru</button></div><iframe id="app" title="ISSHO CAFE OWNER" src="owner-v3.html?v=20260823-category-sync"></iframe><script>(function(){const f=document.getElementById('app');function esc(s){return String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function sync(){try{const w=f.contentWindow,d=f.contentDocument;if(!w||!d||!w.api)return;const cats=d.getElementById('cats');if(!cats)return;w.api('/rest/v1/categories?select=id,name,active,sort_order&active=eq.true&order=sort_order,name').then(a=>{const names=['Semua',...(a||[]).map(x=>x.name).filter(Boolean)];cats.innerHTML=names.map(c=>'<button class="'+(w.CAT===c?'gold':'dark')+'" onclick="CAT='+JSON.stringify(c)+';renderProducts()">'+esc(c)+'</button>').join('')}).catch(()=>{})}catch(e){}}f.addEventListener('load',()=>{setTimeout(sync,300);setInterval(sync,3000)});})();</script></body></html>
