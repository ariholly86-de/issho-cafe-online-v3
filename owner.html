<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>ISSHO CAFE — OWNER</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}#bar{position:fixed;right:14px;top:14px;z-index:99999;display:flex;gap:7px;align-items:center;background:#151515;border:1px solid #444;border-radius:12px;padding:7px;box-shadow:0 8px 25px #000}button{border:0;border-radius:9px;padding:10px 13px;font-weight:900;cursor:pointer}.add{background:#b68142;color:#fff}.manager{background:#315b9a;color:#fff}.restore{background:#2f7d50;color:#fff}.restore.busy{opacity:.65;pointer-events:none}#panel{display:none;position:fixed;right:14px;top:68px;width:min(440px,calc(100vw - 28px));max-height:75vh;overflow:auto;z-index:100000;background:#151515;color:#fff;border:1px solid #555;border-radius:14px;padding:14px;box-shadow:0 18px 50px #000}#panel h3{margin:0 0 8px}.hint{color:#aaa;font-size:12px;margin-bottom:10px}.item{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid #333}.item input{width:20px;height:20px}.item small{display:block;color:#999;margin-top:3px}.panel-actions{display:flex;gap:7px;position:sticky;bottom:0;background:#151515;padding-top:10px}.green{background:#2f7d50;color:#fff}.dark{background:#242424;color:#fff}.all{background:#b68142;color:#fff}#status{position:fixed;left:14px;bottom:14px;z-index:100001;background:#151515;color:#fff;border:1px solid #444;border-radius:10px;padding:10px 13px;font:13px Arial;display:none}@media(max-width:700px){#bar{left:6px;right:6px;top:6px;justify-content:flex-end}#bar button{font-size:11px;padding:8px}.manager,.add{display:none}}</style></head><body><div id="bar"><button id="restore" class="restore" type="button">🟢 PULIHKAN MENU TERPILIH (0)</button><button class="manager" type="button" onclick="location.href='owner-menu-manager.html?v=20260830-selected-restore'">🍽️ Kelola Menu & Kategori</button><button class="add" type="button" onclick="location.href='owner-add-menu.html?v=20260830-selected-restore'">➕ Tambah Menu Baru</button></div><div id="panel"><h3>🔴 Stok Kosong / Hapus centang</h3><div class="hint">Centang hanya menu yang stoknya sudah tersedia kembali. Menu lain yang masih kosong tetap tersembunyi.</div><div id="items">Memuat menu...</div><div class="panel-actions"><button class="all" id="checkAll">☑ Pilih Semua</button><button class="green" id="apply">🟢 PULIHKAN MENU TERPILIH (0)</button><button class="dark" id="close">Tutup</button></div></div><div id="status"></div><iframe id="app" title="ISSHO CAFE OWNER" src="owner-v3.html?v=20260830-selected-restore"></iframe><script>const SUPA='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',frame=document.getElementById('app'),btn=document.getElementById('restore'),panel=document.getElementById('panel'),items=document.getElementById('items'),apply=document.getElementById('apply'),status=document.getElementById('status');let hidden=[];const show=t=>{status.textContent=t;status.style.display='block';clearTimeout(show.t);show.t=setTimeout(()=>status.style.display='none',3500)};function getPin(){try{return frame.contentWindow.document.getElementById('pin')?.value?.trim()||''}catch(e){return''}}async function api(path,opt={}){const h=Object.assign({apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},opt.headers||{});const r=await fetch(SUPA+path,Object.assign({cache:'no-store'},opt,{headers:h})),t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null}function selected(){return [...document.querySelectorAll('#items input[type=checkbox]:checked')]}function updateCount(){const n=selected().length;btn.textContent='🟢 PULIHKAN MENU TERPILIH ('+n+')';apply.textContent='🟢 PULIHKAN MENU TERPILIH ('+n+')'}async function openPanel(){const pin=getPin();if(!pin){show('Silakan login Owner terlebih dahulu.');return}panel.style.display='block';items.textContent='Memuat menu stok kosong...';try{hidden=await api('/rest/v1/products?select=id,name,description,price,active,category_id&active=eq.false&order=name');if(!hidden.length){items.innerHTML='<div style="color:#9f9">✓ Tidak ada menu yang sedang disembunyikan.</div>';updateCount();return}items.innerHTML=hidden.map(p=>'<label class="item"><input type="checkbox" value="'+p.id+'"><span><b>'+esc(p.name)+'</b><small>'+esc(p.description||'')+' • Rp'+Number(p.price||0).toLocaleString('id-ID')+'</small></span></label>').join('');document.querySelectorAll('#items input').forEach(x=>x.addEventListener('change',updateCount));updateCount()}catch(e){items.innerHTML='<div style="color:#ff8f83">Gagal memuat: '+esc(e.message)+'</div>'}}function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}async function restoreSelected(){const pin=getPin(),sel=selected();if(!pin)return show('Silakan login Owner terlebih dahulu.');if(!sel.length)return show('Pilih minimal satu menu.');apply.classList.add('busy');try{let ok=0;for(const cb of sel){const p=hidden.find(x=>x.id===cb.value);if(!p)continue;await api('/rest/v1/rpc/owner_update_product',{method:'POST',body:JSON.stringify({p_owner_pin:pin,p_product_id:p.id,p_name:p.name,p_price:Number(p.price),p_description:p.description||'',p_active:true})});ok++}show('✓ '+ok+' menu berhasil dipulihkan.');panel.style.display='none';try{if(typeof frame.contentWindow.loadProducts==='function')await frame.contentWindow.loadProducts()}catch(e){}setTimeout(()=>{try{frame.contentWindow.location.reload()}catch(e){}},250);setTimeout(()=>{try{frame.contentWindow.parent.location.reload()}catch(e){}},900)}catch(e){show('Gagal memulihkan: '+e.message)}finally{apply.classList.remove('busy')}}btn.addEventListener('click',openPanel);apply.addEventListener('click',restoreSelected);document.getElementById('close').onclick=()=>panel.style.display='none';document.getElementById('checkAll').onclick=()=>{const boxes=document.querySelectorAll('#items input');boxes.forEach(x=>x.checked=true);updateCount()};</script></body></html>
