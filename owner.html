<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>ISSHO CAFE — OWNER</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}#restoreBar{position:fixed;right:18px;top:14px;z-index:99999;display:flex;gap:8px;align-items:center;background:#151515;border:1px solid #444;border-radius:12px;padding:8px;box-shadow:0 8px 25px rgba(0,0,0,.45)}#restoreBtn{border:0;border-radius:9px;padding:10px 14px;background:#2f7d50;color:#fff;font-weight:900;cursor:pointer}#restoreBtn:disabled{opacity:.6;cursor:wait}</style></head><body><div id="restoreBar"><button id="restoreBtn" title="Aktifkan kembali semua menu yang pernah di-uncheck">♻️ Pulihkan Semua Menu</button></div><iframe id="app" title="ISSHO CAFE OWNER"></iframe><script>const f=document.getElementById('app'),rb=document.getElementById('restoreBtn');f.src='owner-v3.html?v=20260822-restore-all-final';let timer;function fix(){try{const d=f.contentDocument;if(!d)return;const search=d.getElementById('menuSearch'),cats=d.getElementById('cats');if(search&&cats&&!search.dataset.globalFix){search.dataset.globalFix='1';search.addEventListener('input',()=>{if(search.value.trim()){const b=[...cats.querySelectorAll('button')].find(x=>x.textContent.trim()==='Semua');if(b)b.click()}})}}catch(e){}}async function restoreAll(){try{const w=f.contentWindow,d=f.contentDocument;if(!w||!d)return;if(!w.P||!w.PS||typeof w.setStock!=='function')return alert('Silakan login ke Owner terlebih dahulu, lalu buka menu Semua Menu & Stok.');const off=(w.PS||[]).filter(p=>p.active!==true);if(!off.length){alert('Semua menu sudah aktif. Tidak ada menu stok kosong/uncheck yang perlu dipulihkan.');return}if(!confirm('Pulihkan '+off.length+' menu yang sedang STOK KOSONG / UNCHECK?\n\nSemua menu tersebut akan kembali AKTIF dan tampil di Pelanggan & Kasir.'))return;rb.disabled=true;rb.textContent='⏳ Memulihkan...';let ok=0,fail=0;for(const p of off){try{await w.setStock(p.id,true);ok++}catch(e){fail++}}if(typeof w.loadProducts==='function')await w.loadProducts();alert('Selesai. '+ok+' menu berhasil diaktifkan kembali.'+(fail?' '+fail+' menu gagal diproses.':''))}catch(e){alert('Gagal memulihkan menu: '+(e.message||e))}finally{rb.disabled=false;rb.textContent='♻️ Pulihkan Semua Menu'}}rb.onclick=restoreAll;f.addEventListener('load',()=>{let n=0;timer=setInterval(()=>{fix();if(++n>120)clearInterval(timer)},100)});</script></body></html>
