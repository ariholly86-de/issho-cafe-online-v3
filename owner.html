<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>ISSHO CAFE — OWNER</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}#bar{position:fixed;right:14px;top:14px;z-index:99999;display:flex;gap:7px;background:#151515;border:1px solid #444;border-radius:12px;padding:7px;box-shadow:0 8px 25px #000}button{border:0;border-radius:9px;padding:10px 13px;font-weight:900;cursor:pointer}.add{background:#b68142;color:#fff}.manager{background:#315b9a;color:#fff}</style></head><body><div id="bar"><button class="manager" onclick="location.href='owner-menu-manager.html?v=catfix20260823'">🍽️ Kelola Menu & Kategori</button><button class="add" onclick="location.href='owner-add-menu.html?v=catfix20260823'">➕ Tambah Menu Baru</button></div><iframe id="app" title="ISSHO CAFE OWNER" src="owner-v3.html?v=catfix20260823"></iframe><script>
const SUPA='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',frame=document.getElementById('app');let lastSig='',busy=false;
function esc(s){return String(s??'').replace(/[&<>\\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[m]))}
async function rpc(path,body){const r=await fetch(SUPA+path,{method:'POST',cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null}
async function syncOwner(){try{const w=frame.contentWindow;if(!w||!w.document)return;const app=w.document.getElementById('app'),pinEl=w.document.getElementById('pin');if(!app||app.classList.contains('hidden')||!pinEl||!pinEl.value.trim())return;const pin=pinEl.value.trim();const cats=await rpc('/rest/v1/rpc/owner_list_categories',{p_owner_pin:pin});const rows=Array.isArray(cats)?cats:[];const products=await w.api('/rest/v1/products?select=id,category_id,name,description,price,image_url,active&order=name');const sig=rows.map(c=>c.id+':'+c.name+':'+c.active).join('|')+'#'+products.map(p=>p.id+':'+p.name+':'+p.price+':'+p.active+':'+(p.category_id||'')).join('|');if(sig===lastSig)return;lastSig=sig;w.__OWNER_CATEGORIES=rows;w.__OWNER_CATEGORY_MAP=Object.fromEntries(rows.map(c=>[c.id,c.name]));w.PS=products;
w.category=function(p){return w.__OWNER_CATEGORY_MAP?.[p.category_id]||'Tanpa Kategori'};
w.cats=function(){const el=w.document.getElementById('cats');if(!el)return;const current=w.CAT||'Semua';const counts={};(w.PS||[]).forEach(p=>{const n=w.__OWNER_CATEGORY_MAP?.[p.category_id]||'Tanpa Kategori';counts[n]=(counts[n]||0)+1});const all=['Semua',...rows.map(c=>c.name)];el.innerHTML=all.map(c=>'<button class="'+(current===c?'gold':'dark')+'" onclick="CAT='+JSON.stringify(c)+';renderProducts()">'+esc(c)+' ('+(c==='Semua'?(w.PS||[]).length:(counts[c]||0))+')</button>').join('')};
w.renderProducts=function(){const q=(w.$('menuSearch')?.value||'').trim().toLowerCase();let list=(w.PS||[]).filter(p=>w.CAT==='Semua'||w.category(p)===w.CAT);if(w.MENU_FILTER==='off')list=list.filter(p=>p.active!==true);if(w.MENU_FILTER==='on')list=list.filter(p=>p.active===true);if(w.MENU_FILTER==='noimg')list=list.filter(p=>!p.image_url||!String(p.image_url).trim());if(q)list=list.filter(p=>(p.name+' '+(p.description||'')+' '+w.category(p)).toLowerCase().includes(q));const all=w.PS||[];w.$('statAll').textContent='Semua: '+all.length;w.$('statOff').textContent='Stok kosong/uncheck: '+all.filter(p=>p.active!==true).length;w.$('statOn').textContent='Aktif/tampil: '+all.filter(p=>p.active===true).length;w.$('menuCount').textContent='Menampilkan '+list.length+' menu dari '+all.length+' menu yang tersimpan di Owner.';if(typeof w.setFilterButtons==='function')w.setFilterButtons();w.$('products').innerHTML=list.length?list.map(p=>'<div class="card '+(p.active===true?'stock-on':'stock-off')+'"><div class="row"><div><b>'+w.esc(p.name)+'</b><div class="muted">Kategori: '+w.esc(w.category(p))+'</div></div>'+(p.active===true?'<span class="badge badge-on">AKTIF / TAMPIL</span>':'<span class="badge badge-off">STOK KOSONG / UNCHECK</span>')+'</div>'+(p.image_url?'<img class="thumb" src="'+w.esc(p.image_url)+'" alt="'+w.esc(p.name)+'">':'<div class="thumb" style="display:grid;place-items:center;color:#777">Belum ada gambar</div>')+'<input id="n-'+p.id+'" value="'+w.esc(p.name)+'" placeholder="Nama menu"><input id="p-'+p.id+'" type="number" min="0" value="'+p.price+'" placeholder="Harga"><input id="d-'+p.id+'" value="'+w.esc(p.description||'')+'" placeholder="Deskripsi"><label style="display:flex;gap:8px;align-items:center;margin-top:5px"><input id="a-'+p.id+'" type="checkbox" '+(p.active===true?'checked':'')+' style="width:auto;margin:0"><b>'+(p.active===true?'AKTIF — tampil di Pelanggan & Kasir':'STOK KOSONG — disembunyikan dari Pelanggan & Kasir')+'</b></label><input id="f-'+p.id+'" type="file" accept="image/jpeg,image/png,image/webp"><div class="actions">'+(p.active===true?'<button class="gold" onclick="saveProduct(\''+p.id+'\')">💾 Simpan Menu</button><button class="red" onclick="setStock(\''+p.id+'\',false)">🔴 Tandai Stok Kosong</button>':'<button class="green" onclick="setStock(\''+p.id+'\',true)">🟢 Aktifkan & Tampilkan</button><button class="gold" onclick="saveProduct(\''+p.id+'\')">💾 Simpan Perubahan</button>')+'<button class="blue" onclick="uploadImage(\''+p.id+'\')">🖼️ Upload / Ganti Gambar</button></div><div id="s-'+p.id+'"></div></div>').join(''):'<div class="card empty">Menu tidak ditemukan. Coba kategori lain atau pilih Semua Menu.</div>'};
w.loadProducts=async function(){if(busy)return;busy=true;try{const pin=w.document.getElementById('pin')?.value.trim();if(!pin)return;const c=await rpc('/rest/v1/rpc/owner_list_categories',{p_owner_pin:pin});w.__OWNER_CATEGORIES=Array.isArray(c)?c:[];w.__OWNER_CATEGORY_MAP=Object.fromEntries(w.__OWNER_CATEGORIES.map(x=>[x.id,x.name]));w.PS=await w.api('/rest/v1/products?select=id,category_id,name,description,price,image_url,active&order=name');w.cats();w.renderProducts()}catch(e){const el=w.document.getElementById('products');if(el)el.innerHTML='<div class="err">Gagal memuat menu/kategori: '+esc(e.message)+'</div>'}finally{busy=false}};
}catch(e){console.error('Owner category sync',e)}}
frame.addEventListener('load',()=>{setInterval(syncOwner,1000)});setInterval(syncOwner,1000);
</script></body></html>
