h)search.value='';if(all)all.click();if(cats){const b=[...cats.querySelectorAll('button')].find(x=>x.textContent.trim()==='Semua');if(b)b.click()}await new Promise(r=>setTimeout(r,250));let count=0;while(count<150){const btn=[...d.querySelectorAll('#products button')].find(x=>x.textContent.includes('Aktifkan & Tampilkan'));if(!btn)break;btn.click();count++;await new Promise(r=>setTimeout(r,850))}alert(count?'Berhasil memulihkan '+count+' menu stok kosong. Sekarang menu tersebut aktif dan tampil di Pelanggan & Kasir.':'Tidak ada menu stok kosong yang perlu dipulihkan.')}catch(e){alert('Gagal memulihkan menu: '+(e.message||e))}}f.addEventListener('load',()=>{let n=0;timer=setInterval(()=>{fix();if(++n>120)clearInterval(timer)},100)});</script></body></html>
