<script>
(function(){
  var btn=document.getElementById('openApp');
  btn.addEventListener('click',function(e){
    e.preventDefault();
    var opened=false;
    var onHide=function(){opened=true};
    document.addEventListener('visibilitychange',onHide,{once:true});
    window.location.href='isshocafe://dapur';
    setTimeout(function(){
      document.removeEventListener('visibilitychange',onHide);
      if(!opened){
        window.location.href='https://issho-cafe-online-v3.vercel.app/dapur-v8.html?v=20260904-gabungan';

    },1200);
