<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>ISSHO CAFE — DAPUR</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f2f2f2;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:14px}.head,.card,.order{background:#151515;border:1px solid #303030;border-radius:14px}.head,.card{padding:16px;margin:10px 0}.order{padding:14px;margin:10px 0;border-left:5px solid #b68142}.new{box-shadow:0 0 0 2px #b68142 inset}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer}.gold{background:#b68142;color:#fff}.green{background:#2f7d50;color:#fff}.red{background:#a73d35;color:#fff}.dark{background:#242424;color:#fff;border:1px solid #444}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#292929;margin:2px;font-size:12px}.item{padding:7px 0;border-bottom:1px solid #333}.muted{color:#aaa;font-size:13px}.err{background:#4a1d1a;color:#ffd9d5;padding:10px;border-radius:9px}.ok{background:#193b25;color:#d9ffe5;padding:10px;border-radius:9px}.hidden{display:none}input{width:100%;padding:12px;border:1px solid #3b3b3b;border-radius:9px;background:#1b1b1b;color:#fff}.alarm{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.84);align-items:center;justify-content:center;padding:18px}.alarmbox{width:min(560px,94vw);background:#171717;border:2px solid #b68142;border-radius:18px;padding:22px;text-align:center;box-shadow:0 10px 40px #000}.alarmbox h2{margin:0 0 10px;font-size:28px}.alarmbox button{font-size:18px;padding:14px 20px}@media(max-width:700px){.wrap{padding:8px}}
</style>
</head>
<body>
<main class="wrap">
<header class="head"><h1 style="margin:0">🍳 ISSHO CAFE — DAPUR</h1><div class="muted">Order terverifikasi dari Kasir • Alarm otomatis • Status pengerjaan</div></header>
<section id="login" class="card"><h2>🔐 Login Dapur</h2><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN Dapur"><div class="actions"><button class="gold" onclick="login()">Masuk Dapur</button></div><div id="msg"></div></section>
<section id="app" class="hidden"><div class="card"><div class="row"><div><h2 style="margin:0">Order Dapur</h2><div id="state" class="muted">Menunggu order...</div></div><div class="actions"><button class="gold" onclick="load()">🔄 Refresh</button><button class="dark" onclick="logout()">Keluar</button></div></div></div><div id="list"></div></section>
</main>
<div id="alarm" class="alarm"><div class="alarmbox"><h2>🔔 ORDER DAPUR MASUK</h2><div id="alarmInfo" style="font-size:18px;line-height:1.6;margin:12px 0"></div><button class="gold" onclick="ackAlarm()">✓ LIHAT ORDER</button><div class="muted" style="margin-top:10px">Alarm berhenti setelah order dibuka.</div></div></div>
<script>
const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';let P='',ORD=[],known=new Set(),ctx=null,alarmVisible=false;
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
async function api(path,opt={}){const h=Object.assign({apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},opt.headers||{}),r=await fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h})),t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}
function unlock(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}}
function beep(){try{unlock();if(!ctx)return;let n=ctx.currentTime;for(let i=0;i<6;i++){let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=i%2?988:659;g.gain.setValueAtTime(.0001,n+i*.25);g.gain.exponentialRampToValueAtTime(.2,n+i*.25+.03);g.gain.exponentialRampToValueAtTime(.0001,n+i*.25+.18);o.connect(g);g.connect(ctx.destination);o.start(n+i*.25);o.stop(n+i*.25+.2)}}catch(e){}}
async function login(){unlock();const p=$('pin').value.trim();if(!/^\d{4,8}$/.test(p))return $('msg').innerHTML='<div class="err">PIN tidak valid.</div>';try{const raw=await api('/rest/v1/rpc/staff_role',{method:'POST',body:JSON.stringify({p_pin:p})});const role=String(typeof raw==='string'?raw:(Array.isArray(raw)?raw[0]:(raw&&raw.role)||'')).trim().toUpperCase();if(role!=='DAPUR')throw Error('PIN bukan akun Dapur.');P=p;$('login').className='hidden';$('app').className='';load()}catch(e){$('msg').innerHTML='<div class="err">Login gagal: '+esc(e.message)+'</div>'}}
function logout(){P='';location.reload()}
function alarm(o){alarmVisible=true;$('alarmInfo').innerHTML='<b>'+esc(o.order_number||'-')+'</b><br><span class="badge">Meja '+esc(o.table_name||'Take Away')+'</span><span class="badge">'+esc(o.payment_method||'-')+'</span><br><b>'+money(o.total)+'</b><br><br>'+(o.items||[]).map(i=>esc(i.name)+' × '+Number(i.qty||0)).join('<br>');$('alarm').style.display='flex';beep();try{navigator.vibrate?.([300,100,300,100,500])}catch(e){}}
function ackAlarm(){$('alarm').style.display='none';alarmVisible=false;unlock();window.scrollTo({top:0,behavior:'smooth'})}
function render(){const rows=ORD.filter(o=>o.payment_status==='PAID'&&o.order_status!=='COMPLETED'&&o.order_status!=='CANCELLED');$('state').textContent=rows.length?rows.length+' order aktif':'Tidak ada order aktif';$('list').innerHTML=rows.length?rows.map(o=>`<div class="order ${o.order_status==='NEW'?'new':''}"><div class="row"><div><h2 style="margin:0">${esc(o.order_number)}</h2><span class="badge">Meja ${esc(o.table_name||'Take Away')}</span><span class="badge">${esc(o.payment_method)}</span><span class="badge">${esc(o.payment_status)}</span><span class="badge">${esc(o.order_status)}</span></div><b>${money(o.total)}</b></div>${(o.items||[]).map(i=>`<div class="item"><b>${esc(i.name)}</b> × ${Number(i.qty||0)}${i.note?`<div class="muted">${esc(i.note)}</div>`:''}</div>`).join('')}<div class="actions">${o.order_status==='NEW'||o.order_status==='ACCEPTED'?`<button class="gold" onclick="setStatus('${o.id}','PREPARING')">👨‍🍳 Mulai Dikerjakan</button>`:''}${o.order_status==='PREPARING'?`<button class="green" onclick="setStatus('${o.id}','READY')">✓ Sudah Dikerjakan</button>`:''}${o.order_status==='READY'?`<button class="green" onclick="setStatus('${o.id}','COMPLETED')">✓ Selesai / Tutup</button>`:''}</div></div>`).join(''):'<div class="card"><div class="muted">Belum ada order yang sudah dibayar.</div></div>'}
async function load(){try{if(!P)return;const old=ORD;ORD=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:P})});render();const active=ORD.filter(o=>o.payment_status==='PAID'&&(o.order_status==='NEW'||o.order_status==='ACCEPTED'));for(const o of active){if(!known.has(String(o.id))){known.add(String(o.id));if(old.length)alarm(o)}}}catch(e){$('list').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}
async function setStatus(id,s){try{await api('/rest/v1/rpc/staff_update_order',{method:'POST',body:JSON.stringify({p_pin:P,p_order_id:id,p_status:s})});await load()}catch(e){alert(e.message)}}
document.addEventListener('pointerdown',unlock,{once:true});setInterval(()=>{if(P)load()},4000);
</script>
</body></html>
