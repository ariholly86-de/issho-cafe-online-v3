<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — DAPUR</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f2f2f2;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:14px}.head,.card,.order{background:#151515;border:1px solid #303030;border-radius:14px}.head,.card{padding:16px;margin:10px 0}.order{padding:14px;margin:10px 0;border-left:5px solid #b68142}.new{box-shadow:0 0 0 3px #b68142 inset}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer}.gold{background:#b68142;color:#fff}.green{background:#2f7d50;color:#fff}.dark{background:#242424;color:#fff;border:1px solid #444}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#292929;margin:2px;font-size:12px}.item{padding:8px 0;border-bottom:1px solid #333}.muted{color:#aaa;font-size:13px}.err{background:#4a1d1a;color:#ffd9d5;padding:10px;border-radius:9px}.hidden{display:none}input{width:100%;padding:12px;border:1px solid #3b3b3b;border-radius:9px;background:#1b1b1b;color:#fff}.alarm{display:none;position:fixed;inset:0;z-index:999999;background:rgba(0,0,0,.94);align-items:center;justify-content:center;padding:18px}.alarmbox{width:min(650px,94vw);background:#171717;border:5px solid #e11;border-radius:20px;padding:24px;text-align:center;box-shadow:0 0 60px #f00}.alarmbox h2{margin:0 0 12px;font-size:32px}.alarmbox .alarm-title{font-size:24px;font-weight:900;color:#ff4b4b;margin-bottom:12px}.alarmbox button{font-size:19px;padding:15px 22px}.alarm-active{animation:alarmFlash .45s steps(2,end) infinite}@keyframes alarmFlash{50%{filter:brightness(2)}}.top-alarm{display:none;position:fixed;top:0;left:0;right:0;z-index:999998;background:#e11;color:#fff;text-align:center;font-size:28px;font-weight:900;padding:16px;box-shadow:0 0 35px #f00}.top-alarm.show{display:block}@media(max-width:700px){.wrap{padding:8px}.alarmbox h2{font-size:26px}.top-alarm{font-size:20px;padding:12px}}</style></head><body><main class="wrap"><header class="head"><h1 style="margin:0">🍳 ISSHO CAFE — DAPUR</h1><div class="muted">Order terverifikasi dari Kasir • Alarm otomatis • Status pengerjaan</div></header><section id="login" class="card"><h2>🔐 Login Dapur</h2><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN Dapur"><div class="actions"><button class="gold" onclick="login()">Masuk Dapur</button></div><div id="msg"></div></section><section id="app" class="hidden"><div class="card"><div class="row"><div><h2 style="margin:0">Order Dapur</h2><div id="state" class="muted">Menunggu order...</div></div><div class="actions"><button class="gold" onclick="load(true)">🔄 Refresh</button><button class="dark" onclick="logout()">Keluar</button></div></div></div><div id="list"></div></section></main><div id="topAlarm" class="top-alarm">🔔 ORDER BARU — SEGERA DITANGANI</div><div id="alarm" class="alarm"><div class="alarmbox"><div class="alarm-title">🔔 ORDER DAPUR MASUK</div><h2 id="alarmOrder">ORDER BARU</h2><div id="alarmInfo" style="font-size:18px;line-height:1.65;margin:12px 0"></div><button class="gold" onclick="ackAlarm()">✓ LIHAT ORDER</button><div class="muted" style="margin-top:10px">Tekan tombol untuk menghentikan alarm.</div></div></div><script>const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';let P='',ORD=[],known=new Set(),ctx=null,alarmTimer=null,voiceTimer=null,alarmOpen=false,firstLoad=true;const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){const h=Object.assign({apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},opt.headers||{}),r=await fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h})),t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}async function unlockAudio(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state!=='running')await ctx.resume()}catch(e){}}function tone(freq,start,dur=.16,vol=.42){if(!ctx||ctx.state!=='running')return;const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(vol,start+.015);g.gain.exponentialRampToValueAtTime(.0001,start+dur);o.connect(g);g.connect(ctx.destination);o.start(start);o.stop(start+dur+.02)}function beep(){try{unlockAudio();if(!ctx)return;const n=ctx.currentTime;[0,0.18,0.36,0.54,0.72,0.90,1.08,1.26,1.44].forEach((t,i)=>tone(i%2?1320:760,n+t,.15,.48))}catch(e){}}function speak(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('PERHATIAN. ORDER BARU MASUK. '+text);u.lang='id-ID';u.rate=.82;u.pitch=.75;u.volume=1;speechSynthesis.speak(u)}catch(e){}}function startAlarm(o){alarmOpen=true;$('alarmOrder').textContent=o.order_number||'ORDER BARU';$('alarmInfo').innerHTML='<b>Meja '+esc(o.table_name||'Take Away')+'</b><br><span class="badge">'+esc(o.payment_method||'-')+'</span><span class="badge">'+esc(o.payment_status||'-')+'</span><br><b>'+money(o.total)+'</b><br><br>'+(o.items||[]).map(i=>esc(i.name)+' × '+Number(i.qty||0)).join('<br>');$('alarm').style.display='flex';$('topAlarm').classList.add('show');document.body.classList.add('alarm-active');beep();speak('Meja '+(o.table_name||'Take Away')+'. '+(o.order_number||'Order baru')+'.');try{navigator.vibrate?.([800,120,800,120,800,120,1200])}catch(e){}clearInterval(alarmTimer);clearInterval(voiceTimer);alarmTimer=setInterval(()=>{beep();try{navigator.vibrate?.([600,100,600])}catch(e){}},3000);voiceTimer=setInterval(()=>speak('Meja '+(o.table_name||'Take Away')+'. Order baru masuk.'),7500)}function ackAlarm(){$('alarm').style.display='none';$('topAlarm').classList.remove('show');document.body.classList.remove('alarm-active');alarmOpen=false;clearInterval(alarmTimer);clearInterval(voiceTimer);alarmTimer=voiceTimer=null;try{speechSynthesis.cancel()}catch(e){}unlockAudio()}async function login(){await unlockAudio();const p=$('pin').value.trim();if(!/^\d{4,8}$/.test(p))return $('msg').innerHTML='<div class="err">PIN tidak valid.</div>';try{const raw=await api('/rest/v1/rpc/staff_role',{method:'POST',body:JSON.stringify({p_pin:p})});const role=String(typeof raw==='string'?raw:(Array.isArray(raw)?raw[0]:(raw&&raw.role)||'')).trim().toUpperCase();if(role!=='DAPUR')throw Error('PIN bukan akun Dapur.');P=p;$('login').className='hidden';$('app').className='';firstLoad=true;await load()}catch(e){$('msg').innerHTML='<div class="err">Login gagal: '+esc(e.message)+'</div>'}}function logout(){ackAlarm();P='';location.reload()}function render(){const rows=ORD.filter(o=>o.payment_status==='PAID'&&o.order_status!=='COMPLETED'&&o.order_status!=='CANCELLED');$('state').textContent=rows.length?rows.length+' order aktif':'Tidak ada order aktif';$('list').innerHTML=rows.length?rows.map(o=>'<div class="order '+(o.order_status==='NEW'?'new':'')+'"><div class="row"><div><h2 style="margin:0">'+esc(o.order_number)+'</h2><span class="badge">Meja '+esc(o.table_name||'Take Away')+'</span><span class="badge">'+esc(o.payment_method)+'</span><span class="badge">'+esc(o.payment_status)+'</span><span class="badge">'+esc(o.order_status)+'</span></div><b>'+money(o.total)+'</b></div>'+(o.items||[]).map(i=>'<div class="item"><b>'+esc(i.name)+'</b> × '+Number(i.qty||0)+(i.note?'<div class="muted">'+esc(i.note)+'</div>':'')+'</div>').join('')+'<div class="actions">'+((o.order_status==='NEW'||o.order_status==='ACCEPTED')?'<button class="gold" onclick="setStatus(\''+o.id+'\',\'PREPARING\')">👨‍🍳 Mulai Dikerjakan</button>':'')+(o.order_status==='PREPARING'?'<button class="green" onclick="setStatus(\''+o.id+'\',\'READY\')">✓ Sudah Dikerjakan</button>':'')+(o.order_status==='READY'?'<button class="green" onclick="setStatus(\''+o.id+'\',\'COMPLETED\')">✓ Selesai / Tutup</button>':'')+'</div></div>').join(''):'<div class="card"><div class="muted">Belum ada order yang sudah dibayar.</div></div>'}async function load(manual=false){try{if(!P)return;const oldIds=new Set(ORD.map(o=>String(o.id)));const next=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:P})});ORD=Array.isArray(next)?next:[];render();const active=ORD.filter(o=>o.payment_status==='PAID'&&(o.order_status==='NEW'||o.order_status==='ACCEPTED'));for(const o of active){const id=String(o.id);if(!known.has(id)){known.add(id);if(!firstLoad||manual||oldIds.size===0)startAlarm(o)}}firstLoad=false}catch(e){$('list').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}async function setStatus(id,s){try{await api('/rest/v1/rpc/staff_update_order',{method:'POST',body:JSON.stringify({p_pin:P,p_order_id:id,p_status:s})});await load(true)}catch(e){alert(e.message)}}document.addEventListener('pointerdown',unlockAudio,{once:true});$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});setInterval(()=>{if(P)load(false)},2500);</script></body></html>
