<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — KASIR WP58D</title><style>html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial}#kasir{width:100%;height:100%;border:0;display:block}#printer{position:fixed;right:10px;top:10px;z-index:2147483647;background:#151515;border:1px solid #555;border-radius:12px;padding:10px;box-shadow:0 4px 18px #0008;max-width:440px}#printer button{border:0;border-radius:8px;padding:10px 12px;margin:2px;font-weight:800;cursor:pointer;touch-action:manipulation}#connect{background:#1687f7;color:white}#test{background:#d08a24;color:white}#diag{background:#b83a32;color:white}.ok{color:#9cff9c}.err{color:#ff8b8b}#status,#diagout{display:block;margin-top:7px;font-size:13px;line-height:1.35;white-space:pre-wrap}</style></head><body><div id="printer"><button id="connect">📶 Hubungkan WP58D</button><button id="test">🧾 Test Print</button><button id="diag">🔎 Periksa Printer</button><span id="status">WP58D • USB + Bluetooth • ESC/POS 58mm</span><span id="diagout">Memeriksa bridge printer…</span></div><iframe id="kasir" src="staff-v6.html?v=20260825-wp58d-final-v6" title="ISSHO CAFE KASIR"></iframe><script>
const BR='http://127.0.0.1:9100',f=document.getElementById('kasir'),status=document.getElementById('status'),diagout=document.getElementById('diagout');let bridge=false,port=null,writer=null;
const E=s=>new TextEncoder().encode(String(s).replace(/[^\x00-\xFF]/g,'')),L=s=>[...E(s),10],U=a=>new Uint8Array(a),C={init:[27,64],center:[27,97,1],left:[27,97,0],bold:[27,69,1],normal:[27,69,0],cut:[29,86,0]};
function msg(s,bad=false){status.textContent=s;status.className=bad?'err':'ok'}
async function bridgeFetch(path,opt={}){const r=await fetch(BR+path,{...opt,cache:'no-store'});const t=await r.text();let j;try{j=JSON.parse(t)}catch(_){j={ok:false,error:t}}if(!r.ok||j.ok===false)throw Error(j.error||('Bridge HTTP '+r.status));return j}
async function checkBridge(){try{const j=await bridgeFetch('/status');bridge=!!j.ok;diagout.textContent='✓ Android Printer Bridge aktif\nPrinter: WP58D\nMetode: Bluetooth Classic/SPP';return true}catch(e){bridge=false;diagout.textContent='Bridge belum aktif. Jika ingin Bluetooth Android yang stabil, buka aplikasi ISSHO Printer Bridge lalu pair WP58D.';return false}}
async function serialConnect(){if(!('serial'in navigator))throw Error('Web Serial tidak tersedia. Untuk Android gunakan ISSHO Printer Bridge.');const saved=await navigator.serial.getPorts();if(saved.length)port=saved[0];else port=await navigator.serial.requestPort({filters:[]});if(port.readable||port.writable){try{if(port.readable)await port.readable.cancel()}catch(_){}try{if(port.writable)await port.writable.close()}catch(_){}}await port.open({baudRate:9600,dataBits:8,stopBits:1,parity:'none',flowControl:'none'});writer=port.writable.getWriter();return true}
async function connect(){if(await checkBridge()){await bridgeFetch('/connect');msg('✓ WP58D TERSAMBUNG via Android Printer Bridge');return true}await serialConnect();msg('✓ WP58D TERSAMBUNG via Web Serial');return true}
async function send(data){if(await checkBridge()){await bridgeFetch('/print',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:data});return}if(!writer)await serialConnect();if(!writer)throw Error('Printer belum terhubung.');for(let i=0;i<data.length;i+=256)await writer.write(data.slice(i,i+256))}
async function test(){if(await checkBridge()){await bridgeFetch('/test');msg('✓ TEST PRINT WP58D BERHASIL via Bridge');return}await send(U([...C.init,...C.center,...C.bold,...E('ISSHO CAFE'),10,...C.normal,...E('TEST PRINT WP58D'),10,...E('BLUETOOTH CLASSIC / SPP'),10,...E('ESC/POS 58mm'),10,...L('--------------------------------'),...L('PRINTER SIAP'),...L('Koneksi aplikasi BERHASIL'),...L(''),...L(''),...C.cut]));msg('✓ TEST PRINT WP58D BERHASIL')}
function orderBytes(o,k){let a=[...C.init,...C.center,...C.bold,...E('ISSHO CAFE'),10,...C.normal,...E(k==='k'?'NOTA DAPUR':'TANDA TERIMA PELANGGAN'),10,...C.left,...L('--------------------------------'),...L('Order : '+(o.order_number||'-')),...L('Meja  : '+(o.table_name||'Take Away'))];for(const i of(o.items||[]))a.push(...L(String(i.name||'')+' x'+Number(i.qty||0)));a.push(...L('--------------------------------'));if(k!=='k')a.push(...C.bold,...L('TOTAL'),...C.normal,...L(String(o.total||0)),...C.center,...L('Terima kasih'));else a.push(...C.center,...C.bold,...L('SEGERA DIPROSES'),...C.normal);return U([...a,...L(''),...C.cut])}
async function printOrder(id,k){try{const o=(f.contentWindow?.ORD||[]).find(x=>x.id===id);if(!o)throw Error('Pesanan tidak ditemukan.');await send(orderBytes(o,k));msg('✓ Nota '+(k==='k'?'dapur':'pelanggan')+' terkirim ke WP58D')}catch(e){msg('Gagal print WP58D: '+e.message,true)}}
function patch(){try{const w=f.contentWindow,d=w.document,app=d.getElementById('app');if(!app)return false;let p=d.getElementById('wp58d-panel');if(!p){p=d.createElement('div');p.id='wp58d-panel';p.className='card noprint';app.insertBefore(p,app.children[1]||null)}p.innerHTML='<h3>🖨️ Printer Thermal WP58D — 58mm</h3><div class="muted">Model sesuai label: WP58D • USB + Bluetooth • ESC/POS 58mm</div><div class="actions"><button type="button" class="blue" id="c1">📶 Hubungkan WP58D</button><button type="button" class="gold" id="t1">🧾 Test Print</button><button type="button" class="red" id="d1">🔎 Periksa Printer</button></div><div id="s1" class="muted">Belum terhubung.</div>';d.getElementById('c1').onclick=()=>connect().catch(e=>msg(e.message,true));d.getElementById('t1').onclick=()=>test().catch(e=>msg('Test print gagal: '+e.message,true));d.getElementById('d1').onclick=()=>checkBridge();if(!w.__wp58d_v6){w.printCustomer=id=>printOrder(id,'c');w.printKitchen=id=>printOrder(id,'k');w.__wp58d_v6=true}return true}catch(e){return false}}
connect.onclick=()=>connect().catch(e=>msg(e.message,true));test.onclick=()=>test().catch(e=>msg('Test print gagal: '+e.message,true));diag.onclick=()=>checkBridge();checkBridge();f.addEventListener('load',()=>{let n=0,t=setInterval(()=>{if(patch()||++n>160)clearInterval(t)},250)});setInterval(patch,1000);
</script></body></html>
