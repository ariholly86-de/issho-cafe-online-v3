<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>ISSHO CAFE — Menu Pelanggan</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080909}iframe{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="app" title="ISSHO CAFE Menu Pelanggan"></iframe>
<script>
const f=document.getElementById('app');
const qs=new URLSearchParams(location.search);
const src=new URL('customer-ui-v3.html?v=20260904-ui-preserved-2',location.href);
if(qs.get('table'))src.searchParams.set('table',qs.get('table'));
if(location.hash)src.hash=location.hash.slice(1);
f.src=src.toString();

f.addEventListener('load',()=>{
  try{
    const doc=f.contentDocument;
    if(!doc)return;
    function getCustomer(){
      const inner=doc.querySelector('iframe#app');
      if(!inner)return null;
      return {win:inner.contentWindow,doc:inner.contentDocument};
    }
    function install(){
      const c=getCustomer();
      if(!c||!c.doc||!c.doc.body)return false;
      const d=c.doc,w=c.win;
      if(d.documentElement.dataset.isshoFix20260904==='1')return true;
      const cash=d.getElementById('cashBtn');
      if(!cash)return false;
      d.documentElement.dataset.isshoFix20260904='1';

      const css=d.createElement('style');
      css.textContent=`
        /* MENU: always keep name above price, with image -> name -> description -> price */
        #menu .menu{display:flex!important;flex-direction:column!important;min-height:270px!important;overflow:hidden!important}
        #menu .menu .photo{order:1!important;flex:0 0 auto!important;margin-bottom:8px!important}
        #menu .menu h3{order:2!important;display:block!important;margin:4px 0 4px!important;line-height:1.25!important;color:#fff!important;position:relative!important;z-index:2!important}
        #menu .menu>.muted{order:3!important;display:block!important;min-height:18px!important;line-height:1.3!important;color:#aaa!important;position:relative!important;z-index:2!important}
        #menu .menu>.row{order:4!important;flex:0 0 auto!important;margin-top:10px!important;position:relative!important;z-index:3!important}
        #menu .menu .price{display:block!important;font-size:16px!important;line-height:1.2!important;color:#fff!important}
        #menu .menu .gold{flex:0 0 auto!important}
        @media(max-width:600px){#menu .menu{min-height:245px!important}#menu .menu h3{font-size:14px!important;margin:3px 0!important}#menu .menu .price{font-size:14px!important}}

        /* CASH REMINDER */
        .cash-reminder-v6-overlay{position:fixed!important;inset:0!important;z-index:2147483647!important;background:rgba(0,0,0,.78)!important;display:flex!important;align-items:center!important;justify-content:center!important;padding:14px!important;overflow:auto!important}
        .cash-reminder-v6{width:min(560px,94vw)!important;max-height:calc(100vh - 28px)!important;overflow:auto!important;background:#fff!important;color:#111!important;border-radius:20px!important;padding:18px!important;box-shadow:0 20px 70px #000!important;text-align:center!important;font-family:Arial,sans-serif!important}
        .cash-reminder-v6 .icon{width:74px;height:74px;border-radius:50%;background:#dff6e6;color:#14823b;margin:0 auto 8px;display:grid;place-items:center;font-size:37px}
        .cash-reminder-v6 h2{font-size:25px;line-height:1.2;margin:0 0 5px;color:#111}.cash-reminder-v6 .method{font-size:16px;color:#444;margin-bottom:14px}
        .cash-reminder-v6 .box{border-radius:13px;padding:14px;margin-top:10px}.cash-reminder-v6 .order{background:#f2f4f7}.cash-reminder-v6 .label{font-size:15px;color:#555;margin-bottom:5px}.cash-reminder-v6 .order-no{font-size:22px;font-weight:900;word-break:break-word}.cash-reminder-v6 .time{font-size:14px;color:#555;margin-top:6px}
        .cash-reminder-v6 .table-inline{margin-top:12px;padding-top:10px;border-top:1px solid #d9dde2;text-align:left}.cash-reminder-v6 .table-inline .table-label{font-size:14px;color:#555;margin-bottom:3px}.cash-reminder-v6 .table-inline .table-no{font-size:25px;font-weight:900;line-height:1.15;color:#111}
        .cash-reminder-v6 .warning{background:#ffe9e7;color:#d71920}.cash-reminder-v6 .warning .big{font-size:22px;font-weight:900;line-height:1.18}.cash-reminder-v6 .warning p{color:#222;font-size:15px;line-height:1.45;margin:10px 0 0}
        .cash-reminder-v6 .instruction{background:#fff2cf;text-align:left;font-size:15px;line-height:1.4}.cash-reminder-v6 .instruction strong{display:block;font-size:16px;margin-bottom:4px}.cash-reminder-v6 .total{background:#f2f4f7;text-align:left}.cash-reminder-v6 .total small{display:block;color:#555;font-size:14px}.cash-reminder-v6 .total b{display:block;font-size:31px;line-height:1.1;margin-top:2px}
        .cash-reminder-v6 button{width:100%;margin-top:12px;background:#8a4f13;color:#fff;border:0;border-radius:13px;padding:16px 14px;font-size:17px;font-weight:900;cursor:pointer}.cash-reminder-v6 .thanks{font-size:14px;color:#666;margin-top:12px}
        @media(max-width:600px){.cash-reminder-v6{padding:14px}.cash-reminder-v6 h2{font-size:21px}.cash-reminder-v6 .icon{width:64px;height:64px;font-size:31px}.cash-reminder-v6 .order-no{font-size:18px}.cash-reminder-v6 .table-inline .table-no{font-size:21px}.cash-reminder-v6 .warning .big{font-size:19px}.cash-reminder-v6 .warning p{font-size:14px}.cash-reminder-v6 .total b{font-size:27px}}
      `;
      d.head.appendChild(css);

      const escSafe=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
      const getTableText=()=>{
        const fromUrl=new URLSearchParams(location.search).get('table');
        const tn=d.getElementById('tn');
        const fromDom=(tn?.textContent||'').trim();
        const raw=String(fromUrl||fromDom||'').trim();
        if(!raw)return '';
        return /^meja\s/i.test(raw)?raw:'Meja '+raw;
      };

      function showPopup(){
        const result=d.getElementById('result');
        if(!result||result.querySelector('.err'))return false;
        const text=result.textContent||'';
        const match=text.match(/Pesanan\s+([^\s]+)\s+berhasil/i);
        if(!match)return false;
        const order=match[1];
        const total=(text.match(/Total\s+(Rp\s*[\d.]+)/i)||[])[1]||(d.getElementById('tot')?.textContent||'Rp0');
        const tableText=getTableText();
        const now=new Date();
        const date=new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'long',year:'numeric',timeZone:'Asia/Jakarta'}).format(now);
        const time=new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Asia/Jakarta'}).format(now)+' WIB';
        d.querySelectorAll('.cash-reminder-overlay,.cash-reminder-v5-overlay,.cash-reminder-v6-overlay').forEach(x=>x.remove());
        const o=d.createElement('div');o.className='cash-reminder-v6-overlay';
        o.innerHTML=`<div class="cash-reminder-v6" role="dialog" aria-modal="true">
          <div class="icon">💵</div>
          <h2>Pesanan Anda Berhasil Dibuat</h2>
          <div class="method">Metode Pembayaran: <b>Tunai</b></div>
          <div class="box order"><div class="label">Nomor Order</div><div class="order-no">${escSafe(order)}</div><div class="time">${escSafe(date)} • ${escSafe(time)}</div>${tableText?`<div class="table-inline"><div class="table-label">Nomor Meja</div><div class="table-no">${escSafe(tableText)}</div></div>`:''}</div>
          <div class="box warning"><div class="big">Silakan lakukan pembayaran di meja kasir</div><p>Untuk pembayaran TUNAI, pesanan Anda <b>belum dapat diproses oleh dapur</b> sebelum pembayaran diterima oleh kasir.</p></div>
          <div class="box instruction"><strong>👤 Silakan datang ke meja kasir</strong>Sebutkan <b>nomor order</b> Anda kepada kasir agar pembayaran dapat segera diproses.</div>
          <div class="box total"><small>Total yang harus dibayar</small><b>${escSafe(total)}</b></div>
          <button type="button" class="cash-v6-ok">✓ &nbsp; SAYA MENGERTI</button>
          <div class="thanks">Terima kasih telah memesan di Issho Cafe ❤️</div>
        </div>`;
        d.body.appendChild(o);
        o.querySelector('.cash-v6-ok').onclick=()=>o.remove();
        o.onclick=e=>{if(e.target===o)o.remove()};
        return true;
      }

      cash.addEventListener('click',async ev=>{
        ev.preventDefault();
        ev.stopImmediatePropagation();
        const place=w.place;
        if(typeof place!=='function')return;
        try{await place.call(w,'CASH')}catch(e){console.warn('ISSHO cash completion wrapper error:',e)}
        let shown=showPopup();
        if(!shown){
          let tries=0;
          const timer=setInterval(()=>{if(showPopup()||++tries>=20)clearInterval(timer)},150);
        }
      },true);
      return true;
    }
    if(!install()){
      const timer=setInterval(()=>{if(install())clearInterval(timer)},200);
      setTimeout(()=>clearInterval(timer),20000);
    }
  }catch(e){console.warn('ISSHO customer fix installer failed',e)}
});
</script>
</body>
</html>
