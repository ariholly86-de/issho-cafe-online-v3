<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>ISSHO CAFE — STOK BARANG</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f4f4f4;font-family:Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;font-weight:800}.wrap{max-width:1200px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.brand{font-size:25px;font-weight:900}.muted{color:#999;font-size:13px}.card{background:#151515;border:1px solid #333;border-radius:14px;padding:14px;margin-top:12px}.login{max-width:430px;margin:8vh auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.stat{background:#202020;border:1px solid #393939;border-radius:12px;padding:13px}.stat b{font-size:22px;display:block;margin-top:5px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.tabs button{white-space:nowrap;background:#252525;color:#ddd}.tabs button.on{background:#b68142;color:white}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;color:#aaa;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#0f0f0f;color:#fff;border:1px solid #444;border-radius:9px;padding:10px}.field textarea{min-height:75px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.primary{background:#b68142;color:white}.green{background:#2f7d50;color:white}.red{background:#8d3c3c;color:white}.blue{background:#315b9a;color:white}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:10px;border-bottom:1px solid #2d2d2d;text-align:left}th{text-transform:uppercase;font-size:11px;color:#aaa;background:#191919}td.num,th.num{text-align:right}.low{color:#ffcf66;font-weight:900}.ok{color:#7ddc9c;font-weight:900}.login input{margin-top:5px}.error{color:#ff8e8e;margin-top:8px;min-height:18px}.hide{display:none!important}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#292929;font-size:11px}.empty{padding:18px;text-align:center;color:#999}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}.modalbox{background:#181818;border:1px solid #444;border-radius:14px;width:min(560px,100%);padding:16px;max-height:90vh;overflow:auto}@media(max-width:650px){.row{grid-template-columns:1fr}.wrap{padding:10px}.brand{font-size:21px}}
</style></head>
<body>
<div id="login" class="wrap login">
 <div class="card"><div class="brand">📦 ISSHO CAFE — STOK BARANG</div><p class="muted">Masuk menggunakan PIN OWNER. Data terhubung dengan penjualan dan rekapan Owner.</p>
 <div class="field"><label>PIN OWNER</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Masukkan PIN Owner"></div>
 <div class="actions"><button class="primary" id="loginBtn">Masuk</button></div><div id="loginErr" class="error"></div></div>
</div>
<div id="app" class="wrap hide">
 <div class="head"><div><div class="brand">📦 ISSHO CAFE — STOK BARANG</div><div class="muted">Stok masuk • stok keluar • pemakaian dari penjualan • rekapan harian</div></div><button class="red" id="logout">Keluar</button></div>
 <div class="card"><div class="tabs"><button data-tab="dashboard" class="on">Dashboard</button><button data-tab="items">Master Barang</button><button data-tab="in">Barang Masuk</button><button data-tab="out">Barang Keluar</button><button data-tab="usage">Pemakaian Menu</button><button data-tab="report">Rekap Detail</button></div></div>
 <div id="content"></div>
</div>
<div id="modal" class="modal hide"><div class="modalbox"><div id="modalBody"></div></div></div>
<script>
const SUPA='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';let PIN='',items=[],products=[],usage=[];let tab='dashboard';
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
const num=n=>Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:3});
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const today=()=>new Date().toISOString().slice(0,10);
async function rpc(name,body){const r=await fetch(SUPA+'/rest/v1/rpc/'+name,{method:'POST',cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null}
async function loadAll(){items=await rpc('inventory_list_items',{p_owner_pin:PIN});usage=await rpc('inventory_usage_list',{p_owner_pin:PIN});const r=await fetch(SUPA+'/rest/v1/products?select=id,name&active=eq.true&order=name.asc',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error('Gagal membaca daftar menu');products=await r.json();}
function dateRange(){return `<div class="row"><div class="field"><label>DARI TANGGAL</label><input id="from" type="date" value="${today()}"></div><div class="field"><label>SAMPAI TANGGAL</label><input id="to" type="date" value="${today()}"></div></div>`}
async function dashboard(){const r=await rpc('inventory_dashboard',{p_owner_pin:PIN,p_from:document.getElementById('from')?.value||today(),p_to:document.getElementById('to')?.value||today()});return `<div class="card">${dateRange()}<div class="actions"><button class="primary" id="refreshDash">Tampilkan</button></div></div><div class="grid"><div class="stat">Barang Masuk<b>${num(r.incoming)}</b><span class="muted">${r.incoming_lines} transaksi</span></div><div class="stat">Keluar Manual<b>${num(r.outgoing_manual)}</b></div><div class="stat">Keluar dari Penjualan<b>${num(r.outgoing_auto)}</b></div><div class="stat">Total Keluar<b>${num(r.outgoing_total)}</b></div><div class="stat">Stok Menipis<b class="low">${r.low_stock}</b></div></div><div class="card"><h3>📊 Posisi Stok</h3><div class="tablewrap"><table><thead><tr><th>Barang</th><th>Kategori</th><th>Satuan</th><th class="num">Stok</th><th class="num">Min.</th><th>Status</th></tr></thead><tbody>${(r.items||[]).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.category)}</td><td>${esc(x.unit)}</td><td class="num"><b>${num(x.stock_now)}</b></td><td class="num">${num(x.min_stock)}</td><td>${Number(x.stock_now)<=Number(x.min_stock)?'<span class="low">⚠ MENIPIS</span>':'<span class="ok">✓ AMAN</span>'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Belum ada barang.</td></tr>'}</tbody></table></div></div>`}
function itemOptions(){return items.map(x=>`<option value="${x.id}">${esc(x.name)} (${esc(x.unit)})</option>`).join('')}
function productOptions(){return products.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}
function itemsPage(){return `<div class="card"><h3>➕ Tambah Barang</h3><div class="row"><div class="field"><label>Nama Barang</label><input id="in_name" placeholder="Contoh: Kopi ABC"></div><div class="field"><label>Kategori</label><input id="in_cat" placeholder="Bahan Minuman"></div><div class="field"><label>Satuan</label><input id="in_unit" value="pcs" placeholder="pcs / kg / liter / botol"></div><div class="field"><label>Stok Awal</label><input id="in_open" type="number" step="0.001" value="0"></div><div class="field"><label>Stok Minimum</label><input id="in_min" type="number" step="0.001" value="0"></div></div><div class="actions"><button class="primary" id="saveItem">Simpan Barang</button></div></div><div class="card"><h3>📦 Daftar Barang</h3><div class="tablewrap"><table><thead><tr><th>Nama</th><th>Kategori</th><th>Satuan</th><th class="num">Stok Awal</th><th class="num">Pergerakan Manual</th><th>Resep</th></tr></thead><tbody>${items.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.category)}</td><td>${esc(x.unit)}</td><td class="num">${num(x.opening_stock)}</td><td class="num">${num(x.stock_manual)}</td><td>${x.recipe_count} menu</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Belum ada barang.</td></tr>'}</tbody></table></div></div>`}
function movementPage(type){let title=type==='IN'?'📥 BARANG MASUK':'📤 BARANG KELUAR';return `<div class="card"><h3>${title}</h3><div class="row"><div class="field"><label>Barang</label><select id="mv_item">${itemOptions()}</select></div><div class="field"><label>Jumlah</label><input id="mv_qty" type="number" min="0.001" step="0.001" placeholder="0"></div><div class="field"><label>Tanggal</label><input id="mv_date" type="date" value="${today()}"></div><div class="field"><label>Sumber</label><select id="mv_source"><option value="MANUAL">Manual</option><option value="PEMBELIAN">Pembelian</option><option value="RETUR">Retur</option><option value="RUSAK">Rusak</option><option value="TERPAKAI">Terpakai</option><option value="LAINNYA">Lainnya</option></select></div></div><div class="field" style="margin-top:10px"><label>Keterangan</label><textarea id="mv_note" placeholder="Contoh: Belanja stok pagi"></textarea></div><div class="actions"><button class="${type==='IN'?'green':'red'}" id="saveMove">Simpan ${type==='IN'?'Barang Masuk':'Barang Keluar'}</button></div></div><div class="card"><p class="muted">Catatan: barang keluar dari penjualan tidak perlu diinput manual. Setelah menu dipetakan pada tab <b>Pemakaian Menu</b>, sistem menghitung pemakaian otomatis dari transaksi PAID.</p></div>`}
function usagePage(){return `<div class="card"><h3>🔗 Hubungkan Menu dengan Stok</h3><p class="muted">Contoh: 1 Es Kopi Gula Aren memakai 20 gram kopi. Setiap transaksi PAID akan otomatis mengurangi stok sesuai pemakaian ini.</p><div class="row"><div class="field"><label>Menu</label><select id="u_product">${productOptions()}</select></div><div class="field"><label>Barang</label><select id="u_item">${itemOptions()}</select></div><div class="field"><label>Pemakaian per 1 menu terjual</label><input id="u_qty" type="number" min="0.001" step="0.001" placeholder="Contoh 20"></div></div><div class="actions"><button class="primary" id="saveUsage">Simpan Pemetaan</button></div></div><div class="card"><h3>📋 Pemetaan Aktif</h3><div class="tablewrap"><table><thead><tr><th>Menu</th><th>Barang</th><th>Pemakaian / Penjualan</th><th>Aksi</th></tr></thead><tbody>${usage.map(x=>`<tr><td><b>${esc(x.product_name)}</b></td><td>${esc(x.inventory_item_name)} (${esc(x.unit)})</td><td>${num(x.quantity_per_sale)} ${esc(x.unit)}</td><td><button class="red" data-delusage="${x.product_id}|${x.inventory_item_id}">Hapus</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada pemetaan.</td></tr>'}</tbody></table></div></div>`}
async function reportPage(){const r=await rpc('inventory_movements_report',{p_owner_pin:PIN,p_from:document.getElementById('from')?.value||today(),p_to:document.getElementById('to')?.value||today()});return `<div class="card">${dateRange()}<div class="actions"><button class="primary" id="refreshReport">Tampilkan Rekapan</button></div></div><div class="card"><h3>📥 Barang Masuk / Keluar Manual</h3><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Barang</th><th>Jenis</th><th class="num">Jumlah</th><th>Sumber</th><th>Keterangan</th></tr></thead><tbody>${(r.manual||[]).map(x=>`<tr><td>${esc(x.movement_date)}</td><td><b>${esc(x.item_name)}</b></td><td>${x.movement_type==='IN'?'<span class="ok">MASUK</span>':x.movement_type==='OUT'?'<span class="low">KELUAR</span>':'ADJUSTMENT'}</td><td class="num">${num(x.quantity)} ${esc(x.unit)}</td><td>${esc(x.source)}</td><td>${esc(x.note||'')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Belum ada transaksi manual.</td></tr>'}</tbody></table></div></div><div class="card"><h3>🤖 Keluar Otomatis dari Penjualan PAID</h3><div class="tablewrap"><table><thead><tr><th>Barang</th><th class="num">Pemakaian</th><th>Satuan</th></tr></thead><tbody>${(r.automatic||[]).map(x=>`<tr><td><b>${esc(x.item_name)}</b></td><td class="num">${num(x.qty)}</td><td>${esc(x.unit)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Belum ada pemakaian otomatis. Isi pemetaan menu terlebih dahulu.</td></tr>'}</tbody></table></div></div>`}
async function render(){const c=document.getElementById('content');c.innerHTML='<div class="card">Memuat...</div>';try{if(tab==='dashboard')c.innerHTML=await dashboard();if(tab==='items')c.innerHTML=itemsPage();if(tab==='in')c.innerHTML=movementPage('IN');if(tab==='out')c.innerHTML=movementPage('OUT');if(tab==='usage')c.innerHTML=usagePage();if(tab==='report')c.innerHTML=await reportPage();bind();}catch(e){c.innerHTML=`<div class="card error">${esc(e.message)}</div>`}}
function bind(){document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});const q=id=>document.getElementById(id);if(q('saveItem'))q('saveItem').onclick=async()=>{try{await rpc('inventory_save_item',{p_owner_pin:PIN,p_id:null,p_name:q('in_name').value,p_category:q('in_cat').value,p_unit:q('in_unit').value,p_min_stock:Number(q('in_min').value||0),p_opening_stock:Number(q('in_open').value||0),p_active:true});await loadAll();alert('Barang berhasil disimpan.');render()}catch(e){alert(e.message)}};if(q('saveMove'))q('saveMove').onclick=async()=>{try{await rpc('inventory_add_movement',{p_owner_pin:PIN,p_item_id:q('mv_item').value,p_type:tab==='in'?'IN':'OUT',p_qty:Number(q('mv_qty').value),p_date:q('mv_date').value,p_source:q('mv_source').value,p_note:q('mv_note').value,p_created_by:'OWNER'});alert('Transaksi stok berhasil disimpan.');render()}catch(e){alert(e.message)}};if(q('saveUsage'))q('saveUsage').onclick=async()=>{try{await rpc('inventory_save_usage',{p_owner_pin:PIN,p_product_id:q('u_product').value,p_item_id:q('u_item').value,p_qty:Number(q('u_qty').value)});await loadAll();alert('Pemetaan pemakaian berhasil disimpan.');render()}catch(e){alert(e.message)}};document.querySelectorAll('[data-delusage]').forEach(b=>b.onclick=async()=>{const [p,i]=b.dataset.delusage.split('|');if(confirm('Hapus pemetaan ini?')){await rpc('inventory_delete_usage',{p_owner_pin:PIN,p_product_id:p,p_item_id:i});await loadAll();render()}});if(q('refreshDash'))q('refreshDash').onclick=render;if(q('refreshReport'))q('refreshReport').onclick=render}
q('loginBtn').onclick=async()=>{const err=q('loginErr');PIN=q('pin').value.trim();err.textContent='';if(!PIN){err.textContent='PIN wajib diisi.';return}try{await loadAll();q('login').classList.add('hide');q('app').classList.remove('hide');render()}catch(e){PIN='';err.textContent=e.message||'PIN Owner tidak valid.'}};q('pin').addEventListener('keydown',e=>{if(e.key==='Enter')q('loginBtn').click()});q('logout').onclick=()=>location.reload();
</script></body></html>
