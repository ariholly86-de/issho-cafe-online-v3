<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>ISSHO CAFE — KASIR</title>
<style>
html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}#kasir{width:100%;height:100%;border:0;display:block}
#alarm{display:none;position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.82);align-items:center;justify-content:center;padding:18px;box-sizing:border-box}
.box{width:min(560px,94vw);background:#171717;border:2px solid #c98a2e;border-radius:18px;padding:22px;box-shadow:0 10px 40px #000;color:#fff;text-align:center}.box h2{margin:0 0 8px;font-size:28px}.box .info{font-size:18px;line-height:1.55;margin:12px 0}.box button{border:0;border-radius:12px;padding:14px 20px;font-weight:900;font-size:18px;cursor:pointer;background:#c98a2e;color:#fff}.q{display:inline-block;padding:5px 9px;border-radius:99px;background:#2b2b2b;margin:3px;font-size:13px}.hint{color:#aaa;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<iframe id="kasir" src="/staff-printer-universal.html?v=20260825-universal-printer-v2" title="ISSHO CAFE KASIR"></iframe>
<div id="alarm"><div class="box"><h2>🔔 ORDER MASUK & SUDAH DIBAYAR</h2><div id="alarmInfo" class="info"></div><button id="ack">✓ SUDAH DILIHAT</button><div class="hint">Alarm akan berhenti setelah ditekan.</div></div></div>
<script>
const f=document.getElementById('kasir'),alarm=document.getElementById('alarm'),info=document.getElementById('alarmInfo'),ack=document.getElementById('ack');
let audioCtx=null,lastIds=new Set(),ready=false,shown=false;
function unlockAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function beep(){try{unlockAudio();if(!audioCtx)return;const now=audioCtx.currentTime;for(let i=0;i<4;i++){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=i%2?1046:784;g.gain.setValueAtTime(.0001,now+i*.24);g.gain.exponentialRampToValueAtTime(.18,now+i*.24+.03);g.gain.exponentialRampToValueAtTime(.0001,now+i*.24+.18);o.connect(g);g.connect(audioCtx.destination);o.start(now+i*.24);o.stop(now+i*.24+.2)}}catch(e){}}
function show(o){shown=true;info.innerHTML='<b>'+esc(o.order_number||'-')+'</b><br><span class="q">Meja '+esc(o.table_name||'Take Away')+'</span><span class="q">'+esc(o.payment_method||'-')+'</span><span class="q">'+esc(o.payment_status||'-')+'</span><br><b>Rp '+new Intl.NumberFormat('id-ID').format(Number(o.total)||0)+'</b><br><br>'+(o.items||[]).map(i=>esc(i.name)+' × '+Number(i.qty||0)).join('<br>');alarm.style.display='flex';beep();try{if(navigator.vibrate)navigator.vibrate([300,100,300,100,300,100,500])}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
ack.onclick=()=>{alarm.style.display='none';shown=false;unlockAudio()};
document.addEventListener('pointerdown',unlockAudio,{once:true});
function patch(){try{const w=f.contentWindow;if(!w||!w.document)return false;w.notifyNewPayment=function(){};return true}catch(e){return false}}
async function poll(){try{const w=f.contentWindow;if(!w||!w.ORD||typeof w.loadOrders!=='function')return;if(w.document.getElementById('app')?.className==='hidden')return;patch();await w.loadOrders();const paid=(w.ORD||[]).filter(o=>o.payment_status==='PAID'&&o.order_status==='NEW');for(const o of paid){if(!lastIds.has(String(o.id))){lastIds.add(String(o.id));if(!shown)show(o)}}}catch(e){}}
f.addEventListener('load',()=>{patch();setTimeout(patch,500);setTimeout(()=>{ready=true;poll()},1200);setInterval(poll,4000)});
</script>
</body></html>
