s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}function orderDateTime(o){const raw=o?.created_at||o?.order_date||o?.ordered_at||o?.createdAt||o?.orderDate;if(raw){const d=new Date(raw);if(!isNaN(d))return{date:d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Asia/Jakarta'}),time:d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Asia/Jakarta'})}}return{date:'-',time:'-'}}function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}function unlock(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return true}catch(e){return false}}function beep(){try{if(!unlock())return;const n=ctx.currentTime;for(let i=0;i<16;i++){const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=i%2?1046:784;g.gain.setValueAtTime(.0001,n+i*.18);g.gain.exponentialRampToValueAtTime(.34,n+i*.18+.025);g.gain.exponentialRampToValueAtTime(.0001,n+i*.18+.13);o.connect(g);g.connect(ctx.destination);o.start(n+i*.18);o.stop(n+i*.18+.15)}}catch(e){}}function repeatAlarm(){beep();try{navigator.vibrate?.([300,100,300,100,300,100,500])}catch(e){}clearTimeout(alarmTimer);alarmTimer=setTimeout(()=>{if($('alarm').style.display==='flex')repeatAlarm()},4000)}function requestNotification(){try{if('Notification'in window&&Notification.permission==='default'&&!permissionAsked){permissionAsked=true;Notification.requestPermission().catch(()=>{})}}catch(e){}}function notify(o,title){try{if('Notification'in window&&Notification.permission==='granted')new Notification(title||'ISSHO CAFE — NOTIFIKASI',{body:`${o.order_number||'-'} • ${o.table_name||'Take Away'} • ${o.payment_method||'-'} • ${o.payment_status||'-'} • ${money(o.total)}`})}catch(e){}}function show(o,type){const method=String(o.payment_method||'-').toUpperCase(),ps=String(o.payment_status||'BELUM DIBAYAR').toUpperCase(),dt=orderDateTime(o),paymentEvent=type==='PAYMENT';$('alarmInfo').innerHTML='<b class="new">'+(paymentEvent?'PEMBAYARAN QRIS TERVERIFIKASI':'PESANAN BARU')+'</b><br><b>'+esc(o.order_number||'-')+'</b><span class="order-date">Tanggal Order: '+dt.date+'</span><span class="order-date">Jam Order: '+dt.time+' WIB</span><span>Meja '+esc(o.table_name||'Take Away')+'</span><br><span class="q '+(method==='CASH'?'cash':'qris')+'">'+esc(method)+'</span> <span class="q">'+esc(ps)+'</span><br><b>'+money(o.total)+'</b><br><br>'+(o.items||[]).map(i=>esc(i.name)+' × '+Number(i.qty||0)).join('<br>');$('alarm').style.display='flex';notify(o,paymentEvent?'ISSHO CAFE — QRIS TERVERIFIKASI':'ISSHO CAFE — ORDER BARU');repeatAlarm()}$('ack').onclick=()=>{$('alarm').style.display='none';clearTimeout(alarmTimer);unlock()};function deepPin(){try{let w=$('kasir').contentWindow,d=w.document,input=d&&d.getElementById('pin'),p=input?String(input.value||'').trim():'';if(p)return p;try{p=w.sessionStorage.getItem('issho_staff_pin')||w.localStorage.getItem('issho_staff_pin')||''}catch(e){}if(p)return p;const nested=d&&d.getElementById('kasir');if(nested&&nested.contentWindow){w=nested.contentWindow;d=w.document;input=d&&d.getElementById('pin');p=input?String(input.value||'').trim():'';if(p)return p;try{p=w.sessionStorage.getItem('issho_staff_pin')||w.localStorage.getItem('issho_staff_pin')||''}catch(e){}}}catch(e){}return ''}async function api(path,opt={}){const h=Object.assign({apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},opt.headers||{}),r=await fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h})),t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null}function isVerified(v){const s=String(v||'').toUpperCase().replace(/[^A-Z]/g,'');return s.includes('VERIFY')||s.includes('VERIFIKASI')||s==='PAID'||s==='LUNAS'||s==='DIBAYAR'}function isPending(v){const s=String(v||'').toUpperCase().replace(/[^A-Z]/g,'');return !s||s.includes('UNPAID')||s.includes('BELUM')||s.includes('PENDING')||s.includes('WAIT')||s.includes('MENUNGGU')}async function poll(){try{const p=deepPin();if(!p)return;const orders=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:p})});const list=Array.isArray(orders)?orders:[];if(!initialized){list.forEach(o=>{const id=String(o.id);known.add(id);knownOrderStatus.set(id,String(o.order_status||''));knownPaymentStatus.set(id,String(o.payment_status||''))});initialized=true;return}for(const o of list){const id=String(o.id),orderStatus=String(o.order_status||''),paymentStatus=String(o.payment_status||''),prevOrder=knownOrderStatus.get(id),prevPayment=knownPaymentStatus.get(id);const newOrder=!known.has(id)&&(orderStatus==='NEW'||orderStatus==='ACCEPTED');const qrisVerified=String(o.payment_method||'').toUpperCase().includes('QRIS')&&prevPayment!==undefined&&prevPayment!==paymentStatus&&isVerified(paymentStatus)&&!isVerified(prevPayment);if(newOrder){known.add(id);show(o,'ORDER')}else if(qrisVerified){show(o,'PAYMENT')}if(!known.has(id))known.add(id);knownOrderStatus.set(id,orderStatus);knownPaymentStatus.set(id,paymentStatus)}}catch(e){}}function start(){if(started)return;started=true;setTimeout(poll,300);setInterval(poll,1500);requestNotification()}document.addEventListener('pointerdown',()=>{unlock();requestNotification();if(!started)start()},{passive:true});window.addEventListener('focus',()=>{if(!started)start()});$('kasir').addEventListener('load',()=>{setTimeout(start,500);setTimeout(poll,1000)});setTimeout(start,1000);</script></body></html>
