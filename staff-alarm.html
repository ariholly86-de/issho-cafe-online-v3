<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>ISSHO CAFE — KASIR</title>
<style>
html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}#kasir{width:100%;height:100%;border:0;display:block}
#alarm{display:none;position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:18px}.box{width:min(560px,94vw);background:#171717;border:3px solid #c98a2e;border-radius:18px;padding:22px;box-shadow:0 10px 40px #000;text-align:center}.box h2{margin:0 0 8px;font-size:28px}.info{font-size:18px;line-height:1.55;margin:12px 0}.box button{border:0;border-radius:12px;padding:14px 20px;font-weight:900;font-size:18px;cursor:pointer;background:#c98a2e;color:#fff}.hint{color:#aaa;font-size:13px;margin-top:10px}.new{color:#25d366;font-weight:900}.cash{color:#ffd166}.qris{color:#7cc7ff}.order-date{display:block;color:#aaa;font-size:13px;font-weight:700;margin-top:3px}
.qrisManual{background:#168a55!important;color:#fff!important;border:0!important;border-radius:10px!important;padding:12px 18px!important;font-weight:900!important;font-size:16px!important;cursor:pointer!important;box-shadow:0 0 0 2px rgba(37,211,102,.18)!important}.qrisManual:disabled{opacity:.55!important;cursor:wait!important}
</style>
</head>
<body>
<iframe id="kasir" src="/staff-printer-universal.html?v=20260829-kasir-qris-manual-v5" title="ISSHO CAFE KASIR"></iframe>
<div id="alarm"><div class="box"><h2>🔔 ORDER / PEMBAYARAN MASUK</h2><div id="alarmInfo" class="info"></div><button id="ack">✓ SUDAH DILIHAT</button><div class="hint">QRIS tanpa foto sekarang dapat diterima manual oleh Kasir melalui tombol <b>✓ Terima QRIS</b>.</div></div></div>
<script>
const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',$=id=>document.getElementById(id);
let ctx=null,known=new Set(),knownPayment=new Map(),initialized=false,started=false,alarmTimer=null,permissionAsked=false,ordersCache=[];
function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}
function orderDateTime(o){const d=new Date(o?.created_at||0);if(!isNaN(d)&&o?.created_at)return{date:d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Asia/Jakarta'}),time:d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Asia/Jakarta'})};return{date:'-',time:'-'}}
function unlock(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return true}catch(e){return false}}
function beep(){try{if(!unlock())return;const n=ctx.currentTime;for(let i=0;i<10;i++){const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=i%2?1046:784;g.gain.setValueAtTime(.0001,n+i*.18);g.gain.exponentialRampToValueAtTime(.3,n+i*.18+.025);g.gain.exponentialRampToValueAtTime(.0001,n+i*.18+.13);o.connect(g);g.connect(ctx.destination);o.start(n+i*.18);o.stop(n+i*.18+.15)}}catch(e){}}
function repeatAlarm(){beep();try{navigator.vibrate?.([300,100,300,100,500])}catch(e){}clearTimeout(alarmTimer);alarmTimer=setTimeout(()=>{if($('alarm').style.display==='flex')repeatAlarm()},4000)}
function notify(o,title){try{if('Notification'in window&&Notification.permission==='granted')new Notification(title||'ISSHO CAFE — NOTIFIKASI',{body:`${o.order_number||'-'} • ${o.table_name||'Take Away'} • ${o.payment_method||'-'} • ${o.payment_status||'-'} • ${money(o.total)}`})}catch(e){}}
function show(o,type){const dt=orderDateTime(o),paymentEvent=type==='PAYMENT';$('alarmInfo').innerHTML='<b class="new">'+(paymentEvent?'PEMBAYARAN QRIS TERVERIFIKASI':'PESANAN BARU')+'</b><br><b>'+esc(o.order_number||'-')+'</b><span class="order-date">Tanggal Order: '+dt.date+'</span><span class="order-date">Jam Order: '+dt.time+' WIB</span><span>Meja '+esc(o.table_name||'Take Away')+'</span><br><span class="qris">'+esc(o.payment_method||'-')+'</span> <span>'+esc(o.payment_status||'-')+'</span><br><b>'+money(o.total)+'</b>';$('alarm').style.display='flex';notify(o,paymentEvent?'ISSHO CAFE — QRIS TERVERIFIKASI':'ISSHO CAFE — ORDER BARU');repeatAlarm()}
$('ack').onclick=()=>{$('alarm').style.display='none';clearTimeout(alarmTimer);unlock()};
function deepPin(){try{let w=$('kasir').contentWindow,d=w.document,p=d&&d.getElementById('pin'),v=p?String(p.value||'').trim():'';if(v)return v;const nested=d&&d.getElementById('kasir');if(nested&&nested.contentWindow){w=nested.contentWindow;d=w.document;p=d&&d.getElementById('pin');v=p?String(p.value||'').trim():'';if(v)return v}}catch(e){}return ''}
async function api(path,opt={}){const h=Object.assign({apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},opt.headers||{}),r=await fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h})),t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null}
function getInnerDoc(){try{const a=$('kasir').contentDocument||$('kasir').contentWindow.document,n=a&&a.getElementById('kasir');return n?(n.contentDocument||n.contentWindow.document):a}catch(e){return null}}
function findRef(el){for(let i=0;i<8&&el;i++,el=el.parentElement){const m=String(el.innerText||'').match(/ISS-\d{6}-\d{6}-[A-Z0-9]+/);if(m)return m[0]}return null}
function noProof(o){return String(o.payment_method||'').toUpperCase()==='QRIS'&&String(o.payment_status||'').toUpperCase()!=='PAID'&&!String(o.payment_proof_url||'').trim()}
async function manualAcceptQris(id,btn){if(btn)btn.disabled=true;try{const p=deepPin();if(!p)throw Error('Sesi Kasir belum terbaca. Pastikan sudah login Kasir.');const o=ordersCache.find(x=>String(x.id)===String(id));if(!o)throw Error('Order tidak ditemukan. Silakan Refresh.');if(!noProof(o))throw Error('Order ini memiliki bukti QRIS atau sudah PAID. Gunakan Verifikasi QRIS biasa.');if(!confirm('Terima pembayaran QRIS tanpa foto untuk '+o.order_number+' sebesar '+money(o.total)+'?'))return;await api('/rest/v1/rpc/staff_accept_qris_without_proof',{method:'POST',body:JSON.stringify({p_pin:p,p_order_id:id})});await refreshInner();alert('✓ QRIS diterima. Pembayaran menjadi PAID dan otomatis masuk ke Dapur.')}catch(e){alert('Gagal menerima QRIS: '+e.message)}finally{if(btn)btn.disabled=false}}
window.manualAcceptQris=manualAcceptQris;
async function refreshInner(){try{const w=$('kasir').contentWindow;if(w&&typeof w.loadOrders==='function')await w.loadOrders();const d=getInnerDoc();if(d){const n=d.getElementById('kasir');if(n&&n.contentWindow&&typeof n.contentWindow.loadOrders==='function')await n.contentWindow.loadOrders()}}catch(e){}}
async function injectQrisButtons(){try{const p=deepPin();if(!p)return;const data=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:p})});ordersCache=Array.isArray(data)?data:[];const d=getInnerDoc();if(!d||!d.body)return;d.querySelectorAll('[data-qris-manual]').forEach(x=>x.remove());d.querySelectorAll('button').forEach(b=>{const ref=findRef(b);if(!ref)return;const o=ordersCache.find(x=>String(x.order_number)===String(ref));if(!o||!noProof(o))return;const parent=b.parentElement;if(!parent||parent.querySelector('[data-qris-manual]'))return;const q=d.createElement('button');q.type='button';q.dataset.qrisManual='1';q.className='qrisManual';q.textContent='✓ Terima QRIS';q.title='Terima QRIS tanpa upload foto';q.onclick=e=>{e.preventDefault();e.stopPropagation();manualAcceptQris(o.id,q)};parent.appendChild(q)})}catch(e){}}
async function poll(){try{const p=deepPin();if(!p)return;const list=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:p})});const a=Array.isArray(list)?list:[];ordersCache=a;if(!initialized){a.forEach(o=>{const id=String(o.id);known.add(id);knownPayment.set(id,String(o.payment_status||''))});initialized=true;return}for(const o of a){const id=String(o.id),ps=String(o.payment_status||''),prev=knownPayment.get(id);const newOrder=!known.has(id)&&(o.order_status==='NEW'||o.order_status==='ACCEPTED');const paidChanged=String(o.payment_method||'').toUpperCase()==='QRIS'&&prev!==undefined&&prev!==ps&&ps==='PAID';if(newOrder){known.add(id);show(o,'ORDER')}else if(paidChanged){show(o,'PAYMENT')}known.add(id);knownPayment.set(id,ps)}}catch(e){}}
function start(){if(started)return;started=true;setTimeout(poll,300);setInterval(poll,1500);setInterval(injectQrisButtons,1200);try{if('Notification'in window&&Notification.permission==='default'&&!permissionAsked){permissionAsked=true;Notification.requestPermission().catch(()=>{})}}catch(e){}}
document.addEventListener('pointerdown',()=>{unlock();if(!started)start()},{passive:true});window.addEventListener('focus',()=>{if(!started)start()});$('kasir').addEventListener('load',()=>{setTimeout(start,500);setTimeout(injectQrisButtons,1000);setTimeout(refreshInner,1200)});setTimeout(start,1000);setInterval(injectQrisButtons,2500);
</script>
</body></html>
