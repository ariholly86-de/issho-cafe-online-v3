<style>
html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}#kasir{width:100%;height:100%;border:0;display:block}
#alarm{display:none;position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.93);align-items:center;justify-content:center;padding:18px}.box{width:min(600px,94vw);background:#171717;border:3px solid #c98a2e;border-radius:18px;padding:22px;box-shadow:0 10px 40px #000;text-align:center}.box h2{margin:0 0 8px;font-size:28px}.info{font-size:18px;line-height:1.55;margin:12px 0}.box button{border:0;border-radius:12px;padding:14px 20px;font-weight:900;font-size:18px;cursor:pointer;background:#c98a2e;color:#fff}.hint{color:#aaa;font-size:13px;margin-top:10px}.new{color:#25d366;font-weight:900}.cash{color:#ffd166}.qris{color:#7cc7ff}.order-date{display:block;color:#aaa;font-size:13px;font-weight:700;margin-top:3px}.ready{color:#25d366;font-weight:900}.manual{background:#168a55!important;color:#fff!important;border:0!important;border-radius:10px!important;padding:11px 16px!important;font-weight:900!important;font-size:15px!important;cursor:pointer!important}.waBtn{background:#25D366!important;color:#07150c!important;border:0!important;border-radius:10px!important;padding:11px 16px!important;font-weight:900!important;font-size:15px!important;cursor:pointer!important}.waModal{display:none;position:fixed;inset:0;z-index:2147483648;background:rgba(0,0,0,.86);align-items:center;justify-content:center;padding:18px}.waBox{width:min(540px,94vw);background:#171717;border:3px solid #25D366;border-radius:18px;padding:22px;box-shadow:0 12px 50px #000}.waBox h2{margin:0 0 8px}.waHelp{color:#bbb;white-space:pre-line;line-height:1.5}.waInput{width:100%;box-sizing:border-box;padding:14px;border:2px solid #555;border-radius:10px;background:#101010;color:#fff;font-size:19px;margin-top:8px}.waActions{display:flex;gap:10px;margin-top:15px}.waActions button{flex:1;border:0;border-radius:10px;padding:13px;font-weight:900;font-size:16px;cursor:pointer}.waSend{background:#25D366;color:#07150c}.waCancel{background:#333;color:#fff}
</style>

<body>
<iframe id="kasir" src="/staff-printer-universal.html?v=20260829-kasir-final-v7" title="ISSHO CAFE KASIR"></iframe>
<div id="alarm"><div class="box"><h2>🔔 ORDER / PEMBAYARAN MASUK</h2><div id="alarmInfo" class="info"></div><button id="ack">✓ SUDAH DILIHAT</button><div class="hint">Alarm berlaku untuk order baru TUNAI maupun QRIS. QRIS tanpa foto memiliki tombol <b>✓ Terima QRIS</b>.</div></div></div>
<div id="waModal" class="waModal"><div class="waBox"><h2>🟢 WhatsApp Pelanggan</h2><div id="waHelp" class="waHelp"></div><label for="waInput"><b>Nomor WhatsApp</b></label><input id="waInput" class="waInput" type="tel" inputmode="tel" placeholder="081234567890"><div class="waActions"><button class="waCancel" id="waCancel">Batal</button><button class="waSend" id="waSend">🟢 Buka WhatsApp</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',$=id=>document.getElementById(id);
let audioCtx=null,known=new Set(),lastPayment=new Map(),initialized=false,started=false,alarmTimer=null,ordersCache=[],pendingWa=null,permissionAsked=false;
function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}
function dt(o){const raw=o?.created_at||o?.order_date||o?.ordered_at||o?.createdAt||o?.orderDate;if(raw){const d=new Date(raw);if(!isNaN(d))return{date:d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Asia/Jakarta'}),time:d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Asia/Jakarta'})}}return{date:'-',time:'-'}}
function unlock(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return true}catch(e){return false}}
function beep(){try{if(!unlock())return;const n=audioCtx.currentTime;for(let i=0;i<12;i++){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=i%2?1046:784;g.gain.setValueAtTime(.0001,n+i*.18);g.gain.exponentialRampToValueAtTime(.32,n+i*.18+.02);g.gain.exponentialRampToValueAtTime(.0001,n+i*.18+.13);o.connect(g);g.connect(audioCtx.destination);o.start(n+i*.18);o.stop(n+i*.18+.15)}}catch(e){}}
function alarmLoop(){beep();try{navigator.vibrate?.([300,100,300,100,500])}catch(e){}clearTimeout(alarmTimer);alarmTimer=setTimeout(()=>{if($('alarm').style.display==='flex')alarmLoop()},3500)}
function showAlarm(o,type){const d=dt(o),payment=type==='PAYMENT';$('alarmInfo').innerHTML='<b class="new">'+(payment?'PEMBAYARAN QRIS TERVERIFIKASI':'PESANAN BARU')+'</b><br><b>'+esc(o.order_number||'-')+'</b><span class="order-date">Tanggal Order: '+d.date+'</span><span class="order-date">Jam Order: '+d.time+' WIB</span><span>Meja: '+esc(o.table_name||'Take Away')+'</span><br><span class="'+(String(o.payment_method||'').toUpperCase()==='CASH'?'cash':'qris')+'">'+esc(o.payment_method||'-')+'</span> <span>'+esc(o.payment_status||'-')+'</span><br><b>'+money(o.total)+'</b><br>'+(o.items||[]).map(i=>esc(i.name)+' × '+Number(i.qty||0)).join('<br>');$('alarm').style.display='flex';alarmLoop();try{if('Notification'in window&&Notification.permission==='granted')new Notification(payment?'ISSHO CAFE — QRIS TERVERIFIKASI':'ISSHO CAFE — ORDER BARU',{body:(o.order_number||'-')+' • '+(o.table_name||'Take Away')+' • '+(o.payment_method||'-')+' • '+money(o.total)})}catch(e){}}
$('ack').onclick=()=>{$('alarm').style.display='none';clearTimeout(alarmTimer);unlock()};
function getDoc(){try{let d=$('kasir').contentDocument||$('kasir').contentWindow.document;if(!d)return null;const nested=d.getElementById('kasir');if(nested)return nested.contentDocument||nested.contentWindow.document;return d}catch(e){return null}}
function getPin(){try{let d=getDoc(),p=d&&d.getElementById('pin'),v=p?String(p.value||'').trim():'';if(v)return v;const w=$('kasir').contentWindow;try{v=w.sessionStorage.getItem('issho_staff_pin')||w.localStorage.getItem('issho_staff_pin')||''}catch(e){}return v}catch(e){return ''}}
async function api(path,opt={}){const h=Object.assign({apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},opt.headers||{}),r=await fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h})),t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null}
function findRef(el){for(let i=0;i<10&&el;i++,el=el.parentElement){const m=String(el.innerText||'').match(/ISS-\d{6}-\d{6}-[A-Z0-9]+/);if(m)return m[0]}return null}
function cleanupWhatsAppButtons(d){try{const seen=new Set();d.querySelectorAll('button').forEach(b=>{const text=String(b.textContent||'').replace(/\s+/g,' ').trim();if(!/WhatsApp\s*[—-]\s*PESANAN SELESAI/i.test(text))return;const ref=findRef(b);if(!ref){b.remove();return}if(seen.has(ref)){b.remove();return}seen.add(ref)})}catch(e){}}
function noProof(o){return String(o.payment_method||'').toUpperCase().includes('QRIS')&&String(o.payment_status||'').toUpperCase()!=='PAID'&&!String(o.payment_proof_url||'').trim()}
function isDone(o){const s=String(o.order_status||'').toUpperCase();return /READY|DONE|COMPLETED|COMPLETE|FINISHED|SELESAI|SERVED|SIAP/.test(s)}
function cleanPhone(v){let s=String(v||'').replace(/[^0-9]/g,'');if(s.startsWith('0'))s='62'+s.slice(1);else if(s.startsWith('8'))s='62'+s;return s}
function invoice(o){const d=dt(o);const items=(o.items||[]).map(i=>'• '+i.name+' × '+Number(i.qty||0)+' — '+money(Number(i.price||0)*Number(i.qty||0))).join('\n');return '*ISSHO CAFE — INVOICE*\n\n*No. Order:* '+(o.order_number||'-')+'\n*Tanggal Order:* '+d.date+'\n*Jam Order:* '+d.time+' WIB\n*Meja:* '+(o.table_name||'Take Away')+'\n*Pembayaran:* '+(o.payment_method||'-')+'\n*Status:* '+(o.payment_status||'-')+'\n\n*Pesanan:*\n'+(items||'• -')+'\n\n*TOTAL:* '+money(o.total)+'\n\n🍽️ *Pesanan Anda Sudah Siap!*\nSilakan ambil di *meja kasir*.\n\nTerima kasih sudah berkunjung ke *ISSHO CAFE* 🙏'}
function openWa(o){pendingWa=o;$('waHelp').textContent='Order: '+(o.order_number||'-')+'\nTanggal: '+dt(o).date+'\nJam: '+dt(o).time+' WIB\nMeja: '+(o.table_name||'Take Away')+'\nTotal: '+money(o.total)+'\n\nInvoice akan dikirim ke pelanggan melalui WhatsApp.';$('waInput').value=o.customer_whatsapp||'';$('waModal').style.display='flex';setTimeout(()=>{$('waInput').focus();$('waInput').select()},80)}
$('waCancel').onclick=()=>{$('waModal').style.display='none';pendingWa=null};$('waSend').onclick=()=>{const p=cleanPhone($('waInput').value);if(!/^62\d{8,15}$/.test(p)){alert('Nomor WhatsApp tidak valid. Contoh: 081234567890');return}localStorage.setItem('issho_last_wa_phone',$('waInput').value.trim());window.open('https://web.whatsapp.com/send?phone='+p+'&text='+encodeURIComponent(invoice(pendingWa)),'_blank','noopener,noreferrer');$('waModal').style.display='none';pendingWa=null};
async function manualQris(id,btn){if(btn)btn.disabled=true;try{const p=getPin();if(!p)throw Error('Sesi Kasir belum terbaca. Login Kasir terlebih dahulu.');const o=ordersCache.find(x=>String(x.id)===String(id));if(!o)throw Error('Order tidak ditemukan. Klik Refresh.');if(!noProof(o))throw Error('Order ini bukan QRIS tanpa foto.');if(!confirm('Terima QRIS tanpa foto untuk '+o.order_number+' sebesar '+money(o.total)+'?'))return;await api('/rest/v1/rpc/staff_accept_qris_without_proof',{method:'POST',body:JSON.stringify({p_pin:p,p_order_id:id})});await refreshInner();alert('✓ QRIS diterima. Status menjadi PAID dan order dapat diteruskan ke Dapur.')}catch(e){alert('Gagal menerima QRIS: '+e.message)}finally{if(btn)btn.disabled=false}}
async function refreshInner(){try{const outer=$('kasir').contentWindow;if(outer&&typeof outer.loadOrders==='function')await outer.loadOrders();const d=$('kasir').contentDocument||outer.document;const n=d&&d.getElementById('kasir');if(n&&n.contentWindow&&typeof n.contentWindow.loadOrders==='function')await n.contentWindow.loadOrders()}catch(e){}}
async function inject(){try{const p=getPin();if(!p)return;const data=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:p})});ordersCache=Array.isArray(data)?data:[];const d=getDoc();if(!d||!d.body)return;cleanupWhatsAppButtons(d);d.querySelectorAll('[data-qris-manual],[data-wa-wrap]').forEach(x=>x.remove());d.querySelectorAll('button').forEach(b=>{const ref=findRef(b);if(!ref)return;const o=ordersCache.find(x=>String(x.order_number)===String(ref));if(!o)return;const parent=b.parentElement;if(!parent)return;if(noProof(o)&&!parent.querySelector('[data-qris-manual]')){const q=d.createElement('button');q.type='button';q.dataset.qrisManual='1';q.className='manual';q.textContent='✓ Terima QRIS';q.title='Terima QRIS tanpa upload foto';q.onclick=e=>{e.preventDefault();e.stopPropagation();manualQris(o.id,q)};parent.appendChild(q)}if(String(o.payment_status||'').toUpperCase()==='PAID'&&!parent.querySelector('[data-wa-wrap]')){const wrap=d.createElement('span');wrap.dataset.waWrap='1';wrap.style.cssText='display:inline-flex;gap:7px;margin-left:4px;align-items:center';const w=d.createElement('button');w.type='button';w.className='waBtn';w.textContent=isDone(o)?'🟢 WhatsApp — PESANAN SELESAI':'🟢 WhatsApp';w.title='Kirim invoice/konfirmasi pelanggan';w.onclick=e=>{e.preventDefault();e.stopPropagation();openWa(o)};wrap.appendChild(w);parent.appendChild(wrap)}});cleanupWhatsAppButtons(d)}catch(e){}}
async function poll(){try{const p=getPin();if(!p)return;const list=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:p})});const a=Array.isArray(list)?list:[];ordersCache=a;if(!initialized){a.forEach(o=>{const id=String(o.id);known.add(id);lastPayment.set(id,String(o.payment_status||''))});initialized=true;return}for(const o of a){const id=String(o.id),ps=String(o.payment_status||''),prev=lastPayment.get(id);const newOrder=!known.has(id)&&(String(o.order_status||'').toUpperCase()==='NEW'||String(o.order_status||'').toUpperCase()==='ACCEPTED');const paidChanged=String(o.payment_method||'').toUpperCase().includes('QRIS')&&prev!==undefined&&prev!==ps&&ps==='PAID';if(newOrder){known.add(id);showAlarm(o,'ORDER')}else if(paidChanged){showAlarm(o,'PAYMENT')}known.add(id);lastPayment.set(id,ps)}}catch(e){}}
function start(){if(started)return;started=true;setTimeout(poll,300);setInterval(poll,1000);setInterval(inject,1000);try{if('Notification'in window&&Notification.permission==='default'&&!permissionAsked){permissionAsked=true;Notification.requestPermission().catch(()=>{})}}catch(e){}}
document.addEventListener('pointerdown',()=>{unlock();if(!started)start()},{passive:true});window.addEventListener('focus',()=>{unlock();if(!started)start()});$('kasir').addEventListener('load',()=>{setTimeout(start,300);setTimeout(inject,800);setTimeout(refreshInner,1200)});setTimeout(start,800);setInterval(inject,2000);
</script>
