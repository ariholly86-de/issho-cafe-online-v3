<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — KASIR DIGITAL</title><style>html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}#kasir{width:100%;height:100%;border:0;display:block}#digital{position:fixed;right:12px;bottom:12px;z-index:2147483646;background:#151515;border:1px solid #555;border-radius:14px;padding:10px;box-shadow:0 6px 30px #000b;max-width:460px;width:calc(100vw - 44px)}#digital button{border:0;border-radius:9px;padding:10px 12px;margin:2px;font-weight:900;cursor:pointer;color:#fff;background:#b68142}.blue{background:#315b9a!important}.green{background:#208b57!important}.dark{background:#303030!important}.muted{color:#aaa;font-size:12px}.panel{display:none;margin-top:8px;max-height:62vh;overflow:auto}.order{border:1px solid #444;border-radius:10px;padding:10px;margin:7px 0;background:#1b1b1b}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.small{font-size:12px;color:#bbb}.msg{margin-top:6px;font-size:12px}.warn{color:#ffd27a}.waRow{display:flex;gap:5px;align-items:center;margin-top:8px}.waRow input{flex:1;min-width:0;border:1px solid #555;background:#101010;color:#fff;border-radius:8px;padding:10px}.saved{color:#79e6a4;font-size:11px;margin-top:3px}</style></head><body><iframe id="kasir" src="/staff-kasir-final.html?v=20260825-kasir-digital-v2" title="ISSHO CAFE KASIR"></iframe><div id="digital"><button id="open">📱 NOTA DIGITAL / WHATSAPP</button><span id="status" class="muted">Kirim nota tanpa kertas</span><div id="panel" class="panel"><div class="muted">Order yang sudah PAID. Nomor WhatsApp disimpan per meja di perangkat Kasir.</div><div id="orders"></div><div class="msg warn">WhatsApp dapat dibuka otomatis dengan nota berupa teks. Untuk PDF, simpan PDF lalu lampirkan manual jika pelanggan memintanya.</div></div></div><script>const frame=document.getElementById('kasir'),panel=document.getElementById('panel'),list=document.getElementById('orders'),statusEl=document.getElementById('status');let last=[];const KEY='issho_customer_wa_by_table_v1';function esc(s){return String(s??'').replace(/[&<>\\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[m]))}function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}function getMap(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}function setMap(m){localStorage.setItem(KEY,JSON.stringify(m))}function normalize(n){n=String(n||'').replace(/\\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);if(n&&!n.startsWith('62'))n='62'+n;return n}function staff(){try{const u=frame.contentWindow,d=u.document.getElementById('kasir');return d?d.contentWindow:null}catch(e){return null}}function getOrders(){const w=staff();return w&&Array.isArray(w.ORD)?w.ORD.filter(o=>o.payment_status==='PAID'):[]}function receiptHTML(o){const items=(o.items||[]).map(i=>'<tr><td>'+esc(i.name)+'</td><td style="text-align:center">'+Number(i.qty||0)+'</td><td style="text-align:right">'+money(i.price*i.qty)+'</td></tr>').join('');return '<!doctype html><html><head><meta charset="utf-8"><title>ISSHO CAFE '+esc(o.order_number)+'</title><style>@page{size:A4;margin:12mm}body{font-family:Arial,sans-serif;color:#111;max-width:700px;margin:auto}h1{text-align:center;margin:0}h3{text-align:center;margin:4px 0 18px}table{width:100%;border-collapse:collapse}td{padding:7px 3px;border-bottom:1px solid #ddd}.total{font-size:20px;font-weight:800;text-align:right;margin-top:15px}.meta{line-height:1.6}.foot{text-align:center;margin-top:30px;color:#666}</style></head><body><h1>ISSHO CAFE</h1><h3>NOTA DIGITAL PELANGGAN</h3><div class="meta"><b>Order:</b> '+esc(o.order_number||'-')+'<br><b>Meja:</b> '+esc(o.table_name||'Take Away')+'<br><b>Pembayaran:</b> '+esc(o.payment_method||'-')+'</div><hr><table>'+items+'</table><div class="total">TOTAL '+money(o.total)+'</div><div class="foot">Terima kasih telah berkunjung ke ISSHO CAFE</div></body></html>'}function savePDF(o){const w=window.open('','_blank','width=850,height=900');if(!w){alert('Popup diblokir. Izinkan popup untuk ISSHO CAFE.');return}w.document.write(receiptHTML(o));w.document.close();w.focus();setTimeout(()=>w.print(),300);statusEl.textContent='Pilih Save as PDF pada dialog cetak';}function waText(o,n){const lines=(o.items||[]).map(i=>'- '+i.name+' x '+Number(i.qty||0)+' = '+money(i.price*i.qty)).join('\\n');return 'Halo, ini nota digital ISSHO CAFE.\\n\\nOrder: '+(o.order_number||'-')+'\\nMeja: '+(o.table_name||'Take Away')+'\\nPembayaran: '+(o.payment_method||'-')+'\\n\\n'+lines+'\\n\\nTOTAL: '+money(o.total)+'\\n\\nTerima kasih telah berkunjung ke ISSHO CAFE.'}function sendWA(o,i){const input=document.getElementById('wa-'+i);let n=normalize(input.value);if(!n){alert('Masukkan nomor WhatsApp pelanggan terlebih dahulu.');input.focus();return}const map=getMap();map[String(o.table_name||'Take Away')]=n;setMap(map);input.value=n;const url='https://wa.me/'+n+'?text='+encodeURIComponent(waText(o,n));window.open(url,'_blank');statusEl.textContent='WhatsApp dibuka untuk '+n}function saveNumber(o,i){let n=normalize(document.getElementById('wa-'+i).value);if(!n){alert('Nomor belum diisi.');return}const map=getMap();map[String(o.table_name||'Take Away')]=n;setMap(map);document.getElementById('wa-'+i).value=n;document.getElementById('saved-'+i).textContent='✓ Nomor tersimpan untuk meja ini';statusEl.textContent='Nomor WhatsApp tersimpan'}function render(){const arr=getOrders();last=arr;const map=getMap();list.innerHTML=arr.length?arr.map((o,i)=>{const table=String(o.table_name||'Take Away'),n=map[table]||'';return '<div class="order"><div class="row"><b>'+esc(o.order_number||'-')+'</b><b>'+money(o.total)+'</b></div><div class="small">Meja '+esc(table)+' • '+esc(o.payment_method||'-')+' • PAID</div><div>'+ (o.items||[]).map(x=>esc(x.name)+' × '+Number(x.qty||0)).join('<br>')+'</div><div class="waRow"><input id="wa-'+i+'" inputmode="tel" autocomplete="tel" placeholder="Nomor WhatsApp pelanggan" value="'+esc(n)+'"><button class="dark" onclick="saveNumber(last['+i+'],'+i+')">Simpan</button></div><div id="saved-'+i+'" class="saved"></div><div style="margin-top:6px"><button class="green" onclick="sendWA(last['+i+'],'+i+')">📱 Kirim Nota WhatsApp</button><button class="blue" onclick="savePDF(last['+i+'])">📄 PDF</button></div></div>'}).join(''):'<p class="muted">Belum ada order PAID.</p>'}document.getElementById('open').onclick=()=>{panel.style.display=panel.style.display==='block'?'none':'block';if(panel.style.display==='block')render()};frame.addEventListener('load',()=>setTimeout(render,1200));setInterval(()=>{if(panel.style.display==='block')render()},2500);</script></body></html>
