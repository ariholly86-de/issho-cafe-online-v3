<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — KASIR WHATSAPP</title><style>html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}#kasir{width:100%;height:100%;border:0;display:block}#digital{position:fixed;right:12px;bottom:12px;z-index:2147483646;background:#151515;border:1px solid #555;border-radius:14px;padding:10px;box-shadow:0 6px 30px #000b;max-width:470px;width:calc(100vw - 44px)}#digital button{border:0;border-radius:9px;padding:10px 12px;margin:2px;font-weight:900;cursor:pointer;color:#fff;background:#208b57}.muted{color:#aaa;font-size:12px}.panel{display:none;margin-top:8px;max-height:62vh;overflow:auto}.order{border:1px solid #444;border-radius:10px;padding:10px;margin:7px 0;background:#1b1b1b}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.small{font-size:12px;color:#bbb}.waRow{display:flex;gap:5px;margin-top:8px}.waRow input{flex:1;min-width:0;border:1px solid #555;background:#101010;color:#fff;border-radius:8px;padding:10px}.wa{background:#208b57!important}.save{background:#303030!important}.saved{color:#79e6a4;font-size:11px;margin-top:3px}</style></head><body><iframe id="kasir" src="/staff-kasir-final.html?v=20260825-kasir-wa-v3" title="ISSHO CAFE KASIR"></iframe><div id="digital"><button id="open">📱 WHATSAPP NOTA PELANGGAN</button><span id="status" class="muted">Kirim rincian order tanpa kertas</span><div id="panel" class="panel"><div class="muted">Setiap order PAID memiliki tombol WhatsApp. Nomor pelanggan disimpan berdasarkan meja di perangkat Kasir.</div><div id="orders"></div></div></div><script>const frame=document.getElementById('kasir'),panel=document.getElementById('panel'),list=document.getElementById('orders'),statusEl=document.getElementById('status');let last=[];const KEY='issho_customer_wa_by_table_v2';function esc(s){return String(s??'').replace(/[&<>\\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[m]))}function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}function getMap(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}function setMap(m){localStorage.setItem(KEY,JSON.stringify(m))}function normalize(n){n=String(n||'').replace(/\\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);if(n&&!n.startsWith('62'))n='62'+n;return n}function staff(){try{const u=frame.contentWindow,d=u.document.getElementById('kasir');return d?d.contentWindow:null}catch(e){return null}}function getOrders(){const w=staff();return w&&Array.isArray(w.ORD)?w.ORD.filter(o=>o.payment_status==='PAID'):[]}function waText(o){const lines=(o.items||[]).map(i=>'- '+i.name+' × '+Number(i.qty||0)+' — '+money((Number(i.price)||0)*(Number(i.qty)||0))).join('\n');return 'Halo, ini rincian pembelian Anda di ISSHO CAFE.\n\nISSN: '+(o.order_number||'-')+'\nMeja: '+(o.table_name||'Take Away')+'\nPembayaran: '+(o.payment_method||'-')+'\nStatus: PAID\n\n'+lines+'\n\nTOTAL: '+money(o.total)+'\n\nTerima kasih telah berkunjung ke ISSHO CAFE.'}function sendWA(o,i){const input=document.getElementById('wa-'+i);let n=normalize(input.value);if(!n){alert('Masukkan nomor WhatsApp pelanggan terlebih dahulu.');input.focus();return}const map=getMap();map[String(o.table_name||'Take Away')]=n;setMap(map);input.value=n;window.open('https://wa.me/'+n+'?text='+encodeURIComponent(waText(o)),'_blank');statusEl.textContent='WhatsApp dibuka — tinggal tekan Kirim'}function saveNumber(o,i){let n=normalize(document.getElementById('wa-'+i).value);if(!n){alert('Nomor belum diisi.');return}const map=getMap();map[String(o.table_name||'Take Away')]=n;setMap(map);document.getElementById('wa-'+i).value=n;document.getElementById('saved-'+i).textContent='✓ Tersimpan untuk meja ini';statusEl.textContent='Nomor WhatsApp tersimpan'}function render(){const arr=getOrders();last=arr;const map=getMap();list.innerHTML=arr.length?arr.map((o,i)=>{const table=String(o.table_name||'Take Away');const n=map[table]||'';return '<div class="order"><div class="row"><b>'+esc(o.order_number||'-')+'</b><b>'+money(o.total)+'</b></div><div class="small">Meja '+esc(table)+' • '+esc(o.payment_method||'-')+' • PAID</div><div style="margin-top:6px">'+(o.items||[]).map(x=>esc(x.name)+' × '+Number(x.qty||0)+' — '+money((Number(x.price)||0)*(Number(x.qty)||0))).join('<br>')+'</div><div class="waRow"><input id="wa-'+i+'" inputmode="tel" autocomplete="tel" placeholder="Nomor WhatsApp pelanggan" value="'+esc(n)+'"><button class="save" onclick="saveNumber(last['+i+'],'+i+')">Simpan</button></div><div id="saved-'+i+'" class="saved"></div><div style="margin-top:6px"><button class="wa" onclick="sendWA(last['+i+'],'+i+')">📱 WhatsApp</button></div></div>'}).join(''):'<p class="muted">Belum ada order PAID.</p>'}document.getElementById('open').onclick=()=>{panel.style.display=panel.style.display==='block'?'none':'block';if(panel.style.display==='block')render()};frame.addEventListener('load',()=>setTimeout(render,1200));setInterval(()=>{if(panel.style.display==='block')render()},2000);</script></body></html>
