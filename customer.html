<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>ISSHO CAFE — Menu Pelanggan</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080909}iframe{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="app" title="ISSHO CAFE Menu Pelanggan"></iframe>
<script>
const f=document.getElementById('app');
const qs=new URLSearchParams(location.search);
const src=new URL('customer-ui-v6.html?v=20260904-image-500x500-jpg85',location.href);
if(qs.get('table'))src.searchParams.set('table',qs.get('table'));
if(location.hash)src.hash=location.hash.slice(1);
f.src=src.toString();

/* CUSTOMER IMAGE STANDARD: display each menu image at a compact fixed size.
   The image asset itself is normalized to 500x500 JPEG quality 85 when CORS permits.
   This prevents the source image's natural dimensions from making the menu card look oversized. */
function normalizeImage(img){
  try{
    if(!img||!img.src||img.dataset.imageFixed==='1')return;
    const src=img.currentSrc||img.src;
    if(!src)return;
    img.dataset.imageFixed='1';
    img.style.width='100%';
    img.style.height='100%';
    img.style.objectFit='contain';
    img.style.display='block';
    const run=async()=>{
      try{
        const res=await fetch(src,{mode:'cors',cache:'no-store'});
        if(!res.ok)throw new Error('image fetch '+res.status);
        const blob=await res.blob();
        const bmp=await createImageBitmap(blob);
        const canvas=document.createElement('canvas');canvas.width=500;canvas.height=500;
        const ctx=canvas.getContext('2d');ctx.fillStyle='#000';ctx.fillRect(0,0,500,500);
        const scale=Math.min(500/bmp.width,500/bmp.height);
        const w=Math.max(1,Math.round(bmp.width*scale)),h=Math.max(1,Math.round(bmp.height*scale));
        ctx.drawImage(bmp,Math.round((500-w)/2),Math.round((500-h)/2),w,h);bmp.close();
        const out=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('toBlob failed')),'image/jpeg',0.85));
        img.src=URL.createObjectURL(out);
      }catch(e){/* keep original image; CSS sizing still applies */}
    };
    if(img.complete&&img.naturalWidth)run();else img.addEventListener('load',run,{once:true});
  }catch(e){}
}
function installImageStandard(doc){
  if(!doc||!doc.body)return false;
  const scan=()=>{
    doc.querySelectorAll('#menu .photo').forEach(photo=>{
      photo.style.height=window.innerWidth<=600?'105px':'140px';
      photo.style.width='100%';
      photo.style.overflow='hidden';
      photo.style.display='grid';
      photo.style.placeItems='center';
    });
    doc.querySelectorAll('#menu .photo img').forEach(normalizeImage);
  };
  scan();
  const menu=doc.getElementById('menu');
  if(menu&&!doc.documentElement.dataset.isshoImageStandard){
    doc.documentElement.dataset.isshoImageStandard='500x500-jpg85-fixed';
    new MutationObserver(scan).observe(menu,{childList:true,subtree:true});
  }
  return true;
}
function install(){
  try{
    const d=f.contentDocument;if(!d)return false;
    const inner=d.querySelector('iframe#app');if(!inner||!inner.contentDocument)return false;
    return installImageStandard(inner.contentDocument);
  }catch(e){return false}
}
f.addEventListener('load',()=>{
  if(!install()){
    const timer=setInterval(()=>{if(install())clearInterval(timer)},200);
    setTimeout(()=>clearInterval(timer),30000);
  }
});
</script>
</body>
</html>
