const SUPA='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',frame=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>\\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[m]))}

async function syncCustomer(){try{const w=frame.contentWindow;if(!w||!w.document||!w.api)return;const [cats,all]=await Promise.all([get('/rest/v1/categories?select=id,name,active,sort_order&active=eq.true&order=sort_order,name'),w.api('/rest/v1/products?select=id,category_id,name,description,price,image_url,sort_order,active&active=eq.true&order=sort_order,name')]);const products=all.filter(p=>p.active===true&&typeof p.image_url==='string'&&p.image_url.trim()!=='');const populated=cats.filter(c=>products.some(p=>p.category_id===c.id));if(!populated.length)return;const map=Object.fromEntries(cats.map(c=>[c.id,c.name]));w.__DB_CATEGORY_MAP=map;w.__DB_CATEGORIES=populated;w.products=products;w.category=p=>map[p.category_id]||'Tanpa Kategori';let current='';try{current=w.eval('typeof activeCat!=="undefined"?activeCat:""')}catch(e){}const currentId=populated.some(c=>c.name===current)?populated.find(c=>c.name===current).id:populated[0].id;try{w.eval('activeCat='+JSON.stringify(map[currentId]))}catch(e){w.activeCat=map[currentId]}
w.renderCats=function(){const el=w.document.getElementById('cats');if(!el)return;const active=w.activeCat||'';el.innerHTML=populated.map(c=>'<button class="cat '+(active===c.name?'active':'')+'" onclick="activeCat='+JSON.stringify(c.name)+';renderCats();renderMenu()">'+esc(c.name)+'</button>').join('')};
w.renderMenu=function(){const q=(w.document.getElementById('search')?.value||'').trim().toLowerCase(),active=w.activeCat||populated[0].name,list=products.filter(p=>w.category(p)===active&&(!q||(p.name+' '+(p.description||'')+' '+active).toLowerCase().includes(q)));const count=w.document.getElementById('count');if(count)count.textContent=active+' • '+list.length+' menu tersedia';const menu=w.document.getElementById('menu');if(!menu)return;menu.innerHTML=list.length?list.map(p=>'<div class="menu"><div class="photo" style="background-image:url(\''+esc(p.image_url)+'\')"></div><span class="tag">'+esc(active)+'</span><h3>'+esc(p.name)+'</h3><div class="muted">'+esc(p.description||'')+'</div><div class="row" style="margin-top:auto"><b class="price">'+w.money(p.price)+'</b><button class="gold" onclick="add(\''+p.id+'\')">Tambah</button></div></div>').join(''):'<div class="card">Belum ada menu aktif bergambar pada kategori <b>'+esc(active)+'</b>.</div>'};w.renderCats();w.renderMenu();}catch(e){console.error('Customer category sync',e)}}
frame.src='customer-v3.html?v=category-final-20260823'+location.search+location.hash;frame.addEventListener('load',()=>{let tries=0;const wait=()=>{if(frame.contentDocument?.getElementById('cats')&&frame.contentWindow?.api){syncCustomer();setInterval(syncCustomer,3000)}else if(tries++<100)setTimeout(wait,100)};wait()});
