<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISSHO CAFE - Menu</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f6f0e7;color:#211d18}.wrap{max-width:1100px;margin:auto;padding:16px}.head{background:#171411;color:#fff}.brand{font-size:26px;font-weight:900}.sub{font-size:12px;opacity:.7}.card,.menu{background:#fff;border:1px solid #e3d8ca;border-radius:16px;padding:16px;margin:14px 0}.hero{background:#171411;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.menu{margin:0}.pic{height:130px;background:#eee3d1;border-radius:12px;display:grid;place-items:center;font-size:48px;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:#777;font-size:13px}.price,.total{font-weight:900}.total{font-size:22px}select,input,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px}button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.gold{background:#b68142;color:#fff}.dark{background:#171411;color:#fff}.green{background:#2f7d50;color:#fff}.err{background:#ffe1de;color:#8d2d27;padding:12px;border-radius:10px}.ok{background:#dff3e5;color:#25633b;padding:12px;border-radius:10px}.hidden{display:none}.item{padding:8px 0;border-bottom:1px solid #eee}.qris{text-align:center}.qrisimg{width:min(420px,100%);border:1px solid #ddd;border-radius:14px}.paytotal{font-size:20px}.paytotal b{font-size:30px}.hint{background:#fff6dd;padding:12px;border-radius:10px;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}</style></head><body><header class="head"><div class="wrap"><div class="brand">ISSHO CAFE</div><div class="sub">MENU & ONLINE ORDER</div></div></header><main class="wrap"><div id="load" class="card">Menghubungkan ke Issho Cafe...</div><div id="app" class="hidden"><div class="card hero"><div style="font-size:12px;opacity:.7">DINE IN</div><h2 id="tn">Meja 01</h2><select id="ts"></select></div><div id="menu" class="grid"></div><div class="card"><h3>Keranjang</h3><div id="cart"></div><div class="row"><b>Total</b><span class="total" id="tot">Rp0</span></div><textarea id="note" rows="2" placeholder="Catatan pesanan"></textarea><div class="actions"><button class="gold" onclick="place('QRIS')">Pesan & QRIS</button><button class="dark" onclick="place('CASH')">Pesan & Tunai</button></div><div id="result"></div></div><div id="qrisbox" class="hidden"></div></div></main><script>const URL='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',BUCKET='payment-proofs';let tables=[],products=[],cart=[],tableId=null;const $=x=>document.getElementById(x),money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){const h=Object.assign({apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},opt.headers||{}),r=await fetch(URL+path,Object.assign({},opt,{headers:h})),t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}function key(v){return String(v??'').trim().replace(/^meja\s*/i,'').padStart(2,'0')}async function start(){try{[tables,products]=await Promise.all([api('/rest/v1/tables?select=id,table_number,name,qr_slug&active=eq.true&order=table_number'),api('/rest/v1/products?select=id,name,description,price,image_url&active=eq.true&order=sort_order,name')]);const qp=new URLSearchParams(location.search).get('table'),q=key(qp),t=tables.find(x=>x.qr_slug===qp)||tables.find(x=>key(x.table_number)===q)||tables[0];if(!t)throw Error('Belum ada meja aktif.');tableId=t.id;$('ts').innerHTML=tables.map(x=>`<option value="${x.id}" ${x.id===tableId?'selected':''}>${esc(x.name)}</option>`).join('');$('ts').onchange=e=>{tableId=e.target.value;$('tn').textContent=tables.find(x=>x.id===tableId).name};$('tn').textContent=t.name;$('menu').innerHTML=products.map(p=>`<div class="menu"><div class="pic">${p.image_url?`<img src="${esc(p.image_url)}">`:'☕'}</div><div class="muted">ISSHO CAFE</div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.description||'')}</div><div class="row"><b class="price">${money(p.price)}</b><button class="gold" onclick="add('${p.id}')">Tambah</button></div></div>`).join('');renderCart();$('load').className='hidden';$('app').className=''}catch(e){$('load').innerHTML=`<b>Koneksi gagal</b><div class="err">${esc(e.message)}</div><button class="gold" onclick="start()">Coba lagi</button>`}}function add(id){const x=cart.find(a=>a.id===id);x?x.qty++:cart.push({id,qty:1});renderCart()}function ch(id,d){const x=cart.find(a=>a.id===id);if(!x)return;x.qty+=d;if(x.qty<1)cart=cart.filter(a=>a.id!==id);renderCart()}function renderCart(){let total=0;$('cart').innerHTML=cart.length?cart.map(x=>{const p=products.find(a=>a.id===x.id);total+=p.price*x.qty;return `<div class="row item"><span>${esc(p.name)}<br><small>${money(p.price)}</small></span><span><button onclick="ch('${x.id}',-1)">−</button> ${x.qty} <button onclick="ch('${x.id}',1)">+</button></span></div>`}).join(''):'Keranjang masih kosong.';$('tot').textContent=money(total)}function showQRIS(id,total){$('qrisbox').className='card qris';$('qrisbox').innerHTML=`<h2>PEMBAYARAN QRIS</h2><p>Scan QRIS ISSHO CAFE.</p><img class="qrisimg" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAcgAAAHIAQAAAADi2kdHAAADmUlEQVR42u1cwW5cQQizq/7/L7sHMENuVU881ZGyWWUfFyPAeDxL4R9/fiGRiUxkIhOZyP81EpI0b9FvBQiChH4D7Y8hScH2YuRv5w8gIAogBIBivVAQQIH7yWB7OZ8gnMT6A4CVXaevEjxPBtvT+XQfJVjt1yXa9VrJVLD9WKQEEiBIEKxy1AzUIPSR+nyNVSAogF2b3WZVtbpqNNjejSTJSqa45mnPShMi8D0ZbA/X56whlcritJ3SJkVc9DbYHo+ciVnZk8SuxTdYnelgezqSWu8oyv+p1M4v1iYTbO/Pz1pO2MJBSwskunJnDSVdtsH2eKTXkpc39fbZFNcTtTbUYHs4Uk1yS1CojaWXTjXHXUQp9Xl7ftK81RLuqHqWbSH342G5wfZspLxXSp6TQ4rwlCE35NTn8f2TzWw7a1zFCogQVcctzZpSn8f1hNkst2jQOZRTqGnRVLC9zocEidYWKsfdXL2TsphtC7rB9jIfMtUR3/bi4Un90B6c3mB7t9+CZrY+8py0dhsWe7DKJ6TB9mw+fUDmGdoHKoT4BD61ZOSCDbZ3+a06hwJfRY5cJHMjAWNCCbaH67MpblVgC3uLGPWxC9jsNvPz+r4yTiHKO+dofJb+2ugXfegDkXYf1Hrirtu548hD40gJtqcjNfI7JI6oMErunGOPsSjYHt4/sdNVDIj7IfVsXUJDsL0dqfZqsqrVMvyTiMonr6fYB9u7+pBlvGK3c+thiUUYX7UXlmB7eV+pE5S2nOAZTJYIH2w/Famyl2j88FR3YHJsm3jTNtje7bdzymn5vVQ9LsFoGm30oQ/w27Ei1Mubp76UZIar6EMfqs/JbOu1jwKNypD7K/f5UGkHrkgfhY4mZCu1tp062B7ut1V5KpS9sY5l3W1c9lYQ2lK9P1s7J7m2e7P7b9u8pK5+f5K7d3Q8r8Gv1fYQw0AAAAASUVORK5CYII=" style="max-width:100%"><div class="paytotal">Total: <b>${money(total)}</b></div><div class="hint">Setelah membayar, upload bukti pembayaran. Kasir akan memeriksa sebelum order diproses.</div><input id="proof" type="file" accept="image/jpeg,image/png,image/webp"><div class="actions"><button class="green" onclick="uploadProof('${id}')">Upload Bukti Pembayaran</button></div><div id="proofmsg"></div>`}async function uploadProof(id){const f=$('proof').files[0];if(!f)return $('proofmsg').innerHTML='<div class="err">Pilih foto bukti.</div>';if(f.size>5*1024*1024)return $('proofmsg').innerHTML='<div class="err">Maksimal 5 MB.</div>';try{const path=id+'/'+crypto.randomUUID()+'.'+(f.type.split('/')[1]||'jpg'),r=await fetch(`${URL}/storage/v1/object/${BUCKET}/${path}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':f.type},body:f});if(!r.ok)throw Error(await r.text());await api('/rest/v1/rpc/submit_payment_proof',{method:'POST',body:JSON.stringify({p_order_id:id,p_proof_url:`${URL}/storage/v1/object/public/${BUCKET}/${path}`})});$('proofmsg').innerHTML='<div class="ok"><b>Bukti berhasil dikirim.</b><br>Kasir akan memeriksa pembayaran.</div>';$('proof').disabled=true}catch(e){$('proofmsg').innerHTML=`<div class="err">Upload gagal: ${esc(e.message)}</div>`}}async function place(method){if(!cart.length)return alert('Keranjang masih kosong.');try{const d=await api('/rest/v1/rpc/create_customer_order',{method:'POST',body:JSON.stringify({p_table_id:tableId,p_payment_method:method,p_items:cart.map(x=>({product_id:x.id,quantity:x.qty})),p_note:$('note').value||null})});cart=[];$('note').value='';renderCart();$('result').className='ok';$('result').innerHTML=`<h3>Pesanan berhasil</h3><p>Nomor: <b>${esc(d.order_number)}</b></p><p>Total: <b>${money(d.total)}</b></p>`;method==='QRIS'?showQRIS(d.id,d.total):$('result').innerHTML+='<p>Silakan bayar tunai di kasir.</p>'}catch(e){$('result').className='err';$('result').textContent=e.message}}start()</script></body></html>
