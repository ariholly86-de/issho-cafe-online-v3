<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate"><meta http-equiv="Pragma"><meta http-equiv="Expires" content="0">
<title>ISSHO CAFE — Menu Pelanggan</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080909}iframe{width:100%;height:100%;border:0;display:block;visibility:hidden}</style>
</head>
<body>
<iframe id="app" title="ISSHO CAFE Menu Pelanggan"></iframe>
<script>
const f=document.getElementById('app');
const qs=new URLSearchParams(location.search);
const src=new URL('customer-ui-v6.html?v=20260904-no-flicker-final2',location.href);
if(qs.get('table'))src.searchParams.set('table',qs.get('table'));
if(location.hash)src.hash=location.hash.slice(1);
f.src=src.toString();

/* CUSTOMER ONLY: prepare the catalog while the iframe is hidden. Once the
   first complete catalog is ready, reveal it once. No visible loading/reflow. */
function stopCatalogIntervals(win){
  if(!win||win.__isshoCatalogIntervalsStopped)return;
  try{
    win.__isshoCatalogIntervalsStopped=true;
    for(let i=1;i<10000;i++){
      try{win.clearInterval(i);}catch(e){}
    }
  }catch(e){}
}

function install(doc,win){
  if(!doc||!doc.body)return false;
  const scan=()=>{
    doc.querySelectorAll('#menu .menu').forEach(menu=>{
      menu.style.setProperty('min-height','0','important');
      menu.style.setProperty('height','auto','important');
      menu.style.setProperty('padding','10px','important');
      menu.style.setProperty('display','flex','important');
      menu.style.setProperty('flex-direction','column','important');
      menu.style.setProperty('transition','none','important');
      menu.style.setProperty('animation','none','important');
      menu.style.setProperty('transform','none','important');
      const photo=menu.querySelector(':scope > .photo');
      if(photo){
        const mobile=win&&win.innerWidth<=600;
        const h=mobile?'105px':'140px';
        photo.style.setProperty('height',h,'important');
        photo.style.setProperty('min-height',h,'important');
        photo.style.setProperty('max-height',h,'important');
        photo.style.setProperty('width','100%','important');
        photo.style.setProperty('margin-bottom',mobile?'4px':'5px','important');
        photo.style.setProperty('overflow','hidden','important');
        photo.style.setProperty('padding','0','important');
        photo.style.setProperty('display','grid','important');
        photo.style.setProperty('place-items','center','important');
        photo.style.setProperty('transition','none','important');
        photo.style.setProperty('animation','none','important');
      }
      const title=menu.querySelector(':scope > h3');
      if(title){
        title.style.setProperty('font-family','Arial, sans-serif','important');
        title.style.setProperty('margin','2px 0 2px','important');
        title.style.setProperty('padding','0','important');
        title.style.setProperty('line-height','1.15','important');
        title.style.setProperty('font-size','12px','important');
        title.style.setProperty('font-weight','500','important');
        title.style.setProperty('min-height','0','important');
      }
      const desc=menu.querySelector(':scope > .muted');
      if(desc){
        desc.style.setProperty('display','none','important');
        desc.style.setProperty('height','0','important');
        desc.style.setProperty('min-height','0','important');
        desc.style.setProperty('margin','0','important');
        desc.style.setProperty('padding','0','important');
      }
      const row=menu.querySelector(':scope > .row');
      if(row){
        row.style.setProperty('margin-top','1px','important');
        row.style.setProperty('margin-bottom','0','important');
        row.style.setProperty('padding-top','0','important');
        row.style.setProperty('flex','0 0 auto','important');
        row.style.setProperty('align-items','center','important');
      }
      const price=menu.querySelector(':scope > .row .price, :scope > .price');
      if(price){
        price.style.setProperty('font-family','Arial, sans-serif','important');
        price.style.setProperty('font-size','13px','important');
        price.style.setProperty('font-weight','600','important');
        price.style.setProperty('line-height','16px','important');
      }
    });
    doc.querySelectorAll('#menu .photo img').forEach(img=>{
      img.style.setProperty('width','100%','important');
      img.style.setProperty('height','100%','important');
      img.style.setProperty('max-width','100%','important');
      img.style.setProperty('max-height','100%','important');
      img.style.setProperty('object-fit','contain','important');
      img.style.setProperty('display','block','important');
      img.style.setProperty('transition','none','important');
      img.style.setProperty('animation','none','important');
      const name=(img.getAttribute('alt')||'').toLowerCase();
      img.style.setProperty('transform',name.includes('steak')?'scale(1.35)':'none','important');
      img.style.setProperty('transform-origin','center center','important');
      img.setAttribute('width','500');
      img.setAttribute('height','500');
      img.setAttribute('decoding','sync');
      img.setAttribute('loading','eager');
    });
  };
  scan();
  const menu=doc.getElementById('menu');
  if(menu){
    /* Only the deepest catalog document is allowed to have its intervals
       cleared. Parent wrappers have timers used by the payment popup. */
    stopCatalogIntervals(win);
    if(!doc.documentElement.dataset.isshoMenuLayoutFinal){
      doc.documentElement.dataset.isshoMenuLayoutFinal='1';
      new MutationObserver(scan).observe(menu,{childList:true,subtree:true});
    }
  }
  return !!menu&&menu.children.length>0;
}

function imagesReady(doc){
  if(!doc)return false;
  const menu=doc.getElementById('menu');
  if(!menu||!menu.children.length)return false;
  const images=[...menu.querySelectorAll('.photo img')];
  return images.length>0&&images.every(img=>img.complete&&img.naturalWidth>0);
}

function walk(doc,win,depth=0){
  if(!doc||depth>8)return false;
  let ready=false;
  try{
    if(doc.getElementById('menu')){
      install(doc,win);
      ready=imagesReady(doc);
    }
    doc.querySelectorAll('iframe').forEach(fr=>{
      try{
        if(fr.contentDocument)ready=walk(fr.contentDocument,fr.contentWindow,depth+1)||ready;
        fr.addEventListener('load',()=>walk(fr.contentDocument,fr.contentWindow,depth+1),{once:true});
      }catch(e){}
    });
  }catch(e){}
  return ready;
}

function revealIfReady(){
  if(f.style.visibility==='visible')return true;
  if(walk(f.contentDocument,f.contentWindow)){
    f.style.visibility='visible';
    return true;
  }
  return false;
}

f.addEventListener('load',()=>{
  revealIfReady();
  const t=setInterval(()=>{if(revealIfReady())clearInterval(t)},200);
  setTimeout(()=>{
    clearInterval(t);
    if(f.style.visibility!=='visible')f.style.visibility='visible';
  },15000);
});
</script>
</body>
</html>
