<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — Menu Pelanggan</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" title="ISSHO CAFE"></iframe><script>
const SUPA='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',frame=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>\\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[m]))}
async function get(path){const r=await fetch(SUPA+path,{cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error(await r.text());return r.json()}
function tableKey(v){return String(v??'').trim().replace(/^meja\\s*/i,'').padStart(2,'0')}
async function sync(){try{
 const w=frame.contentWindow;if(!w||!w.document||!w.api)return;
 const[cats,productsAll,tables]=await Promise.all([
  get('/rest/v1/categories?select=id,name,active,sort_order&active=eq.true&order=sort_order,name'),
  get('/rest/v1/products?select=id,category_id,name,description,price,image_url,sort_order,active&active=eq.true&order=sort_order,name'),
  get('/rest/v1/tables?select=id,table_number,name,qr_slug&active=eq.true&order=table_number')
 ]);
 const products=(productsAll||[]).filter(p=>p.active===true&&typeof p.image_url==='string'&&p.image_url.trim()!=='');
 const populated=(cats||[]).filter(c=>products.some(p=>p.category_id===c.id));
 if(!populated.length)throw Error('Belum ada kategori yang memiliki menu bergambar aktif.');
 const map=Object.fromEntries((cats||[]).map(c=>[c.id,c.name]));
 w.categories=populated;w.products=products;w.tables=tables||[];w.category=p=>map[p.category_id]||'Tanpa Kategori';
 let old=w.activeCat||'';w.activeCat=populated.some(c=>c.name===old)?old:populated[0].name;
 const qp=new URLSearchParams(location.search).get('table'),q=tableKey(qp),t=(tables||[]).find(x=>x.qr_slug===qp)||(tables||[]).find(x=>tableKey(x.table_number)===q)||(tables||[])[0];
 if(!t)throw Error('Belum ada meja aktif.');w.tableId=t.id;
 const ts=w.document.getElementById('ts');if(ts){ts.innerHTML=(tables||[]).map(x=>'<option value="'+x.id+'" '+(x.id===t.id?'selected':'')+'>'+esc(x.name)+'</option>').join('');ts.onchange=e=>{w.tableId=e.target.value;const tt=(tables||[]).find(x=>x.id===w.tableId);if(tt)w.document.getElementById('tn').textContent=tt.name}}
 const tn=w.document.getElementById('tn');if(tn)tn.textContent=t.name;
 w.setActiveCategory=function(name){w.activeCat=name;w.renderCats();w.renderMenu()};
 w.renderCats=function(){const e=w.document.getElementById('cats');if(!e)return;const a=w.activeCat||populated[0].name;e.innerHTML=populated.map(c=>'<button type="button" class="cat '+(a===c.name?'active':'')+'" onclick="setActiveCategory('+JSON.stringify(c.name)+')">'+esc(c.name)+'</button>').join('')};
 w.renderMenu=function(){const q=(w.document.getElementById('search')?.value||'').trim().toLowerCase(),a=w.activeCat||populated[0].name,list=products.filter(p=>map[p.category_id]===a&&(!q||(p.name+' '+(p.description||'')+' '+a).toLowerCase().includes(q)));const count=w.document.getElementById('count');if(count)count.textContent=a+' • '+list.length+' menu tersedia';const menu=w.document.getElementById('menu');if(!menu)return;menu.innerHTML=list.length?list.map(p=>'<div class="menu"><div class="photo" style="background-image:url(\\''+esc(p.image_url)+'\\')"></div><span class="tag">'+esc(a)+'</span><h3>'+esc(p.name)+'</h3><div class="muted">'+esc(p.description||'')+'</div><div class="row" style="margin-top:auto"><b class="price">'+w.money(p.price)+'</b><button class="gold" onclick="add(\\''+p.id+'\\')">Tambah</button></div></div>').join(''):'<div class="card">Belum ada menu aktif bergambar pada kategori <b>'+esc(a)+'</b>.</div>'};
 w.renderCats();w.renderMenu();if(typeof w.renderCart==='function')w.renderCart();
 const load=w.document.getElementById('load'),app=w.document.getElementById('app');if(load)load.className='hidden';if(app)app.className='';
 }catch(e){console.error('Customer menu sync:',e)}}
frame.src='customer-v2.html?v=customer-category-final-20260823-2'+location.search+location.hash;
frame.addEventListener('load',()=>{let n=0;const wait=()=>{try{if(frame.contentDocument?.getElementById('cats')&&frame.contentWindow?.api){sync();setInterval(sync,3000);return}}catch(e){}if(n++<100)setTimeout(wait,100)};wait()});
</script></body></html>
