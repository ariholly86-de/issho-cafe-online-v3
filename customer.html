<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>ISSHO CAFE — Menu Pelanggan</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080909}iframe{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="app" title="ISSHO CAFE Menu Pelanggan"></iframe>
<script>
const f=document.getElementById('app');
const qs=new URLSearchParams(location.search);
const src=new URL('customer-ui-v6.html?v=20260904-image-fix-final',location.href);
if(qs.get('table'))src.searchParams.set('table',qs.get('table'));
if(location.hash)src.hash=location.hash.slice(1);
f.src=src.toString();

/* FINAL CUSTOMER IMAGE FIX
   Walk through every same-origin iframe until the real menu document is found.
   The source image is converted to 500x500 JPEG quality 85 when possible,
   while the visible menu photo area stays compact. */
function normalizeImage(img, win){
  try{
    if(!img||!img.src||img.dataset.imageFixed==='1')return;
    const src=img.currentSrc||img.src;
    if(!src)return;
    img.dataset.imageFixed='1';
    img.style.setProperty('width','100%','important');
    img.style.setProperty('height','100%','important');
    img.style.setProperty('max-width','100%','important');
    img.style.setProperty('max-height','100%','important');
    img.style.setProperty('object-fit','contain','important');
    img.style.setProperty('display','block','important');
    const run=async()=>{
      try{
        const res=await fetch(src,{mode:'cors',cache:'no-store'});
        if(!res.ok)throw new Error('image fetch '+res.status);
        const blob=await res.blob();
        const bmp=await createImageBitmap(blob);
        const canvas=document.createElement('canvas');
        canvas.width=500;canvas.height=500;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#000';ctx.fillRect(0,0,500,500);
        const scale=Math.min(500/bmp.width,500/bmp.height);
        const w=Math.max(1,Math.round(bmp.width*scale));
        const h=Math.max(1,Math.round(bmp.height*scale));
        ctx.drawImage(bmp,Math.round((500-w)/2),Math.round((500-h)/2),w,h);
        bmp.close();
        const out=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('toBlob failed')),'image/jpeg',0.85));
        const old=img.src;
        img.src=URL.createObjectURL(out);
        if(old.startsWith('blob:'))setTimeout(()=>URL.revokeObjectURL(old),1000);
      }catch(e){/* original image remains; compact CSS still applies */}
    };
    if(img.complete&&img.naturalWidth)run();
    else img.addEventListener('load',run,{once:true});
  }catch(e){}
}

function installImageStandard(doc,win){
  if(!doc||!doc.body)return false;
  const scan=()=>{
    const photos=doc.querySelectorAll('#menu .photo');
    photos.forEach(photo=>{
      const compact=win&&win.innerWidth<=600;
      photo.style.setProperty('height',compact?'88px':'105px','important');
      photo.style.setProperty('min-height',compact?'88px':'105px','important');
      photo.style.setProperty('max-height',compact?'88px':'105px','important');
      photo.style.setProperty('width','100%','important');
      photo.style.setProperty('overflow','hidden','important');
      photo.style.setProperty('display','grid','important');
      photo.style.setProperty('place-items','center','important');
      photo.style.setProperty('padding','0','important');
      photo.style.setProperty('box-sizing','border-box','important');
    });
    doc.querySelectorAll('#menu .photo img').forEach(img=>normalizeImage(img,win));
  };
  scan();
  const menu=doc.getElementById('menu');
  if(menu&&!doc.documentElement.dataset.isshoImageStandardFinal){
    doc.documentElement.dataset.isshoImageStandardFinal='1';
    new MutationObserver(scan).observe(menu,{childList:true,subtree:true});
  }
  return !!menu;
}

function walk(doc,win,depth){
  if(!doc||depth>8)return false;
  let found=false;
  try{
    if(doc.querySelector('#menu .photo img')||doc.getElementById('menu')){
      if(installImageStandard(doc,win))found=true;
    }
    doc.querySelectorAll('iframe').forEach(frame=>{
      try{
        if(frame.contentDocument)walk(frame.contentDocument,frame.contentWindow,depth+1);
        frame.addEventListener('load',()=>walk(frame.contentDocument,frame.contentWindow,depth+1),{once:true});
      }catch(e){}
    });
  }catch(e){}
  return found;
}

function install(){
  try{
    const d=f.contentDocument;
    if(!d)return false;
    return walk(d,f.contentWindow,0);
  }catch(e){return false}
}

f.addEventListener('load',()=>{
  install();
  const timer=setInterval(()=>install(),500);
  setTimeout(()=>clearInterval(timer),30000);
});
</script>
</body>
</html>
