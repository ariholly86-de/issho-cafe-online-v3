<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" title="ISSHO CAFE"></iframe><script>
const SUPA='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',frame=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>\\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[m]))}
async function getCategories(){const r=await fetch(SUPA+'/rest/v1/categories?select=id,name,active,sort_order&active=eq.true&order=sort_order,name',{cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error(await r.text());return await r.json()}
async function syncCustomer(){try{const w=frame.contentWindow;if(!w||!w.document)return;const rows=await getCategories();const allProducts=await w.api('/rest/v1/products?select=id,category_id,name,description,price,image_url,sort_order,active&active=eq.true&order=sort_order,name');const products=allProducts.filter(p=>p.active===true&&typeof p.image_url==='string'&&p.image_url.trim()!=='');const map=Object.fromEntries(rows.map(c=>[c.id,c.name]));w.__DB_CATEGORIES=rows;w.__DB_CATEGORY_MAP=map;try{w.eval('products='+JSON.stringify(products))}catch(e){w.products=products}w.category=function(p){return map[p.category_id]||'Tanpa Kategori'};
w.renderCats=function(){const el=w.document.getElementById('cats');if(!el)return;const current=w.eval('typeof activeCat!==\"undefined\"?activeCat:\"\"')||'';el.innerHTML=rows.map(c=>'<button class="cat '+(current===c.name?'active':'')+'" onclick="activeCat='+JSON.stringify(c.name)+';renderCats();renderMenu()">'+esc(c.name)+'</button>').join('')};
w.renderMenu=function(){const q=(w.document.getElementById('search')?.value||'').trim().toLowerCase();const current=w.eval('typeof activeCat!==\"undefined\"?activeCat:\"\"')||'';const list=products.filter(p=>(!current||w.category(p)===current)&&(!q||(p.name+' '+(p.description||'')+' '+w.category(p)).toLowerCase().includes(q)));if(w.document.getElementById('count'))w.document.getElementById('count').textContent='Menampilkan '+list.length+' dari '+products.length+' menu aktif + bergambar';w.document.getElementById('menu').innerHTML=list.length?list.map(p=>'<div class="menu"><div class="photo" style="background-image:url(\''+esc(p.image_url)+'\')"></div><span class="tag">'+esc(w.category(p))+'</span><h3>'+esc(p.name)+'</h3><div class="muted">'+esc(p.description||'')+'</div><div class="row" style="margin-top:auto"><b class="price">'+w.money(p.price)+'</b><button class="gold" onclick="add(\''+p.id+'\')">Tambah</button></div></div>').join(''):'<div class="card">Belum ada menu aktif bergambar pada kategori <b>'+esc(current||'ini')+'</b>.</div>'};
if(!rows.length)return;const old=w.eval('typeof activeCat!==\"undefined\"?activeCat:\"\"')||'';const current=rows.some(c=>c.name===old)?old:rows[0].name;try{w.eval('activeCat='+JSON.stringify(current))}catch(e){w.activeCat=current}w.renderCats();w.renderMenu();
}catch(e){console.error('Customer category sync',e)}}
frame.src='customer-v3.html?v=catfix20260823b'+location.search+location.hash;frame.addEventListener('load',()=>{syncCustomer();setInterval(syncCustomer,3000)});
</script></body></html>
