</style></head><body><header class="head"><div class="wrap"><div class="brand">ISSHO CAFE</div><div class="sub">MENU & ONLINE ORDER • 108 MENU AKTIF</div></div></header><main class="wrap"><div id="load" class="card">Menghubungkan ke Issho Cafe...</div><div id="app" class="hidden"><div class="card hero"><div style="font-size:12px;opacity:.7">DINE IN</div><h2 id="tn">Meja 01</h2><select id="ts"></select><div style="font-size:12px;margin-top:7px;color:#ddd">QR meja akan mengisi nomor meja otomatis.</div></div><div class="tools"><input id="search" class="search" placeholder="🔎 Cari menu..." oninput="renderMenu()"><div id="cats" class="cats"></div><div id="count" class="count"></div></div><div id="menu" class="grid"></div><div class="card"><h3>Keranjang</h3><div id="cart"></div><div class="row"><b>Total</b><span class="total" id="tot">Rp0</span></div><textarea id="note" rows="2" placeholder="Catatan pesanan"></textarea><div class="actions"><button class="gold" onclick="place('QRIS')">Pesan & QRIS</button><button class="dark" onclick="place('CASH')">Pesan & Tunai</button></div><div id="result"></div></div><div id="qrisbox" class="hidden"></div></div></main><script>const URL='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',BUCKET='payment-proofs';let tables=[],products=[],cart=[],tableId=null,activeCat='Semua';const $=x=>document.getElementById(x),money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){const h=Object.assign({apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},opt.headers||{}),r=await fetch(URL+path,Object.assign({},opt,{headers:h})),t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}function key(v){return String(v??'').trim().replace(/^meja\s*/i,'').padStart(2,'0')}function category(p){const n=(p.name+' '+(p.description||'')).toLowerCase();if(n.includes('seblak'))return'Seblak';if(n.includes('steak'))return'Steak Ayam';if(n.includes('nasi goreng'))return'Nasi Goreng';if(n.startsWith('nasi ')||n.includes('nasi '))return'Aneka Nasi';if(n.includes('mie ' )||n.startsWith('mie')||n.includes('mie('))return'Aneka Mie';if(['jahe','sere','uwuh','telang','kunir','secang','rempah','tape singkong'].some(x=>n.includes(x)))return'Wedangan';if(['beef','bola lobster','bola udang','crabstick','dumpling','hokaido','kornet','otak-otak','sate bakso','siomay','sosis','sukoi','tahu bakso'].some(x=>n.includes(x)))return'Aneka Bakaran';if(n.includes('dimsum'))return'Aneka Dimsum';if(['juice','minuman','soda','kopi','americano','matcha','es teh'].some(x=>n.includes(x)))return'Aneka Minuman';return'Aneka Camilan'}function renderCats(){const cats=['Semua','Aneka Nasi','Nasi Goreng','Aneka Mie','Seblak','Steak Ayam','Aneka Camilan','Aneka Bakaran','Aneka Dimsum','Aneka Minuman','Wedangan'];$('cats').innerHTML=cats.map(c=>`<button class="cat ${activeCat===c?'active':''}" onclick="activeCat='${c}';renderCats();renderMenu()">${c}</button>`).join('')}function renderMenu(){const q=($('search').value||'').trim().toLowerCase();const list=products.filter(p=>(activeCat==='Semua'||category(p)===activeCat)&&(!q||(p.name+' '+(p.description||'')).toLowerCase().includes(q)));$('count').textContent=`Menampilkan ${list.length} dari ${products.length} menu`;$('menu').innerHTML=list.length?list.map(p=>`<div class="menu"><div class="pic">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:'🍽️'}</div><span class="tag">${category(p)}</span><div class="muted">ISSHO CAFE</div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.description||'')}</div><div class="row" style="margin-top:auto"><b class="price">${money(p.price)}</b><button class="gold" onclick="add('${p.id}')">Tambah</button></div></div>`).join(''):`<div class="empty">Menu tidak ditemukan.</div>`}async
