<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>ISSHO CAFE — Menu Pelanggan</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" title="ISSHO CAFE Menu Pelanggan"></iframe><script>const f=document.getElementById('app');const qs=new URLSearchParams(location.search);const table=qs.get('table')||'';const menuOnline=table==='menu-online';const src=new URL('customer-live-fixed.html?v=20260828-menu-frame-universal-141-v11',location.href);if(table)src.searchParams.set('table',table);if(location.hash)src.hash=location.hash.slice(1);f.src=src.toString();f.addEventListener('load',()=>{try{const d=f.contentDocument||f.contentWindow.document;if(!d||!d.head)return;const s=d.createElement('style');s.textContent='.menu .photo{width:100%!important;height:140px!important;min-height:140px!important;max-height:140px!important;margin:0 auto 58px!important;display:flex!important;align-items:center!important;justify-content:center!important;overflow:hidden!important;flex:0 0 140px!important;box-sizing:border-box!important}.menu .photo img{width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;object-fit:contain!important;object-position:center!important;display:block!important;margin:auto!important}.menu h3{margin:0 0 10px!important;position:relative!important;z-index:5!important}.menu .row{position:relative!important;z-index:10!important;visibility:visible!important;opacity:1!important}.menu .row .price{display:block!important;visibility:visible!important;opacity:1!important}.menu .photo::before,.menu .photo::after{content:none!important}@media(max-width:600px){.menu .photo{width:100%!important;height:140px!important;min-height:140px!important;max-height:140px!important;flex-basis:140px!important;margin-bottom:58px!important}.menu .photo img{width:100%!important;height:100%!important;object-fit:contain!important}}';d.head.appendChild(s);if(menuOnline){const style=d.createElement('style');style.textContent='#menuOnlineGuide{display:block!important;background:#3b301c;color:#ffe8b2;padding:12px;border-radius:10px;margin:10px 0;font-size:13px;line-height:1.5}#ts{border:2px solid #b68142!important}';d.head.appendChild(style);const hero=d.querySelector('.hero');if(hero){const guide=d.createElement('div');guide.id='menuOnlineGuide';guide.innerHTML='<b>🛎️ PESAN TANPA ANTRE DI KASIR</b><br>Pilih nomor meja Anda terlebih dahulu. Setelah pesanan dibuat, nomor invoice dan WhatsApp digunakan untuk pemberitahuan status pesanan sampai makanan siap.';hero.insertBefore(guide,hero.querySelector('#ts'));}const select=d.getElementById('ts');const buttons=d.querySelectorAll('#qrisBtn,#cashBtn');let chosen=false;if(select){select.selectedIndex=-1;const tn=d.getElementById('tn');if(tn)tn.textContent='Pilih Nomor Meja';const guard=()=>{chosen=!!select.value;buttons.forEach(b=>b.disabled=!chosen);if(tn)tn.textContent=chosen?(Array.from(select.options).find(o=>o.value===select.value)?.textContent||'Pilih Nomor Meja'):'Pilih Nomor Meja';};buttons.forEach(b=>{b.disabled=true;b.addEventListener('click',e=>{if(!chosen){e.preventDefault();e.stopImmediatePropagation();alert('Silakan pilih nomor meja terlebih dahulu.');}},true)});select.addEventListener('change',guard);guard();}}}catch(e){}});</script></body></html>
