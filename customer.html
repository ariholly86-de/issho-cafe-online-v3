<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — Menu Pelanggan</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" title="ISSHO CAFE"></iframe><script>const SUPA='https://xvhimyflrqrdudijwjdn.supabase.co',KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',frame=document.getElementById('app');function esc(s){return String(s??'').replace(/[&<>\\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[m]))}async function get(path){const r=await fetch(SUPA+path,{cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error(await r.text());return r.json()}async function sync(){try{const w=frame.contentWindow;if(!w||!w.document||!w.api)return;const[cats,all]=await Promise.all([get('/rest/v1/categories?select=id,name,active,sort_order&active=eq.true&order=sort_order,name'),w.api('/rest/v1/products?select=id,category_id,name,description,price,image_url,sort_order,active&active=eq.true&order=sort_order,name')]);const products=all.filter(p=>p.active&&typeof p.image_url==='string'&&p.image_url.trim()!==''),populated=cats.filter(c=>products.some(p=>p.category_id===c.id));if(!populated.length)return;const map=Object.fromEntries(cats.map(c=>[c.id,c.name]));w.products=products;w.category=p=>map[p.category_id]||'Tanpa Kategori';w.setActiveCategory=function(name){w.eval('activeCat='+JSON.stringify(name));w.renderCats();w.renderMenu()};let old='';try{old=w.eval('typeof activeCat!=="undefined"?activeCat:""')}catch(e){}const current=populated.some(c=>c.name===old)?old:populated[0].name;w.eval('activeCat='+JSON.stringify(current));w.renderCats=function(){const e=w.document.getElementById('cats');if(!e)return;const a=w.eval('typeof activeCat!=="undefined"?activeCat:""');e.innerHTML=populated.map(c=>'<button class="cat '+(a===c.name?'active':'')+'" onclick="setActiveCategory('+JSON.stringify(c.name)+')">'+esc(c.name)+'</button>').join('')};w.renderMenu=function(){const q=(w.document.getElementById('search')?.value||'').trim().toLowerCase(),a=w.eval('typeof activeCat!=="undefined"?activeCat:""'),list=products.filter(p=>w.category(p)===a&&(!q||(p.name+' '+(p.description||'')+' '+a).toLowerCase().includes(q)));const count=w.document.getElementById('count');if(count)count.textContent=a+' • '+list.length+' menu tersedia';const menu=w.document.getElementById('menu');if(!menu)return;menu.innerHTML=list.length?list.map(p=>'<div class="menu"><div class="photo" style="background-image:url(\''+esc(p.image_url)+'\')"></div><span class="tag">'+esc(a)+'</span><h3>'+esc(p.name)+'</h3><div class="muted">'+esc(p.description||'')+'</div><div class="row" style="margin-top:auto"><b class="price">'+w.money(p.price)+'</b><button class="gold" onclick="add(\''+p.id+'\')">Tambah</button></div></div>').join(''):'<div class="card">Belum ada menu aktif bergambar pada kategori <b>'+esc(a)+'</b>.</div>'};w.renderCats();w.renderMenu()}catch(e){console.error('Customer category sync',e)}}frame.src='customer-v3.html?v=category-click-final-20260823'+location.search+location.hash;frame.addEventListener('load',()=>{let n=0;const wait=()=>{if(frame.contentDocument?.getElementById('cats')&&frame.contentWindow?.api){sync();setInterval(sync,3000)}else if(n++<100)setTimeout(wait,100)};wait()})</script></body></html>
