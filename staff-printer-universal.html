/button></div></div></div><script>const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',f=document.getElementById('kasir'),modal=document.getElementById('waModal'),phone=document.getElementById('waPhone'),info=document.getElementById('waInfo');let pendingOrder=null;async function api(path,opt={}){const h=Object.assign({apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},opt.headers||{}),r=await fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h})),t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}function cleanPhone(v){let s=String(v||'').trim().replace(/[^0-9]/g,'');if(s.startsWith('0'))s='62'+s.slice(1);else if(s.startsWith('8'))s='62'+s;return s}function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}function buildInvoice(o){const items=(o.items||[]).map(i=>`• ${i.name} × ${Number(i.qty||0)} — ${money(Number(i.price||0)*Number(i.qty||0))}`).join('\n');return `*ISSHO CAFE — INVOICE*\n\n*No. Order:* ${o.order_number||'-'}\n*Meja:* ${o.table_name||'Take Away'}\n*Pembayaran:* ${o.payment_method||'-'}\n*Status:* ${o.payment_status||'-'}\n\n*Pesanan:*\n${items||'• -'}\n\n*TOTAL:* ${money(o.total)}\n\nTerima kasih sudah berkunjung ke ISSHO CAFE 🙏`}async function getOrder(orderId){const w=f.contentWindow;let o=(w.ORD||[]).find(x=>String(x.id)===String(orderId));if(o)return o;const p=w.P||sessionStorage.getItem('issho_staff_pin')||localStorage.getItem('issho_staff_pin')||'';if(!p)throw Error('Sesi Kasir tidak ditemukan. Silakan login ulang.');const orders=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:p})});o=(Array.isArray(orders)?orders:[]).find(x=>String(x.id)===String(orderId));if(!o)throw Error('Order tidak ditemukan setelah Refresh.');return o}async function openWhatsApp(orderId){try{pendingOrder=await getOrder(orderId);info.textContent=`Invoice ${pendingOrde tch();setInterval(patch,500)});setInterval(patch,1000);</script></body></html>
