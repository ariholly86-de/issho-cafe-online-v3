<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — KASIR</title><style>html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}#kasir{width:100%;height:100%;border:0;display:block}#printer{position:fixed;right:10px;top:10px;z-index:2147483647;background:#151515;border:1px solid #555;border-radius:12px;padding:10px;box-shadow:0 4px 18px #0008;max-width:520px}#printer button{border:0;border-radius:8px;padding:10px 12px;margin:2px;font-weight:800;cursor:pointer;touch-action:manipulation}#connect{background:#1687f7;color:#fff}#usb{background:#315b9a;color:#fff}#test{background:#d08a24;color:#fff}#diag{background:#b83a32;color:#fff}.ok{color:#9cff9c}.err{color:#ff8b8b}#status,#diagout{display:block;margin-top:7px;font-size:13px;line-height:1.35;white-space:pre-wrap}</style></head><body><div id="printer"><button id="connect" type="button">📶 Hubungkan RPP02N</button><button id="usb" type="button">🔌 Hubungkan Kabel/USB</button><button id="test" type="button">🧾 Test Print</button><button id="diag" type="button">🔎 Periksa Printer</button><span id="status">Printer: RPP02N • ESC/POS 58mm</span><span id="diagout">Memeriksa kemampuan cetak…</span></div><iframe id="kasir" src="staff-v6.html?v=20260825-universal-printer-v3" title="ISSHO CAFE KASIR"></iframe><script>const BR='http://127.0.0.1:9100',f=document.getElementById('kasir'),status=document.getElementById('status'),diagout=document.getElementById('diagout');let serialPort=null,serialWriter=null;const E=s=>new TextEncoder().encode(String(s)),C={init:[27,64],center:[27,97,1],left:[27,97,0],bold:[27,69,1],normal:[27,69,0],cut:[29,86,0]};function msg(s,bad=false){status.textContent=s;status.className=bad?'err':'ok'}async function bridgeFetch(path,opt={}){const r=await fetch(BR+path,{...opt,cache:'no-store'}),t=await r.text();let j;try{j=JSON.parse(t)}catch(_){j={ok:false,error:t}}if(!r.ok||j.ok===false)throw Error(j.error||('Bridge HTTP '+r.status));return j}async function tryBridge(){try{await bridgeFetch('/status');return true}catch(_){return false}}async function connectSerial(){if(!('serial'in navigator))throw Error('Browser tidak mendukung USB/Serial. Gunakan Chrome desktop atau aplikasi Kasir Android.');if(serialPort&&serialPort.writable)return true;serialPort=await navigator.serial.requestPort({});await serialPort.open({baudRate:9600,dataBits:8,stopBits:1,parity:'none',bufferSize:4096,flowControl:'none'});serialWriter=serialPort.writable.getWriter();msg('✓ PRINTER KABEL/USB TERSAMBUNG • siap mencetak');return true}async function sendSerial(bytes){if(!serialWriter)await connectSerial();await serialWriter.write(bytes)}function orderBytes(o){let a=[...C.init,...C.center,...C.bold,...E('ISSHO CAFE'),10,...C.normal,...E('TANDA TERIMA PELANGGAN'),10,...C.left,45,45,45,45,45,45,45,45,45,45,10,...E('Order : '+(o.order_number||'-')),10,...E('Meja  : '+(o.table_name||'Take Away')),10];for(const i of(o.items||[]))a.push(...E(String(i.name||'')+' x'+Number(i.qty||0)),10);a.push(45,45,45,45,45,45,45,45,45,45,10,...C.bold,...E('TOTAL'),10,...C.normal,...E(String(o.total||0)),10,...C.center,...E('Terima kasih'),10,10,10,...C.cut);return new Uint8Array(a)}function browserPrint(o){const w=window.open('','_blank','width=420,height=700');if(!w){alert('Popup printer diblokir. Izinkan popup untuk ISSHO CAFE lalu tekan Print lagi.');return}const items=(o.items||[]).map(i=>'<tr><td>'+esc(i.name)+'</td><td style="text-align:center">'+Number(i.qty||0)+'</td><td style="text-align:right">'+money(i.price*i.qty)+'</td></tr>').join('');w.document.write('<!doctype html><html><head><title>ISSHO CAFE</title><style>@page{size:58mm auto;margin:0}body{width:54mm;margin:0 auto;font:12px monospace;color:#000}h2{text-align:center;margin:4px 0}p{margin:3px 0}table{width:100%;border-collapse:collapse}td{padding:2px 0}hr{border:0;border-top:1px dashed #000}</style></head><body><h2>ISSHO CAFE</h2><p style="text-align:center"><b>TANDA TERIMA PELANGGAN</b></p><hr><p>Order: '+esc(o.order_number||'-')+'</p><p>Meja: '+esc(o.table_name||'Take Away')+'</p><hr><table>'+items+'</table><hr><p style="text-align:right"><b>TOTAL '+money(o.total)+'</b></p><p style="text-align:center">Terima kasih</p></body></html>');w.document.close();w.focus();setTimeout(()=>{w.print();w.close()},250)}function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}async function connectPrinter(){try{if(await tryBridge()){await bridgeFetch('/connect',{method:'POST'});msg('✓ RPP02N TERSAMBUNG • siap mencetak');return}await connectSerial()}catch(e){msg('Belum tersambung: '+e.message,true)}}async function testPrint(){try{if(await tryBridge()){await bridgeFetch('/test',{method:'POST'});msg('✓ TEST PRINT RPP02N BERHASIL');return}if(serialPort&&serialWriter){await sendSerial(new Uint8Array([...C.init,...C.center,...C.bold,...E('ISSHO CAFE'),10,...C.normal,...E('TEST PRINT RPP02N'),10,10,...C.cut]));msg('✓ TEST PRINT KABEL/USB BERHASIL');return}await connectSerial();await sendSerial(new Uint8Array([...C.init,...C.center,...C.bold,...E('ISSHO CAFE'),10,...C.normal,...E('TEST PRINT RPP02N'),10,10,...C.cut]));msg('✓ TEST PRINT KABEL/USB BERHASIL')}catch(e){browserPrint({order_number:'TEST',table_name:'Kasir',items:[{name:'TEST PRINT',qty:1,price:0}],total:0});msg('✓ Test dikirim ke dialog printer sistem')}}async function printOrder(id){try{const w=f.contentWindow,o=(w&&w.ORD||[]).find(x=>String(x.id)===String(id));if(!o)throw Error('Pesanan tidak ditemukan.');if(await tryBridge()){await bridgeFetch('/print',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:orderBytes(o)});msg('✓ Nota pelanggan terkirim');return}if(serialPort&&serialWriter){await sendSerial(orderBytes(o));msg('✓ Nota pelanggan tercetak via kabel/USB');return}await connectSerial();await sendSerial(orderBytes(o));msg('✓ Nota pelanggan tercetak via kabel/USB')}catch(e){browserPrint(o||{order_number:id,items:[],total:0});msg('✓ Nota pelanggan dibuka melalui printer sistem')}}function patch(){try{const w=f.contentWindow,d=w.document,app=d.getElementById('app');if(!app)return false;w.printCustomer=id=>printOrder(id);w.printKitchen=()=>{};const buttons=[...d.querySelectorAll('button')];buttons.forEach(b=>{if(/Print Dapur|Dapur/i.test(b.textContent||'')){b.remove()}});return true}catch(e){return false}}async function diagnostics(){const bridge=await tryBridge(),serial='serial'in navigator;diagout.textContent=(bridge?'✓ Printer RPP02N bridge tersedia\n':'• Bridge tidak tersedia — gunakan kabel/USB\n')+(serial?'✓ Web Serial tersedia\n':'• Web Serial tidak tersedia di browser ini\n')+'Print Pelanggan aktif. Print Dapur dinonaktifkan sesuai permintaan.'}document.getElementById('connect').onclick=connectPrinter;document.getElementById('usb').onclick=async()=>{try{await connectSerial()}catch(e){msg('Koneksi USB gagal: '+e.message,true)}};document.getElementById('test').onclick=testPrint;document.getElementById('diag').onclick=diagnostics;f.addEventListener('load',()=>{patch();setTimeout(patch,300);setTimeout(patch,1000);setInterval(patch,1000);diagnostics()});</script></body></html>
