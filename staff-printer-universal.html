<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — KASIR</title><style>html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}#kasir{width:100%;height:100%;border:0;display:block}.wa-modal{display:none;position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.82);align-items:center;justify-content:center;padding:18px}.wa-box{width:min(520px,94vw);background:#171717;border:3px solid #25D366;border-radius:18px;padding:24px;box-shadow:0 12px 50px #000}.wa-box h2{margin:0 0 8px;font-size:25px}.wa-help{color:#bbb;line-height:1.5;margin:8px 0 18px;white-space:pre-line}.wa-label{display:block;font-weight:900;margin-bottom:8px}.wa-input{width:100%;box-sizing:border-box;padding:15px;border:2px solid #555;border-radius:10px;background:#101010;color:#fff;font-size:20px;outline:none}.wa-input:focus{border-color:#25D366}.wa-example{color:#999;font-size:13px;margin-top:7px}.wa-actions{display:flex;gap:10px;margin-top:18px}.wa-actions button{flex:1;border:0;border-radius:10px;padding:14px;font-weight:900;font-size:16px;cursor:pointer}.wa-send{background:#25D366;color:#07150c}.wa-cancel{background:#333;color:#fff}.wa-row{display:flex!important;gap:8px!important;flex-wrap:wrap!important}.order-date{color:#c9c9c9;font-size:13px;font-weight:700;margin-top:5px}</style></head><body><iframe id="kasir" src="/staff-v6.html?v=20260825-final-wa-invoice-v4" title="ISSHO CAFE KASIR"></iframe><div id="waModal" class="wa-modal"><div class="wa-box"><h2>🟢 Kirim Invoice via WhatsApp</h2><div id="waInfo" class="wa-help">Invoice siap dikirim.</div><label class="wa-label" for="waPhone">📱 Nomor WhatsApp Pelanggan</label><input id="waPhone" class="wa-input" type="tel" inputmode="tel" autocomplete="tel" placeholder="081234567890"><div class="wa-example">Nomor dari pelanggan akan otomatis muncul di sini. Kasir tetap dapat mengoreksi jika diperlukan.<br>Contoh: <b>081234567890</b> atau <b>6281234567890</b>.</div><div class="wa-actions"><button class="wa-cancel" id="waCancel">Batal</button><button class="wa-send" id="waSend">🟢 Buka WhatsApp Web</button></div></div></div><script>const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',f=document.getElementById('kasir'),modal=document.getElementById('waModal'),phone=document.getElementById('waPhone'),info=document.getElementById('waInfo');let pendingOrder=null;async function api(path,opt={}){const h=Object.assign({apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},opt.headers||{}),r=await fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h})),t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}function cleanPhone(v){let s=String(v||'').trim().replace(/[^0-9]/g,'');if(s.startsWith('0'))s='62'+s.slice(1);else if(s.startsWith('8'))s='62'+s;return s}function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}function orderDateTimeFromRef(ref){const m=String(ref||'').match(/^ISS-(\d{6})-(\d{6})-/i);if(!m)return{date:'-',time:'-'};const ds=m[1],ts=m[2],yy=Number(ds.slice(0,2)),mm=Number(ds.slice(2,4)),dd=Number(ds.slice(4,6)),hh=Number(ts.slice(0,2)),mi=Number(ts.slice(2,4)),ss=Number(ts.slice(4,6));return{date:mm>=1&&mm<=12&&dd>=1&&dd<=31?String(dd).padStart(2,'0')+'/'+String(mm).padStart(2,'0')+'/20'+String(yy).padStart(2,'0'):'-',time:hh<=23&&mi<=59&&ss<=59?String(hh).padStart(2,'0')+':'+String(mi).padStart(2,'0')+':'+String(ss).padStart(2,'0'):'-'}}function buildInvoice(o){const dt=orderDateTimeFromRef(o.order_number);const items=(o.items||[]).map(i=>`• ${i.name} × ${Number(i.qty||0)} — ${money(Number(i.price||0)*Number(i.qty||0))}`).join('\n');return `*ISSHO CAFE — INVOICE*\n\n*No. Order:* ${o.order_number||'-'}\n*Tanggal Order:* ${dt.date}\n*Jam Order:* ${dt.time}\n*Meja:* ${o.table_name||'Take Away'}\n*Pembayaran:* ${o.payment_method||'-'}\n*Status:* ${o.payment_status||'-'}\n\n*Pesanan:*\n${items||'• -'}\n\n*TOTAL:* ${money(o.total)}\n\nTerima kasih sudah berkunjung ke ISSHO CAFE 🙏`}function getPin(){const d=f.contentDocument||f.contentWindow.document;const input=d&&d.getElementById('pin');const typed=input?String(input.value||'').trim():'';return typed||sessionStorage.getItem('issho_staff_pin')||localStorage.getItem('issho_staff_pin')||''}async function getOrder(ref){const p=getPin();if(!p)throw Error('Sesi Kasir belum terbaca. Pastikan sudah login Kasir, lalu klik Refresh.');const orders=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:p})});const o=(Array.isArray(orders)?orders:[]).find(x=>String(x.id)===String(ref)||String(x.order_number)===String(ref));if(!o)throw Error('Order belum ditemukan. Klik Refresh pada Pesanan Masuk lalu coba WhatsApp lagi.');return o}async function openWhatsApp(ref){try{pendingOrder=await getOrder(ref);const dt=orderDateTimeFromRef(pendingOrder.order_number);info.textContent=`Order: ${pendingOrder.order_number||'-'}\nTanggal Order: ${dt.date}\nJam Order: ${dt.time}\nMeja: ${pendingOrder.table_name||'Take Away'}\nTotal: ${money(pendingOrder.total)}\n\nNomor WhatsApp dari pelanggan akan digunakan untuk invoice:`;modal.style.display='flex';phone.value=pendingOrder.customer_whatsapp||localStorage.getItem('issho_last_wa_phone')||'';setTimeout(()=>{phone.focus();phone.select()},80)}catch(e){alert('Invoice belum siap: '+e.message)}}window.openWhatsApp=openWhatsApp;document.getElementById('waCancel').onclick=()=>{modal.style.display='none';pendingOrder=null};document.getElementById('waSend').onclick=()=>{const p=cleanPhone(phone.value);if(!/^62\d{8,15}$/.test(p)){alert('Nomor WhatsApp tidak valid. Contoh: 081234567890');phone.focus();return}localStorage.setItem('issho_last_wa_phone',phone.value.trim());const text=buildInvoice(pendingOrder);const url='https://web.whatsapp.com/send?phone='+p+'&text='+encodeURIComponent(text);modal.style.display='none';window.open(url,'_blank','noopener,noreferrer');pendingOrder=null};phone.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('waSend').click();if(e.key==='Escape')document.getElementById('waCancel').click()});function findOrderRef(btn){let el=btn;for(let i=0;i<7&&el;i++,el=el.parentElement){const txt=(el.innerText||el.textContent||'');const m=txt.match(/ISS-\d{6}-\d{6}-[A-Z0-9]+/);if(m)return m[0]}return null}function injectOrderDates(d){try{if(!d||!d.body)return false;d.querySelectorAll('b').forEach(b=>{const ref=String(b.textContent||'').trim();if(!/^ISS-\d{6}-\d{6}-[A-Z0-9]+$/i.test(ref)||b.dataset.orderDateAdded)return;b.dataset.orderDateAdded='1';const dt=orderDateTimeFromRef(ref);const x=d.createElement('div');x.className='order-date';x.textContent='Tanggal Order: '+dt.date+' • Jam Order: '+dt.time;b.insertAdjacentElement('afterend',x)});return true}catch(e){return false}}function patch(){try{const d=f.contentDocument||f.contentWindow.document;if(!d||!d.body)return false;injectOrderDates(d);d.querySelectorAll('button').forEach(b=>{const label=(b.textContent||'').replace(/\s+/g,' ').trim();if(/Print Dapur/i.test(label))b.remove();if(/Print Pelanggan/i.test(label)){b.disabled=false;b.removeAttribute('disabled');b.style.pointerEvents='auto';const parent=b.parentElement;if(parent&&!parent.querySelector('[data-wa-invoice]')){parent.classList.add('wa-row');const ref=findOrderRef(b);if(ref){const wb=d.createElement('button');wb.type='button';wb.dataset.waInvoice='1';wb.textContent='🟢 WhatsApp';wb.title='Kirim invoice ke WhatsApp pelanggan';wb.style.cssText='background:#25D366;color:#07150c;border:0;border-radius:10px;padding:12px 18px;font-weight:900;font-size:16px;cursor:pointer;pointer-events:auto;display:inline-block;';wb.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();window.openWhatsApp(ref)});parent.appendChild(wb)}}}});return true}catch(e){return false}}f.addEventListener('load',()=>{setTimeout(patch,300);setInterval(patch,700)});setInterval(patch,1200);</script></body></html>
