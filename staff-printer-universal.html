dikirim.</div><label class="wa-label" for="waPhone">📱 Nomor WhatsApp Pelanggan</label><input id="waPhone" class="wa-input" type="tel" inputmode="tel" autocomplete="tel" placeholder="081234567890"><div class="wa-example">Nomor dari pelanggan akan otomatis muncul di sini. Kasir tetap dapat mengoreksi jika diperlukan.<br>Contoh: <b>081234567890</b> atau <b>6281234567890</b>.</div><div class="wa-actions"><button class="wa-cancel" id="waCancel">Batal</button><button class="wa-send" id="waSend">🟢 Buka WhatsApp Web</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',f=document.getElementById('kasir'),modal=document.getElementById('waModal'),phone=document.getElementById('waPhone'),info=document.getElementById('waInfo');let pendingOrder=null,orderCache=new Map(),rt=null,refreshTimer=null,patchTimer=null;async function api(path,opt={}){const h=Object.assign({apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},opt.headers||{}),r=await fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h})),t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}function cleanPhone(v){let s=String(v||'').trim().replace(/[^0-9]/g,'');if(s.startsWith('0'))s='62'+s.slice(1);else if(s.startsWith('8'))s='62'+s;return s}function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}function fromRef(ref){const m=String(ref||'').match(/^ISS-(\d{6})-(\d{6})-/i);if(!m)return{date:'-',time:'-'};const ds=m[1],ts=m[2];return{date:ds.slice(4,6)+'/'+ds.slice(2,4)+'/20'+ds.slice(0,2),time:ts.slice(0,2)+':'+ts.slice(2,4)+':'+ts.slice(4,6)}}function orderDateTime(o){const raw=o&&(o.created_at||o.order_date||o.ordered_at||o.createdAt||o.orderDate);if(raw){const d=new Date(raw);if(!isNaN(d))return{date:d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Asia/Jakarta'}),time:d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Asia/Jakarta'})}}return fromRef(o&&o.order_number)}function buildInvoice(o){const dt=orderDateTime(o);const items=(o.items||[]).map(i=>`• ${i.name} × ${Number(i.qty||0)} — ${money(Number(i.price||0)*Number(i.qty||0))}`).join('\n');return `*ISSHO CAFE — INVOICE*\n\n*No. Order:* ${o.order_number||'-'}\n*Tanggal Order:* ${dt.date}\n*Jam Order:* ${dt.time}\n*Meja:* ${o.table_name||'Take Away'}\n*Pembayaran:* ${o.payment_method||'-'}\n*Status:* ${o.payment_status||'-'}\n\n*Pesanan:*\n${items||'• -'}\n\n*TOTAL:* ${money(o.total)}\n\n🍽️ *Pesanan Anda Sudah Siap!*\nSilakan ambil di *meja kasir*.\n*Terima kasih 🙏*\n\nTerima kasih sudah berkunjung ke ISSHO CAFE 🙏`}function getPin(){try{const d=f.contentDocument||f.contentWindow.document,input=d&&d.getElementById('pin');const typed=input?String(input.value||'').trim():'';return typed||sessionStorage.getItem('issho_staff_pin')||localStorage.getItem('issho_staff_pin')||''}catch(e){return''}}async function refreshOrderCache(){try{const p=getPin();if(!p)return;const orders=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:p})});orderCache=new Map((Array.isArray(orders)?orders:[]).map(o=>[String(o.order_number),o]));injectOrderDates(f.contentDocument||f.contentWindow.document)}catch(e){}}async function getOrder(ref){const p=getPin();if(!p)throw Error('Sesi Kasir belum terbaca. Pastikan sudah login Kasir, lalu klik Refresh.');const orders=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:p})});const o=(Array.isArray(orders)?orders:[]).find(x=>String(x.id)===String(ref)||String(x.order_number)===String(ref));if(!o)throw Error('Order belum ditemukan. Klik Refresh pada Pesanan Masuk lalu coba WhatsApp lagi.');return o}async function openWhatsApp(ref){try{pendingOrder=await getOrder(ref);const dt=orderDateTime(pendingOrder);info.textContent=`Order: ${pendingOrder.order_number||'-'}\nTanggal Order: ${dt.date}\nJam Order: ${dt.time} WIB\nMeja: ${pendingOrder.table_name||'Take Away'}\nTotal: ${money(pendingOrder.total)}\n\nNomor WhatsApp dari pelanggan akan digunakan untuk invoice:`;modal.style.display='flex';phone.value=pendingOrder.customer_whatsapp||localStorage.getItem('issho_last_wa_phone')||'';setTimeout(()=>{phone.focus();phone.select()},80)}catch(e){alert('Invoice belum siap: '+e.message)}}window.openWhatsApp=openWhatsApp;document.getElementById('waCancel').onclick=()=>{modal.style.display='none';pendingOrder=null};document.getElementById('waSend').onclick=()=>{const p=cleanPhone(phone.value);if(!/^62\d{8,15}$/.test(p)){alert('Nomor WhatsApp tidak valid. Contoh: 081234567890');phone.focus();return}localStorage.setItem('issho_last_wa_phone',phone.value.trim());window.open('https://web.whatsapp.com/send?phone='+p+'&text='+encodeURIComponent(buildInvoice(pendingOrder)),'_blank','noopener,noreferrer');modal.style.display='none';pendingOrder=null};function findOrderRef(btn){let el=btn;for(let i=0;i<7&&el;i++,el=el.parentElement){const m=String(el.innerText||'').match(/ISS-\d{6}-\d{6}-[A-Z0-9]+/);if(m)return m[0]}return null}function injectOrderDates(d){try{if(!d||!d.body)return false;d.querySelectorAll('b').forEach(b=>{const ref=String(b.textContent||'').trim();if(!/^ISS-\d{6}-\d{6}-[A-Z0-9]+$/i.test(ref))return;const old1=b.nextElementSibling,old2=old1&&old1.nextElementSibling,old3=old2&&old2.nextElementSibling;if(old1&&old1.dataset&&old1.dataset.orderTimeDisplay==='1')old1.remove();if(old2&&old2.dataset&&old2.dataset.orderTimeDisplay==='1')old2.remove();if(old3&&old3.dataset&&old3.dataset.orderTimeDisplay==='1')old3.remove();const o=orderCache.get(ref)||{order_number:ref},dt=orderDateTime(o);const x=d.createElement('div');x.className='order-date';x.dataset.orderTimeDisplay='1';x.textContent='Tanggal Order: '+dt.date;const y=d.createElement('div');y.className='order-time';y.dataset.orderTimeDisplay='1';y.textContent='Jam Order: '+dt.time+' WIB';const z=d.createElement('div');z.className='menu-ready';z.dataset.orderTimeDisplay='1';z.innerHTML='<strong>🍽️ Pesanan Anda Sudah Siap!<br><span style="font-size:13px">Silakan ambil di <u>meja kasir</u>.<br>Terima kasih 🙏</span></strong>';b.insertAdjacentElement('afterend',x);x.insertAdjacentElement('afterend',y);y.insertAdjacentElement('afterend',z)});return true}catch(e){return false}}async function triggerInnerRefresh(){try{const w=f.contentWindow;if(w&&typeof w.loadOrders==='function'){await w.loadOrders()}else if(w&&typeof w.refreshOrders==='function'){await w.refreshOrders()}await refreshOrderCache();patch()}catch(e){}}async function patch(){try{const d=f.contentDocument||f.contentWindow.document;if(!d||!d.body)return false;injectOrderDates(d);d.querySelectorAll('button').forEach(b=>{const label=(b.textContent||'').replace(/\s+/g,' ').trim();if(/Print Dapur/i.test(label))b.remove();if(/Print Pelanggan/i.test(label)){b.disabled=false;b.removeAttribute('disabled');b.style.pointerEvents='auto';const parent=b.parentElement;if(parent&&!parent.querySelector('[data-wa-invoice]')){parent.classList.add('wa-row');const ref=findOrderRef(b);if(ref){const wb=d.createElement('button');wb.type='button';wb.dataset.waInvoice='1';wb.textContent='🟢 WhatsApp';wb.title='Kirim invoice ke WhatsApp pelanggan';wb.style.cssText='background:#25D366;color:#07150c;border:0;border-radius:10px;padding:12px 18px;font-weight:900;font-size:16px;cursor:pointer;pointer-events:auto;display:inline-block;';wb.onclick=ev=>{ev.preventDefault();ev.stopPropagation();window.openWhatsApp(ref)};parent.appendChild(wb)}}}});return true}catch(e){return false}}function connectRealtime(){try{if(rt)return;rt=supabase.createClient(U,K,{realtime:{params:{eventsPerSecond:30}}}).channel('kasir-live-'+Date.now()).on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>{clearTimeout(refreshTimer);refreshTimer=setTimeout(triggerInnerRefresh,80)}).subscribe(()=>{})}catch(e){}}f.addEventListener('load',()=>{setTimeout(connectRealtime,200);setTimeout(refreshOrderCache,400);setTimeout(patch,500);setTimeout(triggerInnerRefresh,900)});setInterval(refreshOrderCache,3000);setInterval(patch,1000);connectRealtime();</script></body></html>
