<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — KASIR</title><style>html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}#kasir{width:100%;height:100%;border:0;display:block}#printer{display:none}</style></head><body><div id="printer"></div><iframe id="kasir" src="/staff-v6.html?v=20260825-final-no-printer" title="ISSHO CAFE KASIR"></iframe><script>const f=document.getElementById('kasir');function patch(){try{const w=f.contentWindow,d=w.document;if(!w.getKasirOrder)w.getKasirOrder=id=>w.ORD.find(x=>String(x.id)===String(id));if(!w.getKasirPin)w.getKasirPin=()=>w.P;d.querySelectorAll('button').forEach(b=>{if(/Print Dapur/i.test(b.textContent||''))b.remove();if(/Print Pelanggan/i.test(b.textContent||'')){b.disabled=false;b.removeAttribute('disabled');b.style.pointerEvents='auto'}});return true}catch(e){return false}}f.addEventListener('load',()=>{patch();setInterval(patch,500)});setInterval(patch,1000);</script></body></html>
