<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — KASIR</title><style>html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}#kasir{width:100%;height:100%;border:0;display:block}.wa-modal{display:none;position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.78);align-items:center;justify-content:center;padding:18px}.wa-box{width:min(460px,92vw);background:#171717;border:2px solid #2f8f57;border-radius:18px;padding:20px;box-shadow:0 12px 50px #000}.wa-box h2{margin:0 0 8px}.wa-box p{color:#bbb;margin:8px 0 14px;line-height:1.45;white-space:pre-line}.wa-box input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #444;border-radius:10px;background:#101010;color:#fff;font-size:18px}.wa-actions{display:flex;gap:8px;margin-top:12px}.wa-actions button{flex:1;border:0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer}.wa-send{background:#25D366;color:#07150c}.wa-cancel{background:#333;color:#fff}</style></head><body><div id="printer"></div><iframe id="kasir" src="/staff-v6.html?v=20260825-final-wa-invoice-v1" title="ISSHO CAFE KASIR"></iframe><div id="waModal" class="wa-modal"><div class="wa-box"><h2>🟢 Kirim Invoice WhatsApp</h2><p id="waInfo">Masukkan nomor WhatsApp pelanggan.</p><input id="waPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Contoh: 081234567890"><div class="wa-actions"><button class="wa-cancel" id="waCancel">Batal</button><button class="wa-send" id="waSend">Buka WhatsApp Web</button></div></div></div><script>const f=document.getElementById('kasir'),modal=document.getElementById('waModal'),phone=document.getElementById('waPhone'),info=document.getElementById('waInfo');let pendingOrder=null;function cleanPhone(v){let s=String(v||'').trim().replace(/[^0-9+]/g,'');if(s.startsWith('+'))s=s.slice(1);if(s.startsWith('0'))s='62'+s.slice(1);if(s.startsWith('8'))s='62'+s;return s}function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}function buildInvoice(o){const items=(o.items||[]).map(i=>`• ${i.name} × ${Number(i.qty||0)} — ${money(Number(i.price||0)*Number(i.qty||0))}`).join('\n');return `*ISSHO CAFE — INVOICE*\n\n*No. Order:* ${o.order_number||'-'}\n*Meja:* ${o.table_name||'Take Away'}\n*Pembayaran:* ${o.payment_method||'-'}\n*Status:* ${o.payment_status||'-'}\n\n*Total:* ${money(o.total)}\n\n*Pesanan:*\n${items||'• -'}\n\nTerima kasih sudah berkunjung ke ISSHO CAFE 🙏`}function openWhatsApp(orderId){try{const w=f.contentWindow,o=(w.ORD||[]).find(x=>String(x.id)===String(orderId));if(!o){alert('Data invoice tidak ditemukan. Silakan Refresh terlebih dahulu.');return}pendingOrder=o;info.textContent=`${o.order_number||'-'} • ${o.table_name||'Take Away'} • ${money(o.total)}\nMasukkan nomor WhatsApp pelanggan:`;modal.style.display='flex';phone.value='';setTimeout(()=>phone.focus(),50)}catch(e){alert('WhatsApp gagal dibuka: '+e.message)}}window.openWhatsApp=openWhatsApp;document.getElementById('waCancel').onclick=()=>{modal.style.display='none';pendingOrder=null};document.getElementById('waSend').onclick=()=>{const p=cleanPhone(phone.value);if(!/^62\d{8,15}$/.test(p)){alert('Nomor WhatsApp tidak valid. Contoh: 081234567890');phone.focus();return}const text=buildInvoice(pendingOrder);const url='https://web.whatsapp.com/send?phone='+p+'&text='+encodeURIComponent(text);modal.style.display='none';window.open(url,'_blank','noopener,noreferrer');pendingOrder=null};phone.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('waSend').click();if(e.key==='Escape')document.getElementById('waCancel').click()});function patch(){try{const w=f.contentWindow,d=w.document;if(!w.getKasirOrder)w.getKasirOrder=id=>(w.ORD||[]).find(x=>String(x.id)===String(id));if(!w.getKasirPin)w.getKasirPin=()=>w.P;d.querySelectorAll('button').forEach(b=>{if(/Print Dapur/i.test(b.textContent||''))b.remove();if(/Print Pelanggan/i.test(b.textContent||'')){b.disabled=false;b.removeAttribute('disabled');b.style.pointerEvents='auto';const card=b.closest('.order');if(card&&!card.querySelector('[data-wa-invoice]')){const m=(b.getAttribute('onclick')||'').match(/printCustomer\(['"]([^'"]+)['"]/);if(m){const wb=d.createElement('button');wb.type='button';wb.className='green';wb.dataset.waInvoice='1';wb.textContent='🟢 WhatsApp';wb.title='Kirim invoice ke WhatsApp pelanggan';wb.onclick=()=>window.openWhatsApp(m[1]);b.parentElement&&b.parentElement.appendChild(wb)}}}});return true}catch(e){return false}}f.addEventListener('load',()=>{patch();setInterval(patch,500)});setInterval(patch,1000);</script></body></html>
