<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>ISSHO CAFE — KASIR</title>
<style>
html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}
#kasir{width:100%;height:100%;border:0;display:block}
.order-date,.order-time{display:block;color:#c9c9c9;font-size:13px;font-weight:700;line-height:1.5;margin-top:3px}
.wa-modal{display:none;position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.86);align-items:center;justify-content:center;padding:18px}
.wa-box{width:min(560px,94vw);background:#171717;border:3px solid #25D366;border-radius:18px;padding:24px;box-shadow:0 12px 50px #000}
.wa-box h2{margin:0 0 8px;font-size:25px}.wa-help{color:#bbb;line-height:1.5;margin:8px 0 18px;white-space:pre-line}
.wa-label{display:block;font-weight:900;margin-bottom:8px}.wa-input{width:100%;box-sizing:border-box;padding:15px;border:2px solid #555;border-radius:10px;background:#101010;color:#fff;font-size:20px;outline:none}.wa-input:focus{border-color:#25D366}
.wa-actions{display:flex;gap:10px;margin-top:18px}.wa-actions button{flex:1;border:0;border-radius:10px;padding:14px;font-weight:900;font-size:16px;cursor:pointer}.wa-send{background:#25D366;color:#07150c}.wa-cancel{background:#333;color:#fff}
.ready-modal{display:none;position:fixed;inset:0;z-index:2147483646;background:rgba(0,0,0,.84);align-items:center;justify-content:center;padding:18px}
.ready-box{width:min(590px,94vw);background:#171717;border:3px solid #2f8b59;border-radius:18px;padding:24px;box-shadow:0 12px 50px #000;text-align:center}
.ready-box h2{margin:0 0 10px;font-size:28px;color:#71e39d}.ready-info{font-size:18px;line-height:1.6;color:#eee}.ready-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.ready-actions button{border:0;border-radius:10px;padding:14px 18px;font-weight:900;font-size:16px;cursor:pointer}.ready-wa{background:#25D366;color:#07150c}.ready-close{background:#333;color:#fff}.ready-badge{display:inline-block;background:#193b25;color:#9ff0bb;padding:7px 12px;border-radius:99px;font-weight:900;margin:8px 0}
.ready-button{background:#25D366!important;color:#07150c!important;border:0!important;border-radius:10px!important;padding:12px 16px!important;font-weight:900!important;font-size:15px!important;cursor:pointer!important}
.wa-row{display:flex!important;gap:8px!important;flex-wrap:wrap!important}
</style>
</head>
<body>
<iframe id="kasir" src="/staff-v6.html?v=20260826-kasir-dapur-link-v1" title="ISSHO CAFE KASIR"></iframe>
<div id="waModal" class="wa-modal"><div class="wa-box">
<h2>🟢 Kirim WhatsApp Pelanggan</h2><div id="waInfo" class="wa-help">Pesan siap dikirim.</div>
<label class="wa-label" for="waPhone">📱 Nomor WhatsApp Pelanggan</label>
<input id="waPhone" class="wa-input" type="tel" inputmode="tel" autocomplete="tel" placeholder="081234567890">
<div class="wa-actions"><button class="wa-cancel" id="waCancel">Batal</button><button class="wa-send" id="waSend">🟢 Buka WhatsApp Web</button></div>
</div></div>
<div id="readyModal" class="ready-modal"><div class="ready-box">
<h2>🍽️ ORDER SUDAH SIAP</h2><div class="ready-badge">DAPUR SELESAI</div><div id="readyInfo" class="ready-info"></div>
<div class="ready-actions"><button class="ready-wa" id="readyWa">🟢 Konfirmasi ke Pelanggan</button><button class="ready-close" id="readyClose">Tutup</button></div>
</div></div>
<script>
const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';
const f=document.getElementById('kasir'),waModal=document.getElementById('waModal'),phone=document.getElementById('waPhone'),info=document.getElementById('waInfo'),readyModal=document.getElementById('readyModal'),readyInfo=document.getElementById('readyInfo');
let pendingOrder=null,readyOrder=null,orderCache=new Map(),lastStatus=new Map(),firstCache=true;
async function api(path,opt={}){const h=Object.assign({apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},opt.headers||{});const r=await fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h}));const t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}
function cleanPhone(v){let s=String(v||'').trim().replace(/[^0-9]/g,'');if(s.startsWith('0'))s='62'+s.slice(1);else if(s.startsWith('8'))s='62'+s;return s}
function validPhone(v){return /^62\d{8,15}$/.test(cleanPhone(v))}
function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}
function fromRef(ref){const m=String(ref||'').match(/^ISS-(\d{6})-(\d{6})-/i);if(!m)return{date:'-',time:'-'};const ds=m[1],ts=m[2];return{date:ds.slice(4,6)+'/'+ds.slice(2,4)+'/20'+ds.slice(0,2),time:ts.slice(0,2)+':'+ts.slice(2,4)+':'+ts.slice(4,6)}}
function orderDateTime(o){const raw=o&&(o.created_at||o.order_date||o.ordered_at||o.createdAt||o.orderDate);if(raw){const d=new Date(raw);if(!isNaN(d))return{date:d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Asia/Jakarta'}),time:d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Asia/Jakarta'})}}return fromRef(o&&o.order_number)}
function getPin(){try{const d=f.contentDocument||f.contentWindow.document,input=d&&d.getElementById('pin');const typed=input?String(input.value||'').trim():'';return typed||sessionStorage.getItem('issho_staff_pin')||localStorage.getItem('issho_staff_pin')||''}catch(e){return''}}
function buildInvoice(o){const dt=orderDateTime(o);const items=(o.items||[]).map(i=>`• ${i.name} × ${Number(i.qty||0)} — ${money(Number(i.price||0)*Number(i.qty||0))}`).join('\n');return `*ISSHO CAFE — INVOICE*\n\n*No. Order:* ${o.order_number||'-'}\n*Tanggal Order:* ${dt.date}\n*Jam Order:* ${dt.time} WIB\n*Meja:* ${o.table_name||'Take Away'}\n*Pembayaran:* ${o.payment_method||'-'}\n*Status:* ${o.payment_status||'-'}\n\n*Pesanan:*\n${items||'• -'}\n\n*TOTAL:* ${money(o.total)}\n\nTerima kasih sudah berkunjung ke ISSHO CAFE 🙏`}
function buildReadyMessage(o){return `*ISSHO CAFE — PESANAN SUDAH SIAP*\n\nHalo, pesanan Anda *${o.order_number||'-'}* sudah selesai disiapkan.\n\n*Meja:* ${o.table_name||'Take Away'}\n*Total:* ${money(o.total)}\n\n🍽️ *Order sudah siap, silakan diambil di meja pemesanan atau meja kasir.*\n\nTerima kasih 🙏`}
async function refreshOrderCache(){try{const p=getPin();if(!p)return;const orders=await api('/rest/v1/rpc/staff_get_orders',{method:'POST',body:JSON.stringify({p_pin:p})});const list=Array.isArray(orders)?orders:[];orderCache=new Map(list.map(o=>[String(o.id),o]));list.forEach(o=>{const id=String(o.id),status=String(o.order_status||'');if(!firstCache&&lastStatus.has(id)&&lastStatus.get(id)!=='COMPLETED'&&status==='COMPLETED'){showReady(o)}lastStatus.set(id,status)});firstCache=false;injectReadyButtons();}catch(e){}}
function showReady(o){readyOrder=o;const dt=orderDateTime(o);readyInfo.innerHTML=`<b>${o.order_number||'-'}</b><br>Tanggal: ${dt.date}<br>Jam: ${dt.time} WIB<br>Meja: ${o.table_name||'Take Away'}<br>Total: ${money(o.total)}<br><br><b>Pesanan dari Dapur sudah selesai.</b><br>Silakan konfirmasi kepada pelanggan melalui WhatsApp.`;readyModal.style.display='flex';try{navigator.vibrate?.([250,100,250,100,500])}catch(e){}}
function closeReady(){readyModal.style.display='none';readyOrder=null}
function openWhatsApp(ref,mode='invoice'){try{const o=orderCache.get(String(ref));if(!o)throw Error('Order belum ditemukan.');pendingOrder=o;const dt=orderDateTime(o);info.textContent=mode==='ready'?`Order: ${o.order_number||'-'}\nTanggal: ${dt.date}\nJam: ${dt.time} WIB\nMeja: ${o.table_name||'Take Away'}\n\nPesan yang akan dikirim:\n“Order sudah siap, silakan diambil di meja pemesanan atau meja kasir.”`: `Order: ${o.order_number||'-'}\nTanggal Order: ${dt.date}\nJam Order: ${dt.time} WIB\nMeja: ${o.table_name||'Take Away'}\nTotal: ${money(o.total)}\n\nNomor WhatsApp pelanggan digunakan untuk mengirim invoice.`;phone.value=o.customer_whatsapp||localStorage.getItem('issho_last_wa_phone')||'';waModal.dataset.mode=mode;waModal.style.display='flex';setTimeout(()=>{phone.focus();phone.select()},80)}catch(e){alert('WhatsApp belum siap: '+e.message)}}
window.openWhatsApp=openWhatsApp;
document.getElementById('waCancel').onclick=()=>{waModal.style.display='none';pendingOrder=null};
document.getElementById('waSend').onclick=()=>{if(!pendingOrder)return;const p=cleanPhone(phone.value);if(!/^62\d{8,15}$/.test(p)){alert('Nomor WhatsApp tidak valid. Contoh: 081234567890');phone.focus();return}localStorage.setItem('issho_last_wa_phone',phone.value.trim());const mode=waModal.dataset.mode||'invoice';const text=mode==='ready'?buildReadyMessage(pendingOrder):buildInvoice(pendingOrder);window.open('https://web.whatsapp.com/send?phone='+p+'&text='+encodeURIComponent(text),'_blank','noopener,noreferrer');waModal.style.display='none';pendingOrder=null;closeReady()};
document.getElementById('readyWa').onclick=()=>{if(readyOrder)openWhatsApp(String(readyOrder.id),'ready')};document.getElementById('readyClose').onclick=closeReady;
function findOrderRef(btn){let el=btn;for(let i=0;i<8&&el;i++,el=el.parentElement){const m=String(el.innerText||'').match(/ISS-\d{6}-\d{6}-[A-Z0-9]+/);if(m)return m[0]}return null}
function injectOrderDates(d){try{if(!d||!d.body)return false;d.querySelectorAll('b').forEach(b=>{const ref=String(b.textContent||'').trim();if(!/^ISS-\d{6}-\d{6}-[A-Z0-9]+$/i.test(ref))return;const o=[...orderCache.values()].find(x=>String(x.order_number)===ref)||{order_number:ref};const old=d.querySelector(`[data-order-time-ref="${ref}"]`);if(old)old.remove();const dt=orderDateTime(o);const x=d.createElement('div');x.className='order-date';x.dataset.orderTimeRef=ref;x.textContent='Tanggal Order: '+dt.date;const y=d.createElement('div');y.className='order-time';y.dataset.orderTimeRef=ref;y.textContent='Jam Order: '+dt.time+' WIB';b.insertAdjacentElement('afterend',x);x.insertAdjacentElement('afterend',y)});return true}catch(e){return false}}
function injectReadyButtons(){try{const d=f.contentDocument||f.contentWindow.document;if(!d||!d.body)return;d.querySelectorAll('button').forEach(b=>{const label=(b.textContent||'').replace(/\s+/g,' ').trim();if(/Print Dapur/i.test(label))b.remove();if(/Print Pelanggan/i.test(label)){b.disabled=false;b.removeAttribute('disabled');b.style.pointerEvents='auto';const parent=b.parentElement;if(parent&&!parent.querySelector('[data-wa-invoice]')){parent.classList.add('wa-row');const ref=findOrderRef(b);if(ref){const wb=d.createElement('button');wb.type='button';wb.dataset.waInvoice='1';wb.textContent='🟢 WhatsApp Invoice';wb.style.cssText='background:#25D366;color:#07150c;border:0;border-radius:10px;padding:12px 16px;font-weight:900;font-size:15px;cursor:pointer;pointer-events:auto;';wb.onclick=ev=>{ev.preventDefault();ev.stopPropagation();openWhatsApp(ref,'invoice')};parent.appendChild(wb)}}}});for(const [id,o] of orderCache){if(String(o.order_status)!=='COMPLETED')continue;const ref=String(o.order_number||'');let btn=[...d.querySelectorAll('button')].find(x=>x.dataset&&x.dataset.waReadyRef===ref);if(btn)continue;const btag=[...d.querySelectorAll('b')].find(x=>String(x.textContent||'').trim()===ref);if(!btag)continue;const row=btag.closest('.order')||btag.parentElement?.parentElement?.parentElement;if(!row)continue;const actions=row.querySelector('.actions');if(!actions)continue;const wb=d.createElement('button');wb.type='button';wb.dataset.waReadyRef=ref;wb.className='ready-button';wb.textContent='🟢 WhatsApp: Order Siap';wb.title='Kirim pemberitahuan order siap ke pelanggan';wb.onclick=ev=>{ev.preventDefault();ev.stopPropagation();openWhatsApp(id,'ready')};actions.appendChild(wb)}}catch(e){}}
f.addEventListener('load',()=>{setTimeout(refreshOrderCache,500);setTimeout(injectReadyButtons,800)});
setInterval(refreshOrderCache,2000);setInterval(()=>{injectOrderDates(f.contentDocument||f.contentWindow.document);injectReadyButtons()},1200);
</script>
</body>
</html>
