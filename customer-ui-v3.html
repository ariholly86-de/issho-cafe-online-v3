<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>ISSHO CAFE — Menu Pelanggan</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080909}iframe{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="app" title="ISSHO CAFE Menu Pelanggan"></iframe>
<script>
const f=document.getElementById('app');
const qs=new URLSearchParams(location.search);
const src=new URL('customer-live-fixed.html?v=20260904-customer-ui-v3',location.href);
if(qs.get('table'))src.searchParams.set('table',qs.get('table'));
if(location.hash)src.hash=location.hash.slice(1);
f.src=src.toString();

f.addEventListener('load',()=>{
 try{
  const d=f.contentDocument||f.contentWindow.document;
  if(!d||!d.head)return;
  const css=d.createElement('style');
  css.textContent=`
  /* ===== REQUESTED CUSTOMER UI: TOP TABLE + LIVE CART ===== */
  body{background:#080909!important;color:#fff!important}
  .head{background:linear-gradient(180deg,#111414,#070909)!important;padding:10px 0!important;border-bottom:1px solid #242424!important}
  .brand{font-size:24px!important;letter-spacing:.3px}
  .sub{font-size:11px!important}
  .wrap{max-width:1100px!important;padding:10px!important}
  .hero{display:none!important}
  .customer-topbar{display:grid;grid-template-columns:1fr 1.55fr;gap:8px;margin:8px 0 10px;position:sticky;top:0;z-index:30}
  .top-table,.top-cart{min-height:72px;border:1px solid #3d3d3d;border-radius:15px;padding:10px 12px;background:linear-gradient(135deg,#3b2614,#171717);box-shadow:0 5px 20px rgba(0,0,0,.25)}
  .top-cart{display:flex;align-items:center;gap:10px;cursor:pointer;background:#171717!important}
  .top-cart.has-items{border-color:#b68142;box-shadow:0 0 0 1px #b68142 inset,0 5px 20px rgba(0,0,0,.25)}
  .top-label{font-size:11px;color:#bbb;margin-bottom:3px}.top-table-name{font-size:20px;font-weight:900;line-height:1.1}
  .top-table select{margin-top:6px!important;padding:7px 9px!important;background:#242424!important;border-color:#555!important;font-size:12px!important;height:auto!important}
  .cart-icon{width:48px;height:48px;border-radius:12px;background:#252525;display:grid;place-items:center;font-size:27px;flex:0 0 auto;position:relative}
  .cart-badge{position:absolute;right:-6px;top:-7px;background:#e3292d;color:#fff;border-radius:50%;min-width:24px;height:24px;padding:0 5px;display:grid;place-items:center;font-size:12px;font-weight:900;border:2px solid #171717}
  .cart-main{min-width:0;flex:1}.cart-title{font-size:17px;font-weight:900}.cart-summary{color:#aaa;margin-top:3px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cart-summary b{color:#fff}
  .cart-arrow{font-size:30px;color:#eee}
  .tools{position:sticky;top:91px!important;z-index:20;background:#080909!important;padding:5px 0!important}
  .search{background:#111616!important;border-color:#3d4444!important}
  .cats{padding:7px 0!important}
  .cat{background:#172022!important;border-color:#3c484a!important}.cat.active{background:#b68142!important;border-color:#b68142!important}
  .menu{background:#111717!important;border-color:#303b3c!important;border-radius:13px!important;min-height:270px!important}
  .menu .gold{border-radius:50%!important;width:38px;height:38px;padding:0!important;font-size:0!important;position:relative}
  .menu .gold:after{content:'+';font-size:24px;line-height:38px}
  #customer-cart-detail{background:#f7f7f5!important;color:#111!important;border:0!important;border-radius:16px!important;padding:13px!important;margin-top:12px!important;box-shadow:0 10px 35px rgba(0,0,0,.35)}
  #customer-cart-detail h3{color:#111!important;font-size:19px!important}
  #customer-cart-detail #cart{color:#111!important}
  #customer-cart-detail #cart .row{border-bottom-color:#ddd!important}
  #customer-cart-detail #cart button{background:#eee!important;color:#111!important;border:1px solid #ddd!important;padding:6px 10px!important}
  #customer-cart-detail .row[style*="margin-top"]{border-top:1px solid #ddd;padding-top:12px}
  #customer-cart-detail textarea{background:#fff!important;color:#111!important;border-color:#ddd!important;margin-top:10px}
  #customer-cart-detail .actions{display:grid!important;grid-template-columns:1fr 1fr;gap:8px!important}
  #customer-cart-detail #qrisBtn,#customer-cart-detail #cashBtn{min-height:58px!important;border-radius:13px!important;font-size:15px!important;text-align:left!important;padding:10px 13px!important}
  #customer-cart-detail #qrisBtn{background:#fff!important;color:#111!important;border:2px solid #ddd!important}
  #customer-cart-detail #cashBtn{background:#fff!important;color:#111!important;border:2px solid #b68142!important}
  #customer-cart-detail #qrisBtn:before{content:'▣';font-size:22px;margin-right:9px;color:#111}
  #customer-cart-detail #cashBtn:before{content:'●';font-size:18px;margin-right:10px;color:#8a4f13}
  @media(max-width:600px){
    .wrap{padding:8px!important}.brand{font-size:22px!important}
    .customer-topbar{grid-template-columns:1fr 1.35fr;gap:6px;margin:6px 0 8px}
    .top-table,.top-cart{padding:9px!important;min-height:68px;border-radius:13px}
    .top-table-name{font-size:17px}.cart-icon{width:42px;height:42px;font-size:24px}.cart-title{font-size:14px}.cart-summary{font-size:11px}.cart-arrow{font-size:25px}
    .tools{top:84px!important}.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important}
    #customer-cart-detail .actions{grid-template-columns:1fr!important}
  }
  /* ===== CASH REMINDER LIKE REQUESTED SCREENSHOT ===== */
  .cash-reminder-overlay{position:fixed!important;inset:0!important;z-index:100000!important;background:rgba(0,0,0,.76)!important;display:flex!important;align-items:center!important;justify-content:center!important;padding:12px!important;overflow:auto!important}
  .cash-reminder{width:min(470px,94vw)!important;background:#fff!important;color:#111!important;border-radius:20px!important;padding:16px!important;box-shadow:0 20px 70px #000!important}
  .cash-reminder .cash-icon{width:66px!important;height:66px!important;background:#dff6e6!important;color:#14823b!important;margin:0 auto 8px!important}
  .cash-reminder h2{font-size:21px!important;margin:0 0 4px!important}.cash-reminder .method{font-size:14px!important;color:#444!important}
  .cash-reminder .order-box,.cash-reminder .pay-total{background:#f2f4f7!important}.cash-reminder .warning{background:#ffe9e7!important;color:#d71920!important;border-radius:12px!important}.cash-reminder .warning p{color:#222!important}
  .cash-reminder .cash-instruction{background:#fff2cf!important}.cash-reminder button{background:#8a4f13!important}
  `;
  d.head.appendChild(css);

  const makeTop=()=>{
   if(d.getElementById('customer-topbar'))return;
   const hero=d.querySelector('.hero');
   const tools=d.querySelector('.tools');
   if(!hero||!tools)return;
   const top=d.createElement('div');top.id='customer-topbar';top.className='customer-topbar';
   top.innerHTML=`<div class="top-table"><div class="top-label">🪑 Meja Anda</div><div class="top-table-name" id="top-table-name">Meja 01</div><div id="top-table-select"></div></div><div class="top-cart" id="top-cart"><div class="cart-icon">🛒<span class="cart-badge">0</span></div><div class="cart-main"><div class="cart-title">Keranjang Pesanan</div><div class="cart-summary">Keranjang masih kosong</div></div><div class="cart-arrow">›</div></div>`;
   hero.parentNode.insertBefore(top,hero);
   const sel=d.getElementById('ts'),holder=d.getElementById('top-table-select');if(sel&&holder){holder.appendChild(sel);sel.style.marginTop='6px'}
   const tn=d.getElementById('tn');if(tn)tn.style.display='none';hero.style.display='none';
   const cartCard=[...d.querySelectorAll('.card')].find(el=>el.querySelector('#cart')&&el.querySelector('#qrisBtn')&&el.querySelector('#cashBtn'));
   if(cartCard){cartCard.id='customer-cart-detail';const h=cartCard.querySelector('h3');if(h)h.textContent='Keranjang Pesanan';d.getElementById('top-cart').onclick=()=>cartCard.scrollIntoView({behavior:'smooth',block:'start'})}
   syncTable();syncCart();
   const obs=new MutationObserver(()=>{syncTable();syncCart()});
   const cart=d.getElementById('cart'),tot=d.getElementById('tot');if(cart)obs.observe(cart,{childList:true,subtree:true,characterData:true});if(tot)obs.observe(tot,{childList:true,subtree:true,characterData:true});
   setInterval(syncCart,300);
  };
  const syncTable=()=>{const a=d.getElementById('tn'),b=d.getElementById('top-table-name');if(a&&b)b.textContent=a.textContent||'Meja 01'};
  const syncCart=()=>{
   const bar=d.getElementById('customer-topbar');if(!bar)return;
   const cart=d.getElementById('cart'),tot=d.getElementById('tot');
   let count=0;
   if(cart){[...cart.children].forEach(row=>{const txt=row.textContent||'';const m=txt.match(/[−-]\s*(\d+)\s*\+/);if(m)count+=Number(m[1]);});}
   const total=(tot?.textContent||'Rp0').trim();
   const badge=bar.querySelector('.cart-badge'),sum=bar.querySelector('.cart-summary'),box=bar.querySelector('.top-cart');
   if(badge)badge.textContent=count;
   if(sum)sum.innerHTML=count?`<b>${count} item</b> • <b>${total}</b>`:'Keranjang masih kosong';
   if(box)box.classList.toggle('has-items',count>0);
  };
  makeTop();

  const originalPlace=d.defaultView.place;
  if(typeof originalPlace==='function'){
   d.defaultView.place=async function(method){
    await originalPlace(method);if(method!=='CASH')return;
    const result=d.getElementById('result');if(!result||result.querySelector('.err'))return;
    const text=result.textContent||'';const match=text.match(/Pesanan\s+([^\s]+)\s+berhasil/i);const orderNo=match?match[1]:'Pesanan Anda';
    const total=d.getElementById('tot')?.textContent||'Rp0';
    const old=d.querySelector('.cash-reminder-overlay');if(old)old.remove();
    const overlay=d.createElement('div');overlay.className='cash-reminder-overlay';
    overlay.innerHTML=`<div class="cash-reminder" role="dialog" aria-modal="true"><div class="cash-icon">💵</div><h2>Pesanan Anda Berhasil Dibuat</h2><div class="method">Metode Pembayaran: <b>Tunai</b></div><div class="order-box"><div class="order-label">Nomor Order</div><div class="order-no">${d.defaultView.esc(orderNo)}</div></div><div class="warning"><div class="big">Silakan lakukan pembayaran di meja kasir</div><p>Untuk pembayaran TUNAI, pesanan Anda <b>belum dapat diproses oleh dapur</b> sebelum pembayaran diterima oleh kasir.</p></div><div class="cash-instruction"><strong>👤 Silakan datang ke meja kasir</strong>Sebutkan <b>nomor order</b> Anda kepada kasir agar pembayaran dapat segera diproses.</div><div class="pay-total"><small>Total yang harus dibayar</small><b>${d.defaultView.esc(total)}</b></div><button type="button" id="cash-reminder-ok">✓ SAYA MENGERTI</button><div class="thanks">Terima kasih telah memesan di Issho Cafe ❤️</div></div>`;
    d.body.appendChild(overlay);d.getElementById('cash-reminder-ok').onclick=()=>overlay.remove();
   };
  }
 }catch(e){console.warn('customer ui v3 patch failed',e)}
});
</script>
</body>
</html>
