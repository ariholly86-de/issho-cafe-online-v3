<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — KASIR LIVE</title><style>html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}#kasir{width:100%;height:100%;min-height:100vh;border:0}.live{position:fixed;right:10px;top:10px;z-index:999997;background:#193b25;border:1px solid #2f7d50;border-radius:18px;padding:10px 16px;font-weight:900}.progressBox{margin:10px 0;padding:12px;border:1px solid #444;border-radius:12px;background:#101010}.progressTitle{font-weight:900;margin-bottom:8px}.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pitem{padding:9px;border-radius:9px;background:#222;border:1px solid #444;font-weight:800}.done{background:#12351f!important;border-color:#2f8b59!important;color:#8ff0ad}.wait{background:#302716!important;border-color:#b68142!important;color:#ffd88e}@media(max-width:700px){.pgrid{grid-template-columns:1fr}.live{font-size:12px;padding:8px 10px}}.waBtn{display:inline-flex!important;align-items:center;gap:6px;height:40px;padding:8px 12px;border:0;border-radius:9px;background:#25D366;color:#fff;font-weight:800;cursor:pointer}.waModal{display:none;position:fixed;inset:0;z-index:1000000;background:#000c;align-items:center;justify-content:center;padding:16px}.waBox{width:min(520px,94vw);background:#171717;border:2px solid #25D366;border-radius:18px;padding:18px}.waBox input{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;background:#101010;color:#fff;border:1px solid #555;margin:8px 0}.receipt{background:#fff;color:#111;padding:14px;border-radius:10px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}.actions button{border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer}.send{background:#25D366;color:#fff}.cancel{background:#555;color:#fff}</style></head><body><div class="live">● KASIR LIVE • PROGRESS DAPUR</div><iframe id="kasir" src="/staff-v6.html?v=20260825-kasir-progress-v1"></iframe><div id="waModal" class="waModal"><div class="waBox"><h3>📱 Kirim Invoice WhatsApp</h3><input id="phone" placeholder="0812xxxx / 62812xxxx" inputmode="tel"><div id="preview" class="receipt"></div><div class="actions"><button class="cancel" onclick="closeWA()">Batal</button><button class="send" onclick="sendWA()">Kirim Invoice</button></div></div></div><script>const $=id=>document.getElementById(id),frame=()=>$('kasir').contentWindow;let selected=null;const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function orders(){try{return Array.isArray(frame().ORD)?frame().ORD:[]}catch(e){return[]}}function getOrder(id){return orders().find(o=>String(o.id)===String(id))||null}function drink(i){const c=String(i.category_name||'').toLowerCase();return c.includes('minum')||c.includes('kopi')||c.includes('wedang')}function progress(o){const food=(o.items||[]).filter(i=>!drink(i)),bev=(o.items||[]).filter(drink);const f=food.length?(o.food_completed?'done':'wait'):'done',d=bev.length?(o.drink_completed?'done':'wait'):'done';return '<div class="progressBox"><div class="progressTitle">👨‍🍳 PROGRESS DAPUR</div><div class="pgrid"><div class="pitem '+f+'">🍽️ Makanan: '+(food.length?(o.food_completed?'✓ SUDAH SELESAI':'⏳ BELUM SELESAI'):'— TIDAK ADA')+'</div><div class="pitem '+d+'">🥤 Minuman: '+(bev.length?(o.drink_completed?'✓ SUDAH SELESAI':'⏳ BELUM SELESAI'):'— TIDAK ADA')+'</div></div></div>'}function patchProgress(){try{const w=frame(),list=w.document.getElementById('list');if(!list)return;list.querySelectorAll('.order').forEach(card=>{if(card.querySelector('.progressBox'))card.querySelector('.progressBox').remove();const b=card.querySelector('b');if(!b)return;const o=orders().find(x=>String(x.order_number)===String(b.textContent.trim()));if(o){const box=w.document.createElement('div');box.innerHTML=progress(o);card.appendChild(box.firstElementChild);}})}catch(e){}}function normalize(n){n=String(n||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);else if(n&&!n.startsWith('62'))n='62'+n;return n}function openWA(o){selected=o;if(!o)return;$('phone').value='';$('preview').innerHTML='<h3>ISSHO CAFE</h3><b>'+esc(o.order_number)+'</b><br>Meja: '+esc(o.table_name||'Take Away')+'<hr>'+(o.items||[]).map(i=>esc(i.name)+' × '+i.qty+' — '+money(i.price*i.qty)).join('<br>')+'<hr><b>TOTAL: '+money(o.total)+'</b>';$('waModal').style.display='flex'}function closeWA(){$('waModal').style.display='none';selected=null}function sendWA(){if(!selected)return;const n=normalize($('phone').value);if(n.length<10||n.length>15)return alert('Nomor WhatsApp tidak valid.');const text=['🧾 INVOICE PEMBAYARAN — ISSHO CAFE','','No. Order: '+selected.order_number,'Meja: '+(selected.table_name||'Take Away'),'Pembayaran: '+(selected.payment_method||'-'),'Status: '+(selected.payment_status==='PAID'?'LUNAS':'BELUM LUNAS'),'','...'+(selected.items||[]).map(i=>'\n- '+i.name+' × '+i.qty+' — '+money(i.price*i.qty)).join(''),'','TOTAL: '+money(selected.total)].join('');window.open('https://wa.me/'+n+'?text='+encodeURIComponent(text),'_blank','noopener');closeWA()}function patchWA(){try{const w=frame(),list=w.document.getElementById('list');if(!list)return;list.querySelectorAll('.order').forEach(card=>{if(card.querySelector('.waBtn'))return;const b=card.querySelector('b');if(!b)return;const o=orders().find(x=>String(x.order_number)===String(b.textContent.trim()));if(!o||o.payment_status!=='PAID')return;const btn=w.document.createElement('button');btn.className='waBtn';btn.textContent='📱 WhatsApp';btn.onclick=e=>{e.preventDefault();e.stopPropagation();openWA(getOrder(o.id))};const actions=card.querySelector('.actions');if(actions)actions.appendChild(btn)})}catch(e){}}function patch(){patchProgress();patchWA()}$('kasir').addEventListener('load',()=>setTimeout(patch,500));setInterval(patch,700);</script></body></html>
