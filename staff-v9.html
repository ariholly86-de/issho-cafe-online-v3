<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>ISSHO CAFE — KASIR</title>
<style>html,body{margin:0;width:100%;height:100%;background:#0b0b0b}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="kasir" src="staff-v6.html?v=20260823-expense-static-v12" title="ISSHO CAFE KASIR"></iframe>
<script>
const U='https://xvhimyflrqrdudijwjdn.supabase.co';
const K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';
const f=document.getElementById('kasir');
async function api(path,opt={}){const h=Object.assign({apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},opt.headers||{});const r=await fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h}));const t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
function getPin(d,w){try{const p=d.getElementById('pin')?.value?.trim();if(p)return p}catch(e){}try{return w.eval('typeof P!=="undefined"?P:""')||''}catch(e){return ''}}
function rowsOf(x){if(Array.isArray(x)){if(x.length===1&&Array.isArray(x[0]))return x[0];if(x.length===1&&x[0]&&Array.isArray(x[0].result))return x[0].result;return x}if(x&&Array.isArray(x.result))return x.result;return x?[x]:[]}
function install(){try{const w=f.contentWindow,d=w.document;if(!d||!d.body)return false;if(d.getElementById('expense-detail-v12'))return true;const st=d.createElement('style');st.id='expense-style-v12';st.textContent='.expense-detail-v12{margin-top:14px;padding:14px;border:1px solid #3b3b3b;border-radius:12px;background:#151515;animation:none!important;transition:none!important}.expense-detail-v12 .erow{padding:11px 0;border-bottom:1px solid #333;animation:none!important;transition:none!important}.expense-detail-v12 .edesc{color:#fff;margin-top:5px;font-size:14px}.expense-detail-v12 .emeta{color:#aaa;font-size:12px;margin-top:4px}.expense-detail-v12 .etotal{display:flex;justify-content:space-between;border-top:1px solid #555;margin-top:8px;padding-top:10px;font-weight:800}.expense-detail-v12 .print-expenses{background:#1687f7!important;color:#fff!important;border:0!important;border-radius:8px!important;padding:10px 14px!important;font-weight:800!important;cursor:pointer!important}';d.head.appendChild(st);return true}catch(e){return false}}
function printDetails(list,date,total){const w=window.open('','_blank','width=420,height=700');if(!w)return;const rows=list.map(e=>'<div style="border-bottom:1px dashed #777;padding:8px 0"><b>'+esc(e?.category||'Operasional')+'</b><br>Keterangan: '+esc(e?.description||'Tidak ada keterangan')+'<br>'+esc(e?.expense_date||date)+'<br><b>'+money(e?.amount)+'</b></div>').join('');w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Rekapan Pengeluaran</title><style>@page{size:58mm auto;margin:3mm}body{font-family:Arial,sans-serif;font-size:11px;width:52mm;margin:0;color:#000}h2{text-align:center;font-size:14px;margin:0 0 8px}.total{border-top:1px solid #000;margin-top:8px;padding-top:8px;font-weight:bold;display:flex;justify-content:space-between}</style></head><body><h2>ISSHO CAFE<br>REKAPAN PENGELUARAN</h2><div>Tanggal: '+esc(date)+'</div>'+rows+'<div class="total"><span>TOTAL</span><span>'+money(total)+'</span></div><script>window.onload=()=>{window.print();setTimeout(()=>window.close(),700)}<\/script></body></html>');w.document.close()}
async function showDetails(){try{const w=f.contentWindow,d=w.document;if(!d||!d.body)return;const expense=d.getElementById('expense');const report=d.getElementById('report');const target=expense&&!expense.classList.contains('hidden')?expense:(report&&!report.classList.contains('hidden')?report:null);if(!target)return;const date=(d.getElementById('exDate')?.value||d.getElementById('date')?.value);const pin=getPin(d,w);if(!date||!pin)return;let box=d.getElementById('expense-detail-v12');if(!box){box=d.createElement('div');box.id='expense-detail-v12';box.className='card expense-detail-v12';const anchor=d.getElementById('expenseMsg')||d.getElementById('reportOut');(anchor?.parentNode||target).appendChild(box)}const raw=await api('/rest/v1/rpc/staff_get_expenses',{method:'POST',body:JSON.stringify({p_pin:pin,p_from:date,p_to:date})});const list=rowsOf(raw);const total=list.reduce((s,e)=>s+(Number(e?.amount)||0),0);box.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h3 style="margin:0">💸 Detail Pengeluaran</h3><button class="print-expenses" type="button">🖨️ Print Pengeluaran</button></div>'+(list.length?list.map(e=>'<div class="erow"><div style="display:flex;justify-content:space-between;gap:12px"><div><b>'+esc(e?.category||'Operasional')+'</b><div class="edesc">Keterangan: <b>'+esc(e?.description||'Tidak ada keterangan')+'</b></div><div class="emeta">Tanggal: '+esc(e?.expense_date||date)+'</div></div><b>'+money(e?.amount)+'</b></div></div>').join(''):'<div class="muted" style="margin-top:12px">Belum ada pengeluaran pada tanggal ini.</div>')+(list.length?'<div class="etotal"><span>Total Pengeluaran</span><span>'+money(total)+'</span></div>':'');box.querySelector('.print-expenses')?.addEventListener('click',()=>printDetails(list,date,total))}catch(e){console.error('expense detail',e)}}
function boot(){if(!install())return;showDetails()}
f.addEventListener('load',()=>setTimeout(boot,200));setTimeout(boot,800);
</script>
</body>
</html>
