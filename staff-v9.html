<iframe id="kasir" src="staff-v6.html?v=20260823-expense-fix-v11" title="ISSHO CAFE KASIR"></iframe>
<script>
const U='https://xvhimyflrqrdudijwjdn.supabase.co';
const K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';
const f=document.getElementById('kasir');
async function api(path,opt={}){const h=Object.assign({apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},opt.headers||{});const r=await fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h}));const t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
function getPin(d,w){try{const p=d.getElementById('pin')?.value?.trim();if(p)return p}catch(e){}try{return w.eval('typeof P!=="undefined"?P:""')||''}catch(e){return ''}}
function rowsOf(x){if(Array.isArray(x)){if(x.length===1&&Array.isArray(x[0]))return x[0];if(x.length===1&&x[0]&&Array.isArray(x[0].result))return x[0].result;return x}if(x&&Array.isArray(x.result))return x.result;return x?[x]:[]}
function install(){try{const w=f.contentWindow,d=w.document;if(!d||!d.body)return false;if(d.getElementById('expense-detail-v11'))return true;const st=d.createElement('style');st.id='expense-style-v11';st.textContent='.expense-detail-v11{margin-top:14px;padding:14px;border:1px solid #3b3b3b;border-radius:12px;background:#151515}.expense-detail-v11 .erow{padding:11px 0;border-bottom:1px solid #333}.expense-detail-v11 .edesc{color:#fff;margin-top:5px;font-size:14px}.expense-detail-v11 .emeta{color:#aaa;font-size:12px;margin-top:4px}.expense-detail-v11 .etotal{display:flex;justify-content:space-between;border-top:1px solid #555;margin-top:8px;padding-top:10px;font-weight:800}';d.head.appendChild(st);return true}catch(e){return false}}
async function showDetails(){try{const w=f.contentWindow,d=w.document;if(!d||!d.body)return;const expense=d.getElementById('expense');const report=d.getElementById('report');const target=expense&&!expense.classList.contains('hidden')?expense:(report&&!report.classList.contains('hidden')?report:null);if(!target)return;const date=(d.getElementById('exDate')?.value||d.getElementById('date')?.value);const pin=getPin(d,w);if(!date||!pin)return;let box=d.getElementById('expense-detail-v11');if(!box){box=d.createElement('div');box.id='expense-detail-v11';box.className='card expense-detail-v11';const anchor=d.getElementById('expenseMsg')||d.getElementById('reportOut');(anchor?.parentNode||target).appendChild(box)}box.innerHTML='<h3 style="margin-top:0">💸 Detail Pengeluaran</h3><div class="muted">Memuat...</div>';const raw=await api('/rest/v1/rpc/staff_get_expenses',{method:'POST',body:JSON.stringify({p_pin:pin,p_from:date,p_to:date})});const list=rowsOf(raw);const total=list.reduce((s,e)=>s+(Number(e?.amount)||0),0);box.innerHTML='<h3 style="margin-top:0">💸 Detail Pengeluaran</h3>'+(list.length?list.map(e=>'<div class="erow"><div style="display:flex;justify-content:space-between;gap:12px"><div><b>'+esc(e?.category||'Operasional')+'</b><div class="edesc">Keterangan: <b>'+esc(e?.description||'Tidak ada keterangan')+'</b></div><div class="emeta">Tanggal: '+esc(e?.expense_date||date)+'</div></div><b>'+money(e?.amount)+'</b></div></div>').join(''):'<div class="muted">Belum ada pengeluaran pada tanggal ini.</div>')+(list.length?'<div class="etotal"><span>Total Pengeluaran</span><span>'+money(total)+'</span></div>':'')}catch(e){console.error('expense detail',e)}}
function boot(){if(!install())return;const w=f.contentWindow,d=w.document;if(d&&d.body&&!w.__expenseV11){w.__expenseV11=true;d.addEventListener('click',()=>setTimeout(showDetails,350));d.addEventListener('change',()=>setTimeout(showDetails,250));setInterval(showDetails,2500)}showDetails()}
f.addEventListener('load',boot);setInterval(boot,500);boot();
</script>
