<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — KASIR</title><style>html,body{margin:0;width:100%;height:100%;background:#0b0b0b}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="kasir" src="staff-v6.html?v=20260823-printer-wp58d-v1" title="ISSHO CAFE KASIR"></iframe><script>
const f=document.getElementById('kasir');
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
let printer={type:'',port:null,writer:null,device:null,iface:null,ep:null};
const C={INIT:[0x1b,0x40],ALIGN_CENTER:[0x1b,0x61,0x01],ALIGN_LEFT:[0x1b,0x61,0x00],BOLD_ON:[0x1b,0x45,0x01],BOLD_OFF:[0x1b,0x45,0x00],CUT:[0x1d,0x56,0x00]};
function bytes(a){return new Uint8Array(a)}
function textBytes(s){return new TextEncoder().encode(String(s).replace(/[^\x00-\xFF]/g,''))}
function escposLine(s=''){return [...textBytes(s),10]}
function wrapText(s,n=32){const out=[];String(s||'').split(/\r?\n/).forEach(part=>{let x=part;while(x.length>n){let p=x.lastIndexOf(' ',n);if(p<1)p=n;out.push(x.slice(0,p));x=x.slice(p).trimStart()}out.push(x)});return out}
function row(a,b,n=32){a=String(a);b=String(b);if(a.length+b.length>n)a=a.slice(0,Math.max(0,n-b.length-1))+'…';return a+' '.repeat(Math.max(1,n-a.length-b.length))+b}
function printerPayload(o,kind){const out=[...C.INIT,...C.ALIGN_CENTER,...C.BOLD_ON,...textBytes('ISSHO CAFE'),10,...C.BOLD_OFF,...textBytes(kind==='kitchen'?'NOTA DAPUR':'TANDA TERIMA PELANGGAN'),10,...C.ALIGN_LEFT,...textBytes('-'.repeat(32)),10,...escposLine('Order : '+(o.order_number||'-')),...escposLine('Meja  : '+(o.table_name||'Take Away'))];if(kind!=='kitchen')out.push(...escposLine('Bayar : '+(o.payment_method||'-')));out.push(...escposLine('-'.repeat(32)));for(const i of (o.items||[])){const name=String(i.name||'');const qty='x'+Number(i.qty||0);const price=kind==='kitchen'?'':money(Number(i.price||0)*Number(i.qty||0));const r=price?row(qty,price,32):qty;wrapText(name,26).forEach((line,j)=>out.push(...escposLine(j===0?line+' '.repeat(Math.max(1,32-line.length-r.length))+r:line)));}out.push(...escposLine('-'.repeat(32)));if(kind!=='kitchen'){out.push(...C.BOLD_ON,...escposLine(row('TOTAL',money(o.total),32)),...C.BOLD_OFF,...C.ALIGN_CENTER,...escposLine('Terima kasih'),...C.ALIGN_LEFT)}else{out.push(...C.ALIGN_CENTER,...C.BOLD_ON,...escposLine('SEGERA DIPROSES'),...C.BOLD_OFF,...C.ALIGN_LEFT)}out.push(...escposLine(''),...escposLine(''),...C.CUT);return bytes(out)}
async function serialConnect(){
  if(!('serial' in navigator))throw Error('Web Serial belum tersedia pada perangkat/browser ini. Untuk Bluetooth Classic WP58D, gunakan Chrome desktop atau Android 17+ yang mendukung Web Serial, lalu pastikan printer sudah dipasangkan (paired). Untuk kabel USB Android, gunakan tombol USB Printer.');
  try{const ports=await navigator.serial.getPorts();if(ports.length)printer.port=ports[0];else printer.port=await navigator.serial.requestPort();}
  catch(e){if(e?.name==='NotFoundError')throw Error('Tidak ada perangkat serial yang dipilih. Pasangkan WP58D Bluetooth atau sambungkan kabel USB/COM, lalu coba lagi.');throw e;}
  await printer.port.open({baudRate:9600,dataBits:8,stopBits:1,parity:'none',flowControl:'none'});printer.writer=printer.port.writable.getWriter();printer.type='serial';return true
}
async function serialPrint(data){if(!printer.writer)await serialConnect();await printer.writer.write(data)}
async function usbConnect(){
  if(!('usb' in navigator))throw Error('WebUSB tidak tersedia pada browser ini. Gunakan Chrome terbaru.');
  let dev=null;try{const granted=await navigator.usb.getDevices();if(granted.length===1)dev=granted[0];else if(granted.length>1)dev=granted.find(d=>/WP58D|58|thermal|printer/i.test((d.productName||'')))||granted[0]}catch(_){}
  if(!dev){try{dev=await navigator.usb.requestDevice({filters:[]})}catch(e){if(e?.name==='NotFoundError')throw Error('Tidak ada perangkat USB yang dipilih. Sambungkan WP58D dengan kabel data + OTG, izinkan Chrome mengakses perangkat, lalu pilih printer pada jendela pemilihan USB.');throw e;}}
  await dev.open();if(dev.configuration===null){if(!dev.configurations?.length)throw Error('WP58D terdeteksi tetapi tidak memiliki USB configuration yang dapat dibuka.');await dev.selectConfiguration(dev.configurations[0].configurationValue)}
  let candidates=[];for(const iface of dev.configuration.interfaces){for(const alt of iface.alternates){for(const ep of (alt.endpoints||[])){if(ep.direction==='out'&&(ep.type==='bulk'||ep.type==='interrupt'))candidates.push({iface:iface.interfaceNumber,ep:ep.endpointNumber,classCode:alt.interfaceClass||0})}}}
  const chosen=candidates.find(x=>x.classCode===7)||candidates[0];if(!chosen)throw Error('USB tersambung tetapi endpoint OUT ESC/POS tidak ditemukan. Printer/adapter mungkin memakai driver USB khusus.');
  try{await dev.claimInterface(chosen.iface)}catch(e){throw Error('USB printer ditemukan tetapi interface sedang dipakai sistem. Coba cabut-pasang OTG, tutup aplikasi printer lain, lalu ulangi.')}
  printer={...printer,type:'usb',device:dev,iface:chosen.iface,ep:chosen.ep};return true
}
async function usbPrint(data){if(!printer.device)await usbConnect();const r=await printer.device.transferOut(printer.ep,data);if(r.status!=='ok')throw Error('USB printer gagal menerima data: '+r.status)}
async function connectPrinter(kind){try{if(kind==='serial')await serialConnect();else await usbConnect();setStatus('✓ Printer WP58D tersambung via '+(kind==='serial'?'Bluetooth/USB Serial':'USB langsung'));}catch(e){setStatus('Gagal tersambung: '+e.message,true)}}
async function printRaw(data){if(printer.type==='serial')return serialPrint(data);if(printer.type==='usb')return usbPrint(data);throw Error('Printer belum tersambung. Pilih Bluetooth/USB Serial atau USB Printer terlebih dahulu.')}
async function testPrinter(){try{const data=bytes([...C.INIT,...C.ALIGN_CENTER,...C.BOLD_ON,...textBytes('ISSHO CAFE'),10,...C.BOLD_OFF,...textBytes('TES PRINTER WP58D'),10,...textBytes('58mm / ESC-POS'),10,...escposLine('-'.repeat(32)),...escposLine('Printer siap digunakan.'),...escposLine(''),...escposLine(''),...C.CUT]);await printRaw(data);setStatus('✓ Test print berhasil.')}catch(e){setStatus('Test print gagal: '+e.message,true)}}
function setStatus(msg,err=false){const d=f.contentWindow?.document,s=d?.getElementById('wp58dStatus');if(s){s.textContent=msg;s.className=err?'err':'ok'}}
function addPrinterPanel(){try{const w=f.contentWindow,d=w.document,app=d.getElementById('app');if(!app)return false;if(d.getElementById('wp58d-panel'))return true;const panel=d.createElement('div');panel.id='wp58d-panel';panel.className='card noprint';panel.innerHTML='<h3 style="margin-top:0">🖨️ Printer Thermal WP58D — 58mm</h3><div class="muted">Model pada foto: WP58D • USB + Bluetooth Classic • 58mm • ESC/POS. Sistem mendukung USB/COM, USB langsung melalui WebUSB bila perangkat mengekspos interface yang dapat diakses browser, serta Bluetooth Classic melalui Web Serial pada perangkat/browser yang mendukungnya.</div><div class="actions"><button class="blue" id="wpConnectSerial">🔌 Hubungkan USB / COM</button><button class="dark" id="wpConnectUsb">🖨️ Hubungkan USB Printer</button><button class="gold" id="wpTest">🧾 Test Print</button></div><div id="wp58dStatus" class="muted" style="margin-top:8px">Belum terhubung. Setelah tersambung, tombol Print Pelanggan / Print Dapur akan mengirim nota langsung ke WP58D.</div>';app.insertBefore(panel,app.children[1]||null);d.getElementById('wpConnectSerial').onclick=()=>connectPrinter('serial');d.getElementById('wpConnectUsb').onclick=()=>connectPrinter('usb');d.getElementById('wpTest').onclick=testPrinter;return true}catch(e){return false}}
function installOverrides(){try{const w=f.contentWindow,d=w.document;if(!d||!w.login)return false;if(w.__wp58dOverrides){addPrinterPanel();return true}addPrinterPanel();const oldCustomer=w.printCustomer,oldKitchen=w.printKitchen;w.printCustomer=async function(id,auto=false){const o=(w.ORD||[]).find(x=>x.id===id);if(!o)return;try{await printRaw(printerPayload(o,'customer'));setStatus('✓ Nota pelanggan terkirim ke WP58D.')}catch(e){if(!printer.type&&oldCustomer)oldCustomer(id,auto);else setStatus('Gagal print WP58D: '+e.message,true)}};w.printKitchen=async function(id){const o=(w.ORD||[]).find(x=>x.id===id);if(!o)return;try{await printRaw(printerPayload(o,'kitchen'));setStatus('✓ Nota dapur terkirim ke WP58D.')}catch(e){if(!printer.type&&oldKitchen)oldKitchen(id);else setStatus('Gagal print WP58D: '+e.message,true)}};w.__wp58dOverrides=true;return true}catch(e){return false}}
let tries=0;f.addEventListener('load',()=>{const t=setInterval(()=>{tries++;if(installOverrides()||tries>120)clearInterval(t)},250)});setInterval(()=>{if(f.contentWindow?.document?.getElementById('app'))installOverrides()},1500);
</script></body></html>
