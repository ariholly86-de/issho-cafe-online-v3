<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — KASIR</title><style>html,body{margin:0;width:100%;height:100%;background:#0b0b0b}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="kasir" src="staff-v6.html?v=20260823-expense-print-v13" title="ISSHO CAFE KASIR"></iframe><script>const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',f=document.getElementById('kasir');async function api(path,opt={}){const h=Object.assign({apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},opt.headers||{});const r=await fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h}));const t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));function rows(x){if(Array.isArray(x))return x.length===1&&Array.isArray(x[0])?x[0]:x;if(x&&Array.isArray(x.result))return x.result;return x?[x]:[]}function getPin(d,w){try{return d.getElementById('pin')?.value?.trim()||w.eval('typeof P!=="undefined"?P:""')}catch(e){return''}}function printExpenses(list,date,total){const w=window.open('','_blank','width=420,height=700');if(!w)return;const r=list.map(e=>'<div style="border-bottom:1px dashed #777;padding:7px 0"><b>'+esc(e.category||'Operasional')+'</b><br>Keterangan: '+esc(e.description||'Tidak ada keterangan')+'<br>Tanggal: '+esc(e.expense_date||date)+'<br><b>'+money(e.amount)+'</b></div>').join('');w.document.write('<!doctype html><html><head><meta charset="utf-8"><style>@page{size:58mm auto;margin:3mm}body{font-family:Arial,sans-serif;width:52mm;font-size:11px;margin:0;color:#000}h2{text-align:center;font-size:14px}</style></head><body><h2>ISSHO CAFE<br>PENGELUARAN HARIAN</h2><div>Tanggal: '+esc(date)+'</div>'+r+'<hr><b>TOTAL PENGELUARAN: '+money(total)+'</b><script>window.onload=()=>window.print()<\/script></body></html>');w.document.close()}async function show(){try{const d=f.contentWindow.document,w=f.contentWindow,target=d.getElementById('expense')||d.getElementById('report');if(!target)return;const date=d.getElementById('exDate')?.value||d.getElementById('date')?.value;if(!date)return;let b=d.getElementById('daily-expense-print');if(!b){b=d.createElement('div');b.id='daily-expense-print';b.style.cssText='margin:14px 0;padding:14px;background:#151515;border:1px solid #333;border-radius:12px;animation:none!important;transition:none!important';(d.getElementById('expenseMsg')?.parentNode||target).appendChild(b)}const list=rows(await api('/rest/v1/rpc/staff_get_expenses',{method:'POST',body:JSON.stringify({p_pin:getPin(d,w),p_from:date,p_to:date})}));const total=list.reduce((s,e)=>s+(Number(e.amount)||0),0);b.innerHTML='<h3 style="margin:0 0 10px">💸 Pengeluaran Harian</h3>'+(list.length?list.map(e=>'<div style="padding:8px 0;border-bottom:1px solid #333"><b>'+esc(e.category||'Operasional')+'</b><br>Keterangan: <b>'+esc(e.description||'Tidak ada keterangan')+'</b><br><small>'+esc(e.expense_date||date)+'</small><strong style="float:right">'+money(e.amount)+'</strong></div>').join(''):'<div>Belum ada pengeluaran.</div>')+'<div style="margin-top:10px;font-weight:800">Total: '+money(total)+'</div><button id="print-expense-daily" style="margin-top:10px;background:#1687f7!important;color:#fff!important;border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer">🖨️ Print Pengeluaran Harian</button>';d.getElementById('print-expense-daily').onclick=()=>printExpenses(list,date,total)}catch(e){console.error('expense print',e)}}function boot(){setTimeout(show,500)}f.addEventListener('load',boot);setTimeout(boot,1000)</script></body></html>
