<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — STOK BARANG</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f5f5f5;font:14px Arial}.wrap{max-width:1250px;margin:auto;padding:14px}.card{background:#171717;border:1px solid #333;border-radius:14px;padding:14px;margin:10px 0}.login{max-width:430px;margin:10vh auto}.brand{font-size:24px;font-weight:900}.muted{color:#999}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stat{background:#222;border:1px solid #3b3b3b;border-radius:12px;padding:13px}.stat b{display:block;font-size:22px;margin-top:5px}.tabs,.catbar{display:flex;gap:7px;overflow:auto}.tabs button,.catbar button{white-space:nowrap}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;color:#aaa;font-size:12px;margin:5px 0}.field input,.field select,.field textarea{width:100%;background:#0f0f0f;color:#fff;border:1px solid #444;border-radius:9px;padding:10px}.field textarea{min-height:70px}button{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer;background:#2a2a2a;color:#fff}.on,.primary{background:#b68142}.green{background:#2f7d50}.red{background:#8d3c3c}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hide{display:none!important}.error{color:#ff8e8e;min-height:20px;margin-top:8px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:9px;border-bottom:1px solid #2e2e2e;text-align:left}th{color:#aaa;font-size:11px}td.r{text-align:right}.low{color:#ffd166;font-weight:900}.ok{color:#7ddc9c;font-weight:900}.quickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.quickitem{background:#202020;border:1px solid #383838;border-radius:11px;padding:9px}.quickitem b{display:block;margin-bottom:7px;line-height:1.25}.quickitem .qrow{display:grid;grid-template-columns:1fr 85px;gap:7px}.quickitem input{width:100%;background:#0d0d0d;color:#fff;border:1px solid #444;border-radius:8px;padding:9px}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#2a2a2a;color:#ddd;font-size:11px;margin-bottom:8px}.notice{background:#201d18;border:1px solid #5b4931;padding:10px;border-radius:10px;color:#e8d6bb}@media(max-width:600px){.row{grid-template-columns:1fr}.brand{font-size:20px}.quickgrid{grid-template-columns:1fr}}</style></head><body><div id="login" class="wrap login"><div class="card"><div class="brand">📦 ISSHO CAFE — STOK BARANG</div><p class="muted">Login menggunakan PIN OWNER yang sama dengan aplikasi OWNER.</p><div class="field"><label>PIN OWNER</label><input id="pin" type="password" inputmode="numeric" placeholder="PIN OWNER"></div><div class="actions"><button class="primary" id="loginBtn">MASUK</button></div><div id="err" class="error"></div></div></div><main id="app" class="wrap hide"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><div class="brand">📦 STOK BARANG ISSHO CAFE</div><div class="muted">Master utama • barang masuk cepat • barang keluar • pemakaian • rekapan</div></div><button class="red" id="logout">KELUAR</button></div><div class="card"><div id="tabs" class="tabs"><button class="on" data-t="dash">Dashboard</button><button data-t="items">Master Utama</button><button data-t="in">Barang Masuk</button><button data-t="out">Barang Keluar</button><button data-t="usage">Pemakaian Menu</button><button data-t="report">Rekap Detail</button></div></div><section id="content"></section></main><script>
const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';let PIN='',items=[],products=[],usages=[],tab='dash',quickCat='Minuman Sachet';
const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10),n=x=>Number(x||0).toLocaleString('id-ID',{maximumFractionDigits:3}),esc=x=>String(x??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
async function rpc(fn,body){const r=await fetch(U+'/rest/v1/rpc/'+fn,{method:'POST',cache:'no-store',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null}
async function load(){items=await rpc('inventory_list_items',{p_owner_pin:PIN});usages=await rpc('inventory_usage_list',{p_owner_pin:PIN});products=await rpc('inventory_products_list',{p_owner_pin:PIN})}
function opts(a,label){return a.map(x=>`<option value="${x.id}">${esc(x.name)}${x.unit?' ('+esc(x.unit)+')':''}</option>`).join('')}
function range(){return `<div class="row"><div class="field"><label>DARI</label><input id="from" type="date" value="${today()}"></div><div class="field"><label>SAMPAI</label><input id="to" type="date" value="${today()}"></div></div>`}
async function dash(){const r=await rpc('inventory_dashboard',{p_owner_pin:PIN,p_from:$('from')?.value||today(),p_to:$('to')?.value||today()});return `<div class="card">${range()}<div class="actions"><button class="primary" id="show">Tampilkan</button></div></div><div class="grid"><div class="stat">Barang Masuk<b>${n(r.incoming)}</b></div><div class="stat">Keluar Manual<b>${n(r.outgoing_manual)}</b></div><div class="stat">Keluar Penjualan<b>${n(r.outgoing_auto)}</b></div><div class="stat">Total Keluar<b>${n(r.outgoing_total)}</b></div><div class="stat">Stok Menipis<b class="low">${r.low_stock}</b></div></div><div class="card"><h3>Posisi Stok</h3><div class="table"><table><thead><tr><th>Barang</th><th>Kategori</th><th>Satuan</th><th class="r">Stok</th><th class="r">Minimum</th><th>Status</th></tr></thead><tbody>${(r.items||[]).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.category)}</td><td>${esc(x.unit)}</td><td class="r"><b>${n(x.stock_now)}</b></td><td class="r">${n(x.min_stock)}</td><td>${Number(x.stock_now)<=Number(x.min_stock)?'<span class="low">MENIPIS</span>':'<span class="ok">AMAN</span>'}</td></tr>`).join('')||'<tr><td colspan="6">Belum ada barang.</td></tr>'}</tbody></table></div></div>`}
const baseName=x=>String(x.name||'').replace(/\s*\/\s*(Ice|HOT)$/i,'').replace(/\s*\+\s*Telur$/i,'').trim();
function quickGroups(){const groups={"Minuman Sachet":[],Indomie:[],"Mie Sedaap":[]};items.forEach(x=>{if(groups[x.category])groups[x.category].push(x)});Object.values(groups).forEach(a=>a.sort((a,b)=>a.name.localeCompare(b.name,'id')));return groups}
function itemsPage(){const g=quickGroups();return `<div class="card"><h3>⭐ Master Barang Utama</h3><div class="notice">Master sudah disiapkan dari menu yang ada: <b>Minuman Sachet</b> → <b>Indomie</b> → <b>Mie Sedaap</b>. Nama duplikat Es/Hot dan +Telur tidak dibuat sebagai barang terpisah.</div><div class="catbar" style="margin-top:10px"><button class="${quickCat==='Minuman Sachet'?'on':''}" data-qcat="Minuman Sachet">Minuman Sachet (${g['Minuman Sachet'].length})</button><button class="${quickCat==='Indomie'?'on':''}" data-qcat="Indomie">Indomie (${g.Indomie.length})</button><button class="${quickCat==='Mie Sedaap'?'on':''}" data-qcat="Mie Sedaap">Mie Sedaap (${g['Mie Sedaap'].length})</button></div></div><div class="card"><h3>📦 ${esc(quickCat)}</h3><div class="quickgrid">${(g[quickCat]||[]).map(x=>`<div class="quickitem"><span class="badge">${esc(x.unit||'pcs')}</span><b>${esc(x.name)}</b><div class="muted">Stok sekarang: ${n(x.stock_manual)}</div></div>`).join('')||'<div class="muted">Belum ada master pada kategori ini.</div>'}</div></div><div class="card"><h3>➕ Tambah Barang Manual</h3><div class="row"><div class="field"><label>Nama</label><input id="name"></div><div class="field"><label>Kategori</label><select id="cat"><option>Minuman Sachet</option><option>Indomie</option><option>Mie Sedaap</option><option>Lainnya</option></select></div><div class="field"><label>Satuan</label><input id="unit" value="pcs"></div><div class="field"><label>Stok Awal</label><input id="open" type="number" step="0.001" value="0"></div><div class="field"><label>Stok Minimum</label><input id="min" type="number" step="0.001" value="0"></div></div><div class="actions"><button class="primary" id="save">Simpan Barang</button></div></div>`}
function quickInPage(){const g=quickGroups();const list=g[quickCat]||[];return `<div class="card"><h3>📥 Barang Masuk Cepat</h3><div class="notice">Pilih kategori, isi jumlah barang yang baru masuk, lalu tekan <b>Simpan Semua</b>. Kolom yang kosong/0 akan dilewati.</div><div class="catbar" style="margin-top:10px"><button class="${quickCat==='Minuman Sachet'?'on':''}" data-qcat="Minuman Sachet">Minuman Sachet (${g['Minuman Sachet'].length})</button><button class="${quickCat==='Indomie'?'on':''}" data-qcat="Indomie">Indomie (${g.Indomie.length})</button><button class="${quickCat==='Mie Sedaap'?'on':''}" data-qcat="Mie Sedaap">Mie Sedaap (${g['Mie Sedaap'].length})</button></div><div class="field" style="margin-top:10px"><label>Tanggal</label><input id="quickDate" type="date" value="${today()}"></div><div class="quickgrid" style="margin-top:10px">${list.map(x=>`<div class="quickitem"><b>${esc(x.name)}</b><div class="qrow"><span class="muted" style="padding:9px 0">stok ${n(x.stock_manual)}</span><input class="qin" data-id="${x.id}" type="number" min="0" step="0.001" placeholder="Jumlah masuk"></div></div>`).join('')||'<div class="muted">Belum ada master.</div>'}</div><div class="actions"><button class="green" id="saveQuick">💾 Simpan Semua</button><button id="clearQuick">Kosongkan</button></div><div id="quickMsg" class="error"></div></div>`}
function movePage(type){return `<div class="card"><h3>${type==='IN'?'📥 Barang Masuk':'📤 Barang Keluar'}</h3>${type==='IN'?'<div class="actions"><button class="primary" id="switchQuick">Gunakan Barang Masuk Cepat</button></div>':''}<div class="row"><div class="field"><label>Barang</label><select id="mi">${opts(items)}</select></div><div class="field"><label>Jumlah</label><input id="qty" type="number" min="0.001" step="0.001"></div><div class="field"><label>Tanggal</label><input id="date" type="date" value="${today()}"></div><div class="field"><label>Sumber</label><select id="src"><option>MANUAL</option><option>PEMBELIAN</option><option>RETUR</option><option>RUSAK</option><option>TERPAKAI</option><option>LAINNYA</option></select></div></div><div class="field"><label>Keterangan</label><textarea id="note"></textarea></div><div class="actions"><button class="${type==='IN'?'green':'red'}" id="saveMove">Simpan</button></div></div>`}
function usagePage(){return `<div class="card"><h3>🔗 Pemakaian Menu</h3><p class="muted">Atur berapa banyak bahan yang dipakai setiap 1 menu terjual. Transaksi PAID akan dihitung otomatis.</p><div class="row"><div class="field"><label>Menu</label><select id="prod">${opts(products)}</select></div><div class="field"><label>Barang</label><select id="itm">${opts(items)}</select></div><div class="field"><label>Jumlah / 1 menu</label><input id="uq" type="number" min="0.001" step="0.001"></div></div><div class="actions"><button class="primary" id="saveU">Simpan Pemetaan</button></div></div><div class="card"><h3>Pemetaan Aktif</h3><div class="table"><table><thead><tr><th>Menu</th><th>Barang</th><th>Pemakaian</th><th>Aksi</th></tr></thead><tbody>${usages.map(x=>`<tr><td>${esc(x.product_name)}</td><td>${esc(x.inventory_item_name)} (${esc(x.unit)})</td><td>${n(x.quantity_per_sale)}</td><td><button class="red" data-del="${x.product_id}|${x.inventory_item_id}">Hapus</button></td></tr>`).join('')||'<tr><td colspan="4">Belum ada pemetaan.</td></tr>'}</tbody></table></div></div>`}
async function report(){const r=await rpc('inventory_movements_report',{p_owner_pin:PIN,p_from:$('from')?.value||today(),p_to:$('to')?.value||today()});return `<div class="card">${range()}<div class="actions"><button class="primary" id="show">Tampilkan</button></div></div><div class="card"><h3>📥📤 Transaksi Manual</h3><div class="table"><table><thead><tr><th>Tanggal</th><th>Barang</th><th>Jenis</th><th>Jumlah</th><th>Sumber</th><th>Keterangan</th></tr></thead><tbody>${(r.manual||[]).map(x=>`<tr><td>${esc(x.movement_date)}</td><td>${esc(x.item_name)}</td><td>${x.movement_type}</td><td>${n(x.quantity)} ${esc(x.unit)}</td><td>${esc(x.source)}</td><td>${esc(x.note||'')}</td></tr>`).join('')||'<tr><td colspan="6">Belum ada transaksi.</td></tr>'}</tbody></table></div></div><div class="card"><h3>🤖 Pemakaian Otomatis dari Penjualan</h3><div class="table"><table><thead><tr><th>Barang</th><th>Jumlah Terpakai</th><th>Satuan</th></tr></thead><tbody>${(r.automatic||[]).map(x=>`<tr><td>${esc(x.item_name)}</td><td>${n(x.qty)}</td><td>${esc(x.unit)}</td></tr>`).join('')||'<tr><td colspan="3">Belum ada pemakaian otomatis.</td></tr>'}</tbody></table></div></div>`}
async function render(){const c=$('content');c.innerHTML='<div class="card">Memuat...</div>';try{c.innerHTML=tab==='dash'?await dash():tab==='items'?itemsPage():tab==='in'?quickInPage():tab==='out'?movePage('OUT'):tab==='usage'?usagePage():await report();bind()}catch(e){c.innerHTML='<div class="card error">Gagal memuat: '+esc(e.message)+'</div>'}}
function bind(){document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});document.querySelectorAll('[data-qcat]').forEach(b=>b.onclick=()=>{quickCat=b.dataset.qcat;render()});if($('show'))$('show').onclick=render;if($('switchQuick'))$('switchQuick').onclick=()=>renderQuick();if($('clearQuick'))$('clearQuick').onclick=()=>document.querySelectorAll('.qin').forEach(i=>i.value='');if($('save'))$('save').onclick=async()=>{try{if(!$('name').value.trim())throw Error('Nama barang wajib diisi');await rpc('inventory_save_item',{p_owner_pin:PIN,p_id:null,p_name:$('name').value.trim(),p_category:$('cat').value,p_unit:$('unit').value||'pcs',p_min_stock:+$('min').value||0,p_opening_stock:+$('open').value||0,p_active:true});await load();alert('Barang tersimpan');render()}catch(e){alert(e.message)}};if($('saveQuick'))$('saveQuick').onclick=saveQuick;if($('saveMove'))$('saveMove').onclick=async()=>{try{const q=+$('qty').value;if(q<=0)throw Error('Jumlah harus lebih dari 0');await rpc('inventory_add_movement',{p_owner_pin:PIN,p_item_id:$('mi').value,p_type:'OUT',p_qty:q,p_date:$('date').value,p_source:$('src').value,p_note:$('note').value,p_created_by:'OWNER'});alert('Transaksi tersimpan');await load();render()}catch(e){alert(e.message)}};if($('saveU'))$('saveU').onclick=async()=>{try{const q=+$('uq').value;if(q<=0)throw Error('Jumlah pemakaian harus lebih dari 0');await rpc('inventory_save_usage',{p_owner_pin:PIN,p_product_id:$('prod').value,p_item_id:$('itm').value,p_qty:q});await load();alert('Pemetaan tersimpan');render()}catch(e){alert(e.message)}};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Hapus pemetaan?')){const a=b.dataset.del.split('|');await rpc('inventory_delete_usage',{p_owner_pin:PIN,p_product_id:a[0],p_item_id:a[1]});await load();render()}})}
function renderQuick(){tab='in';render()}
async function saveQuick(){const inputs=[...document.querySelectorAll('.qin')].filter(i=>Number(i.value)>0);const msg=$('quickMsg');if(!inputs.length){msg.textContent='Isi minimal satu jumlah barang masuk.';return}const date=$('quickDate').value||today();const btn=$('saveQuick');btn.disabled=true;let ok=0;try{for(const i of inputs){await rpc('inventory_add_movement',{p_owner_pin:PIN,p_item_id:i.dataset.id,p_type:'IN',p_qty:Number(i.value),p_date:date,p_source:'PEMBELIAN',p_note:'Barang masuk cepat',p_created_by:'OWNER'});ok++}msg.textContent='Berhasil menyimpan '+ok+' barang.';await load();setTimeout(render,500)}catch(e){msg.textContent='Gagal setelah '+ok+' barang: '+e.message}finally{btn.disabled=false}}
$('loginBtn').onclick=async()=>{PIN=$('pin').value.trim();$('err').textContent='Memeriksa PIN Owner...';if(!PIN){$('err').textContent='PIN Owner wajib diisi.';return}try{await rpc('inventory_auth',{p_owner_pin:PIN});await load();$('login').classList.add('hide');$('app').classList.remove('hide');$('err').textContent='';render()}catch(e){$('err').textContent='PIN Owner tidak diterima atau koneksi gagal: '+e.message;PIN=''}};$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});$('logout').onclick=()=>location.reload();
</script></body></html>
