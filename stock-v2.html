<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>ISSHO CAFE — STOK</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0b0b0b;--panel:#151515;--panel2:#1d1d1d;--line:#343434;--text:#f7f7f7;--muted:#bdbdbd;--gold:#b68142;--green:#2f7d50;--red:#8d3c3c}
body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}
button,input,select,textarea{font:inherit}.wrap{max-width:1180px;margin:auto;padding:16px}.login{max-width:430px;margin:10vh auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.brand{font-size:28px;font-weight:900;letter-spacing:-.4px}.sub{color:var(--muted);margin-top:5px}
.field label{display:block;font-size:12px;font-weight:800;color:#ddd;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;background:#0e0e0e;color:#fff;border:1px solid #444;border-radius:10px;padding:11px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}.field textarea{min-height:86px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:10px;padding:11px 14px;font-weight:900;cursor:pointer;background:#292929;color:#fff}button:hover{filter:brightness(1.1)}.primary{background:var(--gold)}.green{background:var(--green)}.red{background:var(--red)}.ghost{background:#242424;border:1px solid #414141}
.hide{display:none!important}.error{color:#ff9a9a;margin-top:8px;min-height:20px}.success{color:#8ee0ad;margin-top:8px;min-height:20px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.topActions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.nav button{background:#1f1f1f;border:1px solid #363636;padding:13px 10px}.nav button.on{background:var(--gold);border-color:var(--gold)}.secondary{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.secondary button{font-size:12px;padding:9px 11px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--panel2);border:1px solid #383838;border-radius:13px;padding:13px}.stat span{display:block;color:#aaa;font-size:12px;font-weight:800}.stat b{display:block;font-size:25px;margin-top:5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.toolbar .grow{flex:1;min-width:220px}.search{width:100%;background:#0e0e0e;color:#fff;border:1px solid #444;border-radius:10px;padding:11px}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:10px;border-bottom:1px solid #2e2e2e;text-align:left;vertical-align:middle}th{font-size:11px;color:#aaa;text-transform:uppercase}.r{text-align:right}.badge{display:inline-block;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:900;background:#292929}.ok{color:#8ee0ad}.low{color:#ffd37a}.out{color:#ff8e8e}.empty{padding:24px;text-align:center;color:#aaa}.sectionTitle{font-size:18px;font-weight:900;margin-bottom:3px}
@media(max-width:760px){.wrap{padding:10px}.brand{font-size:23px}.top{align-items:flex-start;flex-direction:column}.topActions{justify-content:flex-start}.stats{grid-template-columns:repeat(2,1fr)}.nav{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="wrap login"><div class="card"><div class="brand">📦 ISSHO CAFE</div><div class="sectionTitle" style="margin-top:5px">Stok Barang</div><div class="sub">Masuk menggunakan PIN OWNER yang sama dengan aplikasi Owner.</div><div class="field" style="margin-top:16px"><label>PIN OWNER</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Masukkan PIN Owner"></div><div class="actions"><button class="primary" id="loginBtn">MASUK</button></div><div id="err" class="error"></div></div></div>
<main id="app" class="wrap hide">
<div class="top"><div><div class="brand">📦 STOK BARANG ISSHO CAFE</div><div class="sub">Satu halaman untuk cek stok, barang masuk, barang keluar, dan koreksi.</div></div><div class="topActions"><button class="ghost" id="refresh">🔄 Refresh</button><button class="red" id="logout">KELUAR</button></div></div>
<div class="nav" id="nav"><button class="on" data-view="stock">📦 Stok</button><button data-view="in">📥 Barang Masuk</button><button data-view="out">📤 Barang Keluar</button><button data-view="report">📊 Rekap</button></div>
<div class="secondary"><button class="ghost" data-view="master">⚙️ Master Barang</button><button class="ghost" data-view="usage">🔗 Pemakaian Menu</button><button class="ghost" data-view="sales">📋 Detail Barang Laku</button></div>
<section id="content"></section></main>
<script>
const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';let PIN='',items=[],products=[],usages=[],view='stock',lastDash=null;
const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'}),n=x=>Number(x||0).toLocaleString('id-ID',{maximumFractionDigits:3}),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function rpc(fn,body){const r=await fetch(U+'/rest/v1/rpc/'+fn,{method:'POST',cache:'no-store',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null}
async function load(){items=await rpc('inventory_list_items',{p_owner_pin:PIN});products=await rpc('inventory_products_list',{p_owner_pin:PIN});usages=await rpc('inventory_usage_list',{p_owner_pin:PIN});lastDash=await rpc('inventory_dashboard',{p_owner_pin:PIN,p_from:today(),p_to:today()})}
function opts(a){return a.map(x=>`<option value="${x.id}">${esc(x.name)}${x.unit?' ('+esc(x.unit)+')':''}</option>`).join('')}
function navActive(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===view))}
function stockRows(list){if(!list.length)return '<tr><td colspan="6" class="empty">Tidak ada barang yang cocok.</td></tr>';return list.map(x=>{const s=Number(x.stock_now||0),m=Number(x.min_stock||0),cls=s<=0?'out':s<=m?'low':'ok',label=s<=0?'HABIS':s<=m?'MENIPIS':'AMAN';return `<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.category||'Lainnya')}</td><td>${esc(x.unit||'pcs')}</td><td class="r"><b>${n(s)}</b></td><td class="r">${n(m)}</td><td><span class="badge ${cls}">${label}</span></td></tr>`}).join('')}
async function stockPage(){const r=lastDash||await rpc('inventory_dashboard',{p_owner_pin:PIN,p_from:today(),p_to:today()});lastDash=r;const list=(r.items||[]).slice().sort((a,b)=>Number(a.stock_now||0)-Number(b.stock_now||0));return `<div class="card"><div class="stats"><div class="stat"><span>Total jenis barang</span><b>${n(list.length)}</b></div><div class="stat"><span>Stok menipis</span><b>${n(r.low_stock)}</b></div><div class="stat"><span>Barang masuk hari ini</span><b>${n(r.incoming)}</b></div><div class="stat"><span>Barang keluar hari ini</span><b>${n(r.outgoing_total)}</b></div></div></div><div class="card"><div class="toolbar"><div class="grow field"><label>Cari barang</label><input id="stockSearch" class="search" placeholder="Ketik nama barang..."></div><div class="field"><label>Status</label><select id="stockStatus"><option value="all">Semua</option><option value="out">Habis</option><option value="low">Menipis</option><option value="ok">Aman</option></select></div></div><div class="tableWrap" style="margin-top:12px"><table><thead><tr><th>Barang</th><th>Kategori</th><th>Satuan</th><th class="r">Stok</th><th class="r">Minimum</th><th>Status</th></tr></thead><tbody id="stockBody">${stockRows(list)}</tbody></table></div></div>`}
function filterStock(){const q=($('stockSearch')?.value||'').trim().toLowerCase(),st=$('stockStatus')?.value||'all';const list=(lastDash?.items||[]).filter(x=>{const s=Number(x.stock_now||0),m=Number(x.min_stock||0),status=s<=0?'out':s<=m?'low':'ok';return(!q||String(x.name||'').toLowerCase().includes(q))&&(st==='all'||status===st)}).sort((a,b)=>Number(a.stock_now||0)-Number(b.stock_now||0));if($('stockBody'))$('stockBody').innerHTML=stockRows(list)}
function inPage(){return `<div class="card"><div class="sectionTitle">📥 Barang Masuk</div><div class="sub">Catat barang yang baru dibeli atau diterima. Setelah disimpan, stok langsung bertambah.</div><div class="row" style="margin-top:15px"><div class="field"><label>Barang</label><select id="inItem">${opts(items)}</select></div><div class="field"><label>Jumlah</label><input id="inQty" type="number" min="0.001" step="0.001" placeholder="Contoh: 10"></div><div class="field"><label>Tanggal</label><input id="inDate" type="date" value="${today()}"></div><div class="field"><label>Sumber</label><select id="inSource"><option>PEMBELIAN</option><option>RETUR</option><option>LAINNYA</option></select></div></div><div class="field" style="margin-top:12px"><label>Keterangan</label><textarea id="inNote" placeholder="Opsional"></textarea></div><div class="actions"><button class="green" id="saveIn">💾 Simpan Barang Masuk</button></div><div id="inMsg" class="success"></div></div>`}
function outPage(){return `<div class="card"><div class="sectionTitle">📤 Barang Keluar</div><div class="sub">Gunakan untuk barang yang dipakai, rusak, retur, atau keluar manual.</div><div class="row" style="margin-top:15px"><div class="field"><label>Barang</label><select id="outItem">${opts(items)}</select></div><div class="field"><label>Jumlah</label><input id="outQty" type="number" min="0.001" step="0.001" placeholder="Contoh: 2"></div><div class="field"><label>Tanggal</label><input id="outDate" type="date" value="${today()}"></div><div class="field"><label>Jenis Keluar</label><select id="outSource"><option>MANUAL</option><option>TERPAKAI</option><option>RUSAK</option><option>RETUR</option><option>LAINNYA</option></select></div></div><div class="field" style="margin-top:12px"><label>Keterangan</label><textarea id="outNote" placeholder="Contoh: dipakai untuk operasional"></textarea></div><div class="actions"><button class="red" id="saveOut">💾 Simpan Barang Keluar</button></div><div id="outMsg" class="success"></div></div>`}
function masterPage(){return `<div class="card"><div class="sectionTitle">⚙️ Master Barang</div><div class="sub">Tambah barang yang belum ada. Barang yang sudah ada tidak perlu dibuat ulang.</div><div class="row" style="margin-top:15px"><div class="field"><label>Nama Barang</label><input id="mName" placeholder="Contoh: Teh Botol"></div><div class="field"><label>Kategori</label><select id="mCat"><option>Minuman Sachet</option><option>Indomie</option><option>Mie Sedaap</option><option>Lainnya</option></select></div><div class="field"><label>Satuan</label><select id="mUnit"><option>pcs</option><option>bungkus</option><option>botol</option><option>gelas</option><option>pack</option><option>dus</option><option>kg</option><option>liter</option></select></div><div class="field"><label>Stok Awal</label><input id="mOpen" type="number" min="0" step="0.001" value="0"></div><div class="field"><label>Stok Minimum</label><input id="mMin" type="number" min="0" step="0.001" value="0"></div></div><div class="actions"><button class="primary" id="saveMaster">💾 Simpan Barang</button></div><div id="mMsg" class="success"></div></div><div class="card"><div class="sectionTitle">Daftar Master (${n(items.length)})</div><div class="tableWrap" style="margin-top:10px"><table><thead><tr><th>Barang</th><th>Kategori</th><th>Satuan</th><th class="r">Stok Manual</th><th class="r">Minimum</th></tr></thead><tbody>${items.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),'id')).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.category||'')}</td><td>${esc(x.unit||'')}</td><td class="r">${n(x.stock_manual)}</td><td class="r">${n(x.min_stock)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Belum ada barang.</td></tr>'}</tbody></table></div></div>`}
function usagePage(){return `<div class="card"><div class="sectionTitle">🔗 Pemakaian Menu</div><div class="sub">Hubungkan menu penjualan dengan bahan stok. Penjualan akan mengurangi stok otomatis sesuai pemetaan.</div><div class="row" style="margin-top:15px"><div class="field"><label>Menu</label><select id="uProd">${opts(products)}</select></div><div class="field"><label>Barang/Bahan</label><select id="uItem">${opts(items)}</select></div><div class="field"><label>Jumlah per 1 menu</label><input id="uQty" type="number" min="0.001" step="0.001" placeholder="Contoh: 1"></div></div><div class="actions"><button class="primary" id="saveUsage">💾 Simpan Pemetaan</button></div><div id="uMsg" class="success"></div></div><div class="card"><div class="sectionTitle">Pemetaan Aktif</div><div class="tableWrap" style="margin-top:10px"><table><thead><tr><th>Menu</th><th>Barang</th><th>Jumlah</th><th>Aksi</th></tr></thead><tbody>${usages.map(x=>`<tr><td>${esc(x.product_name)}</td><td>${esc(x.inventory_item_name)} (${esc(x.unit)})</td><td>${n(x.quantity_per_sale)}</td><td><button class="red" data-del="${x.product_id}|${x.inventory_item_id}">Hapus</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada pemetaan.</td></tr>'}</tbody></table></div></div>`}
async function reportPage(){const from=window.reportFrom||today(),to=window.reportTo||today(),r=await rpc('inventory_movements_report',{p_owner_pin:PIN,p_from:from,p_to:to}),manual=r.manual||[];const incoming=manual.filter(x=>String(x.movement_type).toUpperCase()==='IN').reduce((a,x)=>a+Number(x.quantity||0),0),outgoing=manual.filter(x=>String(x.movement_type).toUpperCase()==='OUT').reduce((a,x)=>a+Number(x.quantity||0),0),auto=(r.automatic||[]).reduce((a,x)=>a+Number(x.qty||0),0);return `<div class="card"><div class="sectionTitle">📊 Rekap Barang Masuk & Keluar</div><div class="sub">Pilih periode untuk melihat transaksi stok dan melakukan koreksi bila ada salah input.</div><div class="row" style="margin-top:15px"><div class="field"><label>Dari</label><input id="repFrom" type="date" value="${from}"></div><div class="field"><label>Sampai</label><input id="repTo" type="date" value="${to}"></div></div><div class="actions"><button class="primary" id="applyReport">🔎 Tampilkan Rekap</button><button class="ghost" id="todayReport">Hari Ini</button></div></div><div class="card"><div class="stats"><div class="stat"><span>Barang masuk</span><b>${n(incoming)}</b></div><div class="stat"><span>Barang keluar</span><b>${n(outgoing)}</b></div><div class="stat"><span>Pemakaian otomatis</span><b>${n(auto)}</b></div><div class="stat"><span>Total transaksi manual</span><b>${n(manual.length)}</b></div></div></div><div class="card"><div class="sectionTitle">Transaksi Manual</div><div class="tableWrap" style="margin-top:10px"><table><thead><tr><th>Tanggal</th><th>Barang</th><th>Jenis</th><th>Jumlah</th><th>Sumber</th><th>Keterangan</th><th>Aksi</th></tr></thead><tbody>${manual.map(x=>`<tr><td>${esc(x.movement_date)}</td><td><b>${esc(x.item_name)}</b></td><td>${esc(x.movement_type)}</td><td>${n(x.quantity)} ${esc(x.unit)}</td><td>${esc(x.source)}</td><td>${esc(x.note||'')}</td><td><button class="red" data-move-del="${x.id}" data-move-info="${esc(x.item_name)}|${esc(x.movement_type)}|${n(x.quantity)} ${esc(x.unit)}">🗑️ Hapus</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Tidak ada transaksi pada periode ini.</td></tr>'}</tbody></table></div></div><div class="card"><div class="sectionTitle">🤖 Pemakaian Otomatis dari Penjualan</div><div class="tableWrap" style="margin-top:10px"><table><thead><tr><th>Barang</th><th>Jumlah</th><th>Satuan</th></tr></thead><tbody>${(r.automatic||[]).map(x=>`<tr><td>${esc(x.item_name)}</td><td>${n(x.qty)}</td><td>${esc(x.unit)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Belum ada pemakaian otomatis pada periode ini.</td></tr>'}</tbody></table></div></div>`}
async function salesPage(){const from=window.salesFrom||today(),to=window.salesTo||today(),r=await rpc('inventory_sales_detail',{p_owner_pin:PIN,p_from:from,p_to:to}),detail=Array.isArray(r?.detail)?r.detail:[],lines=Array.isArray(r?.lines)?r.lines:[];const total=detail.reduce((s,x)=>s+Number(x.quantity||0),0),orders=new Set(lines.map(x=>String(x.order_number||x.order_id||''))).size;const grouped=detail.slice().sort((a,b)=>String(a.category||'').localeCompare(String(b.category||''),'id')||String(a.item_name||'').localeCompare(String(b.item_name||''),'id'));return `<div class="card"><div class="sectionTitle">📋 Detail Barang Keluar dari Penjualan Kasir</div><div class="sub">Semua barang yang keluar karena transaksi kasir PAID. Jumlah ini menjadi rincian pemakaian stok otomatis.</div><div class="row" style="margin-top:15px"><div class="field"><label>Dari Tanggal</label><input id="salesFrom" type="date" value="${from}"></div><div class="field"><label>Sampai Tanggal</label><input id="salesTo" type="date" value="${to}"></div></div><div class="actions"><button class="primary" id="applySales">🔎 Tampilkan Rincian</button><button class="ghost" id="todaySales">Hari Ini</button></div></div><div class="card"><div class="stats"><div class="stat"><span>Total barang keluar</span><b>${n(total)}</b></div><div class="stat"><span>Jenis barang</span><b>${n(detail.length)}</b></div><div class="stat"><span>Transaksi kasir</span><b>${n(orders)}</b></div><div class="stat"><span>Baris penjualan</span><b>${n(lines.length)}</b></div></div></div><div class="card"><div class="sectionTitle">📦 Rekap Detail Barang Keluar</div><div class="sub">Nama barang, kategori, satuan, jumlah yang keluar, jumlah order, dan menu yang mengeluarkan barang tersebut.</div><div class="tableWrap" style="margin-top:10px"><table><thead><tr><th>Nama Barang</th><th>Kategori</th><th>Satuan</th><th class="r">Jumlah Keluar</th><th class="r">Jumlah Order</th><th>Menu Kasir</th></tr></thead><tbody>${grouped.map(x=>`<tr><td><b>${esc(x.item_name||'-')}</b></td><td>${esc(x.category||'Lainnya')}</td><td>${esc(x.unit||'pcs')}</td><td class="r"><b>${n(x.quantity)}</b></td><td class="r">${n(x.order_count)}</td><td>${esc(Array.isArray(x.menu_names)?x.menu_names.join(', '):(x.menu_names||'-'))}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Tidak ada barang keluar dari penjualan kasir pada periode ini.</td></tr>'}</tbody></table></div></div><div class="card"><div class="sectionTitle">🧾 Rincian Setiap Penjualan</div><div class="sub">Menampilkan waktu transaksi, nomor order, menu kasir, barang yang dikurangi dari stok, kategori, satuan, dan jumlah.</div><div class="tableWrap" style="margin-top:10px"><table><thead><tr><th>Waktu</th><th>No. Order</th><th>Menu Kasir</th><th>Barang Keluar</th><th>Kategori</th><th>Satuan</th><th class="r">Qty</th></tr></thead><tbody>${lines.slice().sort((a,b)=>String(a.sold_at||'').localeCompare(String(b.sold_at||''))).map(x=>`<tr><td>${esc(x.sold_at?new Date(x.sold_at).toLocaleString('id-ID',{timeZone:'Asia/Jakarta'}):'-')}</td><td>${esc(x.order_number||'-')}</td><td>${esc(x.menu_name||'-')}</td><td><b>${esc(x.item_name||'-')}</b></td><td>${esc(x.category||'Lainnya')}</td><td>${esc(x.unit||'pcs')}</td><td class="r"><b>${n(x.quantity)}</b></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Tidak ada rincian transaksi.</td></tr>'}</tbody></table></div></div>`}
async function render(){navActive();const c=$('content');c.innerHTML='<div class="card">Memuat...</div>';try{if(view==='stock')c.innerHTML=await stockPage();else if(view==='in')c.innerHTML=inPage();else if(view==='out')c.innerHTML=outPage();else if(view==='master')c.innerHTML=masterPage();else if(view==='usage')c.innerHTML=usagePage();else if(view==='sales')c.innerHTML=await salesPage();else c.innerHTML=await reportPage();bind()}catch(e){c.innerHTML='<div class="card error">Gagal memuat: '+esc(e.message)+'</div>'}}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=async()=>{view=b.dataset.view;await render()});if($('stockSearch'))$('stockSearch').oninput=filterStock;if($('stockStatus'))$('stockStatus').onchange=filterStock;if($('saveIn'))$('saveIn').onclick=saveIn;if($('saveOut'))$('saveOut').onclick=saveOut;if($('saveMaster'))$('saveMaster').onclick=saveMaster;if($('saveUsage'))$('saveUsage').onclick=saveUsage;if($('applyReport'))$('applyReport').onclick=async()=>{window.reportFrom=$('repFrom').value;window.reportTo=$('repTo').value;await render()};if($('todayReport'))$('todayReport').onclick=async()=>{window.reportFrom=today();window.reportTo=today();await render()};if($('applySales'))$('applySales').onclick=async()=>{window.salesFrom=$('salesFrom').value;window.salesTo=$('salesTo').value;await render()};if($('todaySales'))$('todaySales').onclick=async()=>{window.salesFrom=today();window.salesTo=today();await render()};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=deleteUsage);document.querySelectorAll('[data-move-del]').forEach(b=>b.onclick=deleteMovement)}
async function saveIn(){const msg=$('inMsg');try{const q=Number($('inQty').value);if(q<=0)throw Error('Jumlah harus lebih dari 0');await rpc('inventory_add_movement',{p_owner_pin:PIN,p_item_id:$('inItem').value,p_type:'IN',p_qty:q,p_date:$('inDate').value||today(),p_source:$('inSource').value,p_note:$('inNote').value,p_created_by:'OWNER'});msg.textContent='Barang masuk berhasil disimpan. Stok sudah bertambah.';await load();setTimeout(()=>render(),300)}catch(e){msg.textContent='Gagal: '+e.message}}
async function saveOut(){const msg=$('outMsg');try{const q=Number($('outQty').value);if(q<=0)throw Error('Jumlah harus lebih dari 0');await rpc('inventory_add_movement',{p_owner_pin:PIN,p_item_id:$('outItem').value,p_type:'OUT',p_qty:q,p_date:$('outDate').value||today(),p_source:$('outSource').value,p_note:$('outNote').value,p_created_by:'OWNER'});msg.textContent='Barang keluar berhasil disimpan. Stok sudah berkurang.';await load();setTimeout(()=>render(),300)}catch(e){msg.textContent='Gagal: '+e.message}}
async function saveMaster(){const msg=$('mMsg');try{const name=$('mName').value.trim(),open=Number($('mOpen').value)||0,min=Number($('mMin').value)||0;if(!name)throw Error('Nama barang wajib diisi');if(open<0||min<0)throw Error('Stok tidak boleh negatif');await rpc('inventory_save_item',{p_owner_pin:PIN,p_id:null,p_name:name,p_category:$('mCat').value,p_unit:$('mUnit').value,p_min_stock:min,p_opening_stock:open,p_active:true});msg.textContent='Barang berhasil ditambahkan ke Master.';await load();setTimeout(()=>render(),300)}catch(e){msg.textContent='Gagal: '+e.message}}
async function saveUsage(){const msg=$('uMsg');try{const q=Number($('uQty').value);if(q<=0)throw Error('Jumlah harus lebih dari 0');await rpc('inventory_save_usage',{p_owner_pin:PIN,p_product_id:$('uProd').value,p_item_id:$('uItem').value,p_qty:q});msg.textContent='Pemetaan berhasil disimpan.';await load();setTimeout(()=>render(),300)}catch(e){msg.textContent='Gagal: '+e.message}}
async function deleteUsage(e){if(!confirm('Hapus pemetaan ini?'))return;try{const a=e.currentTarget.dataset.del.split('|');await rpc('inventory_delete_usage',{p_owner_pin:PIN,p_product_id:a[0],p_item_id:a[1]});await load();render()}catch(err){alert('Gagal: '+err.message)}}
async function deleteMovement(e){const b=e.currentTarget,id=b.dataset.moveDel,info=(b.dataset.moveInfo||'').split('|');if(!id)return;if(!confirm('Hapus transaksi ini?\n\nBarang: '+(info[0]||'')+'\nJenis: '+(info[1]||'')+'\nJumlah: '+(info[2]||'')+'\n\nStok akan dikoreksi kembali.'))return;b.disabled=true;try{await rpc('inventory_delete_movement',{p_owner_pin:PIN,p_movement_id:id});await load();render()}catch(err){b.disabled=false;alert('Gagal: '+err.message)}}
$('loginBtn').onclick=async()=>{PIN=$('pin').value.trim();$('err').textContent='Memeriksa PIN Owner...';if(!PIN){$('err').textContent='PIN Owner wajib diisi.';return}try{await rpc('inventory_auth',{p_owner_pin:PIN});await load();$('login').classList.add('hide');$('app').classList.remove('hide');render()}catch(e){PIN='';$('err').textContent='PIN Owner tidak diterima atau koneksi gagal: '+e.message}};
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});$('logout').onclick=()=>location.reload();$('refresh').onclick=async()=>{try{await load();render()}catch(e){alert('Refresh gagal: '+e.message)}};
setInterval(async()=>{if(!$('app').classList.contains('hide')&&view==='stock'){try{await load();filterStock()}catch(e){}}},10000);
</script>
