<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — STOK BARANG</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f5f5f5;font:14px Arial}.wrap{max-width:1250px;margin:auto;padding:14px}.card{background:#171717;border:1px solid #333;border-radius:14px;padding:14px;margin:10px 0}.login{max-width:430px;margin:10vh auto}.brand{font-size:24px;font-weight:900}.muted{color:#fff!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stat{background:#222;border:1px solid #3b3b3b;border-radius:12px;padding:13px}.stat b{display:block;font-size:22px;margin-top:5px;color:#fff!important}.tabs,.catbar,.links{display:flex;gap:7px;overflow:auto;flex-wrap:wrap}.tabs button,.catbar button,.links a{white-space:nowrap}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;color:#fff;font-size:12px;margin:5px 0}.field input,.field select,.field textarea{width:100%;background:#0f0f0f;color:#fff;border:1px solid #444;border-radius:9px;padding:10px}.field textarea{min-height:70px}button,.links a{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer;background:#2a2a2a;color:#fff;text-decoration:none}.on,.primary{background:#b68142}.green{background:#2f7d50}.red{background:#8d3c3c}.danger{background:#8d3c3c!important}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hide{display:none!important}.error{color:#ff8e8e;min-height:20px;margin-top:8px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:9px;border-bottom:1px solid #2e2e2e;text-align:left;color:#fff}th{color:#fff;font-size:11px}td.r{text-align:right}.low,.ok{color:#fff!important;font-weight:900}.quickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.quickitem{background:#202020;border:1px solid #383838;border-radius:11px;padding:9px}.quickitem b{display:block;margin-bottom:7px;line-height:1.25;color:#fff!important}.quickitem .muted{color:#fff!important}.qrow{display:grid;grid-template-columns:1fr 90px;gap:7px}.quickitem input{width:100%;background:#0d0d0d;color:#fff;border:1px solid #444;border-radius:8px;padding:9px}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#2a2a2a;color:#fff;font-size:11px;margin-bottom:8px}.notice{background:#201d18;border:1px solid #5b4931;padding:10px;border-radius:10px;color:#fff}.linkbtn{background:#242424;border:1px solid #444}.linkbtn:hover{background:#333}.warnbox{background:#2a1f17;border:1px solid #7b5a32;padding:12px;border-radius:10px;color:#fff}.small{font-size:12px;color:#fff}@media(max-width:600px){.row{grid-template-columns:1fr}.brand{font-size:20px}.quickgrid{grid-template-columns:1fr}}</style></head><body><div id="login" class="wrap login"><div class="card"><div class="brand">📦 ISSHO CAFE — STOK BARANG</div><p class="muted">Login menggunakan PIN OWNER yang sama dengan aplikasi OWNER.</p><div class="field"><label>PIN OWNER</label><input id="pin" type="password" inputmode="numeric" placeholder="PIN OWNER"></div><div class="actions"><button class="primary" id="loginBtn">MASUK</button></div><div id="err" class="error"></div></div></div><main id="app" class="wrap hide"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><div class="brand">📦 STOK BARANG ISSHO CAFE</div><div class="muted">Master utama • input manual • barang masuk • barang keluar • pemakaian • rekapan</div></div><button class="red" id="logout">KELUAR</button></div><div class="card"><b>🔗 Aplikasi ISSHO CAFE</b><div class="links" style="margin-top:10px"><a class="linkbtn" href="/owner-rpp02n.html" target="_blank">👑 Owner</a><a class="linkbtn" href="/customer.html" target="_blank">🧑 Pelanggan</a><a class="linkbtn" href="/dapur-v8.html" target="_blank">🍳 Dapur</a><a class="linkbtn" href="/stock-v2.html" target="_self">📦 Stok</a></div></div><div class="card"><div id="tabs" class="tabs"><button class="on" data-t="dash">Dashboard</button><button data-t="items">Master Utama</button><button data-t="in">Barang Masuk</button><button data-t="out">Barang Keluar</button><button data-t="usage">Pemakaian Menu</button><button data-t="report">Rekap Detail</button></div></div><section id="content"></section></main><script>
const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';let PIN='',items=[],products=[],usages=[],tab='dash',cat='Minuman Sachet';
const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10),n=x=>Number(x||0).toLocaleString('id-ID',{maximumFractionDigits:3}),esc=x=>String(x??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
async function rpc(fn,body){const r=await fetch(U+'/rest/v1/rpc/'+fn,{method:'POST',cache:'no-store',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null}
async function load(){items=await rpc('inventory_list_items',{p_owner_pin:PIN});usages=await rpc('inventory_usage_list',{p_owner_pin:PIN});products=await rpc('inventory_products_list',{p_owner_pin:PIN})}
function opts(a){return a.map(x=>`<option value="${x.id}">${esc(x.name)}${x.unit?' ('+esc(x.unit)+')':''}</option>`).join('')}
function groups(){const g={'Minuman Sachet':[],Indomie:[],'Mie Sedaap':[],Lainnya:[]};items.forEach(x=>(g[x.category]||g.Lainnya).push(x));Object.values(g).forEach(a=>a.sort((x,y)=>x.name.localeCompare(y.name,'id')));return g}
function catButtons(g){return `<div class="catbar"><button class="${cat==='Minuman Sachet'?'on':''}" data-cat="Minuman Sachet">Minuman Sachet (${g['Minuman Sachet'].length})</button><button class="${cat==='Indomie'?'on':''}" data-cat="Indomie">Indomie (${g.Indomie.length})</button><button class="${cat==='Mie Sedaap'?'on':''}" data-cat="Mie Sedaap">Mie Sedaap (${g['Mie Sedaap'].length})</button><button class="${cat==='Lainnya'?'on':''}" data-cat="Lainnya">Lainnya (${g.Lainnya.length})</button></div>`}
async function dash(){const r=await rpc('inventory_dashboard',{p_owner_pin:PIN,p_from:today(),p_to:today()});return `<div class="grid"><div class="stat">Barang Masuk<b>${n(r.incoming)}</b></div><div class="stat">Keluar Manual<b>${n(r.outgoing_manual)}</b></div><div class="stat">Keluar Penjualan<b>${n(r.outgoing_auto)}</b></div><div class="stat">Total Keluar<b>${n(r.outgoing_total)}</b></div><div class="stat">Stok Menipis<b class="low">${r.low_stock}</b></div></div><div class="card"><div class="warnbox"><b>⚠️ Ada salah input stok?</b><div class="small" style="margin-top:5px">Transaksi yang sudah tersimpan tetap bisa dikoreksi. Buka Rekap Detail, lalu tekan tombol <b>🗑️ Hapus</b> pada transaksi yang salah. Stok akan dihitung ulang setelah transaksi dihapus.</div><div class="actions"><button class="danger" id="openCorrection">🗑️ Koreksi / Hapus Stok Salah</button><button id="refreshStock">🔄 Refresh Stok</button></div></div></div><div class="card"><h3>Posisi Stok</h3><div class="table"><table><thead><tr><th>Barang</th><th>Kategori</th><th>Satuan</th><th class="r">Stok</th><th class="r">Minimum</th><th>Status</th></tr></thead><tbody>${(r.items||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.category)}</td><td>${esc(x.unit)}</td><td class="r"><b>${n(x.stock_now)}</b></td><td class="r">${n(x.min_stock)}</td><td>${Number(x.stock_now)<=Number(x.min_stock)?'<span class="low">MENIPIS</span>':'<span class="ok">AMAN</span>'}</td></tr>`).join('')||'<tr><td colspan="6">Belum ada barang.</td></tr>'}</tbody></table></div></div>`}
function itemsPage(){const g=groups(),list=g[cat]||[];return `<div class="card"><h3>⭐ Master Barang Utama</h3><div class="notice">Barang utama mengikuti kategori menu. Untuk input barang baru secara manual, pilih kategori di bawah. Setelah disimpan, barang langsung masuk ke master kategori dan bisa dipakai pada Barang Masuk, Barang Keluar, dan Pemakaian Menu.</div>${catButtons(g)}</div><div class="card"><h3>📦 ${esc(cat)}</h3><div class="quickgrid">${list.map(x=>`<div class="quickitem"><span class="badge">${esc(x.unit||'pcs')}</span><b>${esc(x.name)}</b><div class="muted">Stok: ${n(x.stock_manual)}</div></div>`).join('')||'<div class="muted">Belum ada barang.</div>'}</div></div><div class="card"><h3>➕ Input Barang Manual</h3><div class="row"><div class="field"><label>Nama Barang</label><input id="name" placeholder="Contoh: Kopi ABC Mocca"></div><div class="field"><label>Kategori</label><select id="newcat"><option>Minuman Sachet</option><option>Indomie</option><option>Mie Sedaap</option><option>Lainnya</option></select></div><div class="field"><label>Satuan</label><select id="unit"><option>pcs</option><option>bungkus</option><option>botol</option><option>gelas</option><option>pack</option><option>dus</option><option>kg</option><option>liter</option></select></div><div class="field"><label>Stok Awal</label><input id="open" type="number" min="0" step="0.001" value="0"></div><div class="field"><label>Stok Minimum</label><input id="min" type="number" min="0" step="0.001" value="0"></div></div><div class="actions"><button class="primary" id="save">💾 Simpan ke Master</button><button id="reset">Kosongkan</button></div><div id="manualMsg" class="error"></div></div>`}
function quickIn(){const g=groups(),list=g[cat]||[];return `<div class="card"><h3>📥 Barang Masuk Cepat — ${esc(cat)}</h3><div class="notice">Isi jumlah barang yang datang. Tekan <b>Simpan Semua</b>. Semua transaksi tersimpan ke stok dan otomatis muncul di Dashboard/Rekap.</div>${catButtons(g)}<div class="field"><label>Tanggal</label><input id="qdate" type="date" value="${today()}"></div><div class="quickgrid">${list.map(x=>`<div class="quickitem"><b>${esc(x.name)}</b><div class="qrow"><span class="muted">stok ${n(x.stock_manual)}</span><input class="qin" data-id="${x.id}" type="number" min="0" step="0.001" placeholder="Jumlah"></div></div>`).join('')||'<div class="muted">Belum ada barang.</div>'}</div><div class="actions"><button class="green" id="saveQuick">💾 Simpan Semua</button><button id="clearQuick">Kosongkan</button><button class="danger" id="openCorrection2">🗑️ Koreksi Transaksi Tersimpan</button><button id="refreshQuick">🔄 Refresh</button></div><div id="quickMsg" class="error"></div></div>`}
function outPage(){return `<div class="card"><h3>📤 Barang Keluar Manual</h3><div class="row"><div class="field"><label>Barang</label><select id="mi">${opts(items)}</select></div><div class="field"><label>Jumlah</label><input id="qty" type="number" min="0.001" step="0.001"></div><div class="field"><label>Tanggal</label><input id="date" type="date" value="${today()}"></div><div class="field"><label>Sumber</label><select id="src"><option>MANUAL</option><option>TERPAKAI</option><option>RUSAK</option><option>RETUR</option><option>LAINNYA</option></select></div></div><div class="field"><label>Keterangan</label><textarea id="note" placeholder="Contoh: dipakai untuk operasional"></textarea></div><div class="actions"><button class="red" id="saveOut">📤 Simpan Barang Keluar</button><button class="danger" id="openCorrection3">🗑️ Koreksi Transaksi Tersimpan</button></div></div>`}
function usagePage(){return `<div class="card"><h3>🔗 Pemakaian Menu</h3><div class="row"><div class="field"><label>Menu</label><select id="prod">${opts(products)}</select></div><div class="field"><label>Barang/Bahan</label><select id="itm">${opts(items)}</select></div><div class="field"><label>Jumlah per 1 menu</label><input id="uq" type="number" min="0.001" step="0.001"></div></div><div class="actions"><button class="primary" id="saveU">Simpan Pemetaan</button></div></div><div class="card"><h3>Pemetaan Aktif</h3><div class="table"><table><thead><tr><th>Menu</th><th>Barang</th><th>Jumlah</th><th>Aksi</th></tr></thead><tbody>${usages.map(x=>`<tr><td>${esc(x.product_name)}</td><td>${esc(x.inventory_item_name)} (${esc(x.unit)})</td><td>${n(x.quantity_per_sale)}</td><td><button class="red" data-del="${x.product_id}|${x.inventory_item_id}">Hapus</button></td></tr>`).join('')||'<tr><td colspan="4">Belum ada pemetaan.</td></tr>'}</tbody></table></div></div>`}
async function report(){const r=await rpc('inventory_movements_report',{p_owner_pin:PIN,p_from:today(),p_to:today()});return `<div class="card"><h3>📊 Rekap Hari Ini</h3><div class="warnbox"><b>🛠️ Koreksi stok</b><div class="small" style="margin-top:5px">Jika ada salah input yang sudah tersimpan, tekan <b>🗑️ Hapus</b> pada baris transaksi tersebut. Hanya transaksi manual dari stok yang bisa dihapus dan stok akan langsung dihitung ulang.</div><div class="actions"><button id="refreshReport">🔄 Refresh Rekap</button></div></div><div class="table" style="margin-top:10px"><table><thead><tr><th>Tanggal</th><th>Barang</th><th>Jenis</th><th>Jumlah</th><th>Sumber</th><th>Keterangan</th><th>Aksi</th></tr></thead><tbody>${(r.manual||[]).map(x=>`<tr><td>${esc(x.movement_date)}</td><td><b>${esc(x.item_name)}</b></td><td>${esc(x.movement_type)}</td><td>${n(x.quantity)} ${esc(x.unit)}</td><td>${esc(x.source)}</td><td>${esc(x.note||'')}</td><td><button class="danger" data-move-del="${x.id}" data-move-info="${esc(x.item_name)}|${esc(x.movement_type)}|${n(x.quantity)} ${esc(x.unit)}">🗑️ Hapus</button></td></tr>`).join('')||'<tr><td colspan="7">Belum ada transaksi hari ini.</td></tr>'}</tbody></table></div></div><div class="card"><h3>🤖 Pemakaian Otomatis dari Penjualan</h3><div class="table"><table><thead><tr><th>Barang</th><th>Jumlah</th><th>Satuan</th></tr></thead><tbody>${(r.automatic||[]).map(x=>`<tr><td>${esc(x.item_name)}</td><td>${n(x.qty)}</td><td>${esc(x.unit)}</td></tr>`).join('')||'<tr><td colspan="3">Belum ada.</td></tr>'}</tbody></table></div></div>`}
async function render(){const c=$('content');c.innerHTML='<div class="card">Memuat...</div>';try{c.innerHTML=tab==='dash'?await dash():tab==='items'?itemsPage():tab==='in'?quickIn():tab==='out'?outPage():tab==='usage'?usagePage():await report();bind()}catch(e){c.innerHTML='<div class="card error">Gagal memuat: '+esc(e.message)+'</div>'}}
function goReport(){tab='report';document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t==='report'));render()}
function bind(){document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});if($('openCorrection'))$('openCorrection').onclick=goReport;if($('openCorrection2'))$('openCorrection2').onclick=goReport;if($('openCorrection3'))$('openCorrection3').onclick=goReport;if($('refreshStock'))$('refreshStock').onclick=async()=>{await load();render()};if($('refreshQuick'))$('refreshQuick').onclick=async()=>{await load();render()};if($('refreshReport'))$('refreshReport').onclick=render;if($('save'))$('save').onclick=saveManual;if($('reset'))$('reset').onclick=()=>{['name','open','min'].forEach(id=>$(id).value='');$('manualMsg').textContent=''};if($('saveQuick'))$('saveQuick').onclick=saveQuick;if($('clearQuick'))$('clearQuick').onclick=()=>document.querySelectorAll('.qin').forEach(x=>x.value='');if($('saveOut'))$('saveOut').onclick=saveOut;if($('saveU'))$('saveU').onclick=saveUsage;document.querySelectorAll('[data-del]').forEach(b=>b.onclick=deleteUsage);document.querySelectorAll('[data-move-del]').forEach(b=>b.onclick=deleteMovement)}
async function saveManual(){const msg=$('manualMsg');try{const name=$('name').value.trim(),q=Number($('open').value)||0;if(!name)throw Error('Nama barang wajib diisi');if(q<0)throw Error('Stok awal tidak boleh negatif');await rpc('inventory_save_item',{p_owner_pin:PIN,p_id:null,p_name:name,p_category:$('newcat').value,p_unit:$('unit').value,p_min_stock:Number($('min').value)||0,p_opening_stock:q,p_active:true});await load();cat=$('newcat').value;msg.textContent='Barang berhasil masuk ke Master '+cat+'.';render()}catch(e){msg.textContent='Gagal: '+e.message}}
async function saveQuick(){const msg=$('quickMsg'),arr=[...document.querySelectorAll('.qin')].filter(x=>Number(x.value)>0);if(!arr.length){msg.textContent='Isi minimal satu jumlah.';return}const btn=$('saveQuick');btn.disabled=true;let ok=0;try{for(const x of arr){await rpc('inventory_add_movement',{p_owner_pin:PIN,p_item_id:x.dataset.id,p_type:'IN',p_qty:Number(x.value),p_date:$('qdate').value||today(),p_source:'PEMBELIAN',p_note:'Barang masuk cepat',p_created_by:'OWNER'});ok++}msg.textContent='Berhasil menyimpan '+ok+' barang. Jika ada salah input, gunakan tombol Koreksi Transaksi Tersimpan.';await load();setTimeout(render,500)}catch(e){msg.textContent='Gagal setelah '+ok+' transaksi: '+e.message}finally{btn.disabled=false}}
async function saveOut(){try{const q=Number($('qty').value);if(q<=0)throw Error('Jumlah harus lebih dari 0');await rpc('inventory_add_movement',{p_owner_pin:PIN,p_item_id:$('mi').value,p_type:'OUT',p_qty:q,p_date:$('date').value||today(),p_source:$('src').value,p_note:$('note').value,p_created_by:'OWNER'});alert('Barang keluar tersimpan. Jika salah input, gunakan Koreksi Transaksi Tersimpan.');await load();render()}catch(e){alert(e.message)}}
async function saveUsage(){try{const q=Number($('uq').value);if(q<=0)throw Error('Jumlah harus lebih dari 0');await rpc('inventory_save_usage',{p_owner_pin:PIN,p_product_id:$('prod').value,p_item_id:$('itm').value,p_qty:q});await load();alert('Pemetaan tersimpan');render()}catch(e){alert(e.message)}}
async function deleteUsage(e){if(!confirm('Hapus pemetaan ini?'))return;try{const a=e.currentTarget.dataset.del.split('|');await rpc('inventory_delete_usage',{p_owner_pin:PIN,p_product_id:a[0],p_item_id:a[1]});await load();render()}catch(err){alert(err.message)}}
async function deleteMovement(e){const b=e.currentTarget,id=b.dataset.moveDel,info=b.dataset.moveInfo||'';if(!id)return;const parts=info.split('|');const name=parts[0]||'barang',type=parts[1]||'transaksi',qty=parts[2]||'';if(!confirm('Hapus transaksi ini?\n\nBarang: '+name+'\nJenis: '+type+'\nJumlah: '+qty+'\n\nStok akan dikembalikan seperti sebelum transaksi.'))return;b.disabled=true;try{await rpc('inventory_delete_movement',{p_owner_pin:PIN,p_movement_id:id});alert('Transaksi berhasil dihapus. Stok sudah dikoreksi.');await load();render()}catch(err){b.disabled=false;alert('Gagal menghapus transaksi: '+err.message)}}
$('loginBtn').onclick=async()=>{PIN=$('pin').value.trim();$('err').textContent='Memeriksa PIN Owner...';if(!PIN){$('err').textContent='PIN Owner wajib diisi.';return}try{await rpc('inventory_auth',{p_owner_pin:PIN});await load();$('login').classList.add('hide');$('app').classList.remove('hide');render()}catch(e){PIN='';$('err').textContent='PIN Owner tidak diterima atau koneksi gagal: '+e.message}};$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});$('logout').onclick=()=>location.reload();
</script><script src="/ui-standard.js?v=20260830-ui-v2"></script></body></html>
