<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>ISSHO CAFE — STOK BARANG</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f5f5f5;font:14px Arial}.wrap{max-width:1200px;margin:auto;padding:14px}.card{background:#171717;border:1px solid #333;border-radius:14px;padding:14px;margin:10px 0}.login{max-width:430px;margin:10vh auto}.brand{font-size:24px;font-weight:900}.muted{color:#999}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stat{background:#222;border:1px solid #3b3b3b;border-radius:12px;padding:13px}.stat b{display:block;font-size:22px;margin-top:5px}.tabs{display:flex;gap:7px;overflow:auto}.tabs button{white-space:nowrap}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;color:#aaa;font-size:12px;margin:5px 0}.field input,.field select,.field textarea{width:100%;background:#0f0f0f;color:#fff;border:1px solid #444;border-radius:9px;padding:10px}.field textarea{min-height:70px}button{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer;background:#2a2a2a;color:#fff}.on,.primary{background:#b68142}.green{background:#2f7d50}.red{background:#8d3c3c}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hide{display:none!important}.error{color:#ff8e8e;min-height:20px;margin-top:8px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:9px;border-bottom:1px solid #2e2e2e;text-align:left}th{color:#aaa;font-size:11px}td.r{text-align:right}.low{color:#ffd166;font-weight:900}.ok{color:#7ddc9c;font-weight:900}@media(max-width:600px){.row{grid-template-columns:1fr}.brand{font-size:20px}}</style></head><body><div id="login" class="wrap login"><div class="card"><div class="brand">📦 ISSHO CAFE — STOK BARANG</div><p class="muted">Login menggunakan PIN OWNER yang sama dengan aplikasi OWNER.</p><div class="field"><label>PIN OWNER</label><input id="pin" type="password" inputmode="numeric" placeholder="PIN OWNER"></div><div class="actions"><button class="primary" id="loginBtn">MASUK</button></div><div id="err" class="error"></div></div></div><main id="app" class="wrap hide"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><div class="brand">📦 STOK BARANG ISSHO CAFE</div><div class="muted">Barang masuk • keluar • pemakaian menu • rekapan</div></div><button class="red" id="logout">KELUAR</button></div><div class="card"><div id="tabs" class="tabs"><button class="on" data-t="dash">Dashboard</button><button data-t="items">Master Barang</button><button data-t="in">Barang Masuk</button><button data-t="out">Barang Keluar</button><button data-t="usage">Pemakaian Menu</button><button data-t="report">Rekap Detail</button></div></div><section id="content"></section></main><script>
const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';let PIN='',items=[],products=[],usages=[],tab='dash';
const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10),n=x=>Number(x||0).toLocaleString('id-ID',{maximumFractionDigits:3}),esc=x=>String(x??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
async function rpc(fn,body){const r=await fetch(U+'/rest/v1/rpc/'+fn,{method:'POST',cache:'no-store',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null}
async function load(){items=await rpc('inventory_list_items',{p_owner_pin:PIN});usages=await rpc('inventory_usage_list',{p_owner_pin:PIN});products=await rpc('inventory_products_list',{p_owner_pin:PIN})}
function opts(a,label){return a.map(x=>`<option value="${x.id}">${esc(x.name)}${x.unit?' ('+esc(x.unit)+')':''}</option>`).join('')}
function range(){return `<div class="row"><div class="field"><label>DARI</label><input id="from" type="date" value="${today()}"></div><div class="field"><label>SAMPAI</label><input id="to" type="date" value="${today()}"></div></div>`}
async function dash(){const r=await rpc('inventory_dashboard',{p_owner_pin:PIN,p_from:$('from')?.value||today(),p_to:$('to')?.value||today()});return `<div class="card">${range()}<div class="actions"><button class="primary" id="show">Tampilkan</button></div></div><div class="grid"><div class="stat">Barang Masuk<b>${n(r.incoming)}</b></div><div class="stat">Keluar Manual<b>${n(r.outgoing_manual)}</b></div><div class="stat">Keluar Penjualan<b>${n(r.outgoing_auto)}</b></div><div class="stat">Total Keluar<b>${n(r.outgoing_total)}</b></div><div class="stat">Stok Menipis<b class="low">${r.low_stock}</b></div></div><div class="card"><h3>Posisi Stok</h3><div class="table"><table><thead><tr><th>Barang</th><th>Kategori</th><th>Satuan</th><th class="r">Stok</th><th class="r">Minimum</th><th>Status</th></tr></thead><tbody>${(r.items||[]).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.category)}</td><td>${esc(x.unit)}</td><td class="r"><b>${n(x.stock_now)}</b></td><td class="r">${n(x.min_stock)}</td><td>${Number(x.stock_now)<=Number(x.min_stock)?'<span class="low">MENIPIS</span>':'<span class="ok">AMAN</span>'}</td></tr>`).join('')||'<tr><td colspan="6">Belum ada barang.</td></tr>'}</tbody></table></div></div>`}
function itemsPage(){return `<div class="card"><h3>Tambah Barang</h3><div class="row"><div class="field"><label>Nama</label><input id="name"></div><div class="field"><label>Kategori</label><input id="cat"></div><div class="field"><label>Satuan</label><input id="unit" value="pcs"></div><div class="field"><label>Stok Awal</label><input id="open" type="number" step="0.001" value="0"></div><div class="field"><label>Stok Minimum</label><input id="min" type="number" step="0.001" value="0"></div></div><div class="actions"><button class="primary" id="save">Simpan</button></div></div><div class="card"><h3>Daftar Barang</h3><div class="table"><table><thead><tr><th>Nama</th><th>Kategori</th><th>Satuan</th><th>Stok Awal</th><th>Manual Net</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.category)}</td><td>${esc(x.unit)}</td><td>${n(x.opening_stock)}</td><td>${n(x.stock_manual)}</td></tr>`).join('')||'<tr><td colspan="5">Belum ada barang.</td></tr>'}</tbody></table></div></div>`}
function movePage(type){return `<div class="card"><h3>${type==='IN'?'📥 Barang Masuk':'📤 Barang Keluar'}</h3><div class="row"><div class="field"><label>Barang</label><select id="mi">${opts(items)}</select></div><div class="field"><label>Jumlah</label><input id="qty" type="number" min="0.001" step="0.001"></div><div class="field"><label>Tanggal</label><input id="date" type="date" value="${today()}"></div><div class="field"><label>Sumber</label><select id="src"><option>MANUAL</option><option>PEMBELIAN</option><option>RETUR</option><option>RUSAK</option><option>TERPAKAI</option><option>LAINNYA</option></select></div></div><div class="field"><label>Keterangan</label><textarea id="note"></textarea></div><div class="actions"><button class="${type==='IN'?'green':'red'}" id="saveMove">Simpan</button></div></div>`}
function usagePage(){return `<div class="card"><h3>🔗 Pemakaian Menu</h3><p class="muted">Atur berapa banyak bahan yang dipakai setiap 1 menu terjual. Transaksi PAID akan dihitung otomatis.</p><div class="row"><div class="field"><label>Menu</label><select id="prod">${opts(products)}</select></div><div class="field"><label>Barang</label><select id="itm">${opts(items)}</select></div><div class="field"><label>Jumlah / 1 menu</label><input id="uq" type="number" min="0.001" step="0.001"></div></div><div class="actions"><button class="primary" id="saveU">Simpan Pemetaan</button></div></div><div class="card"><h3>Pemetaan Aktif</h3><div class="table"><table><thead><tr><th>Menu</th><th>Barang</th><th>Pemakaian</th><th>Aksi</th></tr></thead><tbody>${usages.map(x=>`<tr><td>${esc(x.product_name)}</td><td>${esc(x.inventory_item_name)} (${esc(x.unit)})</td><td>${n(x.quantity_per_sale)}</td><td><button class="red" data-del="${x.product_id}|${x.inventory_item_id}">Hapus</button></td></tr>`).join('')||'<tr><td colspan="4">Belum ada pemetaan.</td></tr>'}</tbody></table></div></div>`}
async function report(){const r=await rpc('inventory_movements_report',{p_owner_pin:PIN,p_from:$('from')?.value||today(),p_to:$('to')?.value||today()});return `<div class="card">${range()}<div class="actions"><button class="primary" id="show">Tampilkan</button></div></div><div class="card"><h3>📥📤 Transaksi Manual</h3><div class="table"><table><thead><tr><th>Tanggal</th><th>Barang</th><th>Jenis</th><th>Jumlah</th><th>Sumber</th><th>Keterangan</th></tr></thead><tbody>${(r.manual||[]).map(x=>`<tr><td>${esc(x.movement_date)}</td><td>${esc(x.item_name)}</td><td>${x.movement_type}</td><td>${n(x.quantity)} ${esc(x.unit)}</td><td>${esc(x.source)}</td><td>${esc(x.note||'')}</td></tr>`).join('')||'<tr><td colspan="6">Belum ada transaksi.</td></tr>'}</tbody></table></div></div><div class="card"><h3>🤖 Pemakaian Otomatis dari Penjualan</h3><div class="table"><table><thead><tr><th>Barang</th><th>Jumlah Terpakai</th><th>Satuan</th></tr></thead><tbody>${(r.automatic||[]).map(x=>`<tr><td>${esc(x.item_name)}</td><td>${n(x.qty)}</td><td>${esc(x.unit)}</td></tr>`).join('')||'<tr><td colspan="3">Belum ada pemakaian otomatis.</td></tr>'}</tbody></table></div></div>`}
async function render(){const c=$('content');c.innerHTML='<div class="card">Memuat...</div>';try{c.innerHTML=tab==='dash'?await dash():tab==='items'?itemsPage():tab==='in'?movePage('IN'):tab==='out'?movePage('OUT'):tab==='usage'?usagePage():await report();bind()}catch(e){c.innerHTML='<div class="card error">Gagal memuat: '+esc(e.message)+'</div>'}}
function bind(){document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});if($('show'))$('show').onclick=render;if($('save'))$('save').onclick=async()=>{try{await rpc('inventory_save_item',{p_owner_pin:PIN,p_id:null,p_name:$('name').value,p_category:$('cat').value,p_unit:$('unit').value,p_min_stock:+$('min').value||0,p_opening_stock:+$('open').value||0,p_active:true});await load();alert('Barang tersimpan');render()}catch(e){alert(e.message)}};if($('saveMove'))$('saveMove').onclick=async()=>{try{await rpc('inventory_add_movement',{p_owner_pin:PIN,p_item_id:$('mi').value,p_type:tab==='in'?'IN':'OUT',p_qty:+$('qty').value,p_date:$('date').value,p_source:$('src').value,p_note:$('note').value,p_created_by:'OWNER'});alert('Transaksi tersimpan');render()}catch(e){alert(e.message)}};if($('saveU'))$('saveU').onclick=async()=>{try{await rpc('inventory_save_usage',{p_owner_pin:PIN,p_product_id:$('prod').value,p_item_id:$('itm').value,p_qty:+$('uq').value});await load();alert('Pemetaan tersimpan');render()}catch(e){alert(e.message)}};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Hapus pemetaan?')){const a=b.dataset.del.split('|');await rpc('inventory_delete_usage',{p_owner_pin:PIN,p_product_id:a[0],p_item_id:a[1]});await load();render()}})}
$('loginBtn').onclick=async()=>{PIN=$('pin').value.trim();$('err').textContent='Memeriksa PIN Owner...';if(!PIN){$('err').textContent='PIN Owner wajib diisi.';return}try{await rpc('inventory_auth',{p_owner_pin:PIN});await load();$('login').classList.add('hide');$('app').classList.remove('hide');$('err').textContent='';render()}catch(e){$('err').textContent='PIN Owner tidak diterima atau koneksi gagal: '+e.message;PIN=''}};$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});$('logout').onclick=()=>location.reload();
</script></body></html>
