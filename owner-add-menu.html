<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>ISSHO CAFE — Tambah Menu Owner</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:16px}.card{background:#151515;border:1px solid #333;border-radius:16px;padding:18px;margin:12px 0}input,select,textarea{width:100%;padding:12px;margin-top:6px;background:#1b1b1b;color:#fff;border:1px solid #444;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:12px 16px;font-weight:900;cursor:pointer}.gold{background:#b68142;color:#fff}.green{background:#2f7d50;color:#fff}.dark{background:#242424;color:#fff;border:1px solid #444}.ok{background:#193b25;color:#d9ffe5;padding:12px;border-radius:10px}.err{background:#4a1d1a;color:#ffd9d5;padding:12px;border-radius:10px}.muted{color:#aaa;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.catbox{display:grid;grid-template-columns:1fr auto;gap:8px}.cats{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.chip{padding:7px 10px;border-radius:999px;background:#242424;border:1px solid #444;cursor:pointer}.chip.sel{background:#b68142;border-color:#b68142}.selected{background:#302719;border:1px solid #6a512d;color:#ffe8b2;padding:11px;border-radius:10px;margin-top:10px}@media(max-width:600px){.catbox{grid-template-columns:1fr}.catbox button{width:100%}}</style></head><body><main class="wrap"><div class="card"><h1>➕ Tambah Menu Baru</h1><div class="muted">Khusus OWNER. Menu baru tersimpan ke database pusat dan otomatis dibaca Kasir/Pelanggan. QR meja tetap sama.</div><label>PIN Owner<input id="pin" type="password" inputmode="numeric" placeholder="PIN Owner"></label><div id="selected" class="selected" style="display:none"></div><label>Nama Menu<input id="name" placeholder="Contoh: Minuman Sachetan"></label><label style="display:block;font-weight:800;margin-top:12px">Kategori Baru / Kategori Lama</label><div class="catbox"><input id="category" placeholder="Ketik kategori baru atau pilih di bawah"><button class="green" onclick="addCategory()">＋ Simpan Kategori</button></div><div id="cats" class="cats"></div><div class="muted" style="margin-top:7px">Kategori tidak dikunci. Klik kategori untuk memilihnya.</div><label style="display:block;font-weight:800;margin-top:12px">Harga<input id="price" type="number" min="0" placeholder="Contoh: 15000"></label><label style="display:block;font-weight:800;margin-top:12px">Deskripsi<input id="description" placeholder="Opsional"></label><label style="display:block;font-weight:800;margin-top:12px">Foto Menu<input id="image" type="file" accept="image/jpeg,image/png,image/webp"></label><label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input id="active" type="checkbox" checked style="width:auto"> Langsung tampil di Pelanggan & Kasir</label><div class="row"><button class="gold" onclick="save()">💾 Simpan Menu Baru</button><button class="dark" onclick="location.href='owner-menu-manager.html?v=20260823-category-menu-final'">← Kembali Kelola Menu</button></div><div id="msg"></div></div></main><script>const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',B='catalog-images';let CATS=[];const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m])}async function api(path,opt={}){const h=Object.assign({apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},opt.headers||{});const r=await fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h}));const t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}async function loadCategories(){const pin=$('pin').value.trim();if(!pin){$('cats').innerHTML='<span class="muted">Masukkan PIN Owner untuk memuat kategori.</span>';return}try{CATS=await api('/rest/v1/rpc/owner_list_categories',{method:'POST',body:JSON.stringify({p_owner_pin:pin})});if(!Array.isArray(CATS))CATS=[];renderCats()}catch(e){$('cats').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}function renderCats(){const q=$('category').value.trim().toLowerCase();const list=CATS.filter(c=>!q||c.name.toLowerCase().includes(q));$('cats').innerHTML=list.map(c=>'<button type="button" class="chip '+(c.name.toLowerCase()===$("category").value.trim().toLowerCase()?'sel':'')+'" onclick="pick('+JSON.stringify(c.name)+')">'+esc(c.name)+'</button>').join('')||'<span class="muted">Belum ada kategori.</span>'}function pick(n){$('category').value=n;renderCats()}$('pin').addEventListener('change',loadCategories);$('category').addEventListener('input',renderCats);async function addCategory(){const pin=$('pin').value.trim(),name=$('category').value.trim();if(!pin||!name)return alert('Masukkan PIN Owner dan nama kategori.');try{const r=await api('/rest/v1/rpc/owner_create_category',{method:'POST',body:JSON.stringify({p_owner_pin:pin,p_name:name})});const saved=Array.isArray(r)?r[0]:r;await loadCategories();$('category').value=saved?.name||name;renderCats();$('msg').innerHTML='<div class="ok">✅ Kategori <b>'+esc(saved?.name||name)+'</b> berhasil tersimpan. Sekarang kategori tersebut siap dipakai untuk membuat menu.</div>'}catch(e){$('msg').innerHTML='<div class="err">Gagal menyimpan kategori: '+esc(e.message)+'</div>'}}async function save(){const pin=$('pin').value.trim(),name=$('name').value.trim(),cat=$('category').value.trim(),price=Number($('price').value),desc=$('description').value.trim(),active=$('active').checked;if(!pin||!name||!cat||!Number.isFinite(price)){return $('msg').innerHTML='<div class="err">PIN, nama menu, kategori, dan harga wajib diisi.</div>'}try{$('msg').innerHTML='<div class="muted">⏳ Menyimpan menu...</div>';let cats=await api('/rest/v1/rpc/owner_list_categories',{method:'POST',body:JSON.stringify({p_owner_pin:pin})});let found=(cats||[]).find(c=>c.name.trim().toLowerCase()===cat.toLowerCase());if(!found){const cr=await api('/rest/v1/rpc/owner_create_category',{method:'POST',body:JSON.stringify({p_owner_pin:pin,p_name:cat})});found=Array.isArray(cr)?cr[0]:cr}if(!found?.id)throw Error('Kategori gagal dibuat/ditemukan.');const p=await api('/rest/v1/rpc/owner_create_product',{method:'POST',body:JSON.stringify({p_owner_pin:pin,p_name:name,p_price:price,p_description:desc||null,p_active:active,p_category_id:found.id})});const id=p.id;const f=$('image').files[0];if(f){if(f.size>5*1024*1024)throw Error('Ukuran gambar maksimal 5 MB.');const ext=(f.name.split('.').pop()||'jpg').toLowerCase();const path='products/'+id+'.'+ext;const up=await fetch(U+'/storage/v1/object/'+B+'/'+path,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':f.type,'x-upsert':'true'},body:f});if(!up.ok)throw Error(await up.text());await api('/rest/v1/products?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({image_url:U+'/storage/v1/object/public/'+B+'/'+path})})}$('msg').innerHTML='<div class="ok">✅ <b>Menu berhasil ditambahkan.</b><br>Menu <b>'+esc(name)+'</b> masuk database pusat dengan kategori <b>'+esc(found.name)+'</b> dan siap tampil di Kasir/Pelanggan.</div>';await loadCategories();$('name').value='';$('category').value='';$('price').value='';$('description').value='';$('image').value='';$('active').checked=true}catch(e){$('msg').innerHTML='<div class="err">Gagal menambahkan menu: '+esc(e.message)+'</div>'}}const qs=new URLSearchParams(location.search),preset=qs.get('category');if(preset){$('category').value=preset;$('selected').style.display='block';$('selected').innerHTML='📌 Menambahkan menu ke kategori: <b>'+esc(preset)+'</b>'}loadCategories();</script></body></html>
