<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>ISSHO CAFE — Tambah Menu Owner</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:16px}.card{background:#151515;border:1px solid #333;border-radius:16px;padding:18px;margin:12px 0}h1,h2{margin-top:0}label{display:block;font-weight:800;margin-top:12px}input,select,textarea{width:100%;padding:12px;margin-top:6px;background:#1b1b1b;color:#fff;border:1px solid #444;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:12px 16px;font-weight:900;cursor:pointer}.gold{background:#b68142;color:#fff}.dark{background:#242424;color:#fff;border:1px solid #444}.ok{background:#193b25;color:#d9ffe5;padding:12px;border-radius:10px}.err{background:#4a1d1a;color:#ffd9d5;padding:12px;border-radius:10px}.preview{width:100%;max-height:280px;object-fit:contain;background:#090909;border-radius:12px;margin-top:10px;display:none}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.muted{color:#aaa;font-size:13px}</style></head><body><main class="wrap"><div class="card"><h1>➕ Tambah Menu Baru</h1><div class="muted">Khusus OWNER. Menu yang disimpan di sini otomatis menjadi satu data pusat yang dibaca Kasir dan Pelanggan. QR meja tidak perlu diganti.</div><label>PIN Owner<input id="pin" type="password" inputmode="numeric" placeholder="Masukkan PIN Owner"></label><label>Nama Menu<input id="name" placeholder="Contoh: Nasi Ayam Geprek"></label><label>Kategori<select id="category"><option value="">Pilih kategori</option><option>Aneka Nasi</option><option>Nasi Goreng</option><option>Aneka Mie</option><option>Seblak</option><option>Steak Ayam</option><option>Aneka Camilan</option><option>Aneka Bakaran</option><option>Aneka Dimsum</option><option>Aneka Minuman</option><option>Wedangan</option></select></label><label>Harga<input id="price" type="number" min="0" placeholder="Contoh: 18000"></label><label>Deskripsi<input id="description" placeholder="Keterangan singkat (opsional)"></label><label>Foto Menu<input id="image" type="file" accept="image/jpeg,image/png,image/webp" onchange="preview()"></label><img id="prev" class="preview"><label style="display:flex;gap:8px;align-items:center"><input id="active" type="checkbox" checked style="width:auto;margin:0"> Langsung tampil di Pelanggan & Kasir</label><div class="row"><button class="gold" onclick="save()">💾 Simpan Menu Baru</button><button class="dark" onclick="location.href='owner.html?v=20260823'">← Kembali Owner</button></div><div id="msg"></div></div></main><script>const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',B='catalog-images';const $=id=>document.getElementById(id);function preview(){const f=$('image').files[0];if(!f)return;$('prev').src=URL.createObjectURL(f);$('prev').style.display='block'}async function api(path,opt={}){const h=Object.assign({apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},opt.headers||{});const r=await fetch(U+path,Object.assign({cache:'no-store'},opt,{headers:h}));const t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}async function save(){const pin=$('pin').value.trim(),name=$('name').value.trim(),cat=$('category').value,price=Number($('price').value),desc=$('description').value.trim(),active=$('active').checked,msg=$('msg');if(!pin||!name||!cat||!Number.isFinite(price)){msg.innerHTML='<div class="err">PIN, nama, kategori, dan harga wajib diisi.</div>';return}try{msg.innerHTML='<div class="muted">Menyimpan menu...</div>';const cats=await api('/rest/v1/categories?select=id,name&name=eq.'+encodeURIComponent(cat));const categoryId=cats?.[0]?.id||null;const p=await api('/rest/v1/rpc/owner_create_product',{method:'POST',body:JSON.stringify({p_owner_pin:pin,p_name:name,p_price:price,p_description:desc||null,p_active:active,p_category_id:categoryId})});const id=p.id;const f=$('image').files[0];if(f){if(f.size>5*1024*1024)throw Error('Ukuran gambar maksimal 5 MB.');const ext=f.name.split('.').pop().toLowerCase();const path='products/'+id+'.'+ext;const up=await fetch(U+'/storage/v1/object/'+B+'/'+path,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':f.type,'x-upsert':'true'},body:f});if(!up.ok)throw Error(await up.text());const imageUrl=U+'/storage/v1/object/public/'+B+'/'+path;await api('/rest/v1/rpc/owner_update_product',{method:'POST',body:JSON.stringify({p_owner_pin:pin,p_product_id:id,p_name:name,p_price:price,p_description:desc||null,p_active:active})});await api('/rest/v1/products?id=eq.'+id,{method:'PATCH',body:JSON.stringify({image_url:imageUrl})})}msg.innerHTML='<div class="ok"><b>Menu berhasil ditambahkan.</b><br>Menu baru sudah masuk ke database pusat dan dapat dibaca Kasir/Pelanggan.</div>';['name','price','description'].forEach(x=>$(x).value='');$('image').value='';$('prev').style.display='none'}catch(e){msg.innerHTML='<div class="err">Gagal menambahkan menu: '+String(e.message||e)+'</div>'}}</script></body></html>
