<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taufik Cafe — Member Portal</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b0b0b;color:#fff;min-height:100vh}.wrap{max-width:520px;margin:auto;padding:24px}.card{background:#151515;border:1px solid #333;border-radius:20px;padding:24px;margin-top:20px;box-shadow:0 12px 40px #0008}.brand{text-align:center}.brand h1{margin:0 0 8px;font-size:30px}.muted{color:#aaa;font-size:13px;line-height:1.5}.label{display:block;color:#bbb;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;padding:14px;border-radius:11px;border:1px solid #444;background:#0e0e0e;color:#fff;font-size:16px;outline:none}.btn{width:100%;border:0;border-radius:11px;padding:14px;background:#b68142;color:#fff;font-weight:900;font-size:15px;cursor:pointer;margin-top:16px}.hidden{display:none}.ok{background:#193b25;border:1px solid #2f7d50;border-radius:12px;padding:12px;margin-top:14px}.bad{background:#3b1919;border:1px solid #7d2f2f;border-radius:12px;padding:12px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.link{display:block;text-align:center;text-decoration:none;color:#fff;background:#222;border:1px solid #444;border-radius:12px;padding:15px 8px;font-weight:900}.small{font-size:11px;color:#888;margin-top:15px;text-align:center}
</style>
</head>
<body><main class="wrap">
<section id="login" class="card">
<div class="brand"><h1>TAUFIK CAFE</h1><div class="muted">Member Portal • Akses aplikasi cafe</div></div>
<label class="label">Member ID</label><input id="member" autocomplete="username" placeholder="Contoh: TAUFIK-DEMO">
<label class="label">Password</label><input id="pass" type="password" autocomplete="current-password" placeholder="Password member">
<button class="btn" onclick="login()">MASUK KE APLIKASI</button><div id="msg"></div>
<div class="small">Demo pembayaran sudah dicatat sebagai langganan aktif 30 hari.</div>
</section>
<section id="portal" class="card hidden">
<div class="brand"><h1>TAUFIK CAFE</h1><div class="muted">Akses member berhasil</div></div>
<div id="subscription" class="ok"></div>
<div class="grid">
<a class="link" href="customer.html?cafe=taufik-cafe">👤<br>Pelanggan</a>
<a class="link" href="qr-meja.html?cafe=taufik-cafe">📱<br>QR Meja</a>
<a class="link" href="staff-rpp02n.html?cafe=taufik-cafe">💳<br>Kasir</a>
<a class="link" href="dapur-v8.html?cafe=taufik-cafe">🍳<br>Dapur</a>
<a class="link" href="owner-rpp02n.html?cafe=taufik-cafe">👑<br>Owner</a>
</div>
<button class="btn" onclick="location.reload()">KELUAR</button>
<div class="small">Portal ini mengecek masa langganan sebelum membuka menu akses.</div>
</section>
</main>
<script>
const SUPA='https://xvhimyflrqrdudijwjdn.supabase.co';
const KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';
async function getSubscription(){
 const u=SUPA+'/rest/v1/cafe_accounts?select=id,cafe_name,slug,member_code,is_active&slug=eq.taufik-cafe&limit=1';
 const r=await fetch(u,{cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+KEY}}); if(!r.ok)throw Error('Gagal memeriksa akun.');
 const a=(await r.json())[0]; if(!a||!a.is_active)throw Error('Akun cafe tidak aktif.');
 const s=SUPA+'/rest/v1/cafe_subscriptions?select=plan_name,starts_at,expires_at,status&cafe_id=eq.'+a.id+'&order=expires_at.desc&limit=1';
 const rs=await fetch(s,{cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+KEY}}); if(!rs.ok)throw Error('Gagal memeriksa langganan.');
 const sub=(await rs.json())[0]; if(!sub)throw Error('Belum ada langganan.');
 const now=Date.now(),start=new Date(sub.starts_at).getTime(),end=new Date(sub.expires_at).getTime();
 const active=sub.status==='active'&&now>=start&&now<end;
 return {a,sub,active,end};
}
async function login(){
 const m=document.getElementById('member').value.trim(),p=document.getElementById('pass').value;
 const msg=document.getElementById('msg'); msg.innerHTML='';
 if(m!=='TAUFIK-DEMO'||p!=='TAUFIK123'){msg.innerHTML='<div class="bad">Member ID atau password salah.</div>';return}
 try{const x=await getSubscription();if(!x.active){msg.innerHTML='<div class="bad"><b>LANGGANAN EXPIRED</b><br>Akses aplikasi dikunci. Silakan lakukan pembayaran/perpanjangan.</div>';return}
 const days=Math.max(0,Math.ceil((x.end-Date.now())/86400000));document.getElementById('subscription').innerHTML='<b>● LANGGANAN AKTIF</b><br>Paket: '+x.sub.plan_name+'<br>Berlaku sampai: '+new Date(x.sub.expires_at).toLocaleString('id-ID')+'<br>Sisa: '+days+' hari';document.getElementById('login').classList.add('hidden');document.getElementById('portal').classList.remove('hidden');
 }catch(e){msg.innerHTML='<div class="bad">'+e.message+'</div>'}
}
</script></body></html>
